<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Révisions — Étude de marché</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF;
    --black:#101010;
    --grey-900:#1A1A1A;
    --grey-700:#4A4A4A;
    --grey-500:#8A8A8A;
    --grey-300:#D8D8D8;
    --grey-100:#F4F4F4;
    --red:#D0021B;
    --red-dark:#A5011A;
    --red-tint:#FBE7E9;
    --radius: 2px;
  }

  * { box-sizing: border-box; }

  html, body { margin:0; padding:0; }

  body{
    background: var(--white);
    color: var(--black);
    font-family: "Inter", Arial, Helvetica, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  /* ===== HEADER ===== */
  header.top{
    background: var(--black);
    color: var(--white);
    padding: 26px 20px 22px;
    margin-bottom: 0;
    border-bottom: 5px solid var(--red);
  }
  header.top .inner{
    max-width: 900px;
    margin: 0 auto;
  }
  header.top .eyebrow{
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--red);
    font-weight: 700;
    margin-bottom: 10px;
  }
  header.top h1{
    font-size: 30px;
    font-weight: 800;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
    line-height: 1.15;
  }
  header.top p.sub{
    margin:0;
    color: #C9C9C9;
    font-size: 14.5px;
    font-weight: 400;
    max-width: 560px;
  }

  /* ===== STAT BAR ===== */
  .statbar{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    border: 1px solid var(--grey-300);
    border-top: none;
    margin-bottom: 34px;
  }
  .statbar .stat{
    padding: 16px 18px;
    border-right: 1px solid var(--grey-300);
  }
  .statbar .stat:last-child{ border-right:none; }
  .statbar .stat .num{
    font-size: 26px;
    font-weight: 800;
    color: var(--black);
    line-height:1;
  }
  .statbar .stat .num.accent{ color: var(--red); }
  .statbar .stat .lbl{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--grey-500);
    font-weight: 600;
    margin-top: 6px;
  }

  /* ===== HERO / MIX ALL ===== */
  .hero-mix{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 16px;
    border: 1.5px solid var(--black);
    padding: 18px 20px;
    margin-bottom: 44px;
  }
  .hero-mix .txt .h{
    font-weight: 700;
    font-size: 15.5px;
    margin-bottom: 3px;
  }
  .hero-mix .txt .d{
    font-size: 13px;
    color: var(--grey-700);
  }

  .btn{
    font-family: "Inter", Arial, sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
    padding: 12px 20px;
    border-radius: var(--radius);
    cursor: pointer;
    border: 1.5px solid var(--black);
    background: var(--black);
    color: var(--white);
    white-space: nowrap;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .btn:hover{ background: var(--red); border-color: var(--red); }
  .btn.outline{
    background: var(--white);
    color: var(--black);
  }
  .btn.outline:hover{ background: var(--black); color: var(--white); border-color: var(--black); }
  .btn.red{
    background: var(--red);
    border-color: var(--red);
  }
  .btn.red:hover{ background: var(--red-dark); border-color: var(--red-dark); }
  .btn:disabled{
    background: var(--grey-300) !important;
    border-color: var(--grey-300) !important;
    color: var(--grey-500) !important;
    cursor: not-allowed;
  }
  .btn-text{
    background: none;
    border: none;
    color: var(--grey-700);
    font-family: "Inter", Arial, sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 6px 0;
  }
  .btn-text:hover{ color: var(--red); }

  /* ===== CHAPTERS ===== */
  .chapter{
    margin-bottom: 40px;
  }
  .chapter-head{
    display:flex;
    align-items:flex-start;
    gap: 16px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--grey-300);
  }
  .chapter-num{
    font-size: 13px;
    font-weight: 800;
    color: var(--red);
    border: 1.5px solid var(--red);
    padding: 3px 8px;
    flex-shrink:0;
    letter-spacing: 0.03em;
  }
  .chapter-headtext{ flex:1; }
  .chapter-headtext h2{
    font-size: 18.5px;
    font-weight: 800;
    margin: 0 0 4px;
    letter-spacing: -0.005em;
  }
  .chapter-headtext p{
    margin:0;
    font-size: 13px;
    color: var(--grey-700);
  }
  .chapter-headright{
    flex-shrink:0;
    text-align:right;
  }
  .chapter-headright .avg{
    font-size: 20px;
    font-weight: 800;
    color: var(--black);
  }
  .chapter-headright .avg.none{ color: var(--grey-500); font-size: 12.5px; font-weight: 600; }
  .chapter-headright .avglbl{
    font-size: 10.5px;
    text-transform:uppercase;
    letter-spacing: 0.06em;
    color: var(--grey-500);
    font-weight:700;
  }

  .subgrid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }

  .subcard{
    border: 1px solid var(--grey-300);
    background: var(--white);
    text-align:left;
    padding: 14px 15px;
    cursor:pointer;
    font-family: "Inter", Arial, sans-serif;
    transition: border-color 0.12s ease, transform 0.1s ease;
    display:flex;
    flex-direction:column;
    gap: 8px;
  }
  .subcard:hover{ border-color: var(--red); transform: translateY(-1px); }
  .subcard .name{
    font-size: 14px;
    font-weight: 700;
    color: var(--black);
    line-height:1.3;
  }
  .subcard .meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .subcard .count{
    font-size: 11.5px;
    color: var(--grey-500);
    font-weight: 500;
  }
  .subcard .badge{
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
  }
  .subcard .badge.none{
    color: var(--grey-500);
    background: var(--grey-100);
  }
  .subcard .badge.low{
    color: var(--red);
    background: var(--red-tint);
  }
  .subcard .badge.high{
    color: var(--white);
    background: var(--black);
  }

  .chapter-actions{
    display:flex;
    justify-content:flex-end;
  }

  /* ===== QUIZ CARD ===== */
  .quizwrap{
    max-width: 620px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }
  .card{
    background: var(--white);
    border: 1.5px solid var(--black);
    padding: 30px 28px;
  }

  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom: 16px;
  }
  .progress-row .label{
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--grey-500);
    font-weight: 700;
  }
  .progress-row .score{
    font-size: 13.5px;
    color: var(--red);
    font-weight: 800;
  }
  .bar-track{
    height: 4px;
    background: var(--grey-300);
    margin-bottom: 22px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background: var(--red);
    transition: width 0.3s ease;
  }

  .qtheme{
    font-size: 11px;
    color: var(--red);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }

  h2.question{
    font-size: 19px;
    font-weight: 700;
    line-height: 1.4;
    margin: 0 0 22px;
    color: var(--black);
  }

  .options{
    display:flex;
    flex-direction:column;
    gap: 9px;
    margin-bottom: 6px;
  }

  .opt{
    display:flex;
    align-items:flex-start;
    gap: 12px;
    text-align:left;
    background: var(--white);
    border: 1.5px solid var(--grey-300);
    padding: 13px 14px;
    font-family: "Inter", Arial, sans-serif;
    font-size: 14.5px;
    color: var(--black);
    cursor:pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .opt:hover:not(:disabled){ border-color: var(--black); }
  .opt .letter{
    font-weight: 800;
    color: var(--grey-500);
    flex-shrink:0;
  }
  .opt:disabled{ cursor:default; }
  .opt.correct{
    border-color: var(--red);
    border-left-width: 4px;
    font-weight: 700;
  }
  .opt.correct .letter{ color: var(--red); }
  .opt.incorrect{
    background: var(--grey-100);
    border-color: var(--grey-300);
    color: var(--grey-500);
    text-decoration: line-through;
  }
  .opt.incorrect .letter{ color: var(--grey-500); }
  .opt.dim{ opacity: 0.45; }

  .feedback{
    margin-top: 20px;
    padding: 15px 16px;
    border-left: 3px solid var(--black);
    background: var(--grey-100);
    font-size: 14px;
    line-height: 1.55;
    color: var(--grey-900);
  }
  .feedback.wrong{ border-left-color: var(--red); }
  .feedback .verdict{
    font-weight: 800;
    display:block;
    margin-bottom: 4px;
    color: var(--black);
  }
  .feedback.wrong .verdict{ color: var(--red); }

  .actions{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 24px;
  }

  /* ===== RESULTS ===== */
  .results h2{
    font-size: 22px;
    font-weight: 800;
    margin: 0 0 4px;
  }
  .results .scoretag{
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:0.07em;
    color: var(--grey-500);
    font-weight:700;
    margin-bottom: 18px;
  }
  .results .bigscore{
    font-size: 50px;
    font-weight: 800;
    color: var(--red);
    line-height:1;
    margin: 4px 0 4px;
  }
  .results .bigscore span{ font-size: 15px; color: var(--grey-700); font-weight:500; margin-left:4px; }
  .results p.msg{ color: var(--grey-700); margin: 6px 0 22px; font-size: 14px; }

  .recap{
    border-top: 1px solid var(--grey-300);
    padding-top: 4px;
    margin-top: 4px;
  }
  .recap-item{
    display:flex;
    gap: 10px;
    align-items:flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--grey-100);
    font-size: 13.5px;
  }
  .recap-item:last-child{ border-bottom:none; }
  .recap-mark{
    flex-shrink:0;
    width: 16px;
    font-weight: 800;
  }
  .recap-mark.ok{ color: var(--black); }
  .recap-mark.ko{ color: var(--red); }
  .recap-q{ color: var(--grey-700); }

  .results .actions{ justify-content:flex-start; gap: 12px; }

  footer.hint{
    text-align:center;
    color: var(--grey-500);
    font-size: 12px;
    margin-top: 30px;
  }

  @media (max-width: 560px){
    header.top h1{ font-size: 23px; }
    .statbar{ grid-template-columns: 1fr; }
    .statbar .stat{ border-right:none; border-bottom: 1px solid var(--grey-300); }
    .statbar .stat:last-child{ border-bottom:none; }
    .subgrid{ grid-template-columns: 1fr; }
    .hero-mix{ flex-direction:column; align-items:flex-start; }
    .card{ padding: 22px 18px; }
    .chapter-head{ flex-wrap:wrap; }
    .chapter-headright{ text-align:left; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <div class="eyebrow">Analyser et comprendre le marché — L1 &amp; L2</div>
    <h1>Révisions — Étude de marché</h1>
    <p class="sub">Une question, une réponse, une explication. Choisis une sous-catégorie, révise un chapitre entier, ou mélange l'ensemble du programme.</p>
  </div>
</header>

<div class="wrap" id="app"></div>

<script>
const QUESTIONS = [
  // ---------- THEME: fondamentaux ----------
  {theme:"fondamentaux", q:"Comment définit-on l'étude de marché ?", opts:[
    "Un processus systématique de collecte et d'analyse d'informations pour soutenir la prise de décision commerciale",
    "Une base de données de tous les concurrents d'un secteur",
    "Un outil de publicité destiné à promouvoir un produit",
    "Un audit financier de l'entreprise"
  ], correct:0, exp:"L'étude de marché est avant tout un processus de collecte et d'analyse d'informations qui aide le manager à prendre une décision."},

  {theme:"fondamentaux", q:"À quel moment faut-il, en théorie, mener une étude de marché ?", opts:[
    "Seulement avant le lancement d'un nouveau produit",
    "Chaque fois qu'un manager a besoin d'informations avant de prendre une décision",
    "Une fois par an, de façon systématique",
    "Uniquement quand les ventes chutent"
  ], correct:1, exp:"L'étude de marché sert à conseiller la direction : elle est utile dès qu'une décision nécessite des informations fiables."},

  {theme:"fondamentaux", q:"Lequel n'est PAS présenté comme un risque de ne pas mener d'étude de marché ?", opts:[
    "Négliger des opportunités",
    "Mauvaise compréhension des besoins des consommateurs",
    "Une hausse automatique du chiffre d'affaires",
    "Difficultés à attirer des financements"
  ], correct:2, exp:"Ne pas faire d'étude de marché n'apporte aucun bénéfice — c'est justement l'absence d'information qui fragilise les décisions."},

  {theme:"fondamentaux", q:"L'étude de marché suit une approche scientifique structurée en 4 étapes. Laquelle NE fait PAS partie de ces étapes ?", opts:[
    "Description", "Explication", "Certification", "Prédiction"
  ], correct:2, exp:"Les 4 étapes sont : Description, Explication, Prédiction, Contrôle."},

  {theme:"fondamentaux", q:"Quelle est la différence entre problématique commerciale et objectif de recherche ?", opts:[
    "Ce sont deux termes strictement synonymes",
    "La problématique commerciale est le problème du décideur (la décision à prendre) ; l'objectif de recherche définit l'information nécessaire pour l'éclairer",
    "L'objectif de recherche précède toujours la problématique commerciale",
    "La problématique commerciale concerne uniquement les données quantitatives"
  ], correct:1, exp:"La problématique commerciale correspond à la décision du manager ; l'objectif de recherche en découle et précise quelles informations aller chercher."},

  {theme:"fondamentaux", q:"À quoi sert le Research Brief ?", opts:[
    "À présenter le budget marketing de l'année",
    "À lister les concurrents directs de l'entreprise",
    "À énoncer explicitement les objectifs de recherche et les informations à recueillir",
    "À remplacer le rapport final de l'étude"
  ], correct:2, exp:"Le Research Brief formalise, de façon claire et explicite, les objectifs de recherche et les informations attendues."},

  {theme:"fondamentaux", q:"Quel est l'enchaînement correct des 5 étapes du processus général d'étude de marché ?", opts:[
    "Collecte des données → Définition de la problématique → Plan de recherche → Analyse → Rapport",
    "Définition de la problématique → Plan de recherche → Collecte des données → Analyse des données → Rapport",
    "Plan de recherche → Analyse des données → Définition de la problématique → Collecte → Rapport",
    "Rapport → Définition de la problématique → Collecte → Analyse → Plan de recherche"
  ], correct:1, exp:"L'ordre est : 1) problématique, 2) plan de recherche, 3) collecte des données (terrain), 4) analyse, 5) rapport."},

  {theme:"fondamentaux", q:"Quel est l'objectif principal d'un cahier des charges de recherche ?", opts:[
    "Résumer les résultats de l'enquête",
    "Présenter les objectifs de la recherche et les informations nécessaires",
    "Recruter des répondants",
    "Faire de la publicité pour l'entreprise"
  ], correct:1, exp:"Le cahier des charges (Research Brief) sert à présenter clairement les objectifs de la recherche et les informations à recueillir."},

  // ---------- THEME: donnees ----------
  {theme:"donnees", q:"Que sont les données secondaires ?", opts:[
    "Des données collectées pour la première fois pour la recherche en cours",
    "Des informations déjà collectées auparavant, à des fins différentes de la recherche actuelle",
    "Des données uniquement issues de sondages internes",
    "Des données jugées peu fiables et à éviter"
  ], correct:1, exp:"Les données secondaires existent déjà : elles ont été collectées pour un autre objectif que l'étude en cours."},

  {theme:"donnees", q:"Que sont les données primaires ?", opts:[
    "Des données collectées pour la première fois, spécifiquement pour traiter la problématique de recherche étudiée",
    "Des données gratuites disponibles sur Internet",
    "Des données historiques de plus de 10 ans",
    "Des statistiques publiées par l'INSEE"
  ], correct:0, exp:"Les données primaires sont recueillies spécifiquement pour répondre à la problématique actuelle — elles n'existaient pas avant l'étude."},

  {theme:"donnees", q:"Lequel N'EST PAS un avantage des données secondaires ?", opts:[
    "Facilement accessibles", "Relativement peu coûteuses", "Toujours parfaitement à jour et pertinentes", "Rapidement obtenues"
  ], correct:2, exp:"Au contraire, les données secondaires peuvent être obsolètes ou pas entièrement pertinentes — c'est justement une de leurs limites."},

  {theme:"donnees", q:"Laquelle de ces sources est une source INTERNE de données secondaires ?", opts:[
    "Statista", "Les chiffres de vente de l'entreprise", "L'INSEE", "Les études XERFI"
  ], correct:1, exp:"Les chiffres de vente (organisés par zone, produit, année) proviennent directement de l'entreprise : c'est une source interne."},

  {theme:"donnees", q:"Quand doit-on privilégier la collecte de données primaires ?", opts:[
    "Systématiquement, avant toute donnée secondaire",
    "Lorsque les données secondaires ne permettent pas de répondre à la problématique commerciale",
    "Uniquement pour les grandes entreprises cotées",
    "Jamais, car c'est trop coûteux"
  ], correct:1, exp:"On collecte des données primaires seulement quand les données secondaires, plus rapides et moins chères, ne suffisent pas."},

  {theme:"donnees", q:"D'après le cours, quelle précaution faut-il prendre avec les données secondaires générées par l'IA ?", opts:[
    "Aucune, elles sont automatiquement fiables",
    "Vérifier soigneusement leurs sources et leur fiabilité",
    "Les utiliser uniquement comme données primaires",
    "Les ignorer systématiquement"
  ], correct:1, exp:"L'IA peut fournir rapidement des données secondaires, mais leurs sources et leur fiabilité doivent être soigneusement évaluées."},

  {theme:"donnees", q:"Quel type de données correspond à des informations déjà collectées pour un autre objectif ?", opts:[
    "Données primaires", "Données expérimentales", "Données secondaires", "Données qualitatives"
  ], correct:2, exp:"C'est la définition même des données secondaires : elles ont été collectées auparavant, pour un autre objectif."},

  {theme:"donnees", q:"Lequel des éléments suivants est un exemple de source EXTERNE de données secondaires ?", opts:[
    "Registres de ventes de l'entreprise",
    "Base de données des réclamations clients",
    "Revues académiques",
    "Données internes du programme de fidélité"
  ], correct:2, exp:"Les revues académiques sont produites hors de l'entreprise : c'est une source externe, contrairement aux données internes de vente, réclamations ou fidélité."},

  // ---------- THEME: recherche ----------
  {theme:"recherche", q:"Quel objectif poursuit la recherche qualitative ?", opts:[
    "Comprendre le « QUOI » — obtenir des idées et perspectives sur un phénomène nouveau",
    "Comprendre le « COMMENT » via la mesure d'un phénomène",
    "Comprendre le « POURQUOI » via une relation de cause à effet",
    "Confirmer une hypothèse déjà solidement établie"
  ], correct:0, exp:"La recherche qualitative vise à comprendre un phénomène encore peu connu : elle répond au « QUOI »."},

  {theme:"recherche", q:"La recherche descriptive répond principalement à quelle question ?", opts:[
    "Pourquoi ?", "Quoi ?", "Comment ?", "Qui a décidé ?"
  ], correct:2, exp:"La recherche descriptive (quantitative) mesure la fréquence d'un phénomène et les relations entre variables : elle répond au « COMMENT »."},

  {theme:"recherche", q:"La recherche causale correspond à :", opts:[
    "Un plan expérimental visant à identifier une relation de cause à effet",
    "Une phase exploratoire sans hypothèse préalable",
    "Une simple collecte de données secondaires",
    "Une étude menée uniquement par entretiens"
  ], correct:0, exp:"La recherche causale teste des hypothèses en conditions contrôlées pour établir une relation de cause à effet — elle répond au « POURQUOI »."},

  {theme:"recherche", q:"Dans un projet de recherche typique, quel est l'enchaînement logique des trois types de recherche ?", opts:[
    "Causale → Descriptive → Qualitative",
    "Descriptive → Causale → Qualitative",
    "Qualitative (exploratoire) → Descriptive → Causale",
    "Les trois se déroulent toujours simultanément"
  ], correct:2, exp:"On explore d'abord en qualitatif, on mesure ensuite en descriptif, puis on teste les hypothèses en causal (phase conclusive)."},

  {theme:"recherche", q:"« Nous voulons tester la préférence des consommateurs pour différents tons de communication (ex : l'humour) » : de quel type de recherche s'agit-il ?", opts:[
    "Recherche qualitative", "Recherche descriptive", "Recherche causale", "Recherche documentaire"
  ], correct:2, exp:"Tester l'effet d'une variable (le ton) sur une préférence est une démarche causale, expérimentale."},

  {theme:"recherche", q:"Quelle affirmation est vraie concernant la connaissance préalable du sujet ?", opts:[
    "La recherche qualitative nécessite une connaissance approfondie et des hypothèses",
    "La recherche causale se mène avec une connaissance faible ou inexistante du sujet",
    "Descriptive et causale s'appuient sur une connaissance approfondie du sujet, contrairement à la qualitative",

let state = {

  playing: null,    // { scope, label, themeKeys }
  pool: [],
  index: 0,
  score: 0,
  answered: false,
  selectedOpt: null,
  recap: [],
  progress: {}
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

async function loadProgress(){
  try {
    const res = await window.storage.get("quiz-progress", false);
    if(res && res.value){ state.progress = JSON.parse(res.value); }
  } catch(e){ state.progress = {}; }
}

async function saveProgress(scope, scorePct){
  try {
    const prev = state.progress[scope];
    if(!prev || scorePct > prev.best){
      state.progress[scope] = { best: scorePct, attempts: (prev ? prev.attempts+1 : 1) };
    } else {
      state.progress[scope] = { best: prev.best, attempts: prev.attempts+1 };
    }
    await window.storage.set("quiz-progress", JSON.stringify(state.progress), false);
  } catch(e){ /* silent */ }
}

function startQuiz(scope, label, themeKeys){
  const source = themeKeys === "all" ? QUESTIONS : QUESTIONS.filter(q => themeKeys.includes(q.theme));
  state.playing = { scope, label, themeKeys };
  state.pool = shuffle(source);
  state.index = 0;
  state.score = 0;
  state.answered = false;
  state.selectedOpt = null;
  state.recap = [];
  state.screen = "quiz";
  render();
  window.scrollTo(0,0);
}

function selectOption(i){
  if(state.answered) return;
  state.answered = true;
  state.selectedOpt = i;
  const q = state.pool[state.index];
  const isCorrect = i === q.correct;
  if(isCorrect) state.score++;
  state.recap.push({q: q.q, ok: isCorrect});
  render();
}

function nextQuestion(){
  if(state.index < state.pool.length - 1){
    state.index++;
    state.answered = false;
    state.selectedOpt = null;
    render();
  } else {
    const pct = Math.round((state.score / state.pool.length) * 100);
    saveProgress(state.playing.scope, pct);
    state.screen = "results";
    render();
  }
}

function backToPicker(){
  state.screen = "picker";
  render();
}

function render(){
  const app = document.getElementById("app");
  if(state.screen === "picker"){
    app.className = "wrap";
    app.innerHTML = renderPicker();
    attachPickerEvents();
  } else if(state.screen === "quiz"){
    app.className = "quizwrap";
    app.innerHTML = renderQuiz();
    attachQuizEvents();
  } else if(state.screen === "results"){
    app.className = "quizwrap";
    app.innerHTML = renderResults();
    attachResultsEvents();
  }
}

function fmtScore(prog){
  if(!prog) return {cls:"none", txt:"Non commencé"};
  if(prog.best >= 70) return {cls:"high", txt: prog.best + "%"};
  return {cls:"low", txt: prog.best + "%"};
}

function chapterAvg(chapter){
  const scores = chapter.themes
    .map(t => state.progress[t])
    .filter(Boolean)
    .map(p => p.best);
  if(scores.length === 0) return null;
  return Math.round(scores.reduce((a,b)=>a+b,0) / scores.length);
}

        <button class="btn outline" data-mixchapter="${ch.id}">Réviser le chapitre complet</button>
      </div>
    </div>`;
  });

  html += `<footer class="hint">Ta progression par sous-catégorie et par chapitre est mémorisée pour cette révision.</footer>`;

  return html;
}

function attachPickerEvents(){
  document.querySelectorAll(".subcard").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const tid = btn.dataset.theme;
      startQuiz(tid, THEME_META[tid].label, [tid]);
    });
  });
  document.querySelectorAll("[data-mixchapter]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const ch = CHAPTERS.find(c => c.id === btn.dataset.mixchapter);
      startQuiz("chapter:"+ch.id, ch.title, ch.themes);
    });
  });
  const mixAll = document.querySelector("[data-mixall]");
  if(mixAll){
    mixAll.addEventListener("click", ()=> startQuiz("all", "Tous chapitres confondus", "all"));
  }
}

const LETTERS = ["A","B","C","D"];

function renderQuiz(){
  const q = state.pool[state.index];
  const total = state.pool.length;
  const pct = Math.round(((state.index) / total) * 100);
  let optsHtml = "";
  q.opts.forEach((opt,i)=>{
    let cls = "opt";
    if(state.answered){
      if(i === q.correct) cls += " correct";
      else if(i === state.selectedOpt) cls += " incorrect";
      else cls += " dim";
    }
    optsHtml += `<button class="${cls}" data-i="${i}" ${state.answered ? "disabled":""}>
      <span class="letter">${LETTERS[i]}</span><span>${opt}</span>
    </button>`;
  });

  const isCorrect = state.answered && state.selectedOpt === q.correct;
  const feedback = state.answered ? `
    <div class="feedback ${isCorrect ? "" : "wrong"}">
      <span class="verdict">${isCorrect ? "Exact." : "Pas tout à fait."}</span>
      ${q.exp}
    </div>` : "";

  const isLast = state.index === total - 1;

  return `
    <div class="card">
      <div class="progress-row">
        <span class="label">${state.playing.label} — Question ${state.index+1} / ${total}</span>
        <span class="score">${state.score} bonne${state.score>1?"s":""}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="qtheme">${THEME_META[q.theme].short}</div>
      <h2 class="question">${q.q}</h2>
      <div class="options">${optsHtml}</div>
      ${feedback}
      <div class="actions">
        <button class="btn-text" id="back-btn">Changer de thème</button>
        <button class="btn red" id="next-btn" ${state.answered ? "" : "disabled"}>${isLast ? "Voir mes résultats" : "Question suivante"}</button>
      </div>
    </div>
  `;
}

function attachQuizEvents(){
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.addEventListener("click", ()=> selectOption(parseInt(btn.dataset.i)));
  });
  document.getElementById("next-btn").addEventListener("click", nextQuestion);
  document.getElementById("back-btn").addEventListener("click", backToPicker);
}

function renderResults(){
  const total = state.pool.length;
  const pct = Math.round((state.score/total)*100);
  let msg;
  if(pct >= 90) msg = "Excellent — ce thème est maîtrisé.";
  else if(pct >= 70) msg = "Bon niveau, encore quelques détails à consolider.";
  else if(pct >= 50) msg = "Sur la bonne voie, relis la fiche sur les points ratés.";
  else msg = "Ce thème mérite une nouvelle relecture avant de retenter.";

  let recap = '<div class="recap">';
  state.recap.forEach(r=>{
    recap += `<div class="recap-item"><span class="recap-mark ${r.ok?"ok":"ko"}">${r.ok?"✓":"✕"}</span><span class="recap-q">${r.q}</span></div>`;
  });
  recap += '</div>';

  return `
    <div class="card results">
      <h2>${state.playing.label}</h2>
      <div class="scoretag">Résultat de la session</div>
      <div class="bigscore">${pct}%<span>— ${state.score}/${total} bonnes réponses</span></div>
      <p class="msg">${msg}</p>
      ${recap}
      <div class="actions">
        <button class="btn red" id="retry-btn">Rejouer</button>
        <button class="btn-text" id="picker-btn">Choisir un autre thème</button>
      </div>
    </div>
  `;
}

function attachResultsEvents(){
  document.getElementById("retry-btn").addEventListener("click", ()=> startQuiz(state.playing.scope, state.playing.label, state.playing.themeKeys));
  document.getElementById("picker-btn").addEventListener("click", backToPicker);
}

(async function init(){
  await loadProgress();
  render();
})();
</script>
</body>
</html>
