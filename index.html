/* Suppose que state.courseAIUI.busy est déjà verrouillé (synchrone) par l'appelant. */
async function ensureCourseAIReady(eventId){
  if(state.aiStatus === "ready") return true;
  if(state.aiStatus === "checking"){
    state.courseAIUI.error = "Vérification de la compatibilité de ton appareil en cours, réessaie dans un instant.";
    return false;
  }
  if(state.aiStatus === "nogpu"){
    state.courseAIUI.error = "L'assistant IA n'est pas disponible sur cet appareil (WebGPU requis). Tes notes restent bien enregistrées normalement.";
    return false;
  }
  if(state.aiStatus === "loading"){
    state.courseAIUI.error = "Le modèle est en cours de chargement, réessaie dans quelques secondes.";
    return false;
  }
  // idle ou error : on (re)lance le chargement, exactement comme le bouton « Charger l'assistant IA »
  // de l'onglet principal — un seul modèle, jamais deux instances.
  state.courseAIUI.pendingKind = "loading";
  render();
  await aiLoadModel(state.aiModelId || pickModelForDevice());
  return state.aiStatus === "ready";
}

async function courseAiSend(eventId, userContent, display, kind, meta){
  if(aiEngineBusy()) return;
  // Verrou synchrone posé AVANT tout await : un double-clic/double-appel dans le même tick
  // voit forcément aiEngineBusy() === true dès le deuxième appel.
  state.courseAIUI.busy = true;
  state.courseAIUI.activeEventId = eventId;
  state.courseAIUI.error = null;
  if(state.aiStatus !== "ready"){
    state.courseAIUI.pendingKind = "loading";
    render();
  }

  const ready = await ensureCourseAIReady(eventId);
  if(!ready){
    state.courseAIUI.busy = false;
    state.courseAIUI.pendingKind = null;
    render();
    return;
  }

  const ev = state.planning.events.find(x => x.id === eventId);
  if(!ev){
    state.courseAIUI.busy = false;
    state.courseAIUI.pendingKind = null;
    render();
    return;
  }
  const cd = getCourseData(eventId);
  const thread = cd.aiThread.slice();
  const sysContent = COURSE_AI_SYSTEM + "\n\n" + courseAiContextBlock(ev, cd);
  if(thread.length && thread[0].role === "system") thread[0] = {role:"system", content:sysContent, hidden:true};
  else thread.unshift({role:"system", content:sysContent, hidden:true});
  thread.push({role:"user", content:userContent, display, kind, meta: meta || null});
  saveCourseData(eventId, {aiThread: thread});

  state.courseAIUI.pendingKind = kind;
  const signal = { cancelled:false };
  aiCurrentSignal = signal;
  render();

  const turns = thread.map(m => ({role:m.role, content:m.content}));

  try{
    if(kind === "cards" || kind === "questions"){
      const arr = await webllmJsonChat(turns, {signal});
      if(signal.cancelled) throw new Error("cancelled");
      if(!arr || !arr.length) throw new Error("format inattendu");
      const fresh = getCourseData(eventId).aiThread.concat([{role:"assistant", content: JSON.stringify(arr), kind}]);
      saveCourseData(eventId, {aiThread: fresh});
      if(kind === "questions"){ state.courseAIUI.quizIndex = 0; state.courseAIUI.quizRevealed = false; }
    } else {
      const res = await webllmChat(turns, {
        signal,
        onText: ({text}) => {
          const el = document.getElementById("cw-ai-stream");
          if(el) el.innerHTML = renderAIMarkdown(text);
        },
      });
      const text = (res && res.text) ? res.text : "";
      if(signal.cancelled){
        if(text){
          const fresh = getCourseData(eventId).aiThread.concat([{role:"assistant", content:text + "\n\n*(génération interrompue)*", kind}]);
          saveCourseData(eventId, {aiThread: fresh});
        }
      } else {
        if(!text) throw new Error("réponse vide");
        const fresh = getCourseData(eventId).aiThread.concat([{role:"assistant", content:text, kind}]);
        saveCourseData(eventId, {aiThread: fresh});
      }
    }
  }catch(e){
    if(!signal.cancelled) state.courseAIUI.error = aiErrorMessage(e);
  }finally{
    state.courseAIUI.busy = false;
    state.courseAIUI.pendingKind = null;
    if(aiCurrentSignal === signal) aiCurrentSignal = null;
    render();
  }
}

function courseAiRunAction(eventId, actionKey){
  if(aiEngineBusy()) return;
  const a = COURSE_AI_ACTIONS[actionKey];
  if(!a) return;
  const cd = getCourseData(eventId);
  if(a.needsNotes && !cd.notes.trim()){
    const verb = actionKey === "reformulateNotes" ? "les reformuler" : (actionKey === "summarizeNotes" ? "les résumer" : "les corriger");
    state.courseAIUI.error = "Écris d'abord quelques notes de cours pour que je puisse " + verb + ".";
    render();
    return;
  }
  const meta = actionKey === "reformulateNotes" ? {originalText: cd.notes} : null;
  courseAiSend(eventId, a.task, a.label, a.kind, meta);
}

function courseAiSendQuestion(eventId){
  if(aiEngineBusy()) return;
  const q = (state.courseAIUI.question || "").trim();
  if(!q) return;
  state.courseAIUI.question = "";
  courseAiSend(eventId, q, q, "free");
}

function courseAiReformulateSelection(eventId){
  if(aiEngineBusy()) return;
  const ta = document.getElementById("cw-notes");
  if(!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  if(start === end){
    state.courseAIUI.selectionHint = "Sélectionne d'abord du texte dans tes notes, puis clique à nouveau sur ce bouton.";
    render();
    return;
  }
  state.courseAIUI.selectionHint = null;
  const selected = ta.value.slice(start, end);
  const shortLabel = selected.length > 40 ? selected.slice(0,40) + "…" : selected;
  courseAiSend(
    eventId,
    "Reformule ce passage de mes notes dans un langage plus clair, en conservant les idées et le vocabulaire important :\n\n" + selected,
    "Reformuler la sélection : « " + shortLabel + " »",
    "reformulate-selection",
    {originalText: selected, selStart: start, selEnd: end}
  );
}

function courseAiInsertResponse(eventId, msgIndex){
  const cd = getCourseData(eventId);
  const thread = cd.aiThread;
  const assistantMsg = thread[msgIndex];
  if(!assistantMsg || assistantMsg.role !== "assistant") return;
  const userMsg = thread[msgIndex - 1];
  const kind = assistantMsg.kind;
  const text = assistantMsg.content.replace(/\n\n\*\(génération interrompue\)\*$/, "");

  let newNotes, confirmMsg;
  const cur = cd.notes;
  if(kind === "reformulate-all"){
    confirmMsg = "Remplacer toutes tes notes par cette reformulation ? L'ancien texte sera perdu.";
    newNotes = text;
  } else if(kind === "reformulate-selection" && userMsg && userMsg.meta){
    const meta = userMsg.meta;
    if(cur.slice(meta.selStart, meta.selEnd) === meta.originalText){
      confirmMsg = "Remplacer le passage sélectionné par cette reformulation ?";
      newNotes = cur.slice(0, meta.selStart) + text + cur.slice(meta.selEnd);
    } else {
      confirmMsg = "Le texte original a changé depuis : ajouter la reformulation à la fin de tes notes à la place ?";
      newNotes = cur + (cur ? "\n\n" : "") + text;
    }
  } else {
    confirmMsg = "Ajouter cette réponse de l'IA à la fin de tes notes ?";
    newNotes = cur + (cur ? "\n\n" : "") + text;
  }
  if(!confirm(confirmMsg)) return;
  saveCourseData(eventId, {notes: newNotes});
  render();
}

function courseAiCopyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(()=>{});
}

function courseAiClearThread(eventId){
  if(!confirm("Effacer la conversation IA de ce cours ? Tes notes, résumé et questions ne sont pas touchés.")) return;
  saveCourseData(eventId, {aiThread: []});
  state.courseAIUI.quizIndex = 0;
  state.courseAIUI.quizRevealed = false;
  render();
}

function courseAIStatusHtml(){
  if(state.aiStatus === "checking"){
    return `<div class="cw-ai-status checking"><span class="ai-spinner"></span> Vérification de la compatibilité de ton appareil…</div>`;
  }
  if(state.aiStatus === "nogpu"){
    return `<div class="cw-ai-status ko">⚠️ Assistant IA indisponible sur cet appareil (WebGPU requis). La prise de notes reste disponible normalement.</div>`;
  }
  if(state.aiStatus === "loading" && state.courseAIUI.activeEventId === state.planning.selectedEventId){
    const pct = Math.max(0, Math.min(100, state.aiLoadProgress || 0));
    return `<div class="cw-ai-status loading"><span class="ai-spinner"></span> Chargement du modèle IA… ${pct}%
      <div class="ai-loadbar" style="margin-top:6px;width:100%;"><div class="ai-loadbar-fill" style="width:${pct}%;"></div></div></div>`;
  }
  if(state.aiStatus === "error"){
    return `<div class="cw-ai-status ko">⚠️ Le chargement de l'IA a échoué. <button class="btn-text" id="cw-ai-retry">Réessayer</button></div>`;
  }
  if(state.aiStatus === "idle"){
    return `<div class="cw-ai-status idle">💤 Assistant IA disponible — clique sur une action pour le lancer (premier lancement : téléchargement unique du modèle).</div>`;
  }
  return "";
}

function courseAiThreadHtml(eventId, cd){
  const thread = cd.aiThread;
  const visible = thread.filter(m => !m.hidden);
  const showingActive = state.courseAIUI.busy && state.courseAIUI.activeEventId === eventId;
  if(!visible.length && !showingActive) return "";
  let html = `<div class="cw-ai-thread" id="cw-ai-thread">`;
  visible.forEach(m=>{
    const realIdx = thread.indexOf(m);
    if(m.role === "user"){
      html += `<div class="ai-bubble user">${escapeHtml(m.display || m.content)}</div>`;
    } else if(m.kind === "cards" || m.kind === "questions"){
      html += courseAiDraftHtml(m, cd, eventId);
    } else {
      if(m.kind === "reformulate-all" || m.kind === "reformulate-selection"){
        const userTurn = thread[realIdx - 1];
        const orig = userTurn && userTurn.meta ? userTurn.meta.originalText : "";
        if(orig) html += `<div class="cw-ai-compare"><div class="lbl">Texte original</div><div class="orig">${escapeHtml(clip(orig,400))}</div></div>`;
      }
      html += `<div class="ai-bubble assistant">
        <div class="ai-result-body">${renderAIMarkdown(m.content.replace(/\n\n\*\(génération interrompue\)\*$/,""))}</div>
        <div class="cw-ai-msgactions">
          <button class="btn-text" data-ai-copy="${realIdx}">📋 Copier</button>
          <button class="btn-text" data-ai-insert="${realIdx}">➕ Insérer dans mes notes</button>
        </div>
      </div>`;
    }
  });
  if(showingActive){
    if(state.courseAIUI.pendingKind === "cards" || state.courseAIUI.pendingKind === "questions" || state.courseAIUI.pendingKind === "loading"){
      html += `<div class="ai-bubble assistant"><span class="ai-loading" style="padding:0;"><span class="ai-spinner"></span>${state.courseAIUI.pendingKind === "loading" ? "Chargement du modèle…" : "Génération en cours…"}</span></div>`;
    } else {
      html += `<div class="ai-bubble assistant"><div class="ai-result-body" id="cw-ai-stream"><span class="ai-loading" style="padding:0;"><span class="ai-spinner"></span>L'IA réfléchit…</span></div></div>`;
    }
  }
  html += `</div>`;
  return html;
}

function courseWorkspaceModalHtml(e, opts){
  opts = opts || {};
  const subj = matchEventSubject(e.summary);
  const durMin = e.end ? Math.round((e.end - e.start) / 60000) : 0;
  const status = getCourseStatus(e);
  const cd = getCourseData(e.id);
  const statusLabel = status === "current" ? "🟢 En cours" : (status === "past" ? "Terminé" : "À venir");

  let progressHtml = "";
  if(status === "current" && !e.allDay && e.end){
    const now = Date.now();
    const total = e.end - e.start;
    const elapsed = Math.min(total, Math.max(0, now - e.start));
    const pct = total > 0 ? Math.round((elapsed / total) * 100) : 0;
    const remainMin = Math.max(0, Math.round((e.end - now) / 60000));
    progressHtml = `<div class="cw-progress-wrap" id="cw-progress-wrap" data-ev-start="${e.start}" data-ev-end="${e.end}">
      <div class="cw-progress-label"><span>Avancement du cours</span><span id="cw-progress-text">${pct}% · ${remainMin >= 60 ? Math.round(remainMin/6)/10 + " h" : remainMin + " min"} restantes</span></div>
      <div class="cw-progressbar"><div class="cw-progressbar-fill" id="cw-progress-fill" style="width:${pct}%;"></div></div>
    </div>`;
  }

  const revisionOptions = [
    {key:"none", label:"Non révisé"},
    {key:"progress", label:"En cours de révision"},
    {key:"done", label:"Révisé"},
  ];
  const hasData = !courseDataIsEmpty(cd);

  return `<div class="cal-modal-backdrop" id="cal-modal-backdrop">
    <div class="cal-modal cal-modal-wide cal-modal-workspace" role="dialog" aria-modal="true" aria-labelledby="cal-modal-title">
    <div class="cw-main">
      <div class="cw-toprow">
        <h2 id="cal-modal-title" class="cw-title">${escapeHtml(e.summary)}</h2>
        <button type="button" class="cw-fav-btn ${cd.favorite ? "active" : ""}" id="cw-fav-btn" aria-pressed="${cd.favorite ? "true" : "false"}" aria-label="${cd.favorite ? "Retirer des favoris" : "Marquer comme favori"}" title="Favori">${cd.favorite ? "★" : "☆"}</button>
        <button class="btn-text" id="cal-modal-close" aria-label="Fermer les détails">✕</button>
      </div>
      <button type="button" class="cw-ai-openbtn ${!state.planning.aiPanelOpenMobile ? "mobile-show" : ""} ${state.planning.aiPanelCollapsed ? "desktop-show" : ""}" id="cw-ai-open-btn" aria-label="Ouvrir l'assistant IA" title="Ouvrir l'assistant IA">
        <span aria-hidden="true">🤖</span><span class="txt">Assistant IA</span>
      </button>
      <div class="cw-badges"><span class="cw-badge ${status}">${statusLabel}</span></div>
      ${progressHtml}
      <ul class="dash-progress-list">
        <li><span>Date</span><b>${new Date(e.start).toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long"})}</b></li>
        <li><span>Horaire</span><b>${fmtEventTimeRange(e)}</b></li>
        ${durMin > 0 && !e.allDay ? `<li><span>Durée</span><b>${durMin >= 60 ? (Math.round(durMin/6)/10) + " h" : durMin + " min"}</b></li>` : ""}
        ${e.location ? `<li><span>Lieu</span><b>${escapeHtml(e.location)}</b></li>` : ""}
        ${e.organizer ? `<li><span>Professeur</span><b>${escapeHtml(e.organizer)}</b></li>` : ""}
      </ul>
      ${e.description ? `<p style="font-size:12.5px;color:var(--ink-soft);margin:12px 0 0;line-height:1.6;">${escapeHtml(e.description)}</p>` : ""}
      ${subj ? `<button class="btn outline small" data-open-event-subject="${subj.id}" style="margin-top:14px;">Voir la matière : ${escapeHtml(subj.name)} →</button>` : ""}

      <div class="cw-section">
        <span class="cw-section-label">Statut de révision</span>
        <div class="cw-revision-choices" id="cw-revision-choices">
          ${revisionOptions.map(o => `<button type="button" class="status-pill ${o.key === "progress" ? "progress" : (o.key === "done" ? "done" : "none")} ${cd.revisionStatus === o.key ? "is-active" : ""}" data-revision="${o.key}">${o.label}</button>`).join("")}
        </div>
      </div>

      <div class="cw-section">
        <span class="cw-section-label">Notes du cours</span>
        <textarea class="ai-textarea" id="cw-notes" data-ev-id="${e.id}" style="min-height:110px;" placeholder="Écris ici tes notes de cours…">${escapeHtml(cd.notes)}</textarea>
      </div>

      <div class="cw-section">
        <span class="cw-section-label">Résumé rapide</span>
        <textarea class="ai-textarea" id="cw-summary" data-ev-id="${e.id}" style="min-height:64px;" placeholder="L'essentiel à retenir en quelques lignes…">${escapeHtml(cd.summary)}</textarea>
      </div>

      <div class="cw-section">
        <span class="cw-section-label">Questions à revoir</span>
        <textarea class="ai-textarea" id="cw-questions" data-ev-id="${e.id}" style="min-height:64px;" placeholder="Points à éclaircir, questions à poser…">${escapeHtml(cd.questions)}</textarea>
      </div>

      <div class="cw-section">
        <span class="cw-section-label">À faire pour ce cours</span>
        <div class="cw-checklist">
          <label><input type="checkbox" data-check="relire" ${cd.checklist.relire ? "checked" : ""}> Relire mes notes</label>
          <label><input type="checkbox" data-check="exercices" ${cd.checklist.exercices ? "checked" : ""}> Faire les exercices</label>
          <label><input type="checkbox" data-check="definitions" ${cd.checklist.definitions ? "checked" : ""}> Revoir les définitions clés</label>
          <label><input type="checkbox" data-check="prochain" ${cd.checklist.prochain ? "checked" : ""}> Préparer le prochain cours</label>

function renderGlobalCourseModal(){
  const root = document.getElementById("course-modal-root");
  if(!root) return;
  const selected = state.planning.selectedEventId ? state.planning.events.find(e => e.id === state.planning.selectedEventId) : null;
  if(!selected){
    if(root.innerHTML) root.innerHTML = "";
    return;
  }
  root.innerHTML = courseWorkspaceModalHtml(selected, {focusNotes: state.planning.focusNotesOnOpen});
  attachCourseModalEvents();
}

function attachCourseModalEvents(){
  if(state.aiStatus === "checking") checkAIStatus();

  const modalClose = document.getElementById("cal-modal-close");
  if(modalClose) modalClose.addEventListener("click", closeCourseModal);
  const modalBackdrop = document.getElementById("cal-modal-backdrop");
  if(modalBackdrop) modalBackdrop.addEventListener("click", (e)=>{
    if(e.target === modalBackdrop) closeCourseModal();
  });

  const favBtn = document.getElementById("cw-fav-btn");
  if(favBtn) favBtn.addEventListener("click", ()=>{
    const evId = state.planning.selectedEventId;
    const cd = getCourseData(evId);
    flushCourseModalSaves();
    saveCourseData(evId, {favorite: !cd.favorite});
    render();
  });

  document.querySelectorAll("[data-revision]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const evId = state.planning.selectedEventId;
      flushCourseModalSaves();
      saveCourseData(evId, {revisionStatus: btn.dataset.revision});
      render();
    });
  });

  document.querySelectorAll("[data-check]").forEach(chk=>{
    chk.addEventListener("change", ()=>{
      const evId = state.planning.selectedEventId;
      const cd = getCourseData(evId);
      const checklist = Object.assign({}, cd.checklist, {[chk.dataset.check]: chk.checked});
      saveCourseData(evId, {checklist});
    });
  });

  Object.keys(COURSE_TEXT_FIELDS).forEach(id=>{
    const ta = document.getElementById(id);
    if(!ta) return;
    ta.addEventListener("input", ()=>{
      const evId = ta.dataset.evId;
      const indicator = document.getElementById("cw-save-indicator");
      if(indicator) indicator.textContent = "Enregistrement…";
      clearTimeout(courseModalSaveTimers[id]);
      courseModalSaveTimers[id] = setTimeout(()=>{
        saveCourseData(evId, {[COURSE_TEXT_FIELDS[id]]: ta.value});
        delete courseModalSaveTimers[id];
        const ind = document.getElementById("cw-save-indicator");
        if(ind) ind.textContent = "Enregistré ✓";
      }, 500);
    });
  });

  const delBtn = document.getElementById("cw-delete-notes");
  if(delBtn) delBtn.addEventListener("click", ()=>{
    if(!confirm("Supprimer toutes les notes, le résumé, les questions et le statut liés à ce cours ? Cette action est irréversible.")) return;
    const evId = state.planning.selectedEventId;
    Object.keys(courseModalSaveTimers).forEach(id => clearTimeout(courseModalSaveTimers[id]));
    courseModalSaveTimers = {};
    deleteCourseData(evId);
    render();
  });

  document.querySelectorAll("[data-open-event-subject]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      flushCourseModalSaves();
      state.planning.selectedEventId = null;
      libGoto("subjectDetail", {subjectId: btn.dataset.openEventSubject});
      switchTab("library");
    });
  });

  /* ---- assistant IA du cours ---- */
  const evId = state.planning.selectedEventId;

  // Un seul bouton pour fermer/réduire l'assistant IA, un seul pour le rouvrir — les deux
  // flags (mobile/desktop) sont mis à jour ensemble : seul celui qui compte pour la largeur
  // d'écran courante a un effet visuel, donc rien à recalculer côté JS au redimensionnement.
  const aiCloseBtn = document.getElementById("cw-ai-close-btn");
  if(aiCloseBtn) aiCloseBtn.addEventListener("click", ()=>{
    state.planning.aiPanelOpenMobile = false;
    state.planning.aiPanelCollapsed = true;
    render();
  });
  const aiOpenBtn = document.getElementById("cw-ai-open-btn");
  if(aiOpenBtn) aiOpenBtn.addEventListener("click", ()=>{
    state.planning.aiPanelOpenMobile = true;
    state.planning.aiPanelCollapsed = false;
    render();
  });

  const retryBtn = document.getElementById("cw-ai-retry");
  if(retryBtn) retryBtn.addEventListener("click", ()=> aiLoadModel(state.aiModelId || pickModelForDevice()));

  document.querySelectorAll("[data-course-ai-action]").forEach(btn=>{
    if(btn.disabled) return;
    btn.addEventListener("click", ()=> courseAiRunAction(evId, btn.dataset.courseAiAction));
  });

  const reformSelBtn = document.getElementById("cw-ai-reformulate-selection");
  if(reformSelBtn && !reformSelBtn.disabled) reformSelBtn.addEventListener("click", ()=> courseAiReformulateSelection(evId));

  const aiQuestion = document.getElementById("cw-ai-question");
  const aiSendBtn = document.getElementById("cw-ai-send-btn");
  if(aiQuestion){
    aiQuestion.addEventListener("input", (e)=>{
      state.courseAIUI.question = e.target.value;
      if(aiSendBtn && !aiEngineBusy()) aiSendBtn.disabled = !e.target.value.trim();
    });
    aiQuestion.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        if(state.courseAIUI.question.trim() && !aiEngineBusy()) courseAiSendQuestion(evId);
      }
    });
  }
  if(aiSendBtn) aiSendBtn.addEventListener("click", ()=>{ if(!aiSendBtn.disabled) courseAiSendQuestion(evId); });
  const aiCancelBtn = document.getElementById("cw-ai-cancel-btn");
  if(aiCancelBtn) aiCancelBtn.addEventListener("click", aiCancelGeneration);

  const aiClearBtn = document.getElementById("cw-ai-clear");
  if(aiClearBtn) aiClearBtn.addEventListener("click", ()=> courseAiClearThread(evId));

  document.querySelectorAll("[data-ai-copy]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const cd = getCourseData(evId);
      const m = cd.aiThread[parseInt(btn.dataset.aiCopy)];
      if(m) courseAiCopyText(m.content.replace(/\n\n\*\(génération interrompue\)\*$/, ""));
    });
  });
  document.querySelectorAll("[data-ai-insert]").forEach(btn=>{
    btn.addEventListener("click", ()=> courseAiInsertResponse(evId, parseInt(btn.dataset.aiInsert)));
  });
  const copyCardsBtn = document.getElementById("cw-ai-copy-cards");
  if(copyCardsBtn) copyCardsBtn.addEventListener("click", ()=>{
    const cd = getCourseData(evId);
    const msg = cd.aiThread.slice().reverse().find(m => m.role === "assistant" && m.kind === "cards");
    if(!msg) return;
    try{
      const arr = JSON.parse(msg.content);
      courseAiCopyText(arr.map((c,i)=>`Carte ${i+1}\nQuestion : ${c.front}\nRéponse : ${c.back}`).join("\n\n"));
    }catch(e){}
  });
  const quizReveal = document.getElementById("cw-ai-quiz-reveal");
  if(quizReveal) quizReveal.addEventListener("click", ()=>{ state.courseAIUI.quizRevealed = true; render(); });
  const quizNext = document.getElementById("cw-ai-quiz-next");
  if(quizNext) quizNext.addEventListener("click", ()=>{ state.courseAIUI.quizIndex++; state.courseAIUI.quizRevealed = false; render(); });
  const quizPrev = document.getElementById("cw-ai-quiz-prev");
  if(quizPrev) quizPrev.addEventListener("click", ()=>{ state.courseAIUI.quizIndex = Math.max(0, state.courseAIUI.quizIndex - 1); state.courseAIUI.quizRevealed = false; render(); });

  if(state.planning.focusNotesOnOpen){
    state.planning.focusNotesOnOpen = false;
    const notesTa = document.getElementById("cw-notes");
    if(notesTa){
      notesTa.focus();
      const len = notesTa.value.length;
      notesTa.setSelectionRange(len, len);
    }
  }
}


function renderPlanning(){
  const hasPlanning = state.planning.events.length > 0;
  const configOpen = state.planning.configPanelOpen || !hasPlanning;

  let html = `<h1 style="font-size:22px;font-weight:800;margin:28px 0 4px;">Planning</h1>
  <p class="ai-intro">Ton emploi du temps — aucune donnée n'est envoyée à un serveur, tout reste dans ce navigateur.</p>`;

  if(hasPlanning && !configOpen){
    html += `<div class="planning-source-bar">
      <span class="s">${state.planning.lastSyncAt ? "Dernière synchronisation : " + fmtRelativeDate(dateKey(new Date(state.planning.lastSyncAt))).toLowerCase() : ""}</span>
      <button class="btn-text" id="planning-toggle-config">⚙️ Modifier la source du planning</button>
    </div>`;
  }

  if(configOpen){
    html += `<div class="card" style="margin-bottom:22px;">`;
    if(hasPlanning){
      html += `<div class="dash-card-head"><div class="section-title" style="margin-bottom:0;">Source de mon planning</div>
        <button class="btn-text" id="planning-toggle-config">Masquer ▲</button></div>`;
    } else {
      html += `<div class="section-title" style="margin-bottom:10px;">Configurer mon planning</div>`;
    }
    html += `<p class="ai-intro" style="margin:0 0 12px;">Exporte le fichier .ics depuis Makers Board (ou ton espace étudiant), puis importe-le ici. Ré-importer le même fichier met à jour les cours modifiés sans créer de doublon (basé sur l'identifiant de chaque événement). C'est actuellement la méthode la plus fiable : un site statique comme celui-ci ne peut pas toujours récupérer un calendrier distant automatiquement (CORS, authentification).</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
      <label class="btn outline small" style="cursor:pointer;margin:0;">⬆️ Importer / actualiser (.ics)<input type="file" id="planning-ics-input" accept=".ics,text/calendar" style="display:none;"></label>
      <span style="font-size:12px;color:var(--muted);">${state.planning.lastSyncAt ? "Dernière synchronisation : " + fmtRelativeDate(dateKey(new Date(state.planning.lastSyncAt))).toLowerCase() + " à " + new Date(state.planning.lastSyncAt).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) : "Jamais synchronisé"}</span>
    </div>
    <div id="planning-import-status" style="margin-top:8px;font-size:12.5px;color:var(--muted);">${escapeHtml(state.planning.lastImportMsg||"")}</div>

    <div class="section-title" style="margin:20px 0 10px;">Lien de mon planning</div>
    <p class="ai-intro" style="margin:0 0 10px;">🔒 Reste uniquement dans ce navigateur — jamais écrit dans le code du site, jamais envoyé à un serveur ni à l'assistant IA. Champ masqué par défaut.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <input type="${state.planning.urlVisible ? "text" : "password"}" id="planning-url-input" class="ai-select" placeholder="https://..." value="${escapeHtml(state.planning.officialUrl||"")}" autocomplete="off" style="flex:1;min-width:220px;">
      <button class="btn-text" id="planning-url-toggle-visibility" type="button" aria-label="${state.planning.urlVisible ? "Masquer le lien" : "Afficher le lien"}" title="${state.planning.urlVisible ? "Masquer le lien" : "Afficher le lien"}">${state.planning.urlVisible ? "🙈" : "👁️"}</button>
      <button class="btn outline small" id="planning-url-save">Enregistrer</button>
      ${state.planning.officialUrl ? `<button class="btn red small" id="planning-url-open">Ouvrir ↗</button>` : ""}
      ${state.planning.officialUrl ? `<button class="btn-text" id="planning-url-delete" style="color:var(--red-dark);">Supprimer le lien</button>` : ""}
    </div>

    ${hasPlanning ? `<p class="dash-empty" style="margin-top:18px;"><button class="btn-text" id="planning-clear-btn" style="padding:0;color:var(--red-dark);">🗑️ Supprimer mon planning (événements importés + lien enregistré)</button></p>` : ""}
    </div>`;
  }

  if(state.planning.events.length === 0){
    html += `<div class="empty-state"><div class="big">🗓️</div>Aucun événement prévu pour cette période.<br>Importe un fichier .ics pour voir apparaître tes cours ici.</div>`;
    return html;
  }

  html += `<div class="card" style="padding:18px 20px 22px;">`;
  html += planningControlsHtml();

  const calView = state.planning.calView || "week";
  let visibleDays;
  if(calView === "day") visibleDays = [new Date(planningAnchor())];
  else if(calView === "week") visibleDays = planningWeekDays(planningAnchor());
  else {
    const anchor = new Date(planningAnchor());
    const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    const daysInMonth = new Date(anchor.getFullYear(), anchor.getMonth()+1, 0).getDate();
    visibleDays = [...Array(daysInMonth)].map((_,i)=> new Date(first.getFullYear(), first.getMonth(), i+1));
  }

  if(calView === "day") html += renderCalendarDay();
  else if(calView === "week") html += renderCalendarWeek();
  else html += renderCalendarMonth();

  html += planningLegendHtml(visibleDays);
  html += `</div>`;

  if(Object.keys(state.courseData).length > 0){
    html += `<p class="dash-empty" style="margin:14px 0 0;"><button class="btn-text" id="planning-clear-notes-btn" style="padding:0;color:var(--red-dark);">🗑️ Supprimer toutes mes notes de cours (notes, résumés, questions, checklists)</button></p>`;
  }

  html += `<footer class="hint">Pourquoi un import manuel plutôt qu'automatique ? Un site hébergé sur GitHub Pages n'exécute aucun code serveur : il ne peut récupérer un calendrier distant que si Makers Board autorise les requêtes cross-origin (CORS) depuis un navigateur. Tant que ce point n'est pas vérifié, l'import manuel garantit un fonctionnement fiable sans exposer ton lien personnel.</footer>`;

  return html;
}

function attachPlanningEvents(){
  const icsInput = document.getElementById("planning-ics-input");
  if(icsInput) icsInput.addEventListener("change", async ()=>{
    const file = icsInput.files[0];
    if(!file) return;
    try{
      const text = await readFileAsText(file);
      const parsed = parseICS(text);
      // Le panneau de config reste ouvert après une action d'import : sinon le message
      // de confirmation (ou d'erreur) disparaîtrait immédiatement, masqué avec la section.
      state.planning.configPanelOpen = true;
      if(parsed.length === 0){
        state.planning.lastImportMsg = "Aucun événement reconnu dans ce fichier.";
        render();
        return;
      }
      const { added, updated } = mergePlanningEvents(parsed);
      state.planning.lastSyncAt = Date.now();
      savePlanning();
      state.planning.lastImportMsg = added + " événement(s) importé(s)" + (updated ? ", " + updated + " mis à jour" : "") + ".";
      render();
    }catch(e){
      state.planning.configPanelOpen = true;
      state.planning.lastImportMsg = "Erreur lors de la lecture du fichier : " + e.message;
      render();
    }
  });

  const toggleConfigBtn = document.getElementById("planning-toggle-config");
  if(toggleConfigBtn) toggleConfigBtn.addEventListener("click", ()=>{
    state.planning.configPanelOpen = !state.planning.configPanelOpen;
    render();
  });

  const urlToggleVis = document.getElementById("planning-url-toggle-visibility");
  if(urlToggleVis) urlToggleVis.addEventListener("click", ()=>{
    // Bascule directement le DOM (pas de render()) pour ne jamais perdre un lien
    // déjà tapé mais pas encore enregistré.
    state.planning.urlVisible = !state.planning.urlVisible;
    const input = document.getElementById("planning-url-input");
    if(input) input.type = state.planning.urlVisible ? "text" : "password";
    urlToggleVis.textContent = state.planning.urlVisible ? "🙈" : "👁️";
    const lbl = state.planning.urlVisible ? "Masquer le lien" : "Afficher le lien";
    urlToggleVis.title = lbl;
    urlToggleVis.setAttribute("aria-label", lbl);
  });
  const urlDelete = document.getElementById("planning-url-delete");
  if(urlDelete) urlDelete.addEventListener("click", ()=>{
    if(!confirm("Supprimer le lien de planning enregistré ?")) return;
    state.planning.officialUrl = "";
    savePlanning();
    render();
  });

  const clearBtn = document.getElementById("planning-clear-btn");
  if(clearBtn) clearBtn.addEventListener("click", ()=>{
    if(!confirm("Supprimer tous les événements importés et le lien de planning enregistré ?")) return;
    state.planning.events = [];
    state.planning.officialUrl = "";
    state.planning.lastImportMsg = "";
    state.planning.lastSyncAt = null;
    state.planning.selectedEventId = null;
    savePlanning();
    render();
  });

  const clearNotesBtn = document.getElementById("planning-clear-notes-btn");
  if(clearNotesBtn) clearNotesBtn.addEventListener("click", ()=>{
    if(!confirm("Supprimer toutes les notes, résumés, questions, favoris et checklists de tous tes cours ? Cette action est irréversible.")) return;
    state.courseData = {};
    lsSet(KEY_COURSE_DATA, state.courseData);
    render();
  });

  const urlSave = document.getElementById("planning-url-save");
  if(urlSave) urlSave.addEventListener("click", ()=>{
    state.planning.officialUrl = document.getElementById("planning-url-input").value.trim();
    savePlanning();
    render();
  });
  const urlOpen = document.getElementById("planning-url-open");
  if(urlOpen) urlOpen.addEventListener("click", ()=> window.open(state.planning.officialUrl, "_blank", "noopener"));

  document.querySelectorAll("[data-cal-view]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.planning.calView = btn.dataset.calView; render(); });
  });
  const calPrev = document.getElementById("cal-prev");
  if(calPrev) calPrev.addEventListener("click", ()=> planningNavigate(-1));
  const calNext = document.getElementById("cal-next");
  if(calNext) calNext.addEventListener("click", ()=> planningNavigate(1));
  const calToday = document.getElementById("cal-today");
  if(calToday) calToday.addEventListener("click", ()=> planningNavigate(0));

  document.querySelectorAll("[data-open-day]").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.planning.anchorDate = Number(el.dataset.openDay);
      state.planning.calView = "day";
      render();
    });
  });
  document.querySelectorAll("[data-expand-day]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const day = Number(btn.dataset.expandDay);
      state.planning.expandedMonthDay = state.planning.expandedMonthDay === day ? null : day;
      render();
    });
  });
  document.querySelectorAll("[data-open-event]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      openCourseModal(el.dataset.openEvent);
    });
    el.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        openCourseModal(el.dataset.openEvent);
      }
    });
  });
}

/* ============================================================
   15septies. DOCUMENTS — import local (Ressources + sujets d'examen)
   ============================================================ */
const DOC_MAX_BYTES = 3 * 1024 * 1024; // ~3 Mo par fichier, pour rester dans les quotas localStorage

function docTypeLabel(t){
  return t === "resume" ? "Résumé" : (t === "sujet" ? "Sujet d'examen" : "Document");
}

function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Lecture du fichier impossible"));
    reader.readAsDataURL(file);
  });
}

async function importDocumentFile(file, type){
  if(file.size > DOC_MAX_BYTES){
    throw new Error("Fichier trop volumineux pour être stocké localement (limite ~3 Mo).");
  }
  const isText = /\.(txt|md|markdown)$/i.test(file.name) || file.type === "text/plain" || file.type === "text/markdown";
  const doc = {
    id: genLibId("doc"),
    name: file.name,
    type: type || "document",
    mime: file.type || "",
    addedAt: Date.now(),
  };
  if(isText) doc.content = await readFileAsText(file);
  else doc.dataUrl = await readFileAsDataURL(file);
  state.documents.push(doc);
  saveDocuments();
  return doc;
}

function openDocument(doc){
  if(doc.dataUrl){
    window.open(doc.dataUrl, "_blank");
    return;
  }
  const blob = new Blob([doc.content || ""], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  window.open(url, "_blank");
  setTimeout(()=> URL.revokeObjectURL(url), 60000);
}

function docRowHtml(doc){
  return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bg);gap:10px;flex-wrap:wrap;">
    <div>
      <div style="font-weight:700;font-size:13px;color:var(--ink);">${escapeHtml(doc.name)}</div>
      <div style="font-size:11.5px;color:var(--muted);">${docTypeLabel(doc.type)} · ${fmtRelativeDate(dateKey(new Date(doc.addedAt))).toLowerCase()}</div>
    </div>
    <div style="display:flex;gap:8px;flex-shrink:0;">
      <button class="btn-text" data-open-doc="${doc.id}">Ouvrir</button>
      <button class="btn-text" data-delete-doc="${doc.id}" style="color:var(--muted);">Supprimer</button>
    </div>
  </div>`;
}

function attachDocumentRowEvents(){
  document.querySelectorAll("[data-open-doc]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const doc = state.documents.find(d => d.id === btn.dataset.openDoc);
      if(doc) openDocument(doc);
    });
  });
  document.querySelectorAll("[data-delete-doc]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(!confirm("Supprimer ce document ?")) return;
      state.documents = state.documents.filter(d => d.id !== btn.dataset.deleteDoc);
      saveDocuments();
      render();
    });
  });
}

/* ============================================================
   15octies. EXAMENS — hub (examens blancs, sujets, historique)
   ============================================================ */
function renderExams(){
  const hist = state.exam.history || [];
  const sujets = state.documents.filter(d => d.type === "sujet");

  let html = `<h1 style="font-size:22px;font-weight:800;margin:28px 0 4px;">Examens</h1>
  <p class="ai-intro">Entraîne-toi en conditions d'examen, retrouve tes sujets et consulte tes résultats.</p>`;

  html += `<div class="ai-actiongrid" style="grid-template-columns:repeat(2,1fr);">
    <button class="ai-action" id="exams-blancs-btn"><span class="ico">📝</span><span class="t">Examens blancs</span><span class="d">Entraîne-toi dans des conditions d'examen chronométré, par matière ou chapitre.</span></button>
    <button class="ai-action" id="exams-sujets-btn"><span class="ico">📄</span><span class="t">Mes sujets</span><span class="d">${sujets.length} sujet${sujets.length>1?"s":""} importé${sujets.length>1?"s":""}.</span></button>
  </div>`;

  html += `<div class="dash-section" id="exams-sujets-section">
    <div class="dash-section-head">
      <span class="section-title" style="margin-bottom:0;">Mes sujets</span>
      <label class="btn outline small" style="cursor:pointer;margin:0;">+ Importer un sujet<input type="file" id="exams-sujet-input" accept=".txt,.md,.pdf,image/*" style="display:none;"></label>
    </div>
    ${state.examsSujetStatus ? `<div style="font-size:12.5px;color:var(--muted);margin-bottom:8px;">${escapeHtml(state.examsSujetStatus)}</div>` : ""}
    ${sujets.length === 0 ? `<p class="dash-empty">Aucun sujet importé pour l'instant.</p>` : sujets.map(docRowHtml).join("")}
  </div>`;

  html += `<div class="dash-section">
    <div class="section-title">Historique des résultats</div>
    ${hist.length === 0 ? `<p class="dash-empty">Aucun examen réalisé pour l'instant.</p>` : hist.slice(0,15).map(h => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bg);gap:10px;flex-wrap:wrap;">
        <div>
          <div style="font-weight:700;font-size:13px;color:var(--ink);">${escapeHtml(h.scopeLabel)}</div>
          <div style="font-size:11.5px;color:var(--muted);">${fmtRelativeDate(h.dateKey)} · ${h.total} questions · ${fmtClock(h.timeUsed)}</div>
        </div>
        <div style="font-weight:800;font-size:14px;color:${h.pct>=70?"var(--green)":"var(--red-dark)"};">${h.pct}%</div>
      </div>
    `).join("")}
  </div>`;

  return html;
}

function attachExamsEvents(){
  const blancsBtn = document.getElementById("exams-blancs-btn");
  if(blancsBtn) blancsBtn.addEventListener("click", ()=>{ state.exam.screen = "setup"; switchTab("exam"); });
  const sujetsBtn = document.getElementById("exams-sujets-btn");
  if(sujetsBtn) sujetsBtn.addEventListener("click", ()=>{
    const el = document.getElementById("exams-sujets-section");
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  });
  const sujetInput = document.getElementById("exams-sujet-input");
  if(sujetInput) sujetInput.addEventListener("change", async ()=>{
    const file = sujetInput.files[0];
    if(!file) return;
    try{
      await importDocumentFile(file, "sujet");
      state.examsSujetStatus = "";
    }catch(e){
      state.examsSujetStatus = e.message;
    }
    render();
  });
  attachDocumentRowEvents();
}

/* ============================================================
   15nonies. NAVIGATION PRINCIPALE — menus déroulants + mobile
   ============================================================ */
const NAV_GROUP = {
  dashboard: "dashboard", library: "library",
  activities: "activities", quiz: "activities", flash: "activities", oral: "activities", review: "activities",
  fiches: "resources",
  exams: "exams", exam: "exams",
  planning: "planning",
  progress: "progress",
  ai: "myspace", settings: "myspace", myspace: "myspace",
};

function updateNavDynamic(){
  // liste des matières dans le menu déroulant "Mes matières"
  const listEl = document.getElementById("menu-library-subjects");
  if(listEl){
    listEl.innerHTML = allSubjects().map(s =>
      `<button data-goto="library-subject" data-subject-id="${s.id}">${s.icon||"📘"} ${escapeHtml(s.name)}</button>`
    ).join("");
  }

  // onglet principal actif
  const group = NAV_GROUP[state.tab] || state.tab;
  document.querySelectorAll(".mainnav-item").forEach(el=>{
    el.classList.toggle("active-group", el.dataset.nav === group);
  });

  // profil (header)
  const firstName = (state.profile.firstName || "").trim();
  const nameLbl = document.getElementById("profile-label");
  if(nameLbl) nameLbl.textContent = firstName ? "Bonjour " + firstName : "Mon espace";
  const avatar = document.getElementById("profile-avatar");
  if(avatar) avatar.textContent = firstName ? firstName.charAt(0).toUpperCase() : "🎓";
}

function updateNavMenuState(){
  document.querySelectorAll(".mainnav-item").forEach(el=>{
    el.classList.toggle("open", el.dataset.nav === state.openMenu);
  });
  document.body.classList.toggle("mobile-nav-open", state.mobileMenuOpen);
}

function closeAllNavMenus(){
  state.openMenu = null;
  state.mobileMenuOpen = false;
  updateNavMenuState();
}

function handleNavGoto(ds){
  const goto = ds.goto;
  if(goto === "dashboard") return switchTab("dashboard");
  if(goto === "library"){ libGoto("subjects"); return switchTab("library"); }
  if(goto === "library-subject"){ libGoto("subjectDetail", {subjectId: ds.subjectId}); return switchTab("library"); }
  if(goto === "library-add"){ libGoto("subjectForm", {editingSubjectId:null}); return switchTab("library"); }
  if(goto === "continue") return continueRevision();
  if(goto === "activities") return switchTab("activities");
  if(goto === "review") return switchTab("review");
  if(goto === "fiches"){
    state.catalog.scope = ds.filter || "all";
    switchTab("fiches");
    return;
  }
  if(goto === "import-course"){ goToCourseImport(); return switchTab("library"); }
  if(goto === "flash"){ state.flashScreen = "picker"; return switchTab("flash"); }
  if(goto === "quiz"){ state.screen = "picker"; return switchTab("quiz"); }
  if(goto === "exam"){ state.exam.screen = "setup"; return switchTab("exam"); }
  if(goto === "exams") return switchTab("exams");
  if(goto === "exams-sujets"){
    switchTab("exams");
    setTimeout(()=>{ const el = document.getElementById("exams-sujets-section"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); }, 60);
    return;
  }
  if(goto === "oral") return switchTab("oral");
  if(goto === "ai") return switchTab("ai");
  if(goto === "planning") return switchTab("planning");
  if(goto === "progress") return switchTab("progress");
  if(goto === "settings") return switchTab("settings");
  if(goto === "myspace") return switchTab("myspace");
}

function attachMainNavEvents(){
  const nav = document.getElementById("mainnav");

  document.querySelectorAll("[data-menu-toggle]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const key = btn.dataset.menuToggle;
      state.openMenu = (state.openMenu === key) ? null : key;
      updateNavMenuState();
    });
  });

  nav.addEventListener("click", (e)=>{
    const leaf = e.target.closest("[data-goto]");
    if(!leaf) return;
    e.stopPropagation();
    closeAllNavMenus();
    handleNavGoto(leaf.dataset);
  });

  document.getElementById("profile-chip-btn").addEventListener("click", (e)=>{
    e.stopPropagation();
    closeAllNavMenus();
    switchTab("myspace");
  });

  document.getElementById("hamburger-btn").addEventListener("click", (e)=>{
    e.stopPropagation();
    state.mobileMenuOpen = !state.mobileMenuOpen;
    state.openMenu = null;
    updateNavMenuState();
  });

  document.addEventListener("click", (e)=>{
    if(!e.target.closest("#mainnav") && !e.target.closest("#hamburger-btn")){
      if(state.openMenu || state.mobileMenuOpen) closeAllNavMenus();
    }
  });

  document.addEventListener("keydown", (e)=>{
    if(e.key === "Escape" && (state.openMenu || state.mobileMenuOpen)) closeAllNavMenus();
  });
}

/* ============================================================
   15decies. BULLE ASSISTANT IA — déplaçable librement (souris + tactile)
   ============================================================ */
const AI_FAB_MARGIN = 8;
const AI_FAB_TOP_MIN = 60; // laisse le header cliquable

function aiFabSize(){
  const bubble = document.getElementById("ai-bubble");
  return bubble ? bubble.offsetWidth : 56;
}

function clampAIFabX(x){
  const size = aiFabSize();
  return Math.max(AI_FAB_MARGIN, Math.min(window.innerWidth - size - AI_FAB_MARGIN, x));
}
function clampAIFabY(y){
  const size = aiFabSize();
  return Math.max(AI_FAB_TOP_MIN, Math.min(window.innerHeight - size - AI_FAB_MARGIN, y));
}

/* Position par défaut si aucune position n'a jamais été enregistrée : bas droite. */
function defaultAIFabXY(){
  const size = aiFabSize();
  return { x: window.innerWidth - size - 20, y: window.innerHeight - size - 20 };
}

function applyAIFabPosition(x, y){
  const bubble = document.getElementById("ai-bubble");
  if(!bubble) return;
  bubble.style.left = x + "px";
  bubble.style.top = y + "px";
  bubble.style.right = "auto";
  bubble.style.bottom = "auto";
}

function setAIFabXY(x, y, persist){
  const cx = clampAIFabX(x), cy = clampAIFabY(y);
  state.aiBubble.x = cx; state.aiBubble.y = cy;
  applyAIFabPosition(cx, cy);
  if(persist !== false) saveAIBubblePos();
}

/* Positions nommées pour l'alternative accessible (Mon espace) : grille 3x3. */
function aiFabPresetXY(key){
  const size = aiFabSize();
  const m = 20;
  const row = key[0], col = key[1];
  const x = col === "l" ? m : (col === "c" ? (window.innerWidth - size) / 2 : window.innerWidth - size - m);
  const y = row === "t" ? 70 : (row === "m" ? (window.innerHeight - size) / 2 : window.innerHeight - size - m);
  return { x, y };
}

function setAIFabPreset(key){
  const { x, y } = aiFabPresetXY(key);
  setAIFabXY(x, y);
}

function openAIBubble(){
  switchTab("ai");
}

function initAIBubble(){
  const bubble = document.getElementById("ai-bubble");
  if(!bubble) return;

  let dragging = false, moved = false, startX = 0, startY = 0, startLeft = 0, startTop = 0;

  bubble.addEventListener("pointerdown", (e)=>{
    dragging = true; moved = false;
    const rect = bubble.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY;
    startLeft = rect.left; startTop = rect.top;
    bubble.setPointerCapture(e.pointerId);
  });

  bubble.addEventListener("pointermove", (e)=>{
    if(!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(!moved && Math.hypot(dx, dy) < 6) return;
    moved = true;
    setAIFabXY(startLeft + dx, startTop + dy, false);
  });

  bubble.addEventListener("pointerup", ()=>{
    if(!dragging) return;
    dragging = false;
    if(moved) saveAIBubblePos();
    else openAIBubble();
  });

  bubble.addEventListener("pointercancel", ()=>{ dragging = false; });

  bubble.addEventListener("keydown", (e)=>{
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openAIBubble(); }
  });

  window.addEventListener("resize", ()=>{
    setAIFabXY(state.aiBubble.x, state.aiBubble.y);
  });
}

/* ============================================================
   15undecies. HORLOGE DU PLANNING — ligne verte + cours en cours en direct
   ============================================================ */
let lastKnownCurrentCourseId = null;

/* Repositionne la ligne "maintenant" et met à jour la barre d'avancement du cours en cours
   SANS re-rendu complet (coût minimal, appelé chaque seconde) ; ne déclenche render()
   que si le cours "en cours" a réellement changé (démarré / terminé). */
function updateCurrentTimeIndicator(){
  const now = new Date();
  const label = now.toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"});
  document.querySelectorAll(".cal-now-line").forEach(el=>{
    const minH = Number(el.dataset.gridMinH), maxH = Number(el.dataset.gridMaxH);
    if(now.getHours() < minH || now.getHours() >= maxH){ el.remove(); return; }
    el.style.top = ((now.getHours() - minH) + now.getMinutes() / 60) * CAL_HOUR_H + "px";
    const timeEl = el.querySelector(".cal-now-time");
    if(timeEl) timeEl.textContent = label;
  });

  [{wrap:"cw-progress-wrap", fill:"cw-progress-fill", text:"cw-progress-text"},
   {wrap:"dash-ccourse-progress", fill:"dash-ccourse-fill", text:"dash-ccourse-text"}].forEach(ids=>{
    const wrap = document.getElementById(ids.wrap);
    if(!wrap) return;
    const start = Number(wrap.dataset.evStart), end = Number(wrap.dataset.evEnd);
    const total = end - start;
    const elapsed = Math.min(total, Math.max(0, Date.now() - start));
    const pct = total > 0 ? Math.round((elapsed / total) * 100) : 0;
    const fillEl = document.getElementById(ids.fill);
    if(fillEl) fillEl.style.width = pct + "%";
    const remainMin = Math.max(0, Math.round((end - Date.now()) / 60000));
    const textEl = document.getElementById(ids.text);
    if(textEl) textEl.textContent = pct + "% · " + (remainMin >= 60 ? Math.round(remainMin/6)/10 + " h" : remainMin + " min") + " restantes";
  });

  const cur = getCurrentCourse();
  const curId = cur ? cur.id : null;
  if(curId !== lastKnownCurrentCourseId){
    lastKnownCurrentCourseId = curId;
    render();
  }
}

/* ============================================================
   16. INIT
   ============================================================ */
attachMainNavEvents();
initAIBubble();

document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape" && state.planning.selectedEventId) closeCourseModal();
});

setInterval(updateCurrentTimeIndicator, 1000);

(async function init(){
  await loadAllData();
  if(typeof state.aiBubble.x === "number" && typeof state.aiBubble.y === "number"){
    setAIFabXY(state.aiBubble.x, state.aiBubble.y, false);
  } else {
    const def = defaultAIFabXY();
    setAIFabXY(def.x, def.y);
  }
  render();
  lastKnownCurrentCourseId = getCurrentCourse() ? getCurrentCourse().id : null;
})();
</script>
