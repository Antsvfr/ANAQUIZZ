  /* ============================================================
     GRAMMAIRE VISUELLE PARTAGÉE (§2/§37)
     ------------------------------------------------------------
     Quatre niveaux, cohérents dans TOUT le site. La grammaire n'est pas
     inventée ici : c'est celle que le dashboard utilisait déjà
     (eyebrow → titre → meta → action) et qui manquait aux 30 autres
     pages, formalisée pour être réutilisable.

       Niveau 1  .page-head / .page-title / .page-subtitle  → « où suis-je ? »
       Niveau 2  .section-title (+ .section-sub)            → sous-section
       Niveau 3  .dash-section / .card                      → bloc/unité logique
       Niveau 4  .meta / .eyebrow                           → information secondaire

     La hiérarchie repose sur taille + poids + contraste + espace, jamais
     sur la seule taille ni sur le gras systématique (§3).
     ============================================================ */

  /* --- Niveau 1 : titre de page ---
     Remplace 31 <h1 style="font-size:22px;font-weight:800;margin:…"> qui
     portaient 7 valeurs de marge différentes. Une seule source de vérité. */
  .page-head{ margin: var(--space-2xl) 0 var(--space-xl); }
  .page-head .page-title{ margin: 0; }
  .page-head .page-subtitle{ margin: var(--space-xs) 0 0; }
  .page-title{
    font-size: var(--text-h1); font-weight: 800; line-height:1.25;
    letter-spacing:-0.015em; color: var(--ink);
    margin: var(--space-2xl) 0 var(--space-2xs);
  }
  /* Titre de page dans un contexte déjà introduit (fil d'ariane, retour) :
     l'espace au-dessus est déjà fourni par l'élément précédent. */
  .page-title.tight{ margin-top: 0; }
  /* Titre SANS sous-titre : c'est lui qui porte l'espace avant le contenu,
     puisqu'aucun .page-subtitle ne viendra le faire. */
  .page-title.solo{ margin-bottom: var(--space-lg); }
  .page-subtitle{
    font-size: var(--text-body); color: var(--ink-soft); font-weight: 400;
    margin: 0 0 var(--space-xl); max-width: 560px; line-height:1.65;
  }

  /* --- Niveau 2 : titre de section --- */
  .section-title{ font-size: var(--text-h2); font-weight: 800; margin-bottom: var(--space-md); letter-spacing:-0.005em; }
  /* Titre de section aligné avec une action sur la même ligne (en-tête de
     section) : la marge basse est portée par le conteneur flex, pas par le
     titre. Remplace 13 style="margin-bottom:0;" identiques. */
  .section-title.inline{ margin-bottom: 0; }
  /* Sous-titre de section : explique la section sans la transformer en page. */
  .section-sub{ font-size: var(--text-sm); color: var(--ink-soft); font-weight:400; margin: calc(-1 * var(--space-sm)) 0 var(--space-md); line-height:1.6; }

  /* --- Niveau 4 : information secondaire (§10) ---
     Moins de contraste et de poids, jamais illisible pour autant. */
  .meta{ font-size: var(--text-xs); color: var(--muted); font-weight: 500; line-height:1.55; }
  .eyebrow{
    font-size: var(--text-2xs); font-weight: 800; letter-spacing:0.07em;
    text-transform: uppercase; color: var(--muted);
  }

  /* ===== MES MATIÈRES (bibliothèque de cours) ===== */
  .breadcrumb{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:26px 0 18px; font-size:12.5px; }
  .breadcrumb button{ background:none; border:none; color: var(--ink-soft); font-family:"Inter",sans-serif; font-weight:700; font-size:12.5px; cursor:pointer; padding:2px; }
  .breadcrumb button:hover{ color: var(--red); }
  .breadcrumb span.sep{ color: var(--border-strong); }
  .breadcrumb span.current{ color: var(--ink); font-weight:800; }
  .subject-card .icon{ font-size:22px; width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .empty-state{ text-align:center; padding:40px 20px; border:1.5px dashed var(--border-strong); border-radius: var(--radius-lg); color: var(--muted); font-size:13.5px; line-height:1.7; }
  .empty-state .big{ font-size:30px; margin-bottom:10px; }
  .form-row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:560px){ .form-row2{ grid-template-columns:1fr; } }
  .color-swatches{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .color-swatches button{ width:28px; height:28px; border-radius:8px; border:2px solid transparent; cursor:pointer; }
  .color-swatches button.active{ border-color: var(--ink); }
  .chapter-status-select{ display:flex; gap:8px; }

  /* ===== RESSOURCES — AUTOMATISER MES RÉVISIONS ===== */
  .automate-card{ margin:22px 0 28px; }
  .automate-head{ display:flex; align-items:flex-start; gap:14px; margin-bottom:18px; }
  .automate-head .ico{
    font-size:22px; width:44px; height:44px; border-radius:12px; flex-shrink:0;
    background: var(--red-tint); display:flex; align-items:center; justify-content:center;
  }
  .automate-head .h{ font-size:16px; font-weight:800; margin-bottom:4px; }
  .automate-head .d{ font-size:12.5px; color: var(--ink-soft); line-height:1.55; max-width:560px; }
  .import-dropzone-compact{ padding:26px 18px; }
  .automate-advanced{ margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
  .automate-advanced summary{ font-size:12px; font-weight:700; color: var(--ink-soft); cursor:pointer; list-style:none; }
  .automate-advanced summary::marker{ content:""; }
  .automate-advanced summary:hover{ color: var(--red); }

  /* ===== RESSOURCES — BIBLIOTHÈQUE DE COURS ===== */
  .course-filters-card{ padding:16px 18px; margin-bottom:20px; display:flex; flex-direction:column; gap:12px; }
  .course-filters-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .course-filters-row .ai-select{ width:100%; }
  .course-filters-footer{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .course-viewtoggle{ display:flex; gap:2px; background: var(--bg); border-radius:10px; padding:3px; }
  .course-viewbtn{
    border:none; background:none; padding:6px 12px; border-radius:8px; cursor:pointer;
    font-size:14px; color: var(--muted); line-height:1;
  }
  .course-viewbtn.active{ background: var(--surface); color: var(--ink); box-shadow: var(--shadow-xs); }

  .course-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:900px){ .course-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:600px){ .course-grid{ grid-template-columns:1fr; } }
  @media (max-width:760px){ .course-filters-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:520px){ .course-filters-row{ grid-template-columns:1fr; } }

  .course-card{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg);
    padding:16px 17px; cursor:pointer; box-shadow: var(--shadow-sm);
    display:flex; flex-direction:column; gap:9px;
    transition: border-color .16s var(--ease), transform .16s var(--ease), box-shadow .16s var(--ease);
  }
  .course-card:hover, .course-card:focus-visible{ border-color: var(--red); transform: translateY(-2px); box-shadow: var(--shadow-md); outline:none; }
  .course-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .course-card-icon{ font-size:19px; width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .course-card-badges{ display:flex; align-items:center; gap:6px; }
  .course-card-title{ font-size:14px; font-weight:800; line-height:1.3; color: var(--ink); }
  .course-card-meta{ font-size:11.5px; color: var(--ink-soft); }
  .course-card-stats{ display:flex; gap:10px; flex-wrap:wrap; font-size:11px; color: var(--muted); font-weight:600; }
  .course-card-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .course-card-chip{
    font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px;
    background: var(--green-tint); color: var(--green);
  }
  .course-card-chip.off{ background: var(--bg); color: var(--muted); }
  .course-card-chip.ok{ background:none; padding:0; font-size:13px; }
  .course-card-progress{ display:flex; align-items:center; gap:8px; margin-top:2px; }
  .course-card-progress .deckbar-track{ flex:1; height:5px; background: var(--bg); border-radius:999px; overflow:hidden; }
  .course-card-progress .deckbar-fill{ height:100%; border-radius:999px; transition: width .4s var(--ease); }
  .course-card-progress .deckbar-fill.none{ background: var(--border-strong); }
  .course-card-progress .deckbar-fill.progress{ background: var(--amber); }
  .course-card-progress .deckbar-fill.done{ background: var(--green); }
  .course-card-progress .pct{ font-size:11px; font-weight:700; color: var(--muted); flex-shrink:0; }
  .course-card-open{ align-self:flex-start; margin-top:4px; pointer-events:none; }

  .course-list{ display:flex; flex-direction:column; gap:10px; }
  .course-list .course-card{
    flex-direction:row; align-items:center; flex-wrap:wrap; padding:12px 16px; gap:14px;
  }
  .course-list .course-card-top{ flex-direction:column; align-items:flex-start; gap:6px; }
  .course-list .course-card-title{ min-width:160px; }
  .course-list .course-card-meta{ min-width:120px; }
  .course-list .course-card-chips{ margin-left:auto; }
  .course-list .course-card-progress{ width:110px; margin-top:0; }
  .course-list .course-card-open{ margin-top:0; }

  /* ===== PLANNING — CALENDRIER JOUR / SEMAINE / MOIS ===== */
  .cal-viewbtn{
    border:none; background:none; padding:7px 14px; border-radius:999px;
    font-family: var(--font-main); font-weight:700; font-size:12.5px; color: var(--ink-soft); cursor:pointer;
  }
  .cal-viewbtn.active{ background: var(--ink); color:#fff; }

  .cal-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .cal-headerrow{ display:grid; min-width:600px; }
  .cal-daylabel{
    text-align:center; padding:8px 4px; border-bottom:2px solid var(--border);
    font-size:11px; color: var(--muted); font-weight:700; cursor:pointer;
  }
  .cal-daylabel .wd{ text-transform:capitalize; }
  .cal-daylabel .dn{ font-size:15px; font-weight:800; color: var(--ink); margin-top:2px; }
  .cal-daylabel.is-today, .cal-daylabel.is-today .dn{ color: var(--red); }

  .cal-allday-row{ display:grid; min-width:600px; border-bottom:1px solid var(--border); }
  .cal-allday-label{ font-size:9.5px; color: var(--muted); padding:4px; align-self:center; }
  .cal-allday-cell{ padding:3px; display:flex; flex-direction:column; gap:2px; border-left:1px solid var(--bg); min-height:22px; }
  .cal-allday-chip{
    font-size:10px; font-weight:700; padding:2px 6px; border-radius:5px; cursor:pointer;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .cal-grid{ display:grid; position:relative; min-width:600px; }
  .cal-timecol{ position:relative; border-right:1px solid var(--border); }
  .cal-hour{
    position:absolute; right:8px; font-size:10px; color: var(--muted); transform:translateY(-6px);
  }
  .cal-daycol{ position:relative; border-left:1px solid var(--bg); }
  .cal-daycol.is-today{ background: var(--red-tint); }
  .cal-hourline{ position:absolute; left:0; right:0; border-top:1px solid var(--bg); }
  .cal-now-line{ position:absolute; left:0; right:0; border-top:2px solid var(--green); z-index:6; pointer-events:none; }
  .cal-now-line::before{
    content:""; position:absolute; left:-4px; top:-4px; width:8px; height:8px; border-radius:50%; background: var(--green);
  }
  .cal-now-time{
    position:absolute; right:2px; top:-8px; font-size:9px; font-weight:800; color:#fff;
    background: var(--green); padding:1px 5px; border-radius:4px;
  }
  .cal-event{
    position:absolute; border-radius:6px; padding:3px 6px; font-size:11px; overflow:hidden;
    cursor:pointer; transition: box-shadow .15s var(--ease), z-index 0s;
  }
  .cal-event:hover, .cal-event:focus-visible{ box-shadow: var(--shadow-md); z-index:4; outline:none; }
  .cal-event.is-current{ box-shadow: 0 0 0 1.5px var(--green); }
  .cal-event.is-past{ opacity:0.55; }
  .cal-event-badge{
    display:block; font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:0.02em;
    background: var(--green); color:#fff; padding:1px 4px; border-radius:4px; margin-bottom:2px; width:fit-content;
  }
  .cal-event-fav{ float:right; color: var(--amber); font-size:11px; line-height:1; }
  .cal-event-time{ font-size:9.5px; font-weight:700; opacity:0.85; }
  .cal-event-title{ font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cal-event-loc{ font-size:9.5px; opacity:0.8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .cal-monthgrid{
    display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background: var(--border);
    border:1px solid var(--border); border-radius: var(--radius-md); overflow:hidden;
  }
  .cal-monthhead{ background: var(--surface-2); padding:6px 4px; font-size:10px; font-weight:800; text-align:center; color: var(--muted); }
  .cal-monthcell{ background: var(--surface); min-height:88px; padding:4px; font-size:10px; }
  .cal-monthcell.is-outside{ background: var(--bg); color: var(--muted); }
  .cal-monthcell.is-today{ box-shadow: inset 0 0 0 1.5px var(--green); }
  .cal-monthcell .dn{ font-weight:800; margin-bottom:3px; cursor:pointer; display:inline-block; }
  .cal-monthcell.is-today .dn{ color:#fff; background: var(--green); border-radius:50%; width:19px; height:19px; line-height:19px; text-align:center; font-size:10.5px; }
  .cal-monthchip{
    font-size:9.5px; font-weight:700; padding:1px 5px; border-radius:4px; margin-bottom:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;
  }
  .cal-more{ border:none; background:none; font-size:9.5px; color: var(--muted); font-weight:700; cursor:pointer; padding:0; }

  .cal-modal-backdrop{ position:fixed; inset:0; background:rgba(20,21,26,0.55); z-index:300; display:flex; align-items:center; justify-content:center; padding:20px; }
  .cal-modal{ background: var(--surface); border-radius: var(--radius-lg); max-width:420px; width:100%; max-height:85vh; overflow-y:auto; padding:22px; box-shadow: var(--shadow-lg); }
  .cal-modal-wide{ max-width:560px; }

  .cw-toprow{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:4px; }
  .cw-title{ font-size:17px; font-weight:800; margin:0; flex:1; }
  .cw-fav-btn{ background:none; border:none; cursor:pointer; font-size:21px; line-height:1; color: var(--border-strong); padding:2px 4px; flex-shrink:0; }
  .cw-fav-btn.active{ color: var(--amber); }
  .cw-badges{ display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 14px; }
  .cw-badge{ font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:20px; letter-spacing:0.02em; }
  .cw-badge.current{ background: var(--green-tint); color: var(--green); }
  .cw-badge.past{ background: var(--bg); color: var(--muted); }
  .cw-badge.upcoming{ background: var(--red-tint); color: var(--red-dark); }
  .cw-progress-wrap{ margin-bottom:16px; }
  .cw-progress-label{ font-size:11px; color: var(--muted); margin-bottom:4px; display:flex; justify-content:space-between; gap:10px; }
  .cw-progressbar{ height:6px; border-radius:4px; background: var(--bg); overflow:hidden; }
  .cw-progressbar-fill{ height:100%; background: var(--green); border-radius:4px; transition: width 0.3s var(--ease); }
  .cw-section{ margin-top:18px; }
  .cw-section-label{ font-size:11px; font-weight:800; color: var(--ink); margin-bottom:7px; display:block; text-transform:uppercase; letter-spacing:0.03em; }
  .cw-revision-choices{ display:flex; gap:6px; flex-wrap:wrap; }
  .cw-revision-choices .status-pill{ cursor:pointer; border:1.5px solid transparent; font-family: var(--font-main); }
  .cw-revision-choices .status-pill.is-active{ border-color: currentColor; }
  .cw-checklist{ display:flex; flex-direction:column; gap:8px; }
  .cw-checklist label{ display:flex; align-items:center; gap:9px; font-size:13px; color: var(--ink); cursor:pointer; }
  .cw-checklist input[type="checkbox"]{ width:16px; height:16px; accent-color: var(--red); cursor:pointer; flex-shrink:0; }
  .cw-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:20px; padding-top:14px; border-top:1px solid var(--bg); }
  .cw-save-indicator{ font-size:11px; color: var(--muted); }

  /* ---- fiche de cours : disposition à deux volets (notes + assistant IA) ---- */
  .cal-modal-workspace{
    max-width:1020px; width:100%; max-height:90vh; padding:0; overflow:hidden;
    display:flex; flex-direction:column; position:relative;
  }
  .cal-modal-workspace .cw-main{ flex:1 1 auto; min-width:0; overflow-y:auto; padding:22px; }

  /* Un seul bouton pour fermer (dans l'en-tête du panneau) et un seul pour rouvrir
     (bouton plein, avec icône + texte) — jamais de glyphe ambigu sans libellé. */
  .cw-ai-openbtn{
    display:none; align-items:center; justify-content:center; gap:8px;
    background: var(--red-tint); color: var(--red-dark); border:1.5px solid var(--red); border-radius: var(--radius-md);
    padding:11px; font-weight:800; font-size:13px; cursor:pointer; font-family: var(--font-main);
    transition: background .15s var(--ease), color .15s var(--ease), transform .1s var(--ease);
  }
  .cw-ai-openbtn:hover{ background: var(--red); color:#fff; }
  .cw-ai-openbtn:active{ transform: scale(0.97); }
  .cw-ai-openbtn.mobile-show{ display:flex; width:100%; margin:14px 0 4px; }

  .cw-ai-closebtn{
    display:flex; align-items:center; gap:6px; background: var(--surface); border:1.5px solid var(--border);
    border-radius:20px; padding:7px 14px 7px 12px; font-size:12px; font-weight:800; color: var(--ink-soft);
    cursor:pointer; font-family: var(--font-main); margin-left:auto; flex-shrink:0; min-height:34px;
    transition: border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease), transform .1s var(--ease);
  }
  .cw-ai-closebtn:hover{ border-color: var(--red); color: var(--red-dark); background: var(--red-tint); }
  .cw-ai-closebtn:active{ transform: scale(0.96); }
  @media (max-width:420px){
    .cw-ai-closebtn .txt{ display:none; }
    .cw-ai-closebtn{ padding:0; width:34px; height:34px; justify-content:center; border-radius:50%; }
  }

  .cw-aiside{ display:none; }
  .cw-aiside.is-open{
    display:flex; flex-direction:column; position:absolute; inset:0; background: var(--surface);
    z-index:5; padding:16px; overflow-y:auto; border-radius: var(--radius-lg);
  }
  @media (min-width:900px){
    .cal-modal-workspace{ flex-direction:row; max-height:88vh; }
    .cal-modal-workspace .cw-main{ border-radius: var(--radius-lg) 0 0 var(--radius-lg); }
    .cw-ai-openbtn.mobile-show{ display:none; }
    .cw-ai-openbtn.desktop-show{
      display:inline-flex; position:absolute; top:20px; right:20px; width:auto; margin:0;
      padding:9px 18px; z-index:2; box-shadow: var(--shadow-sm);
    }
    .cw-aiside{
      display:flex !important; flex-direction:column; width:340px; flex-shrink:0;
      position:static; z-index:auto; border-left:1px solid var(--border);
      background: var(--surface-2); border-radius:0 var(--radius-lg) var(--radius-lg) 0;
      padding:18px; overflow-y:auto;
    }
    .cw-aiside.collapsed{ display:none !important; }
  }
  .cw-ai-header{ display:flex; align-items:center; gap:8px; padding-bottom:12px; margin-bottom:12px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .cw-ai-title{ font-size:13.5px; font-weight:800; color: var(--ink); flex:1; }
  .cw-ai-body{ display:flex; flex-direction:column; flex:1; min-height:0; }
  .cw-ai-status{ font-size:11.5px; line-height:1.5; padding:9px 11px; border-radius:8px; margin-bottom:12px; }
  .cw-ai-status.idle{ background: var(--bg); color: var(--muted); }
  .cw-ai-status.loading{ background: var(--amber-tint); color: var(--amber); }
  .cw-ai-status.ko{ background: var(--amber-tint); color: var(--amber); }
  .cw-ai-status.checking{ background: var(--bg); color: var(--muted); }
  .cw-ai-actions{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:10px; }
  .cw-ai-action{
    display:flex; align-items:center; gap:6px; text-align:left; cursor:pointer;
    background: var(--surface); border:1px solid var(--border); border-radius:8px; padding:7px 8px;
    font-family: var(--font-main); font-size:10.8px; font-weight:700; color: var(--ink); line-height:1.25;
    transition: border-color .15s var(--ease);
  }
  .cw-ai-action:hover:not(:disabled){ border-color: var(--red); }
  .cw-ai-action:disabled{ opacity:.45; cursor:not-allowed; }
  .cw-ai-action .ico{ font-size:14px; flex-shrink:0; }
  .cw-ai-selection-row{ margin-bottom:12px; }
  .cw-ai-hint{ font-size:10.5px; color: var(--muted); margin-top:4px; }
  .cw-ai-thread{ display:flex; flex-direction:column; gap:10px; margin:4px 0 12px; }
  .cw-ai-msgactions{ display:flex; gap:10px; margin-top:8px; }
  .cw-ai-msgactions .btn-text{ font-size:10.5px; }
  .cw-ai-composer{ margin-top:auto; padding-top:10px; border-top:1px solid var(--border); }
  .cw-ai-composer-row{ display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }
  .cw-ai-compare{ border:1px solid var(--border); border-radius:8px; padding:9px 10px; margin-bottom:8px; font-size:11.5px; background: var(--surface); }
  .cw-ai-compare .lbl{ font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.03em; color: var(--muted); margin-bottom:3px; }
  .cw-ai-compare .orig{ color: var(--ink-soft); white-space:pre-wrap; }

  @media (max-width:680px){
    .cal-headerrow, .cal-allday-row, .cal-grid{ min-width:540px; }
    .cal-monthcell{ min-height:64px; font-size:9px; }
  }

  @media (max-width: 860px){
    .wrap{ padding: 0 18px 80px; }
  }

  @media (max-width: 680px){
    .topbar-inner{ padding: 0 16px; }
    .brandrow{ min-height:56px; }
    .brand-text h1{ font-size: 15px; }
    .mainnav{ display:none; }
    .hamburger-btn{ display:flex; }
    .profile-chip .profile-label{ display:none; }
    .topbar-divider{ display:none; }

    body.mobile-nav-open .mainnav{
      display:flex; flex-direction:column; align-items:stretch;
      position:fixed; top:56px; left:0; right:0; bottom:0;
      background: var(--surface); z-index:90; padding:14px; gap:2px; overflow-y:auto;
    }
    .mainnav-item{ flex-direction:column; align-items:stretch; }
    .mainnav-link{
      height:auto; padding:13px 12px; color: var(--ink); justify-content:space-between;
      border-radius: var(--radius-md); width:100%;
    }
    .mainnav-link:hover{ background: var(--bg); color:var(--ink); }
    .mainnav-item.active-group > .mainnav-link{ color: var(--red); background: var(--red-tint); }
    .mainnav-item.active-group > .mainnav-link::after{ display:none; }
    .mainnav-item.open > .mainnav-link{ background: var(--bg); color:var(--ink); }
    .dropdown-menu{ position:static; box-shadow:none; border:none; background:var(--bg); margin-top:4px; min-width:0; }
  }

  @media (max-width: 560px){
    .statbar{ grid-template-columns: 1fr; }
    .subgrid{ grid-template-columns: 1fr; }
    .hero-mix{ flex-direction:column; align-items:flex-start; padding: 20px; }
    .hero-mix .btn{ width:100%; text-align:center; }
    .card{ padding: var(--space-lg) var(--space-md); }
    .chapter{ padding: 20px 17px; }
    .chapter-head{ flex-wrap:wrap; }
    .chapter-headright{ text-align:left; }
    .fiche-card{ padding: 22px 17px; }
    .fiche-card-head{ flex-wrap:wrap; }
    .flashcard-front .q{ font-size: 17px; }
    .flashcard-back .a{ font-size: 14px; }
    .flash-source{ padding: 12px 14px; }
    .flash-source-excerpt, .flash-source-example{ font-size: 13px; }
    .ai-history-item .hprompt{ max-width: 180px; }
    .level-heading{ align-items:flex-start; }
    .level-heading .line{ display:none; }

const QUESTIONS = [
  // ---------- THEME: fondamentaux ----------
  {theme:"fondamentaux", q:"Comment définit-on l'étude de marché ?", opts:[

    "Une base de données de tous les concurrents d'un secteur",

    "Seulement avant le lancement d'un nouveau produit",

    "Une fois par an, de façon systématique",
    "Uniquement quand les ventes chutent"
  ], correct:1, exp:"L'étude de marché sert à conseiller la direction : elle est utile dès qu'une décision nécessite des informations fiables."},

  {theme:"fondamentaux", q:"Lequel n'est PAS présenté comme un risque de ne pas mener d'étude de marché ?", opts:[
    "Négliger des opportunités",
    "Mauvaise compréhension des besoins des consommateurs",
    "Une hausse automatique du chiffre d'affaires",
    "Difficultés à attirer des financements"
  ], correct:2, exp:"Ne pas faire d'étude de marché n'apporte aucun bénéfice — c'est justement l'absence d'information qui fragilise les décisions."},

  {theme:"fondamentaux", q:"L'étude de marché suit une approche scientifique structurée en 4 étapes. Laquelle NE fait PAS partie de ces étapes ?", opts:[
    "Description", "Explication", "Certification", "Prédiction"
  ], correct:2, exp:"Les 4 étapes sont : Description, Explication, Prédiction, Contrôle."},

  {theme:"fondamentaux", q:"Quelle est la différence entre problématique commerciale et objectif de recherche ?", opts:[
    "Ce sont deux termes strictement synonymes",
    "La problématique commerciale est le problème du décideur (la décision à prendre) ; l'objectif de recherche définit l'information nécessaire pour l'éclairer",
    "L'objectif de recherche précède toujours la problématique commerciale",
    "La problématique commerciale concerne uniquement les données quantitatives"
  ], correct:1, exp:"La problématique commerciale correspond à la décision du manager ; l'objectif de recherche en découle et précise quelles informations aller chercher."},

  {theme:"fondamentaux", q:"À quoi sert le Research Brief ?", opts:[
    "À présenter le budget marketing de l'année",
    "À lister les concurrents directs de l'entreprise",
    "À énoncer explicitement les objectifs de recherche et les informations à recueillir",
    "À remplacer le rapport final de l'étude"
  ], correct:2, exp:"Le Research Brief formalise, de façon claire et explicite, les objectifs de recherche et les informations attendues."},

  {theme:"fondamentaux", q:"Quel est l'enchaînement correct des 5 étapes du processus général d'étude de marché ?", opts:[
    "Collecte des données → Définition de la problématique → Plan de recherche → Analyse → Rapport",
    "Définition de la problématique → Plan de recherche → Collecte des données → Analyse des données → Rapport",
    "Plan de recherche → Analyse des données → Définition de la problématique → Collecte → Rapport",
    "Rapport → Définition de la problématique → Collecte → Analyse → Plan de recherche"
  ], correct:1, exp:"L'ordre est : 1) problématique, 2) plan de recherche, 3) collecte des données (terrain), 4) analyse, 5) rapport."},

  {theme:"fondamentaux", q:"Quel est l'objectif principal d'un cahier des charges de recherche ?", opts:[
    "Résumer les résultats de l'enquête",
    "Présenter les objectifs de la recherche et les informations nécessaires",
    "Recruter des répondants",
    "Faire de la publicité pour l'entreprise"
  ], correct:1, exp:"Le cahier des charges (Research Brief) sert à présenter clairement les objectifs de la recherche et les informations à recueillir."},

  // ---------- THEME: donnees ----------
  {theme:"donnees", q:"Que sont les données secondaires ?", opts:[
    "Des données collectées pour la première fois pour la recherche en cours",
    "Des informations déjà collectées auparavant, à des fins différentes de la recherche actuelle",
    "Des données uniquement issues de sondages internes",
    "Des données jugées peu fiables et à éviter"
  ], correct:1, exp:"Les données secondaires existent déjà : elles ont été collectées pour un autre objectif que l'étude en cours."},

  {theme:"donnees", q:"Que sont les données primaires ?", opts:[
    "Des données collectées pour la première fois, spécifiquement pour traiter la problématique de recherche étudiée",
    "Des données gratuites disponibles sur Internet",
    "Des données historiques de plus de 10 ans",
    "Des statistiques publiées par l'INSEE"
  ], correct:0, exp:"Les données primaires sont recueillies spécifiquement pour répondre à la problématique actuelle — elles n'existaient pas avant l'étude."},

  {theme:"donnees", q:"Lequel N'EST PAS un avantage des données secondaires ?", opts:[
    "Facilement accessibles", "Relativement peu coûteuses", "Toujours parfaitement à jour et pertinentes", "Rapidement obtenues"
  ], correct:2, exp:"Au contraire, les données secondaires peuvent être obsolètes ou pas entièrement pertinentes — c'est justement une de leurs limites."},

  {theme:"donnees", q:"Laquelle de ces sources est une source INTERNE de données secondaires ?", opts:[
    "Statista", "Les chiffres de vente de l'entreprise", "L'INSEE", "Les études XERFI"
  ], correct:1, exp:"Les chiffres de vente (organisés par zone, produit, année) proviennent directement de l'entreprise : c'est une source interne."},

  {theme:"donnees", q:"Quand doit-on privilégier la collecte de données primaires ?", opts:[
    "Systématiquement, avant toute donnée secondaire",
    "Lorsque les données secondaires ne permettent pas de répondre à la problématique commerciale",
    "Uniquement pour les grandes entreprises cotées",

  {theme:"donnees", q:"D'après le cours, quelle précaution faut-il prendre avec les données secondaires générées par l'IA ?", opts:[
    "Aucune, elles sont automatiquement fiables",
    "Vérifier soigneusement leurs sources et leur fiabilité",
    "Les utiliser uniquement comme données primaires",
    "Les ignorer systématiquement"
  ], correct:1, exp:"L'IA peut fournir rapidement des données secondaires, mais leurs sources et leur fiabilité doivent être soigneusement évaluées."},

  {theme:"donnees", q:"Quel type de données correspond à des informations déjà collectées pour un autre objectif ?", opts:[
    "Données primaires", "Données expérimentales", "Données secondaires", "Données qualitatives"
  ], correct:2, exp:"C'est la définition même des données secondaires : elles ont été collectées auparavant, pour un autre objectif."},

  {theme:"donnees", q:"Lequel des éléments suivants est un exemple de source EXTERNE de données secondaires ?", opts:[
    "Registres de ventes de l'entreprise",
    "Base de données des réclamations clients",
    "Revues académiques",
    "Données internes du programme de fidélité"
  ], correct:2, exp:"Les revues académiques sont produites hors de l'entreprise : c'est une source externe, contrairement aux données internes de vente, réclamations ou fidélité."},

  // ---------- THEME: recherche ----------
  {theme:"recherche", q:"Quel objectif poursuit la recherche qualitative ?", opts:[
    "Comprendre le « QUOI » — obtenir des idées et perspectives sur un phénomène nouveau",
    "Comprendre le « COMMENT » via la mesure d'un phénomène",
    "Comprendre le « POURQUOI » via une relation de cause à effet",
    "Confirmer une hypothèse déjà solidement établie"
  ], correct:0, exp:"La recherche qualitative vise à comprendre un phénomène encore peu connu : elle répond au « QUOI »."},

  {theme:"recherche", q:"La recherche descriptive répond principalement à quelle question ?", opts:[
    "Pourquoi ?", "Quoi ?", "Comment ?", "Qui a décidé ?"
  ], correct:2, exp:"La recherche descriptive (quantitative) mesure la fréquence d'un phénomène et les relations entre variables : elle répond au « COMMENT »."},

  {theme:"recherche", q:"La recherche causale correspond à :", opts:[
    "Un plan expérimental visant à identifier une relation de cause à effet",
    "Une phase exploratoire sans hypothèse préalable",
    "Une simple collecte de données secondaires",
    "Une étude menée uniquement par entretiens"
  ], correct:0, exp:"La recherche causale teste des hypothèses en conditions contrôlées pour établir une relation de cause à effet — elle répond au « POURQUOI »."},

  {theme:"recherche", q:"Dans un projet de recherche typique, quel est l'enchaînement logique des trois types de recherche ?", opts:[
    "Causale → Descriptive → Qualitative",
    "Descriptive → Causale → Qualitative",
    "Qualitative (exploratoire) → Descriptive → Causale",
    "Les trois se déroulent toujours simultanément"
  ], correct:2, exp:"On explore d'abord en qualitatif, on mesure ensuite en descriptif, puis on teste les hypothèses en causal (phase conclusive)."},

  {theme:"recherche", q:"« Nous voulons tester la préférence des consommateurs pour différents tons de communication (ex : l'humour) » : de quel type de recherche s'agit-il ?", opts:[
    "Recherche qualitative", "Recherche descriptive", "Recherche causale", "Recherche documentaire"
  ], correct:2, exp:"Tester l'effet d'une variable (le ton) sur une préférence est une démarche causale, expérimentale."},

  {theme:"recherche", q:"Quelle affirmation est vraie concernant la connaissance préalable du sujet ?", opts:[
    "La recherche qualitative nécessite une connaissance approfondie et des hypothèses",
    "La recherche causale se mène avec une connaissance faible ou inexistante du sujet",
    "Descriptive et causale s'appuient sur une connaissance approfondie du sujet, contrairement à la qualitative",
    "Le niveau de connaissance préalable n'a aucune importance"
  ], correct:2, exp:"Qualitatif = connaissance faible/inexistante (exploration) ; descriptif et causal = connaissance approfondie permettant de formuler des hypothèses."},

  {theme:"recherche", q:"Quel est l'objectif principal de la recherche descriptive ?", opts:[
    "Comprendre pourquoi un phénomène se produit",
    "Quantifier et décrire un phénomène",
    "Générer uniquement des premiers enseignements",
    "Recruter des répondants"
  ], correct:1, exp:"La recherche descriptive vise à quantifier et décrire un phénomène, en mesurant sa fréquence et ses relations avec d'autres variables."},

  {theme:"recherche", q:"Quel type de recherche est généralement mené en premier lorsqu'on étudie un nouveau phénomène ?", opts:[
    "Recherche causale", "Recherche descriptive", "Recherche qualitative", "Recherche expérimentale"
  ], correct:2, exp:"On commence toujours par la recherche qualitative (exploratoire) avant de passer au descriptif puis au causal."},

  {theme:"recherche", q:"Quel type de recherche est principalement utilisé pour identifier des relations de cause à effet ?", opts:[
    "Recherche qualitative", "Recherche descriptive", "Recherche causale", "Recherche secondaire"
  ], correct:2, exp:"C'est la recherche causale, de nature expérimentale, qui permet d'établir une relation de cause à effet."},

  // ---------- THEME: echantillonnage ----------
  {theme:"echantillon", q:"Quelle est la différence essentielle entre échantillonnage probabiliste et non probabiliste ?", opts:[
    "Le probabiliste ne concerne que les grandes populations",

    "Le non probabiliste est toujours plus fiable statistiquement",
    "Il n'y a aucune différence pratique entre les deux"
  ], correct:1, exp:"Le probabiliste repose sur le hasard et l'égalité des chances ; le non probabiliste sur la commodité ou un choix raisonné du chercheur."},

  {theme:"echantillon", q:"Un tirage au sort façon loto, où chaque individu a une chance égale d'être choisi, illustre :", opts:[
    "L'échantillon de convenance", "L'échantillon aléatoire simple", "L'échantillon boule de neige", "Le recensement"

  {theme:"echantillon", q:"Diviser la population en strates (ex : par tranche d'âge) puis échantillonner dans chaque strate correspond à :", opts:[
    "L'échantillonnage stratifié", "L'échantillonnage de convenance", "L'échantillonnage boule de neige", "Le recensement"

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function pad2(n){ return n<10 ? "0"+n : ""+n; }
function dateKey(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayKey(){ return dateKey(new Date()); }
function mondayOfThisWeek(){
  const d = new Date();
  const day = d.getDay(); // 0 = dimanche, 1 = lundi, ...
  const diff = day === 0 ? -6 : 1 - day; // recule jusqu'au lundi
  d.setDate(d.getDate() + diff);
  return d;
}
function weeklyCount(){
  const monday = mondayOfThisWeek();
  const stats = state.dash.dailyStats;
  let total = 0;
  for(let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    const k = dateKey(d);
    if(stats[k]) total += stats[k].answered;
  }
  return total;
}
function diffDaysKeys(a,b){
  const da = new Date(a+"T00:00:00");
  const db = new Date(b+"T00:00:00");
  return Math.round((db-da)/86400000);
}

function computeStreaks(dateKeys){
  const set = new Set(dateKeys || []);
  if(set.size === 0) return {current:0, best:0};
  const sorted = Array.from(set).sort();
  let best = 1, run = 1;
  for(let i=1;i<sorted.length;i++){
    if(diffDaysKeys(sorted[i-1], sorted[i]) === 1) run++; else run = 1;
    if(run > best) best = run;
  }
  let cursor = new Date();
  let cKey = dateKey(cursor);
  if(!set.has(cKey)){
    cursor.setDate(cursor.getDate()-1);
    cKey = dateKey(cursor);
    if(!set.has(cKey)) return {current:0, best};
  }
  let current = 0;
  while(set.has(dateKey(cursor))){
    current++;
    cursor.setDate(cursor.getDate()-1);
  }
  return {current, best};
}

function fmtDuration(totalSeconds){
  const s = totalSeconds || 0;
  if(s < 60) return s + " sec";
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  if(h > 0) return h + "h" + (m>0 ? " "+pad2(m)+"min" : "");
  return m + " min";
}

function fmtRelativeDate(k){
  const today = todayKey();
  const yestDate = new Date(); yestDate.setDate(yestDate.getDate()-1);
  const yest = dateKey(yestDate);
  if(k === today) return t("date.today");
  if(k === yest) return t("date.yesterday");
  const diff = diffDaysKeys(k, today);
  if(diff < 7 && diff > 0) return t("date.days_ago", {n: diff});
  const dt = new Date(k+"T00:00:00");
  return dt.toLocaleDateString(currentLocaleTag(), {day:"2-digit", month:"short"});
}

function chapterIdFromQuizScope(scope){
  if(typeof scope !== "string") return null;
  if(scope.indexOf("chapter:") === 0) return scope.slice(8);
  if(CHAPTERS.some(c=>c.id===scope)) return scope;
  const ch = CHAPTERS.find(c=>c.themes.includes(scope));
  return ch ? ch.id : null;
}

/* Progression d'un chapitre "utilisateur" : basée sur les tentatives de quiz/flashcards
   générés par IA, enregistrées sous la même clé que le reste du site ("chapter:<id>"). */
function userChapterProgress(ch){
  const quizP = state.progress["chapter:"+ch.id];
  const flashP = state.flashProgress[ch.id];
  const vals = [];
  if(quizP) vals.push(quizP.best);
  if(flashP) vals.push(flashP.best);
  if(vals.length === 0) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}

function subjectProgress(subjectId){
  const chs = chaptersOfSubject(subjectId);
  if(chs.length === 0) return null;
  let sum = 0, n = 0;
  chs.forEach(ch=>{
    const p = isUserChapter(ch.id) ? userChapterProgress(ch) : chapterMetrics(ch).mastery;
    if(p !== null && p !== undefined){ sum += p; n++; }
  });
  return n ? Math.round(sum/n) : 0;
}

const memoryFallback = {};   // utilisé si localStorage est indisponible
let storageAvailable = true;

/* Espace de stockage local, scopé par compte Supabase connecté. Corrige une
   limite pré-existante et déjà déclarée lors des étapes précédentes
   (audit complet, "Ma progression", "Révision intelligente") : les données
   locales de révision n'étaient scopées par AUCUN identifiant de compte,
   donc visibles par n'importe quel compte connecté sur le même navigateur.
   Invité (ou Supabase non configuré) -> namespace vide : comportement
   strictement identique à avant ce correctif. Voir claimGuestDataForUser()
   pour la migration unique et non destructive des données pré-existantes
   vers le premier compte qui se connecte sur ce navigateur. */
function currentStorageNamespace(){
  const authed = window.LyonAuth && LyonAuth.available && LyonAuth.state.status === "signed-in" && LyonAuth.state.user;
  return authed ? ("u." + LyonAuth.state.user.id + ".") : "";
}

function lsGet(key){
  const nsKey = currentStorageNamespace() + key;
  try{
    const raw = localStorage.getItem(LS_PREFIX + nsKey);
    if(raw === null) return null;
    return JSON.parse(raw);
  }catch(e){
    storageAvailable = false;
    return memoryFallback[nsKey] !== undefined ? memoryFallback[nsKey] : null;
  }
}

function lsSet(key, value){
  const nsKey = currentStorageNamespace() + key;
  memoryFallback[nsKey] = value;
  try{
    localStorage.setItem(LS_PREFIX + nsKey, JSON.stringify(value));
    return true;
  }catch(e){
    storageAvailable = false;
    return false;
  }
}

/* Ancienne API de stockage (window.storage) : on l'importe une seule fois,
   sans jamais l'effacer, pour ne perdre aucune donnée déjà enregistrée. */
async function legacyGet(key){
  try{
    if(typeof window === "undefined" || !window.storage || !window.storage.get) return null;
    const res = await window.storage.get(key, false);
    if(res && res.value) return JSON.parse(res.value);
    return null;
  }catch(e){ return null; }
}

async function loadKey(key, fallback){
  const local = lsGet(key);
  if(local !== null && local !== undefined) return local;
  const legacy = await legacyGet(key);
  if(legacy !== null && legacy !== undefined){
    lsSet(key, legacy);   // migration non destructive
    return legacy;
  }
  return fallback;
}

async function loadAllData(){
  state.progress      = await loadKey(KEY_QUIZ, {});
  state.flashProgress = await loadKey(KEY_FLASH, {});
  state.aiHistory     = await loadKey(KEY_AI, []);
  // NB: pas de "if(dash){...}" — chaque champ doit être réinitialisé à sa
  // valeur par défaut même quand `dash` est null (aucune donnée sauvegardée
  // dans cet espace), sinon loadAllData() appelé une deuxième fois (voir
  // handleAuthUserChange, changement de compte) laisserait les valeurs en
  // mémoire du compte PRÉCÉDENT inchangées — un vrai risque de fuite de
  // données entre comptes, pas seulement un défaut d'affichage.
  const dash = await loadKey(KEY_DASH, null);
  state.dash.totalAnswered    = (dash && dash.totalAnswered) || 0;
  state.dash.totalCorrect     = (dash && dash.totalCorrect) || 0;

  state.dash.recentAdds = (dash && dash.recentAdds) || [];
  state.dash.dailyTimeSeconds = (dash && dash.dailyTimeSeconds) || {};
  state.qstats = await loadKey(KEY_QSTATS, {});
  state.exam.history = await loadKey(KEY_EXAM, []);
  state.aiCards = await loadKey(KEY_AICARDS, {});
  state.badges = await loadKey(KEY_BADGES, {});
  state.userSubjects = await loadKey(KEY_USER_SUBJECTS, []);
  state.userChapters = await loadKey(KEY_USER_CHAPTERS, []);
  // Même raison que pour state.dash ci-dessus : toujours réinitialiser,
  // jamais de "if(savedPlanning){...}" qui laisserait les événements de
  // planning d'un compte précédent visibles pour le suivant.
  const savedPlanning = await loadKey(KEY_PLANNING, null);

  const savedBubble = lsGet(KEY_AIBUBBLE);
  const defaultFabPos = defaultAIFabPos();
  state.aiBubble.side = defaultFabPos.side;

/* Toutes les clés de données locales concernées par le scoping par compte
   (voir currentStorageNamespace) — fonction (pas une const) car certaines
   clés (KEY_AIMODEL) sont déclarées plus bas dans le fichier ; évaluée
   seulement au moment de l'appel, jamais au chargement du script. */
function storageNamespacedKeys(){
  return [
    KEY_QUIZ, KEY_FLASH, KEY_AI, KEY_DASH, KEY_QSTATS, KEY_EXAM, KEY_AICARDS,
    KEY_BADGES, KEY_USER_SUBJECTS, KEY_USER_CHAPTERS, KEY_PLANNING, KEY_DOCUMENTS,
    KEY_COURSE_DATA, KEY_AIBUBBLE, KEY_AIMODEL, KEY_STUDY_PLAN,
  ];
}

/* Migration unique et non destructive : la première fois qu'un compte se
   connecte sur ce navigateur, ses données locales pré-existantes (invité,
   ou d'avant ce correctif) sont copiées vers son propre espace nommé — rien
   n'est perdu pour l'utilisateur déjà existant (voir §27, compatibilité).
   Un marqueur global (jamais lui-même namespacé) garantit qu'un DEUXIÈME
   compte différent ne pourra plus jamais hériter de cette même donnée :
   il démarrera avec un espace strictement vide, garantissant l'isolation
   entre comptes (voir §24). Idempotent et sûr si localStorage est
   indisponible (no-op silencieux, voir storageAvailable). */
function claimGuestDataForUser(userId){
  let claimedBy = null;
  try{ claimedBy = localStorage.getItem(LS_PREFIX + "storage-claimed-by"); }catch(e){ return; }
  if(claimedBy !== null) return;
  storageNamespacedKeys().forEach(key=>{
    try{
      const guestRaw = localStorage.getItem(LS_PREFIX + key);

    }catch(e){ /* stockage indisponible : rien à migrer, non bloquant */ }
  });
  try{ localStorage.setItem(LS_PREFIX + "storage-claimed-by", userId); }catch(e){ /* non bloquant */ }
}

function migrateLegacyWrongQuestions(){

/* ============================================================
   5bis. MOTEUR DE MAÎTRISE PAR QUESTION
   ============================================================ */
function qstat(q){ return state.qstats[q.uid] || null; }

function recordQuestionResult(q, ok){
  const s = state.qstats[q.uid] || {seen:0, correct:0, wrong:0, streak:0, last:null, lastDate:null, history:[], theme:q.theme};
  s.seen++;
  if(ok){ s.correct++; s.streak = s.streak > 0 ? s.streak + 1 : 1; s.last = "ok"; }
  else   { s.wrong++;   s.streak = 0;                               s.last = "ko"; }
  s.history.push(ok ? 1 : 0);
  if(s.history.length > 10) s.history = s.history.slice(-10);
  s.lastDate = todayKey();
  s.theme = q.theme;
  state.qstats[q.uid] = s;
  saveQStats();
  return s;
}

/* Niveau de maîtrise 0-100, ou null si la question n'a jamais été répondue.
   Les réponses les plus récentes pèsent davantage, et une série de bonnes
   réponses donne un bonus (mémorisation consolidée). */
function masteryOf(q){
  const s = qstat(q);
  if(!s || !s.seen) return null;
  const h = s.history.slice(-5);
  let sum = 0, weights = 0;
  h.forEach((v,i) => { const w = i + 1; sum += v * w; weights += w; });
  let m = weights ? (sum / weights) * 100 : 0;
  if(s.streak >= 3) m = Math.min(100, m + 10);
  if(s.seen === 1) m = m * 0.9;            // une seule réponse = maîtrise non confirmée
  return Math.max(0, Math.min(100, Math.round(m)));
}

function successRateOf(q){
  const s = qstat(q);
  if(!s || !s.seen) return null;
  return Math.round((s.correct / s.seen) * 100);
}

function masteryTier(m){
  if(m === null || m === undefined) return {key:"new",       label:"Jamais faite"};
  if(m >= 85) return {key:"mastered", label:"Maîtrisée"};
  if(m >= 60) return {key:"good",     label:"Acquise"};
  if(m >= 35) return {key:"weak",     label:"Fragile"};
  return {key:"critical", label:"À revoir"};
}

/* --- Sélections automatiques --- */
function poolNever(){
  return QUESTIONS.filter(q => { const s = qstat(q); return !s || !s.seen; });
}
function poolWrong(){
  return QUESTIONS.filter(q => { const s = qstat(q); return s && s.last === "ko"; });
}
function poolHard(){
  return QUESTIONS
    .filter(q => { const s = qstat(q); return s && s.seen >= 2 && (s.correct / s.seen) < 0.5; })
    .sort((a,b) => (successRateOf(a) - successRateOf(b)) || (qstat(b).wrong - qstat(a).wrong));
}
/* "À revoir" : les questions déjà vues dont la maîtrise est la plus faible. */
function poolReview(limit){
  const list = QUESTIONS
    .filter(q => { const m = masteryOf(q); return m !== null && m < 75; })
    .sort((a,b) => masteryOf(a) - masteryOf(b));
  return typeof limit === "number" ? list.slice(0, limit) : list;
}
/* Révision express : priorité aux points faibles, complétée par du neuf et de l'aléatoire. */
function poolExpress(n){
  n = n || 10;
  const picked = [];
  const seen = {};
  const add = arr => arr.forEach(q => { if(!seen[q.uid] && picked.length < n){ seen[q.uid]=true; picked.push(q); } });
  add(shuffle(poolWrong()));
  add(poolReview().slice(0, n));
  add(shuffle(poolNever()));
  add(shuffle(QUESTIONS));
  return shuffle(picked);
}

/* --- Agrégats --- */
function globalMetrics(){
  let answered = 0, sumMastery = 0, totalSeen = 0, totalCorrect = 0, mastered = 0;
  QUESTIONS.forEach(q => {
    const m = masteryOf(q);
    if(m !== null){ answered++; sumMastery += m; if(m >= 85) mastered++; }
    const s = qstat(q);
    if(s){ totalSeen += s.seen; totalCorrect += s.correct; }
  });
  const total = QUESTIONS.length;
  return {
    total,
    answered,
    never: total - answered,
    coverage: Math.round((answered / total) * 100),
    mastery: Math.round(sumMastery / total),           // les questions jamais faites comptent 0
    masteredCount: mastered,
    successRate: totalSeen ? Math.round((totalCorrect / totalSeen) * 100) : null,
    totalSeen,
    totalCorrect,
  };
}

function themeMastery(themeId){
  const qs = QUESTIONS.filter(q => q.theme === themeId);
  if(qs.length === 0) return null;
  let sum = 0;
  qs.forEach(q => { const m = masteryOf(q); sum += (m === null ? 0 : m); });
  return Math.round(sum / qs.length);
}

function chapterMetrics(ch){
  const qs = QUESTIONS.filter(q => (ch.themes||[]).includes(q.theme));
  let answered = 0;
  qs.forEach(q => { if(masteryOf(q) !== null) answered++; });
  const mastery = qs.length ? Math.round(qs.reduce((acc,q)=>{ const m = masteryOf(q); return acc + (m===null?0:m); },0) / qs.length) : 0;
  return {
    total: qs.length,
    answered,
    coverage: qs.length ? Math.round((answered/qs.length)*100) : 0,
    mastery,
    mastered: mastery >= 80 && answered === qs.length && qs.length > 0,
  };
}

function masteredChaptersCount(){
  return CHAPTERS.filter(ch => chapterMetrics(ch).mastered).length;
}

/* Progression globale affichée sur l'accueil : niveau de maîtrise réel. */
function globalProgressPct(){ return globalMetrics().mastery; }

/* ============================================================
   5quater. TRACKING DES ACTIVITÉS
   ============================================================ */
function accrueTime(){
  const now = Date.now();
  if(lastActionTs){
    const delta = now - lastActionTs;
    if(delta > 0 && delta < 3*60*1000){
      const secs = Math.round(delta/1000);
      state.dash.timeSpentSeconds += secs;
      const today = todayKey();
      state.dash.dailyTimeSeconds[today] = (state.dash.dailyTimeSeconds[today] || 0) + secs;
    }
  }
  lastActionTs = now;
}

function markTodayActive(){
  const today = todayKey();
  if(state.dash.activityDates.indexOf(today) === -1){
    state.dash.activityDates.push(today);
  }
}

function trackQuizAnswer(q, correct){
  accrueTime();
  if(q.ai){ markTodayActive(); saveDashboardStats(); return; }
  const d = state.dash;
  d.totalAnswered++;
  if(correct) d.totalCorrect++;
  if(correct){
    d.correctStreak = (d.correctStreak || 0) + 1;
    if(d.correctStreak > (d.bestCorrectStreak || 0)) d.bestCorrectStreak = d.correctStreak;
  } else {
    d.correctStreak = 0;
  }
  const today = todayKey();
  if(!d.dailyStats[today]) d.dailyStats[today] = {answered:0, correct:0};
  d.dailyStats[today].answered++;
  if(correct) d.dailyStats[today].correct++;
  markTodayActive();

  if(correct){
    if(d.wrongQuestions[q.id]) delete d.wrongQuestions[q.id];
  } else {
    const existing = d.wrongQuestions[q.id];
    d.wrongQuestions[q.id] = {
      theme: q.theme,
      q: q.q,
      wrongCount: existing ? existing.wrongCount + 1 : 1,
      lastWrong: today,
    };
  }
  saveDashboardStats();

  recordQuestionResult(q, correct);
  evaluateBadges();
}

function trackFlashActivity(){
  accrueTime();
  markTodayActive();
  saveDashboardStats();
}

function trackChapterVisit(chapterId, type){
  if(!chapterId) return;
  const d = state.dash;
  d.recentChapters = d.recentChapters.filter(c => c.chapterId !== chapterId);
  d.recentChapters.unshift({chapterId, type, ts: Date.now()});
  if(d.recentChapters.length > 8) d.recentChapters.length = 8;
  saveDashboardStats();
}

function logActivity(type, scope, label, score, total, timeUsed){
  const d = state.dash;
  const now = new Date();
  const pct = total ? Math.round((score/total)*100) : 0;
  d.recentActivity.unshift({
    ts: now.toISOString(), date: dateKey(now), type, scope, label,
    score, total, pct, timeUsed: (typeof timeUsed === "number" ? timeUsed : null),
  });
  if(d.recentActivity.length > 20) d.recentActivity.length = 20;
  if(type === "quiz" || type === "exam") d.quizzesCompleted = (d.quizzesCompleted || 0) + 1;
  if(total >= 10 && pct >= 90) d.best90Achieved = true;
  saveDashboardStats();
  evaluateBadges();
}

   6. QUIZ — LOGIQUE
   ============================================================ */
function startQuiz(scope, label, themeKeys, customPool){
  const source = customPool ? customPool : (themeKeys === "all" ? QUESTIONS : QUESTIONS.filter(q => themeKeys.includes(q.theme)));
  if(!source || source.length === 0) return;
  state.playing = { scope, label, themeKeys, custom: !!customPool, startedAt: Date.now() };
  state.pool = shuffle(source);
  state.index = 0;
  state.score = 0;
  state.answered = false;
  state.selectedOpt = null;
  state.recap = [];
  state.quizSourceOpen = false;
  state.screen = "quiz";
  state.tab = "quiz";
  const chId = chapterIdFromQuizScope(scope);
  if(chId) trackChapterVisit(chId, "quiz");
  render();
  window.scrollTo(0,0);
}

function selectOption(i){
  if(state.answered) return;
  state.answered = true;
  state.selectedOpt = i;
  const q = state.pool[state.index];
  const isCorrect = i === q.correct;
  if(isCorrect) state.score++;
  // Carte complète (pas juste le texte) : nécessaire pour l'écran "Revoir mes
  // erreurs" (réponse donnée, bonne réponse, explication, extrait du cours).
  state.recap.push({q, selectedOpt: i, ok: isCorrect});
  trackQuizAnswer(q, isCorrect);
  render();
}

function toggleQuizSource(){
  state.quizSourceOpen = !state.quizSourceOpen;
  render();
}

function nextQuestion(){
  if(state.index < state.pool.length - 1){
    state.index++;
    state.answered = false;
    state.selectedOpt = null;
    state.quizSourceOpen = false;
    render();
  } else {
    const pct = Math.round((state.score / state.pool.length) * 100);
    const timeUsed = state.playing.startedAt ? Math.round((Date.now() - state.playing.startedAt) / 1000) : null;
    saveProgress(state.playing.scope, pct);
    logActivity("quiz", state.playing.scope, state.playing.label, state.score, state.pool.length, timeUsed);
    state.playing.timeUsed = timeUsed;
    if(state.smartSession){
      const item = state.smartSession.items[state.smartSession.stepIndex];
      recordSmartSessionStep({ mode: "quiz", chapterId: item ? item.chapterId : null, title: state.playing.label, score: state.score, total: state.pool.length, pct, timeUsed });
      advanceSmartSession();
      return;
    }
    if(state.planningSession){
      recordPlanningSessionStep({ mode: "quiz", score: state.score, total: state.pool.length, pct, timeUsed });
      advancePlanningSession();
      return;
    }
    state.screen = "results";
    render();
  }
}

function backToPicker(){
  if(state.smartSession){ abortSmartSession(); return; }
  if(state.planningSession){ abortPlanningSession(); return; }
  state.screen = "picker";
  render();
}

/* ============================================================
   7bis. MODES DE RÉVISION INTELLIGENTS
   ============================================================ */
function startModeQuiz(mode){
  if(mode === "express"){
    const pool = poolExpress(10);
    if(pool.length) startQuiz("express", "Révision express (" + pool.length + " questions)", null, pool);
    return;
  }
  if(mode === "wrong"){
    const pool = poolWrong();
    if(pool.length) startQuiz("wrong", "Mes erreurs à revoir", null, shuffle(pool));
    return;
  }
  if(mode === "hard"){
    const pool = poolHard();
    if(pool.length) startQuiz("hard", "Questions difficiles", null, shuffle(pool));
    return;
  }
  if(mode === "never"){
    const pool = poolNever();
    if(pool.length) startQuiz("never", "Questions jamais faites", null, shuffle(pool));
    return;
  }
  if(mode === "review"){
    const pool = poolReview(15);
    if(pool.length) startQuiz("review", "À revoir en priorité", null, shuffle(pool));
    return;
  }
}

function continueRevision(){
  const d = state.dash;
  if(d.recentChapters && d.recentChapters.length > 0){
    const rc = d.recentChapters[0];
    const ch = findAnyChapter(rc.chapterId);
    if(ch){
      if(isUserChapter(ch.id)){
        if(rc.type === "flash" && ch.aiFlashcards && ch.aiFlashcards.length){
          state.tab = "flash";
          startFlashDeck(ch.id, ch.title, ch.aiFlashcards.slice());
          return;
        }
        if(ch.aiQuiz && ch.aiQuiz.length){
          startQuiz("chapter:"+ch.id, ch.title, null, ch.aiQuiz.slice());
          return;
        }
        libGoto("chapterDetail", {subjectId: ch.subjectId, chapterId: ch.id});
        switchTab("library");
        return;
      }
      if(rc.type === "flash"){
        state.tab = "flash";
        startFlashDeck(ch.id, ch.num + " · " + ch.title, deckCards(ch.id));
        return;
      }
      startQuiz("chapter:"+ch.id, ch.title, ch.themes);
      return;
    }
  }
  state.tab = "quiz";
  state.screen = "picker";
  render();
  window.scrollTo(0,0);
}

/* Bloc discret "Révision intelligente" du dashboard (§12) : une seule
   recommandation principale (la plus prioritaire) + un compte réel du
   nombre de notions qui méritent l'attention — jamais une liste complète
   (ça, c'est le rôle de la page dédiée). Recalculé à chaque rendu du
   dashboard comme le reste des blocs, via le même moteur que la page
   "Révision intelligente" (getSmartRevisionRecommendations) — aucune
   deuxième logique de recommandation. */
function renderDashboardSmartBlock(){
  // Même règle que renderSmartHome() : un utilisateur sans aucune donnée ne
  // doit jamais voir "N notions à réviser" (tous les chapitres jamais faits
  // qualifieraient), seulement le message neutre d'invitation.
  const hasAnyData = state.dash.recentActivity.length > 0
    || QUESTIONS.some(q => qstat(q))
    || state.userChapters.some(ch => userChapterProgress(ch) !== null);
  const recos = hasAnyData ? getSmartRevisionRecommendations() : [];
  const top = recos[0] || null;
  return `<div class="dash-card">
    <div class="dash-card-eyebrow">🧠 ${t("smart.title")}</div>
    ${top ? `
      <p class="dash-card-meta">${t("smart.dashboard_count", {n: recos.length})}</p>
      <h2 class="dash-card-title" style="font-size:16px;">${escapeHtml(top.title)}</h2>
      ${smartReasonHtml(top)}
      <button class="btn red small" id="dash-smart-btn" style="margin-top:10px;">${t("smart.dashboard_cta")} →</button>

      <p class="dash-card-meta">${t("smart.dashboard_empty")}</p>

}

/* "Mon emploi du temps" — aperçu du planning du jour directement sur le dashboard,
   avec détection du cours en cours et accès direct à l'espace de notes. */
function renderDashboardSchedule(){
  const previewDay = state.dashSchedulePreview === "tomorrow" ? 1 : 0;
  let html = `<div class="dash-card dash-schedule-card" id="dash-schedule-card">
    <div class="dash-card-head">
      <span class="section-title inline">${t("dashboard.schedule_title")}</span>
      <div class="dash-schedule-nav">
        <button class="dash-schedule-navbtn ${previewDay===0?"active":""}" data-schedule-day="today">${t("dashboard.today")}</button>
        <button class="dash-schedule-navbtn ${previewDay===1?"active":""}" data-schedule-day="tomorrow">${t("dashboard.tomorrow")}</button>
        <button class="dash-schedule-navbtn" id="dash-schedule-week">${t("dashboard.week")}</button>
      </div>
    </div>`;

  if(state.planning.events.length === 0){
    html += `<p class="dash-empty">${t("dashboard.no_planning")}</p>
      <button class="btn outline small" id="dash-schedule-setup" style="margin-top:6px;">${t("dashboard.setup_planning")}</button></div>`;
    return html;
  }

  const targetDate = new Date(Date.now() + previewDay * 86400000);
  const todaysEvents = eventsOnDay(targetDate).slice().sort((a,b)=>a.start-b.start);
  const current = previewDay === 0 ? getCurrentCourse() : null;

  if(current){
    const cd = getCourseData(current.id);
    const total = (current.end || current.start) - current.start;
    const elapsed = Math.min(total, Math.max(0, Date.now() - current.start));
    const pct = total > 0 ? Math.round((elapsed / total) * 100) : 0;
    const remainMin = Math.max(0, Math.round(((current.end || current.start) - Date.now()) / 60000));
    html += `<div class="dash-current-course" data-open-event="${current.id}" tabindex="0" role="button" aria-label="${escapeHtml(current.summary)} — en cours">
      <span class="badge-current">🟢 En cours${cd.favorite ? " · ★" : ""}</span>
      <div class="ccourse-title">${escapeHtml(current.summary)}</div>
      <div class="ccourse-meta">${fmtEventTimeRange(current)}${current.location ? " · " + escapeHtml(current.location) : ""}</div>
      <div class="ccourse-progressbar" id="dash-ccourse-progress" data-ev-start="${current.start}" data-ev-end="${current.end || current.start}">
        <div class="ccourse-progressbar-fill" id="dash-ccourse-fill" style="width:${pct}%;"></div>
      </div>
      <div class="ccourse-remaining" id="dash-ccourse-text">${pct}% · ${remainMin >= 60 ? Math.round(remainMin/6)/10 + " h" : remainMin + " min"} restantes</div>
      <button class="btn red small" data-open-event-notes="${current.id}" style="margin-top:8px;">✏️ Prendre des notes</button>
    </div>`;
  }

  const others = todaysEvents.filter(e => !current || e.id !== current.id);
  if(others.length){
    html += `<div class="dash-schedule-list">` + others.map(e=>{
      const st = getCourseStatus(e);
      const stLabel = st === "past" ? t("dashboard.status_done") : (st === "current" ? t("dashboard.status_current") : t("dashboard.status_upcoming"));
      return `<div class="dash-schedule-row status-${st}" data-open-event="${e.id}" tabindex="0" role="button" aria-label="${escapeHtml(e.summary)}">
        <span class="dash-schedule-time">${fmtEventTimeRange(e)}</span>
        <span class="dash-schedule-title">${escapeHtml(e.summary)}</span>
        <span class="dash-schedule-badge">${stLabel}</span>
      </div>`;
    }).join("") + `</div>`;
  } else if(!current){
    html += `<p class="dash-empty">${previewDay === 0 ? t("dashboard.no_course_today") : t("dashboard.no_course_tomorrow")}</p>`;
  }

  html += `<button class="btn-text" id="dash-schedule-full" style="margin-top:10px;">${t("dashboard.view_full_planning")}</button>`;
  html += `</div>`;
  return html;
}

/* Matières à mettre en avant sur le dashboard : les plus récemment consultées d'abord. */
function recentSubjectsPreview(limit){
  const seen = new Set();
  const result = [];
  (state.dash.recentChapters||[]).forEach(rc=>{
    const ch = findAnyChapter(rc.chapterId);
    const subj = ch ? subjectOfChapter(ch) : null;
    if(subj && !seen.has(subj.id)){ seen.add(subj.id); result.push(subj); }
  });
  allSubjects().forEach(s=>{ if(result.length < limit && !seen.has(s.id)){ seen.add(s.id); result.push(s); } });
  return result.slice(0, limit);
}

/* Fusionne sessions terminées + ajouts récents pour le fil d'activité du dashboard. */
function recentFeedItems(limit){
  const items = [];
  (state.dash.recentActivity||[]).forEach(a=>{
    const typeLbl = a.type === "exam" ? "Examen" : (a.type === "quiz" ? "Quiz" : "Flashcards");
    items.push({ ts: new Date(a.ts).getTime(), html: "Tu as terminé : <b>" + typeLbl + " — " + escapeHtml(a.label) + "</b> (" + a.pct + "%)" });
  });
  (state.dash.recentAdds||[]).forEach(a=>{
    items.push({ ts: a.ts, html: "Tu as ajouté : <b>" + escapeHtml(a.label) + "</b>" });
  });
  items.sort((x,y)=> y.ts - x.ts);
  return items.slice(0, limit).map(it => it.html);
}

}

/* ============================================================
   7quinto. MES MATIÈRES — bibliothèque de cours (nouveau)
   ============================================================ */
function libGoto(view, extra){
  state.library.view = view;
  if(extra) Object.assign(state.library, extra);
  render();
  window.scrollTo(0,0);
}

function libBreadcrumb(parts){
  // parts: [{label, view, extra} ...] — le dernier est toujours "courant" (non cliquable)
  let html = '<div class="breadcrumb">';
  parts.forEach((p,i)=>{
    if(i>0) html += '<span class="sep">›</span>';
    if(i === parts.length-1) html += `<span class="current">${escapeHtml(p.label)}</span>`;
    else html += `<button data-crumb="${i}">${escapeHtml(p.label)}</button>`;
  });
  html += '</div>';
  return {html, parts};
}
function attachBreadcrumbEvents(parts){
  document.querySelectorAll("[data-crumb]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const p = parts[parseInt(btn.dataset.crumb)];
      libGoto(p.view, p.extra);
    });
  });
}

function renderLibrary(){
  const lib = state.library;
  if(lib.view === "subjectForm") return renderSubjectForm();
  if(lib.view === "chapterForm") return renderChapterForm();
  if(lib.view === "chapterDetail") return renderChapterDetail();
  if(lib.view === "subjectDetail") return renderSubjectDetail();
  if(lib.view === "import") return renderCourseImportWizard();
  return renderSubjectsList();
}

function renderSubjectsList(){
  const subjects = allSubjects();
  let html = `
    <div class="lib-pagehead">
      <h1 class="page-title tight">Mes matières</h1>
      <div class="actions" style="justify-content:flex-start;margin:0;">
        <button class="btn-text" id="lib-import-course-btn">📥 Importer un cours</button>
        <button class="btn-text" id="lib-add-subject-btn">+ Ajouter une matière</button>
      </div>
    </div>
  `;

  SEMESTERS.forEach(sem=>{
    const subs = subjects.filter(s => s.semesterId === sem.id);
    if(subs.length === 0) return;
    html += `<div class="level-heading"><span class="tag">${escapeHtml(sem.name)}</span><span class="line"></span></div>`;
    html += `<div class="flash-deckgrid">`;
    subs.forEach(s=>{
      const chs = chaptersOfSubject(s.id);
      const prog = subjectProgress(s.id);
      const tier = statusTier(prog === null ? null : {best:prog});
      html += `<div class="flash-deckcard" data-open-subject="${s.id}" style="cursor:pointer;">
        <div class="top">
          <div style="display:flex;gap:11px;align-items:center;">
            <span class="icon" style="background:${s.color}22;">${s.icon || "📘"}</span>
            <div>
              <div class="name">${escapeHtml(s.name)}</div>
              <div class="desc">${chs.length} chapitre${chs.length>1?"s":""}</div>
            </div>
          </div>
        </div>
        <div class="deckbar-track"><div class="deckbar-fill ${tier.key}" style="width:${tier.pct}%;background:${s.color};"></div></div>
        <div class="bottom">
          <span class="mastery ${tier.key}">${prog===null ? "Pas encore commencé" : prog + "% de progression"}</span>
          <span class="btn-text" style="pointer-events:none;">Ouvrir →</span>
        </div>
      </div>`;
    });
    html += `</div>`;
  });

  if(subjects.length === 0){
    html += `<div class="empty-state"><div class="big">📭</div>Aucune matière pour l'instant.<br>Clique sur « + Ajouter une matière » pour créer la première.</div>`;
  }

  return html;
}

function renderSubjectDetail(){
  const s = findSubject(state.library.subjectId);
  if(!s){ state.library.view = "subjects"; return renderSubjectsList(); }
  const crumb = libBreadcrumb([{label:"Mes matières", view:"subjects"}, {label:s.name}]);
  const chs = chaptersOfSubject(s.id);

  let html = crumb.html;
  html += `<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap;">
    <span class="icon subject-card" style="background:${s.color}22;">${s.icon||"📘"}</span>
    <h1 class="page-title tight">${escapeHtml(s.name)}</h1>
    ${s.builtin ? '<span class="level-badge L2">Intégré</span>' : ""}

  if(s.description) html += `<p class="ai-intro" style="margin-top:6px;">${escapeHtml(s.description)}</p>`;

  html += `<div class="actions" style="margin:16px 0 26px;justify-content:flex-start;">
    <button class="btn red small" id="lib-add-chapter-btn">+ Ajouter un chapitre</button>
    ${!s.builtin ? `<button class="btn outline small" id="lib-edit-subject-btn">Modifier la matière</button>
    <button class="btn-text" id="lib-delete-subject-btn">Supprimer la matière</button>` : ""}

    html += `<div class="empty-state"><div class="big">📄</div>Aucun chapitre dans cette matière.<br>Clique sur « + Ajouter un chapitre » pour commencer.</div>`;
  } else {
    html += `<div class="lib-chgrid">`;
    chs.forEach(ch=>{
      const isUser = isUserChapter(ch.id);
      const prog = isUser ? userChapterProgress(ch) : chapterMetrics(ch).mastery;
      const tier = isUser ? statusTier(prog===null?null:{best:prog}) : (chapterMetrics(ch).answered===0 ? {key:"none",label:"Non commencé"} : (chapterMetrics(ch).mastered ? {key:"done",label:"Maîtrisé"} : {key:"progress",label:"En cours"}));
      const qCount = isUser ? (ch.aiQuiz ? ch.aiQuiz.length : 0) : chapterMetrics(ch).total;
      const cCount = isUser ? (ch.aiFlashcards ? ch.aiFlashcards.length : 0) : deckCards(ch.id).length;
      const metaParts = [];
      if(qCount) metaParts.push(qCount + " question" + (qCount>1?"s":""));
      if(cCount) metaParts.push(cCount + " flashcard" + (cCount>1?"s":""));
      html += `<div class="lib-chcard" data-open-chapter="${ch.id}">

/* Badge "S1", "S2"… affiché sur les cartes de chapitre de « Mes matières »
   (numéro d'ordre du chapitre, pas les identifiants internes L1/L2/L3). */
function chapterNumBadge(ch){
  const raw = String(ch.num || "").trim();
  const n = parseInt(raw, 10);
  return isFinite(n) ? "S" + n : raw;
}

function statusTierGeneric(pct){
  if(pct === null || pct === undefined) return {key:"none", label:"Non commencé", pct:0};
  if(pct >= 75) return {key:"done", label:"Terminé", pct};
  return {key:"progress", label:"En cours", pct};
}

  if(lib.view === "subjects"){

/* Convertit le contenu d'une fiche (JSON structuré, HTML ou texte/Markdown
   hérité) en texte brut exploitable comme contexte IA, sans jamais exposer
   de JSON brut au modèle. */
function ficheContentToPlainText(raw){
  const text = String(raw || "").trim();
  if(!text) return "";
  if(text[0] === "{"){
    try{
      const parsed = JSON.parse(text);
      if(parsed && Array.isArray(parsed.sections)){
        const parts = [];
        if(parsed.introduction) parts.push(parsed.introduction);
        parsed.sections.forEach(sec=>{
          if(sec.title) parts.push(sec.title + " :");
          (sec.items||[]).forEach(it=>{
            if(it.title && it.content) parts.push(it.title + " : " + it.content);
            else if(it.content) parts.push(it.content);
            else if(it.label && it.value) parts.push(it.label + " : " + it.value);
            if(it.example) parts.push("Exemple : " + it.example);
          });
        });
        if(parsed.keyPoints && parsed.keyPoints.length) parts.push("À retenir : " + parsed.keyPoints.join(" ; "));
        return parts.join("\n");
      }
    }catch(e){ /* pas du JSON : continue vers le nettoyage HTML/texte ci-dessous */ }
  }
  return stripHtml(text);
}
function chapterSourceText(ch){
  return ch.originalText || ficheContentToPlainText(ch.content) || "";
}

/* Texte source d'un chapitre, quel que soit son type (matière intégrée ou
   chapitre utilisateur) — utilisé par la liaison flashcard → cours
   ("Dans ton cours", voir plus bas). Ne duplique rien : relit simplement le
   texte déjà stocké (FICHES pour les chapitres intégrés, ch.originalText/
   ch.content pour les chapitres utilisateur). */
function flashcardSourceText(chapterId){
  if(!chapterId) return "";
  if(FICHES[chapterId] !== undefined) return stripHtml(FICHES[chapterId]);
  const ch = state.userChapters.find(c => c.id === chapterId);
  return ch ? chapterSourceText(ch) : "";
}

/* ---------- Actions IA pour un chapitre créé par l'utilisateur ----------
   Réutilise intégralement le moteur WebLLM déjà en place (webllmChat /
   webllmJsonChat), sans dupliquer de logique. */
function libChapterContext(ch){
  return clip("CHAPITRE : " + ch.title + (ch.desc ? " — " + ch.desc : "") + "\n\nCONTENU DU COURS :\n" + chapterSourceText(ch));
}

async function libRunUserChapterAI(ch, mode){
  state.aiChapter = null;
  state.aiAction = "course";
  if(!AI_ACTIONS.course) AI_ACTIONS.course = {icon:"📚", label:"Chapitre de ma bibliothèque", needs:"none", desc:""};

  state.aiThread = [];
  state.aiCardsDraft = null; state.aiQuizDraft = null; state.aiError = null;
  const ctx = libChapterContext(ch);
  const task = mode === "summary"
    ? "TÂCHE : rédige une synthèse de révision de ce chapitre (définitions clés, points essentiels en listes, puis 3 pièges classiques)."
    : "TÂCHE : fais réviser l'étudiant à l'oral sur ce chapitre. Pose UNE SEULE question ouverte à la fois, attends sa réponse, puis corrige brièvement avant d'enchaîner. Commence directement par la première question.";
  state.aiThread = [{role:"user", content: aiSystemPrompt() + "\n\n" + ctx + "\n\n" + task, display: (mode==="summary"?"📖 Résumer — ":"🎤 Réviser — ") + ch.title}];
  state.aiContextLabel = "Contexte : chapitre « " + ch.title + "» (Ma bibliothèque)";
  state.tab = "ai";
  window.scrollTo(0,0);
  await aiSend();
}

/* "Résumer ce chapitre" : utilise l'IA si prête, sinon un résumé heuristique
   (première phrase de chaque partie du texte) — jamais bloqué par WebGPU. */
async function libGenerateUserChapterSummary(ch){
  if(!ch.content || !ch.content.trim()){ showToast("Ajoute du contenu à ce chapitre avant de générer un résumé."); return; }
  if(state.aiStatus !== "ready"){
    const summary = heuristicSummary(chapterSourceText(ch));
    if(!summary){ showToast("Pas assez de texte structuré pour résumer ce chapitre."); return; }
    ch.summary = summary;
    saveUserChapters();
    render();
    return;
  }
  state.libToolsBusy = "summary";
  render();
  try{
    const summary = await generateCourseSummary(clip(chapterSourceText(ch), 20000), {title: ch.title, chapterTitle: ch.desc || ch.title, notions: ch.keyNotions || []});
    ch.summary = summary;
    saveUserChapters();
    state.libToolsBusy = null;
    render();
  }catch(e){
    state.libToolsBusy = null;
    render();
    showToast("Impossible de générer le résumé pour l'instant.");
  }
}

async function libGenerateUserChapterQuiz(ch){
  if(!ch.content || !ch.content.trim()){ showToast("Ajoute du contenu à ce chapitre avant de générer un quiz."); return; }
  if(state.aiStatus !== "ready"){
    const h = buildHeuristicCourseMaterials(chapterSourceText(ch));
    if(h.quiz.length === 0){ showToast("Pas assez de définitions claires pour générer un quiz fiable."); return; }
    const quizH = h.quiz.map(q => Object.assign({}, q, {chapterId: ch.id}));
    ch.aiQuiz = quizH;
    saveUserChapters();
    render();
    startQuiz("chapter:"+ch.id, ch.title, null, quizH);
    return;
  }
  state.libToolsBusy = "quiz";
  render();
  const prompt = aiSystemPrompt() + "\n\n" + libChapterContext(ch) +
    "\n\nTÂCHE : génère 6 questions à choix multiples inédites sur ce contenu, 4 options chacune, une seule bonne réponse. Pour chaque question, \"sourceQuote\" doit être une COURTE citation EXACTE (mot pour mot, sans reformulation) copiée depuis le contenu ci-dessus, qui justifie la bonne réponse. Si un exemple lié apparaît juste à côté dans le cours, ajoute \"exampleQuote\" (citation exacte) ; sinon laisse-le vide. Réponds UNIQUEMENT par un tableau JSON : [{\"q\":\"...\",\"opts\":[\"a\",\"b\",\"c\",\"d\"],\"correct\":0,\"exp\":\"...\",\"sourceQuote\":\"...\",\"exampleQuote\":\"...\"}]";
  try{
    const arr = await webllmJsonChat([{role:"user", content: prompt}], {});
    const quiz = (arr||[]).filter(q=>q&&q.q&&Array.isArray(q.opts)&&q.opts.length>=2&&typeof q.correct==="number")
      .map((q,i)=>({
        uid:"lib-"+ch.id+"-"+Date.now()+"-"+i, ai:true, theme:"ai", q:String(q.q), opts:q.opts.slice(0,4).map(String),
        correct:Math.max(0,Math.min(q.opts.length-1,q.correct)), exp:q.exp?String(q.exp):"", chapterId: ch.id,
        sourceQuote: q.sourceQuote ? String(q.sourceQuote) : "",
        exampleQuote: q.exampleQuote ? String(q.exampleQuote) : "",
      }));
    if(quiz.length === 0) throw new Error("format inattendu");
    ch.aiQuiz = quiz;
    saveUserChapters();
    state.libToolsBusy = null;
    render();
    startQuiz("chapter:"+ch.id, ch.title, null, quiz);
  }catch(e){
    state.libToolsBusy = null;
    render();
    showToast("Impossible de générer le quiz pour l'instant.");
  }
}

  try{

    render();
    showToast("Impossible de générer les flashcards pour l'instant.");
