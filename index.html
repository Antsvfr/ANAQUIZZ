function renderCourseLibrarySection(){
  const q = (state.catalog.query || "").trim().toLowerCase();
  const subjFilter = state.catalog.subjectId || "all";
  const semFilter = state.catalog.semesterId || "all";
  const scopeFilter = state.catalog.scope || "all";
  const levelFilter = state.catalog.level || "all";
  const revisionFilter = state.catalog.revisionState || "all";
  const sortBy = state.catalog.sortBy || "recent";
  const viewMode = state.catalog.viewMode || "grid";
  const subjects = allSubjects();

  let chapters = allChaptersFlat().filter(ch=>{
    const subj = findSubject(ch.subjectId);
    if(scopeFilter === "mine" && !isUserChapter(ch.id)) return false;
    if(scopeFilter === "builtin" && isUserChapter(ch.id)) return false;
    if(subjFilter !== "all" && ch.subjectId !== subjFilter) return false;
    if(semFilter !== "all" && (!subj || subj.semesterId !== semFilter)) return false;
    if(levelFilter !== "all" && ch.level !== levelFilter) return false;
    if(revisionFilter === "revised" && !courseIsRevised(ch)) return false;
    if(revisionFilter === "torevise" && courseIsRevised(ch)) return false;
    if(q){
      const hay = ((ch.title||"") + " " + (ch.desc||"") + " " + (subj?subj.name:"")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  chapters = chapters.slice().sort((a,b)=>{
    if(sortBy === "alpha") return a.title.localeCompare(b.title, "fr");
    if(sortBy === "progress") return (courseProgressOf(b)||0) - (courseProgressOf(a)||0);
    return (b.createdAt||0) - (a.createdAt||0);
  });

  const hasActiveFilters = !!(q || subjFilter!=="all" || semFilter!=="all" || scopeFilter!=="all" || levelFilter!=="all" || revisionFilter!=="all");

  let html = `<div class="section-title" style="margin-top:6px;">Bibliothèque de cours</div>`;

  html += `<div class="card course-filters-card">
    <input type="text" id="catalog-search" class="ai-select" placeholder="🔍 Rechercher un cours…" value="${escapeHtml(state.catalog.query||"")}">
    <div class="course-filters-row">
      <select id="catalog-subject" class="ai-select">
        <option value="all">Toutes les matières</option>
        ${subjects.map(s=>`<option value="${s.id}" ${subjFilter===s.id?"selected":""}>${escapeHtml(s.name)}</option>`).join("")}
      </select>
      <select id="catalog-semester" class="ai-select">
        <option value="all">Tous les semestres</option>
        ${SEMESTERS.map(sm=>`<option value="${sm.id}" ${semFilter===sm.id?"selected":""}>${escapeHtml(sm.name)}</option>`).join("")}
      </select>
      <select id="catalog-level" class="ai-select">
        <option value="all">Tous niveaux</option>
        ${LEVELS.map(lv=>`<option value="${lv}" ${levelFilter===lv?"selected":""}>${levelName(lv)}</option>`).join("")}
      </select>
      <select id="catalog-revision" class="ai-select">
        <option value="all" ${revisionFilter==="all"?"selected":""}>Statut : tous</option>
        <option value="revised" ${revisionFilter==="revised"?"selected":""}>Révisés</option>
        <option value="torevise" ${revisionFilter==="torevise"?"selected":""}>À revoir</option>
      </select>
      <select id="catalog-sort" class="ai-select">
        <option value="recent" ${sortBy==="recent"?"selected":""}>Tri : plus récents</option>
        <option value="alpha" ${sortBy==="alpha"?"selected":""}>Tri : alphabétique</option>
        <option value="progress" ${sortBy==="progress"?"selected":""}>Tri : progression</option>
      </select>
    </div>
    <div class="course-filters-footer">
      <div class="course-viewtoggle">
        <button class="course-viewbtn ${viewMode==="grid"?"active":""}" data-view-mode="grid" aria-label="Affichage en grille" title="Grille">▦</button>
        <button class="course-viewbtn ${viewMode==="list"?"active":""}" data-view-mode="list" aria-label="Affichage en liste" title="Liste">☰</button>
      </div>
      ${hasActiveFilters ? `<button class="btn-text" id="catalog-reset-filters">Réinitialiser les filtres</button>` : ""}
    </div>
  </div>`;

  if(chapters.length === 0){
    html += `<div class="empty-state"><div class="big">🔍</div>Aucun cours ne correspond à ta recherche.</div>`;
    return html;
  }

  html += `<div class="${viewMode==="grid" ? "course-grid" : "course-list"}">` + chapters.map(renderCourseCard).join("") + `</div>`;
  html += `<footer class="hint">${chapters.length} cours · clique sur une carte pour ouvrir sa fiche, son quiz et ses flashcards.</footer>`;
  return html;
}

/* ============================================================
   15duodecies. SOURCES CONNECTÉES — Brightspace
   ------------------------------------------------------------
   Brightspace est une SOURCE de contenu, pas une expérience séparée : un
   cours importé devient une matière REV-EM normale, qui bénéficie ensuite
   des fiches, quiz, flashcards, révision intelligente, statistiques,
   planning et assistant IA exactement comme un cours importé en PDF.

   Répartition des responsabilités :
     • Edge Function brightspace-api  → parle à Brightspace (token, CORS)
     • content-sources.js             → normalise et calcule le diff (pur)
     • ici                            → orchestre, écrit, affiche

   Supabase est la source de vérité pour le contenu Brightspace (d'où la
   disponibilité multi-appareils) ; l'état local en est une copie de travail,
   réhydratée au chargement.
   ============================================================ */

function bsConnected(){
  return !!(state.brightspace && state.brightspace.connection && state.brightspace.connection.status === "connected");
}

/* L'intégration n'existe que pour un compte connecté : sans identité
   Supabase, il n'y a ni token à rattacher ni ligne à protéger par RLS. */
function bsAvailable(){
  return !!(window.LyonAuth && LyonAuth.available && LyonAuth.client
    && LyonAuth.state.status === "signed-in" && window.LyonContentSources
    && window.LyonSync && window.LyonSourceAdapters);
}

async function bsInvoke(fn, body){
  const { data, error } = await LyonAuth.client.functions.invoke(fn, { body: body || {} });
  if(error){
    // Le corps d'erreur des Edge Functions porte un message déjà rédigé pour
    // l'utilisateur : on le préfère au message technique de supabase-js.
    let payload = null;
    try{ payload = await error.context.json(); }catch(e){}
    const err = new Error((payload && payload.message) || "Service indisponible.");
    err.code = payload && payload.error;
    err.retryable = !!(payload && payload.retryable);
    throw err;
  }
  return data;
}

async function bsLoadConnection(){
  if(!bsAvailable()){ state.brightspace.connection = null; return null; }
  // Les colonnes de token ne sont pas accordées au rôle authenticated :
  // même ce select ne peut pas les rapporter (voir la migration).
  const { data, error } = await LyonAuth.client
    .from("brightspace_connections")
    .select("tenant_url,status,scopes,last_synced_at,last_error,token_expires_at")
    .maybeSingle();
  if(error){ state.brightspace.connection = null; return null; }
  state.brightspace.connection = data || null;
  return data || null;
}

async function bsConnect(){
  if(!bsAvailable()) return;
  state.brightspace.busy = "connecting";
  state.brightspace.error = null;
  render();
  try{
    const res = await bsInvoke("brightspace-connect");
    if(res && res.url){ window.location.href = res.url; return; }
    throw new Error("URL d'autorisation absente.");
  }catch(e){
    state.brightspace.busy = null;
    state.brightspace.error = e.message || t("sources.error_generic");
    render();
  }
}

async function bsDisconnect(){
  if(!bsAvailable()) return;
  if(!confirm(t("sources.disconnect_confirm"))) return;
  state.brightspace.busy = "disconnecting";
  render();
  try{
    await bsInvoke("brightspace-disconnect");
    state.brightspace.connection = null;
    state.brightspace.lastResult = null;
    showToast(t("sources.disconnected"));
  }catch(e){
    state.brightspace.error = e.message || t("sources.error_generic");
  }finally{
    state.brightspace.busy = null;
    render();
  }
}

/* ---------- synchronisation ----------
   Tout le travail est fait par le moteur générique (sync-engine.js) : diff,
   déduplication, réessais, annulation, curseur de reprise et journal. Ce qui
   reste ici, c'est le BRANCHEMENT — quel adaptateur, quel store, quel journal —
   et l'affichage. Aucune logique de synchronisation n'est dupliquée dans le
   frontend, et aucune ligne de ce fichier ne connaît l'API Brightspace.

   Ajouter Moodle un jour : écrire un adaptateur, l'enregistrer. Ici, rien. */

/* L'adaptateur n'est construit qu'une fois : il lui faut un transport
   authentifié (bsInvoke), donc une session Supabase établie. */
function bsAdapter(){
  const SA = window.LyonSourceAdapters;
  if(!SA.has("brightspace")) SA.registerBrightspace({ transport: bsInvoke });
  return SA.get("brightspace");
}

function bsEngine(){
  const userId = LyonAuth.state.user.id;
  return LyonSync.createEngine({
    adapter: bsAdapter(),
    /* Le store est générique : il ne sait pas d'où vient le contenu. Seuls
       les champs venant de la source y transitent — fiches, quiz, flashcards
       et progression ne peuvent pas être écrasés par une resynchronisation. */
    store: LyonSync.createSupabaseStore(LyonAuth.client, userId, {
      containerDefaults: { semester_id: SEMESTERS[0].id },
    }),
    journal: LyonSync.createSupabaseJournal(LyonAuth.client, userId),
  });
}

/* Le rapport du moteur est générique (conteneurs / éléments) ; l'interface
   parle de matières et de chapitres. On traduit ici, une seule fois. */
function bsReportToResult(rep){
  const c = rep.counts;
  return {
    subjectsCreated: c.containersCreated,
    subjectsUpdated: c.containersUpdated + c.containersRestored,
    chaptersCreated: c.itemsCreated,
    chaptersUpdated: c.itemsUpdated + c.itemsRestored,
    removed: c.containersRemoved + c.itemsRemoved,
    unavailable: c.unavailable,
    status: rep.status,
    resumed: rep.resumed,
  };
}

async function bsSync(){
  if(!bsAvailable() || state.brightspace.busy) return;
  state.brightspace.busy = "syncing";
  state.brightspace.error = null;
  state.brightspace.progress = { done: 0, total: 0, label: "" };
  state.brightspace.lastResult = null;
  /* Objet d'annulation partagé avec le moteur : le bouton se contente de
     passer `aborted` à true, le moteur s'arrête au prochain point de contrôle. */
  state.brightspace.cancel = { aborted: false };
  render();

  try{
    const report = await bsEngine().run({
      signal: state.brightspace.cancel,
      /* La progression affichée vient du nombre réel de cours traités,
         jamais d'une barre qui avance toute seule. */
      onProgress: function(p){
        if(p.stage === "containers"){
          state.brightspace.progress = { done: 0, total: p.total, label: "" };
          render();
        } else if(p.stage === "container"){
          state.brightspace.progress = { done: p.index, total: p.total, label: p.label };
          render();
        }
      },
    });

    if(report.status === LyonSync.RUN_STATUS.FAILED){
      state.brightspace.error = report.errorCode === "already_running"
        ? t("sources.already_running")
        : (report.error || t("sources.error_generic"));
    } else {
      if(report.status === LyonSync.RUN_STATUS.CANCELLED) showToast(t("sources.cancelled"));
      else if(report.resumed) showToast(t("sources.resumed"));
      /* Même annulée, une synchronisation a réellement importé ce qu'elle a
         eu le temps d'importer : on réhydrate, et on affiche ces chiffres-là. */
      await bsPullIntoLocalState();
      await bsLoadConnection();
      state.brightspace.lastResult = bsReportToResult(report);
    }
  }catch(e){
    /* run() ne lève jamais : si on arrive ici, c'est la réhydratation locale. */
    state.brightspace.error = e.message || t("sources.error_generic");
  }finally{
    state.brightspace.busy = null;
    state.brightspace.progress = null;
    state.brightspace.cancel = null;
    render();
  }
}

/* Annulation : le moteur clôt son journal en `cancelled` et CONSERVE son
   curseur. La synchronisation suivante reprend où celle-ci s'est arrêtée,
   sans retélécharger les cours déjà traités. */
function bsCancelSync(){
  if(state.brightspace && state.brightspace.cancel){
    state.brightspace.cancel.aborted = true;
  }
}

/* Réhydrate l'état local à partir de Supabase pour que les fonctionnalités
   existantes (bibliothèque, quiz, révision intelligente, planning…) voient
   les cours Brightspace comme n'importe quels autres. Les matières/chapitres
   d'autres sources ne sont jamais touchés. */
async function bsPullIntoLocalState(){
  if(!bsAvailable()) return;
  const { data: subs } = await LyonAuth.client
    .from("subjects").select("*").eq("source", "brightspace").neq("sync_status", "removed");
  const { data: chaps } = await LyonAuth.client
    .from("chapters").select("*").eq("source", "brightspace").neq("sync_status", "removed");

  state.userSubjects = state.userSubjects.filter(s => s.source !== "brightspace");
  (subs || []).forEach(s => {
    state.userSubjects.push({
      id: s.id, name: s.name, semesterId: s.semester_id || SEMESTERS[0].id,
      icon: s.icon || "🎓", color: s.color || SUBJECT_COLORS[state.userSubjects.length % SUBJECT_COLORS.length],
      description: s.description || "", builtin: false,
      source: "brightspace", externalId: s.external_id, syncStatus: s.sync_status,
    });
  });

  state.userChapters = state.userChapters.filter(c => c.source !== "brightspace");
  (chaps || []).forEach(c => {
    state.userChapters.push({
      id: c.id, subjectId: c.subject_id, num: c.num || "", title: c.title,
      desc: c.description || "", content: c.content || "",
      originalText: c.original_text || "", summary: c.summary || "",
      aiQuiz: c.ai_quiz || [], aiFlashcards: c.ai_flashcards || [],
      aiReviewQuestions: c.ai_review_questions || [], keyNotions: c.key_notions || [],
      createdAt: c.created_at ? Date.parse(c.created_at) : Date.now(),
      updatedAt: c.updated_at ? Date.parse(c.updated_at) : Date.now(),
      markedReviewed: !!c.marked_reviewed,
      source: "brightspace", externalId: c.external_id, syncStatus: c.sync_status,
      resources: c.resources || [],
    });
  });

  saveUserSubjects();
  saveUserChapters();
}

/* ---------- rendu ---------- */

function renderSourcesSection(){
  const bs = state.brightspace || {};
  let body;

  if(!bsAvailable()){
    // Sans compte connecté, l'intégration n'a pas de sens : on l'explique
    // plutôt que d'afficher un bouton qui échouerait.
    body = `<p class="meta">${t("sources.requires_account")}</p>`;
  } else if(bs.busy === "connecting"){
    body = `<p class="meta"><span class="ai-spinner"></span> ${t("sources.connecting")}</p>`;
  } else if(!bsConnected()){
    body = `<p class="section-sub">${t("sources.bs_pitch")}</p>
      <button class="btn red" id="bs-connect-btn">${t("sources.connect")}</button>`;
  } else {
    const c = bs.connection;
    const last = c.last_synced_at ? fmtRelativeDate(dateKey(new Date(c.last_synced_at))).toLowerCase() : t("sources.never_synced");
    const progress = bs.progress;
    body = `<div class="src-row">
        <span class="src-state src-ok">${t("sources.connected")}</span>
        <span class="meta">${t("sources.last_sync", { when: escapeHtml(last) })}</span>
      </div>`;

    if(bs.busy === "syncing"){
      const pct = progress && progress.total ? Math.round((progress.done / progress.total) * 100) : 0;
      body += `<div class="src-progress">
        <div class="deckbar-track"><div class="deckbar-fill good" style="width:${pct}%;"></div></div>
        <p class="meta">${t("sources.syncing")}${progress && progress.label ? " · " + escapeHtml(progress.label) : ""}
          ${progress && progress.total ? ` (${progress.done}/${progress.total})` : ""}</p>
        <button class="btn-text" id="bs-cancel-btn">${t("sources.cancel")}</button>
      </div>`;
    } else {
      body += `<div class="src-actions">
        <button class="btn outline small" id="bs-sync-btn">${t("sources.sync_now")}</button>
        <button class="btn-text" id="bs-disconnect-btn">${t("sources.disconnect")}</button>
      </div>`;
    }

    const r = bs.lastResult;
    if(r && !bs.busy){
      const created = r.subjectsCreated + r.chaptersCreated;
      const updated = r.subjectsUpdated + r.chaptersUpdated;
      let msg;
      if(created === 0 && updated === 0 && r.removed === 0) msg = t("sources.up_to_date");
      else {
        const bits = [];
        if(created) bits.push(t("sources.n_new", { n: created }));
        if(updated) bits.push(t("sources.n_updated", { n: updated }));
        if(r.removed) bits.push(t("sources.n_removed", { n: r.removed }));
        msg = bits.join(" · ");
      }
      body += `<p class="meta src-result">${escapeHtml(msg)}</p>`;
      if(r.unavailable) body += `<p class="meta src-warn">${t("sources.n_unavailable", { n: r.unavailable })}</p>`;
    }
  }

  if(state.brightspace && state.brightspace.error){
    body += `<p class="meta src-warn">${escapeHtml(state.brightspace.error)}</p>`;
  }

  return `<div class="dash-section src-section">
    <div class="section-title">${t("sources.title")}</div>
    <div class="src-card">
      <div class="src-head">
        <span class="src-name">Brightspace</span>
      </div>
      ${body}
    </div>
  </div>`;
}

function bsHandleOAuthReturn(){

  params.delete("brightspace");
  const clean = window.location.pathname + (params.toString() ? "?" + params.toString() : "");

}

/* ============================================================
   9bis. FLASHCARDS — liaison "Dans ton cours"
   ------------------------------------------------------------
   Fonctionnalité additive : une flashcard PEUT porter chapterId +
   sourceQuote (+ exampleQuote optionnel) — une courte citation à
   retrouver dans le texte déjà stocké du chapitre (jamais une copie du
   cours entier dans la carte, voir flashcardSourceText plus haut). Les
   flashcards sans ces champs (anciennes, ou ajoutées manuellement)
   continuent de s'afficher exactement comme avant : resolveFlashcard
   CourseRef() leur renvoie simplement un statut "none".
   Recherche : correspondance exacte d'abord, puis tolérante aux espaces/
   majuscules (jamais une recherche floue par mots-clés) — si la citation
   n'existe pas dans le texte, on ne fabrique jamais de passage. Résultat
   mis en cache par carte (WeakMap) : le calcul ne tourne qu'une fois,
   jamais à chaque clic sur "Voir dans le cours".
   ============================================================ */
const flashSourceCache = new WeakMap();

function normalizeForMatch(s){ return String(s||"").replace(/\s+/g, " ").trim(); }

/* Construit une version du texte à espaces normalisés (espaces/retours à
   la ligne multiples réduits à un seul), avec une table de correspondance
   vers les index du texte ORIGINAL — pour retrouver une citation même si
   son découpage en lignes diffère légèrement (fréquent après extraction
   PDF), sans jamais perdre la position exacte dans le texte réel. */
function buildNormalizedIndexMap(original){
  let normalized = "";
  const map = [];
  let lastWasSpace = true;
  for(let i=0;i<original.length;i++){
    const ch = original[i];
    if(/\s/.test(ch)){
      if(!lastWasSpace){ normalized += " "; map.push(i); lastWasSpace = true; }
    } else {
      normalized += ch; map.push(i); lastWasSpace = false;
    }
  }
  if(normalized.endsWith(" ")){ normalized = normalized.slice(0, -1); map.pop(); }
  return { normalized, map };
}

/* Retourne {start,end} (index dans le texte ORIGINAL) si la citation est
   retrouvée, sinon null. Ne renvoie jamais une position approximative :
   soit la citation correspond réellement à ce passage du texte, soit rien. */
function locateQuoteInText(original, quote){
  const text = String(original || "");
  const q = String(quote || "").trim();
  if(!text || !q) return null;
  const idx = text.indexOf(q);
  if(idx !== -1) return { start: idx, end: idx + q.length };
  const { normalized, map } = buildNormalizedIndexMap(text);
  const normQuote = normalizeForMatch(q);
  if(!normQuote || !map.length) return null;
  const nIdx = normalized.toLowerCase().indexOf(normQuote.toLowerCase());
  if(nIdx === -1) return null;
  const nEnd = Math.min(nIdx + normQuote.length - 1, map.length - 1);
  return { start: map[nIdx], end: map[nEnd] + 1 };
}

/* ---------- Retrouver le passage d'une ANCIENNE flashcard (sans sourceQuote) ----------
   Compatibilité rétroactive : une flashcard enregistrée avant cette
   fonctionnalité n'a ni chapterId ni sourceQuote. Le chapitre est retrouvé
   par le contexte d'affichage (deck à chapitre unique — voir
   renderFlashPlay), puis le passage est cherché par recouvrement de
   mots-clés (question + réponse) dans le texte déjà stocké du chapitre —
   jamais une copie du cours, jamais un passage inventé : uniquement de
   vraies phrases du texte source, retenues seulement au-dessus d'un seuil
   minimal de correspondance. */
const FLASH_STOPWORDS = new Set([
  "les","des","une","un","le","la","de","du","et","est","que","qui","quoi","dans","pour","avec","sur","ce","cette","ces","cet",
  "son","sa","ses","il","elle","ils","elles","ne","pas","plus","au","aux","en","par","se","leur","leurs","etre","avoir",
  "comme","mais","ou","donc","or","ni","car","tout","tous","toute","toutes","fait","sont","etait","ete","sans","entre",
  "vers","chez","depuis","apres","avant","aussi","alors","ainsi","ainsi","lorsque","lorsqu","quand","dont","meme","memes",
]);

function stripDiacritics(s){
  return s && s.normalize ? s.normalize("NFD").replace(/[̀-ͯ]/g, "") : s;
}
/* Insensible aux accents/majuscules/ponctuation/apostrophes — utilisé pour
   l'extraction de mots-clés et le score de correspondance par phrase. */
function normalizeLoose(s){
  return stripDiacritics(String(s || "").toLowerCase())
    .replace(/[’']/g, " ")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}
function extractKeywords(s){
  const norm = normalizeLoose(s);
  if(!norm) return [];
  const seen = new Set();
  const out = [];
  norm.split(" ").forEach(w=>{
    if(w.length >= 4 && !FLASH_STOPWORDS.has(w) && !seen.has(w)){ seen.add(w); out.push(w); }
  });
  return out.slice(0, 10);
}

/* Découpe le texte en "phrases" contiguës (limites : . ! ? ou saut de ligne),
   en conservant les index EXACTS du texte original — jamais de zone
   chevauchante, tout le texte est couvert. Les fragments trop courts
   (titres vides, lignes blanches) sont ignorés. */
function splitIntoSentenceSpans(text){
  const spans = [];
  let start = 0;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(c === "." || c === "!" || c === "?" || c === "\n"){
      const end = i + 1;
      if(text.slice(start, end).trim().length >= 8) spans.push({ start, end });
      start = end;
    }
  }
  if(text.length - start >= 8) spans.push({ start, end: text.length });
  return spans;
}

/* Cherche la phrase du texte source qui recouvre le mieux les mots-clés
   donnés (question + réponse combinées). Retourne null si rien ne dépasse
   un seuil minimal — jamais une correspondance approximative isolée. */
function findBestKeywordMatch(text, keywords){
  if(!keywords.length) return null;
  const spans = splitIntoSentenceSpans(text);
  let best = null, bestScore = 0;
  for(const sp of spans){
    const norm = normalizeLoose(text.slice(sp.start, sp.end));
    let score = 0;
    for(const kw of keywords) if(norm.indexOf(kw) !== -1) score++;
    if(score > bestScore){ bestScore = score; best = sp; }
  }
  const minScore = keywords.length <= 1 ? 1 : 2;
  if(!best || bestScore < minScore) return null;
  return { start: best.start, end: best.end };
}

/* Cherche une phrase "Exemple…" juste après le passage trouvé (fenêtre
   courte), jamais ailleurs dans le cours — pour ne jamais associer un
   exemple sans rapport avec la notion affichée. */
function findNearbyExampleSpan(text, afterIndex, maxDistance){
  const spans = splitIntoSentenceSpans(text);
  for(const sp of spans){
    if(sp.end <= afterIndex) continue;
    if(sp.start > afterIndex + maxDistance) break;
    if(/^exemple\s*:?/i.test(text.slice(sp.start, sp.end).trim())) return sp;
  }
  return null;
}

const FLASH_SOURCE_WINDOW = 260; // caractères de contexte si aucun paragraphe net n'est détecté

/* Élargit [start,end] au paragraphe qui le contient (séparateur : ligne
   vide) pour donner du contexte — cf. consigne "pas juste une phrase
   isolée". Si le texte n'a pas de mise en forme en paragraphes (fréquent
   sur un texte extrait), retombe sur une fenêtre de caractères calée sur
   des limites de mots. Ne modifie jamais [start,end] lui-même : le
   surlignage reste toujours exact. */
function extractParagraphAround(text, start, end){
  let pStart = text.lastIndexOf("\n\n", start);
  pStart = pStart === -1 ? 0 : pStart + 2;
  let pEnd = text.indexOf("\n\n", end);
  pEnd = pEnd === -1 ? text.length : pEnd;

  if(pEnd - pStart > 1400 || pEnd < end || pStart > start){
    pStart = Math.max(0, start - FLASH_SOURCE_WINDOW);
    pEnd = Math.min(text.length, end + FLASH_SOURCE_WINDOW);
    const spBefore = text.indexOf(" ", pStart);
    if(spBefore !== -1 && spBefore < start) pStart = spBefore + 1;
    const spAfter = text.lastIndexOf(" ", pEnd);
    if(spAfter !== -1 && spAfter > end) pEnd = spAfter;
  }
  while(pStart < start && /\s/.test(text[pStart])) pStart++;
  while(pEnd > end && /\s/.test(text[pEnd-1])) pEnd--;
  return { pStart, pEnd };
}

function buildHighlightedExcerptHtml(text, start, end){
  const { pStart, pEnd } = extractParagraphAround(text, start, end);
  const before = escapeHtml(text.slice(pStart, start));
  const mid = escapeHtml(text.slice(start, end));
  const after = escapeHtml(text.slice(end, pEnd));
  const prefix = pStart > 0 ? "… " : "";
  const suffix = pEnd < text.length ? " …" : "";
  return prefix + before + (mid ? `<mark class="flash-source-mark">${mid}</mark>` : "") + after + suffix;
}

/* Fenêtre plus courte que extractParagraphAround, calée sur les phrases
   voisines (. ! ? ou saut de ligne) plutôt que sur tout le paragraphe —
   utilisée pour l'exemple, afin de ne pas répéter le passage principal déjà
   affiché juste au-dessus quand définition et exemple sont proches dans le
   texte source. */
function lastSentenceBreakEnd(str){
  const re = /[.!?]\s|\n/g;
  let m, lastEnd = -1;
  while((m = re.exec(str))) lastEnd = m.index + m[0].length;
  return lastEnd;
}
function firstSentenceBreakEnd(str){
  const m = /[.!?]\s|\n/.exec(str);
  return m ? m.index + m[0].length : -1;
}
function extractSentenceWindowAround(text, start, end){
  const MAX_BACK = 220, MAX_FWD = 220;
  let pStart = Math.max(0, start - MAX_BACK);
  let pEnd = Math.min(text.length, end + MAX_FWD);

  // longueur du séparateur variable (1 caractère pour "\n", 2 pour ". "/"! "/"? ") :
  // on avance/recule exactement de la longueur réelle trouvée par le regex,
  // jamais d'un décalage fixe qui couperait le premier caractère du texte gardé.
  const backCut = lastSentenceBreakEnd(text.slice(pStart, start));
  if(backCut !== -1) pStart = pStart + backCut;

  const fwdCut = firstSentenceBreakEnd(text.slice(end, pEnd));
  if(fwdCut !== -1) pEnd = end + fwdCut;

  while(pStart < start && /\s/.test(text[pStart])) pStart++;
  while(pEnd > end && /\s/.test(text[pEnd-1])) pEnd--;
  return { pStart, pEnd };
}

function buildPlainExcerptHtml(text, start, end){
  const { pStart, pEnd } = extractSentenceWindowAround(text, start, end);
  const prefix = pStart > 0 ? "… " : "";
  const suffix = pEnd < text.length ? " …" : "";
  return prefix + escapeHtml(text.slice(pStart, pEnd)) + suffix;
}

/* Résout la référence "Dans ton cours" d'une flashcard. Jamais d'erreur :
   toute absence de donnée (carte, chapitre, texte, passage introuvable)
   retombe proprement sur un statut, sans lever d'exception.

   fallbackChapterId : chapitre du deck en cours de révision (voir
   renderFlashPlay), utilisé quand la carte elle-même n'a pas de chapterId
   (flashcard enregistrée avant cette fonctionnalité) — mais UNIQUEMENT
   quand le deck ne mélange pas plusieurs chapitres (jamais deviné pour
   "Tout mélanger" / "Réviser ce niveau", pour ne jamais associer une
   carte au mauvais cours).

   Ordre de résolution (compatibilité rétroactive) :
     A. sourceQuote déjà enregistrée (citation exacte, carte récente) ;
     C. la réponse elle-même, si elle apparaît telle quelle dans le cours ;
     B+D. recouvrement de mots-clés question+réponse dans les phrases du
          cours (tolérant accents/majuscules/ponctuation/apostrophes).
   Statuts distincts : "no_chapter" (chapitre/texte introuvable — rare,
   plus le cas par défaut d'avant) vs "not_found" (chapitre et cours bien
   là, mais aucun passage assez fiable trouvé) — jamais confondus, pour ne
   plus jamais afficher "indisponible" quand le cours existe réellement. */
function resolveFlashcardCourseRef(card, fallbackChapterId){
  if(!card) return { status: "no_chapter" };
  if(flashSourceCache.has(card)) return flashSourceCache.get(card);

  const chapterId = card.chapterId || fallbackChapterId || null;
  const text = chapterId ? flashcardSourceText(chapterId) : "";

  let result;
  if(!text){
    result = { status: "no_chapter" };
  } else {
    let loc = card.sourceQuote ? locateQuoteInText(text, card.sourceQuote) : null;
    if(!loc && card.back) loc = locateQuoteInText(text, card.back);
    if(!loc){
      const keywords = extractKeywords((card.front || "") + " " + (card.back || ""));
      loc = findBestKeywordMatch(text, keywords);
    }
    if(!loc){
      result = { status: "not_found" };
    } else {
      const excerptHtml = buildHighlightedExcerptHtml(text, loc.start, loc.end);
      let exampleHtml = null;
      if(card.exampleQuote){
        const exLoc = locateQuoteInText(text, card.exampleQuote);
        if(exLoc) exampleHtml = buildPlainExcerptHtml(text, exLoc.start, exLoc.end);
      }
      if(!exampleHtml){
        const nearby = findNearbyExampleSpan(text, loc.end, 400);
        if(nearby) exampleHtml = buildPlainExcerptHtml(text, nearby.start, nearby.end);
      }
      result = { status: "found", excerptHtml, exampleHtml };
    }
  }
  flashSourceCache.set(card, result);
  return result;
}

function renderFlashSourcePanel(card, open, fallbackChapterId){
  const ref = resolveFlashcardCourseRef(card, fallbackChapterId);
  let body;
  if(ref.status === "no_chapter"){
    body = `<p class="flash-source-empty">📖 Passage du cours indisponible pour cette flashcard.</p>`;
  } else if(ref.status === "not_found"){
    body = `<p class="flash-source-empty">📖 Le passage exact n'a pas pu être retrouvé dans ce cours.</p>`;
  } else {
    body = `<div class="flash-source-excerpt">${ref.excerptHtml}</div>` +
      (ref.exampleHtml ? `<p class="flash-source-example"><b>💡 Exemple</b><br>${ref.exampleHtml}</p>` : "");
  }
  return `<div class="flash-source${open ? " open" : ""}">
    <div class="flash-source-head"><span class="ico" aria-hidden="true">📖</span><span class="lbl">Dans ton cours</span></div>
    <button type="button" class="flash-source-toggle" id="flash-source-toggle" aria-expanded="${open ? "true" : "false"}">${open ? "↑ Réduire" : "Voir dans le cours ↓"}</button>
    <div class="flash-source-collapse"><div class="flash-source-body">${body}</div></div>
  </div>`;
}

   10. FLASHCARDS — LOGIQUE
   ============================================================ */
function startFlashDeck(scope, label, cards){
  if(!cards || cards.length === 0) return;
  state.flashDeck = {
    scope, label,
    cards: shuffle(cards),
    idx: 0,
    flipped: false,
    sourceOpen: false,
    known: [],
    unknown: [],
  };
  state.flashScreen = "play";
  state.tab = "flash";
  const chId = chapterIdFromQuizScope(scope);
  if(chId) trackChapterVisit(chId, "flash");
  render();
  window.scrollTo(0,0);
}

function flipCurrentCard(){
  const d = state.flashDeck;
  d.flipped = !d.flipped;
  d.sourceOpen = false;
  render();
}

function judgeCard(knewIt){
  trackFlashActivity();
  const d = state.flashDeck;
  const card = d.cards[d.idx];
  if(knewIt) d.known.push(card); else d.unknown.push(card);

  if(d.idx < d.cards.length - 1){
    d.idx++;
    d.flipped = false;
    d.sourceOpen = false;
    render();
  } else {
    const pct = Math.round((d.known.length / d.cards.length) * 100);
    saveFlashProgress(d.scope, pct);
    logActivity("flash", d.scope, d.label, d.known.length, d.cards.length);
    if(state.smartSession){
      const item = state.smartSession.items[state.smartSession.stepIndex];
      recordSmartSessionStep({ mode: "flash", chapterId: item ? item.chapterId : null, title: d.label, score: d.known.length, total: d.cards.length, pct, timeUsed: null });
      advanceSmartSession();
      return;
    }
    if(state.planningSession){
      recordPlanningSessionStep({ mode: "flash", score: d.known.length, total: d.cards.length, pct, timeUsed: null });
      advancePlanningSession();
      return;
    }
    state.flashScreen = "summary";
    render();
  }
}

function replayUnknown(){
  const d = state.flashDeck;
  if(d.unknown.length === 0) return;
  startFlashDeck(d.scope, d.label + " (à revoir)", d.unknown);
}

function backToFlashPicker(){
  if(state.smartSession){ abortSmartSession(); return; }
  if(state.planningSession){ abortPlanningSession(); return; }
  state.flashScreen = "picker";
  render();
}

        </div>

/* Diagnostic WebGPU précis : distingue API absente / adaptateur introuvable /
   adaptateur trouvé mais périphérique impossible à initialiser, plutôt qu'un
   simple booléen — pour afficher un message exact à l'utilisateur. */
/* Diagnostic WebGPU complet. Retourne un résultat structuré (avec les champs
   historiques ok/code/message/detail conservés pour ne rien casser côté
   appelants) : supported/gpuApiAvailable/adapterAvailable/deviceAvailable,
   adapterInfo (seulement si réellement exposé par le navigateur),
   reason/errorCode/recommendedAction. Essaie plusieurs préférences
   d'adaptateur avant de conclure qu'aucun GPU n'est utilisable : certains
   appareils (ex. portables avec GPU intégré + GPU dédié) n'exposent un
   adaptateur que sous l'une des deux préférences. */
async function checkWebGPUCompatibility(){
  const result = {
    supported: false, gpuApiAvailable: false, adapterAvailable: false, deviceAvailable: false,
    adapterInfo: null, adapterInfoSupported: null, reason: "", errorCode: "no_api", recommendedAction: "",
    // Résultat DÉTAILLÉ de CHAQUE tentative d'adaptateur, séparément — pour ne
    // jamais résumer "high-performance" et "low-power" en un seul verdict.
    adapterAttempts: [],
    chosenPreference: null,
    protocol: location.protocol,
    isSecureContext: !!window.isSecureContext,
    ok: false, code: "no_api", message: "", detail: "",
  };
  if(!navigator.gpu || !navigator.gpu.requestAdapter){
    result.reason = "navigator.gpu est absent : ce navigateur ne prend pas (encore) en charge WebGPU, ou la fonctionnalité est désactivée dans ses réglages.";
    result.message = "WebGPU n'est pas disponible dans ce navigateur.";
    result.detail = result.reason;
    result.recommendedAction = "Utilise une version récente de Google Chrome ou Microsoft Edge, ou utilise le mode simplifié en attendant.";
    return result;
  }
  result.gpuApiAvailable = true;

  let adapter = null;
  for(const powerPreference of ["high-performance", "low-power"]){
    const attempt = { powerPreference, found: false, error: null };
    try{
      const a = await navigator.gpu.requestAdapter({ powerPreference });
      attempt.found = !!a;
      if(a && !adapter){ adapter = a; result.chosenPreference = powerPreference; }
    }catch(e){
      attempt.error = (e && e.message) ? e.message : String(e);
    }
    result.adapterAttempts.push(attempt);
  }
  if(!adapter && !result.adapterAttempts.some(a => a.error)){
    // Dernier essai sans préférence explicite, au cas où l'option elle-même ne serait pas prise en charge.
    const attempt = { powerPreference: "(sans préférence)", found: false, error: null };
    try{
      const a = await navigator.gpu.requestAdapter();
      attempt.found = !!a;
      if(a){ adapter = a; result.chosenPreference = "(sans préférence)"; }
    }catch(e){ attempt.error = (e && e.message) ? e.message : String(e); }
    result.adapterAttempts.push(attempt);
  }

  const attemptError = result.adapterAttempts.find(a => a.error);
  if(!adapter && attemptError){
    result.errorCode = "adapter_error"; result.code = "adapter_error";
    result.message = "WebGPU est présent, mais l'accès à la carte graphique a échoué.";
    result.reason = attemptError.error || "Erreur inconnue lors de la demande d'accès au GPU (navigator.gpu.requestAdapter).";
    result.detail = result.reason;
    result.recommendedAction = "Vérifie que l'accélération matérielle est activée dans les réglages du navigateur, puis clique sur Réessayer.";
    return result;
  }
  if(!adapter){
    result.errorCode = "no_adapter"; result.code = "no_adapter";
    result.message = "WebGPU est présent, mais aucun adaptateur graphique utilisable n'a été trouvé.";
    result.reason = "navigator.gpu.requestAdapter() n'a renvoyé aucun adaptateur, essayé séparément en « high-performance », « low-power » et sans préférence : pilote graphique manquant ou trop ancien, GPU bloqué spécifiquement pour WebGPU par le navigateur (indépendamment de l'accélération matérielle générale visible dans chrome://gpu), ou accélération désactivée pour ce contexte précis.";
    result.detail = result.reason;
    result.recommendedAction = "Mets à jour tes pilotes graphiques, vérifie la section WebGPU (pas seulement la section générale) de chrome://gpu, ou essaie un autre appareil.";
    return result;
  }
  result.adapterAvailable = true;

  // Informations de l'adaptateur, seulement si réellement exposées par le navigateur
  // (propriétés standard de l'API GPUAdapterInfo — jamais inventées si absentes).
  try{
    let info = null;
    if(typeof adapter.requestAdapterInfo === "function"){ result.adapterInfoSupported = true; info = await adapter.requestAdapterInfo(); }
    else if(adapter.info){ result.adapterInfoSupported = true; info = adapter.info; }
    else { result.adapterInfoSupported = false; }
    if(info){
      const picked = {};
      if(info.vendor) picked.vendor = info.vendor;
      if(info.architecture) picked.architecture = info.architecture;
      if(info.description) picked.description = info.description;
      result.adapterInfo = picked;
    }
  }catch(e){ result.adapterInfoSupported = false; }

  try{
    if(adapter.requestDevice) await adapter.requestDevice();
  }catch(e){
    result.errorCode = "device_error"; result.code = "device_error";
    result.message = "Le navigateur détecte une carte graphique, mais ne permet pas de créer un périphérique compatible.";
    result.reason = (e && e.message) ? e.message : "Erreur inconnue lors de la création du périphérique GPU (adapter.requestDevice).";
    result.detail = result.reason;
    result.recommendedAction = "Redémarre le navigateur, ferme les autres onglets/applications qui utilisent le GPU, puis réessaie.";
    return result;
  }
  result.deviceAvailable = true;
  result.supported = true; result.ok = true;
  result.errorCode = "ok"; result.code = "ok";
  result.message = "WebGPU est disponible."; result.detail = ""; result.reason = "";
  return result;
}
/* Alias conservé pour la lisibilité des appels existants. */
function diagnoseWebGPU(){ return checkWebGPUCompatibility(); }
function pickModelForDevice(){
  const saved = lsGet(KEY_AIMODEL);
  if(saved === "small" || saved === "large") return AI_MODELS[saved].id;
  const mem = navigator.deviceMemory;
  const smallScreen = Math.min(window.innerWidth, window.innerHeight) < 500;
  if((typeof mem === "number" && mem > 0 && mem < 4) || smallScreen) return AI_MODELS.small.id;
  return AI_MODELS.large.id;
}

let webllmModulePromise = null;
let webllmWorker = null;
let webllmEngine = null;
let webllmLoadedModelId = null;
let webllmGenerationToken = 0;
let webllmLoadToken = 0;
let webllmWatchdog = null;

function loadWebLLMModule(){
  if(!webllmModulePromise){
    webllmModulePromise = import("https://esm.run/@mlc-ai/web-llm");
  }
  return webllmModulePromise;
}

async function checkAIStatus(){
  if(state.aiStatus !== "checking") return;
  const diag = await diagnoseWebGPU();
  if(state.aiStatus !== "checking") return;
  state.aiGpuDiag = diag;
  if(!diag.ok){
    state.aiStatus = "nogpu";
    render();
    return;
  }
  state.aiModelId = pickModelForDevice();
  state.aiStatus = "idle";
  render();
}

/* Ré-exécute uniquement le diagnostic WebGPU (rapide, sans charger de modèle) —
   utilisé par le bouton "Tester mon assistant IA". */
async function aiRunQuickTest(){
  state.aiTestResult = "Test en cours…";
  state.aiDiagPanelOpen = true;
  render();
  const diag = await diagnoseWebGPU();
  state.aiGpuDiag = diag;
  if(diag.ok && state.aiStatus === "nogpu") state.aiStatus = "idle";
  state.aiTestResult = diag.ok
    ? "✅ WebGPU répond correctement sur cet appareil — tu peux charger l'assistant IA."
    : "❌ " + diag.message;
  render();
}

/* Libellé du mode actuel, dans le vocabulaire exact demandé — dérivé de
   l'état réel (state.aiStatus / state.aiDiagnostic), jamais d'un état à part. */
function aiCurrentModeLabel(){
  if(state.aiStatus === "ready") return "IA locale WebGPU prête";
  if(state.aiStatus === "loading") return (state.aiLoadProgress > 0) ? "Modèle en cours de téléchargement" : "Modèle en cours de chargement";
  if(state.aiStatus === "nogpu") return "WebGPU indisponible";
  if(state.aiStatus === "error"){
    if(state.aiDiagnostic && state.aiDiagnostic.stage === "worker_start") return "Worker indisponible";
    return "Erreur de génération";
  }
  return "Mode simplifié sans IA";
}

/* Test complet, de bout en bout et RÉEL (jamais simulé) : refait le
   diagnostic WebGPU, puis — seulement s'il est positif — charge réellement
   le worker + WebLLM + le modèle configuré (aiLoadModel, la même fonction
   que le reste du site, pas une copie), puis envoie une vraie requête et
   affiche le texte exact reçu. Chaque étape ci-dessous est cochée
   individuellement à partir de faits réels (adapterAvailable/deviceAvailable
   du diagnostic, stage de l'échec de chargement, réponse effective du
   modèle) — jamais "ça marche" sans avoir réellement obtenu chaque étape. */
async function aiRunFullEngineTest(){
  if(aiEngineBusy() || state.aiFullTestBusy) return;
  state.aiFullTestBusy = true;
  state.aiDiagPanelOpen = true;
  state.aiFullTestResult = "";
  // 11 étapes distinctes, chacune cochée séparément à partir d'un fait réel —
  // les deux préférences d'adaptateur sont testées et affichées séparément
  // (jamais fusionnées en un seul verdict "adaptateur").
  const steps = state.aiFullTestSteps = [
    {key:"ctx", label:"Contexte sécurisé (https / localhost)", status:"pending"},
    {key:"gpu", label:"navigator.gpu présent", status:"pending"},
    {key:"adapter_hp", label:"requestAdapter({powerPreference:\"high-performance\"})", status:"pending"},
    {key:"adapter_lp", label:"requestAdapter({powerPreference:\"low-power\"})", status:"pending"},
    {key:"device", label:"adapter.requestDevice() — périphérique créé", status:"pending"},
    {key:"worker", label:"Worker créé (ai-worker.js)", status:"pending"},
    {key:"webllm", label:"Module WebLLM chargé", status:"pending"},
    {key:"model", label:"Modèle demandé : " + (state.aiModelId || pickModelForDevice()), status:"pending"},
    {key:"download", label:"Téléchargement + initialisation terminés (modèle prêt)", status:"pending"},
    {key:"request", label:"Requête envoyée au modèle", status:"pending"},
    {key:"response", label:"Réponse réelle reçue", status:"pending"},
  ];
  render();

  const diag = await checkWebGPUCompatibility();
  state.aiGpuDiag = diag;
  steps[0].status = diag.isSecureContext ? "ok" : "fail";
  steps[1].status = diag.gpuApiAvailable ? "ok" : "fail";
  const hp = diag.adapterAttempts.find(a => a.powerPreference === "high-performance");
  const lp = diag.adapterAttempts.find(a => a.powerPreference === "low-power");
  steps[2].status = !diag.gpuApiAvailable ? "skip" : (hp ? (hp.found ? "ok" : "fail") : "skip");
  steps[3].status = !diag.gpuApiAvailable ? "skip" : (lp ? (lp.found ? "ok" : "fail") : "skip");
  steps[4].status = diag.adapterAvailable ? (diag.deviceAvailable ? "ok" : "fail") : "skip";
  render();

  if(!diag.ok){
    for(let i=5;i<steps.length;i++) steps[i].status = "skip";
    state.aiStatus = "nogpu";
    const attemptDetail = diag.adapterAttempts.map(a => a.powerPreference + " → " + (a.found ? "trouvé" : (a.error ? "erreur : " + a.error : "aucun adaptateur"))).join(" · ");
    state.aiFullTestResult = "❌ " + diag.message + " Détail par tentative : " + attemptDetail + ". Impossible d'aller plus loin : sans adaptateur/périphérique GPU réel, le worker WebLLM ne peut pas être testé pour de vrai sur cet appareil.";
    state.aiFullTestBusy = false;
    render();
    return;
  }

  steps[5].status = "running"; render();
  const modelId = state.aiModelId || pickModelForDevice();
  if(state.aiStatus !== "ready" || webllmLoadedModelId !== modelId){
    await aiLoadModel(modelId);
  }
  if(state.aiStatus !== "ready"){
    const stage = state.aiDiagnostic ? state.aiDiagnostic.stage : null;
    steps[5].status = stage === "worker_start" ? "fail" : "ok";
    steps[6].status = steps[5].status !== "ok" ? "skip" : (stage === "module_import" ? "fail" : "ok");
    steps[7].status = steps[6].status !== "ok" ? "skip" : "ok";
    steps[8].status = steps[7].status !== "ok" ? "skip" : "fail";
    steps[9].status = "skip"; steps[10].status = "skip";
    state.aiFullTestResult = "❌ Le moteur ne s'est pas chargé réellement (étape : " + (state.aiDiagnostic ? state.aiDiagnostic.typeLabel : "inconnue") + "). " + (state.aiDiagnostic ? state.aiDiagnostic.message : "") + " Adaptateur ET périphérique GPU étaient pourtant réels et fonctionnels — cherche la cause côté worker/réseau/mémoire/cache plutôt que côté GPU.";
    state.aiFullTestBusy = false;
    render();
    return;
  }
  steps[5].status = "ok"; steps[6].status = "ok"; steps[7].status = "ok"; steps[8].status = "ok";
  render();

  steps[9].status = "running"; render();
  try{
    const res = await webllmChat([{role:"user", content:"Réponds uniquement : IA LOCALE FONCTIONNELLE."}], {});
    steps[9].status = "ok";
    const text = (res && res.text || "").trim();
    if(text){
      steps[10].status = "ok";
      state.aiFullTestResult = "✅ Test réel réussi — le modèle « " + aiModelMeta(modelId).label + " » a répondu : « " + clip(text, 200) + " »";
    } else {
      steps[10].status = "fail";
      state.aiFullTestResult = "❌ Requête envoyée, mais réponse vide reçue : le moteur tourne, mais la génération elle-même échoue.";
    }
  }catch(e){
    steps[9].status = "fail"; steps[10].status = "skip";
    state.aiFullTestResult = "❌ Échec de la génération réelle : " + (e && e.message ? e.message : "erreur inconnue") + ".";
  }
  state.aiFullTestBusy = false;
  render();
}

/* Relance le diagnostic complet depuis le début (utilisé par "Réessayer").
   Se protège contre les doubles clics pendant la vérification. */
async function aiRetryDetection(){
  if(state.aiStatus === "loading" || state.aiRetryChecking) return;
  state.aiRetryChecking = true;
  state.aiStatus = "checking";
  state.aiGpuDiag = null;
  state.aiTestResult = "";
  render();
  await checkAIStatus();
  state.aiRetryChecking = false;
  render();
}

function aiEnvSummary(){
  const ua = navigator.userAgent || "";
  if(/Edg\//.test(ua)) return "Microsoft Edge";
  if(/OPR\//.test(ua)) return "Opera";
  if(/Chrome\//.test(ua) && !/Edg\//.test(ua)) return "Google Chrome";
  if(/Firefox\//.test(ua)) return "Mozilla Firefox";
  if(/Safari\//.test(ua) && !/Chrome\//.test(ua)) return "Safari";
  return "Navigateur non identifié";
}

/* Liste à cocher du test complet — chaque ligne reflète un fait réel
   (jamais un état inventé) : pending = pas encore atteinte, running = en
   cours, ok = confirmée réellement, fail = a réellement échoué à cette
   étape, skip = non atteinte car une étape précédente a échoué. */
function aiFullTestStepsHtml(){
  const icon = { pending:"⚪", running:"⏳", ok:"✅", fail:"❌", skip:"➖" };
  return `<div style="margin-top:10px; padding:10px 12px; background:var(--bg); border-radius:var(--radius-md); font-size:12px; line-height:1.85;">
    ${state.aiFullTestSteps.map(s => `<div>${icon[s.status]||"⚪"} ${escapeHtml(s.label)}</div>`).join("")}
  </div>`;
}

        <div>adapterAvailable : ${diag.adapterAvailable ? "true" : "false"} (préférence retenue : ${escapeHtml(diag.chosenPreference || "—")})</div>

/* Explique la contradiction "chrome://gpu dit Hardware accelerated" vs
   "aucun adaptateur WebGPU trouvé ici" — cette page ne peut pas lire
   chrome://gpu (page interne non exposée au web), donc ceci reste une liste
   de causes réelles et connues, pas une certitude sur ta machine précise. */
function aiChromeGpuContradictionHtml(diag){
  return `<details class="ai-extra" style="margin-top:10px;">
    <summary>⚠️ « chrome://gpu » dit WebGPU accéléré, mais aucun adaptateur n'est trouvé ici — pourquoi ?</summary>
    <div style="font-size:12px; line-height:1.7; margin-top:6px; color:var(--ink-soft);">
      <p>Cette page ne peut pas lire <code>chrome://gpu</code> (c'est une page interne du navigateur, non accessible aux sites web) : impossible pour ce diagnostic de comparer directement les deux. Voici les causes réelles connues pour cet écart précis :</p>
      <ul class="fiche-list">
        <li><b>chrome://gpu teste le rendu général</b> (compositing 2D/3D du navigateur lui-même), pas spécifiquement l'attribution d'un adaptateur WebGPU aux pages web — les deux peuvent diverger. Cherche, sur cette page, une section « WebGPU » séparée (souvent plus bas) qui peut indiquer un blocage spécifique (« blocklisted »/« disabled »).</li>
        <li>Chrome maintient une liste de blocage GPU/pilote propre à WebGPU (différente de l'accélération générale) : un GPU/pilote précis peut y figurer même quand l'accélération classique fonctionne.</li>
        <li>Contexte de la page : protocole détecté ici = <code>${escapeHtml(diag.protocol)}</code>, contexte sécurisé = <code>${diag.isSecureContext ? "oui" : "non"}</code>. WebGPU exige un contexte sécurisé (https, ou localhost) ; si tu ouvres le fichier directement depuis le disque, teste aussi via l'adresse GitHub Pages (https://…) pour éliminer cette piste.</li>
        <li>Politique d'entreprise ou extension de navigateur désactivant spécifiquement WebGPU.</li>
        <li>Machine virtuelle / bureau à distance / partage de GPU : l'accélération 2D/3D classique passe, mais l'exposition WebGPU à Chrome peut être bridée par l'hyperviseur.</li>
        <li>Version de Chrome trop ancienne pour le support WebGPU par défaut sur ton système d'exploitation précis.</li>
      </ul>
      <p>Aucune de ces pistes n'est certaine à distance : elles sont données comme causes réelles possibles, à vérifier une par une sur ta machine — pas comme un diagnostic définitif.</p>
    </div>
  </details>`;
}

function buildAiDiagnostic(stage, raw){
  const base = { stage, raw: raw || null };
  if(stage === "worker_start"){
    return Object.assign(base, {
      stageLabel: "Avant le téléchargement du modèle",
      typeLabel: "Le fichier ai-worker.js n'a pas pu être chargé",
      message: (raw && (raw.message || raw.filename)) ?
        `Détail du navigateur : ${raw.message || ""} ${raw.filename ? "(" + raw.filename + ")" : ""}`.trim() :
        "Le navigateur n'a pas réussi à démarrer le fichier ai-worker.js (aucun détail supplémentaire fourni).",
      cause: "Le fichier « ai-worker.js » est introuvable à l'adresse attendue (erreur 404) ou son nom/chemin ne correspond pas exactement à celui utilisé dans le code.",
      solution: "Vérifie que le fichier ai-worker.js est bien présent dans ton dépôt GitHub, au même niveau que index.html, avec exactement ce nom (les majuscules/minuscules comptent sur GitHub Pages).",
    });
  }
  if(stage === "module_import"){
    return Object.assign(base, {
      stageLabel: "Avant le téléchargement du modèle",
      typeLabel: "Le moteur WebLLM n'a pas pu être téléchargé",
      message: raw && raw.message ? raw.message : "Échec du chargement du script depuis le réseau.",
      cause: "Le fichier JavaScript du moteur (hébergé sur un CDN externe) n'a pas pu être récupéré : connexion internet coupée/instable, ou bloqué par un bloqueur de publicité/pare-feu.",
      solution: "Vérifie ta connexion internet, désactive temporairement un éventuel bloqueur de publicité pour ce site, puis clique sur Réessayer.",
    });
  }
  if(stage === "stalled"){
    return Object.assign(base, {
      stageLabel: "Pendant le téléchargement du modèle",
      typeLabel: "Le téléchargement semble bloqué",
      message: "Aucune progression détectée depuis plusieurs secondes.",
      cause: "Connexion très lente ou instable, ou requête interrompue silencieusement par une extension du navigateur.",
      solution: "Réessaie avec une connexion plus stable (Wi-Fi plutôt que 4G si possible), ou essaie le modèle léger (téléchargement plus rapide).",
    });
  }
  if(stage === "engine_init"){
    return Object.assign(base, {
      stageLabel: "Pendant l'initialisation du moteur (adaptateur et périphérique GPU étaient pourtant réels)",
      typeLabel: "Le modèle n'a pas pu être initialisé",
      message: raw && raw.message ? raw.message : "Erreur inconnue pendant l'initialisation.",
      cause: "Le téléchargement a pu aboutir, mais l'initialisation a échoué après coup. Causes possibles à vérifier une par une : mémoire GPU insuffisante pour ce modèle précis (essaie le modèle léger) ; version de @mlc-ai/web-llm incompatible avec l'identifiant de modèle demandé (le CDN sert la dernière version, qui peut avoir retiré/renommé ce modèle) ; cache navigateur corrompu par un téléchargement précédent interrompu (utilise « Réinitialiser le cache IA » ci-dessous) ; message postMessage malformé entre la page et ai-worker.js (visible dans la console via les logs « [EM Lyon Révision · IA] »).",
      solution: "1) Réinitialise le cache IA, 2) réessaie avec le modèle léger, 3) si ça persiste, regarde la console (F12) pour le message exact juste avant cette erreur.",
    });
  }
  return Object.assign(base, {
    stageLabel: "Étape indéterminée",
    typeLabel: "Erreur inattendue",
    message: raw && raw.message ? raw.message : String(raw || "Erreur inconnue."),
    cause: "Cause non identifiée précisément.",
    solution: "Réessaie ; si le problème persiste, réinitialise le cache IA ci-dessous.",
  });
}

function clearAiWatchdog(){
  if(webllmWatchdog){ clearTimeout(webllmWatchdog); webllmWatchdog = null; }
}

function aiTeardownEngine(){
  clearAiWatchdog();
  if(webllmWorker){ try{ webllmWorker.terminate(); }catch(e){} }
  webllmWorker = null;
  webllmEngine = null;
  webllmLoadedModelId = null;
}

/* Logs de diagnostic courts et lisibles pour suivre précisément où en est
   le chargement du moteur IA (utile en console pendant un débogage — ne
   change rien à l'interface). */
function aiLog(step, detail){
  console.log("[EM Lyon Révision · IA]", step, detail !== undefined ? detail : "");
}

async function aiLoadModel(modelId){
  if(state.aiStatus === "loading") return;
  if(state.aiStatus === "ready" && webllmLoadedModelId === modelId) return;

  const myLoadToken = ++webllmLoadToken;
  state.aiStatus = "loading";
  state.aiLoadProgress = 0;
  state.aiLoadText = "Préparation du moteur…";
  state.aiError = null;
  state.aiDiagnostic = null;
  state.aiLoadStartedAt = Date.now();
  render();
  aiLog("Modèle demandé", modelId);

  const failLoad = (stage, raw) => {
    if(myLoadToken !== webllmLoadToken) return;
    console.error(`Échec du chargement IA (étape: ${stage}) :`, raw);
    aiLog("Erreur détectée", stage);
    clearAiWatchdog();
    state.aiStatus = "error";
    state.aiDiagnostic = buildAiDiagnostic(stage, raw);
    render();
  };

  try{
    let webllm;
    try{
      webllm = await loadWebLLMModule();
      aiLog("Module WebLLM chargé");
    }catch(e){
      failLoad("module_import", e);
      return;
    }
    if(myLoadToken !== webllmLoadToken) return;

    aiTeardownEngine();
    try{
      webllmWorker = new Worker("ai-worker.js", { type: "module" });
      aiLog("Worker créé");
    }catch(e){
      failLoad("worker_start", e);
      return;
    }
    let workerErrored = false;
    webllmWorker.onerror = (err) => {
      workerErrored = true;
      failLoad("worker_start", err);
    };
    webllmWorker.onmessageerror = (err) => {
      workerErrored = true;
      failLoad("worker_start", { message: "Message illisible reçu depuis ai-worker.js (onmessageerror)." });
    };

    const armWatchdog = () => {
      clearAiWatchdog();
      webllmWatchdog = setTimeout(() => {
        if(myLoadToken !== webllmLoadToken) return;
        failLoad("stalled", null);
      }, 25000);
    };
    armWatchdog();

    aiLog("Initialisation demandée — début du téléchargement");
    webllmEngine = await webllm.CreateWebWorkerMLCEngine(webllmWorker, modelId, {
      initProgressCallback: (report) => {
        if(myLoadToken !== webllmLoadToken) return;
        armWatchdog();
        state.aiLoadProgress = Math.round((report.progress || 0) * 100);
        state.aiLoadText = report.text || "";
        if(state.tab === "ai") render();
      },
    });

    clearAiWatchdog();
    if(myLoadToken !== webllmLoadToken || workerErrored) return;

    aiLog("Téléchargement terminé — modèle prêt");
    webllmLoadedModelId = modelId;
    state.aiModelId = modelId;
    state.aiStatus = "ready";
    const key = modelId === AI_MODELS.small.id ? "small" : "large";
    lsSet(KEY_AIMODEL, key);
    state.aiModelChoice = key;
    render();
  }catch(e){
    if(!workerErroredSafe()) failLoad("engine_init", e);
  }

  function workerErroredSafe(){
    return state.aiStatus === "error" && state.aiDiagnostic && state.aiDiagnostic.stage === "worker_start";
  }
}

function aiCancelLoad(){
  webllmLoadToken++;
  aiTeardownEngine();
  state.aiStatus = "idle";
  state.aiLoadProgress = 0;
  state.aiLoadText = "";
  state.aiError = null;
  state.aiDiagnostic = null;
  render();
}

async function aiResetCache(){
  if(state.aiStatus === "loading") aiCancelLoad();
  aiTeardownEngine();
  webllmLoadToken++;
  let cleared = 0;
  try{
    if(window.caches && caches.keys){
      const names = await caches.keys();
      const targets = names.filter(n => /webllm|mlc/i.test(n));
      await Promise.all(targets.map(n => caches.delete(n)));
      cleared += targets.length;
    }
  }catch(e){ console.error("Erreur en vidant le Cache Storage IA :", e); }
  try{
    if(window.indexedDB && indexedDB.databases){
      const dbs = await indexedDB.databases();
      const targets = dbs.filter(d => d && d.name && /webllm|mlc/i.test(d.name));
      await Promise.all(targets.map(d => new Promise((res)=>{
        const req = indexedDB.deleteDatabase(d.name);
        req.onsuccess = req.onerror = req.onblocked = () => res();
      })));
      cleared += targets.length;
    }
  }catch(e){ console.error("Erreur en vidant l'IndexedDB IA :", e); }
  state.aiStatus = "idle";
  state.aiLoadProgress = 0;
  state.aiLoadText = "";
  state.aiError = null;
  state.aiDiagnostic = null;
  state.aiCacheResetMsg = cleared > 0
    ? "Cache IA réinitialisé (" + cleared + " élément(s) supprimé(s)). Le prochain chargement retéléchargera le modèle."
    : "Aucun cache IA trouvé à supprimer (rien n'avait encore été téléchargé, ou déjà vide).";
  render();
}

function aiChangeModel(key){

async function webllmChat(turns, { onText, signal } = {}){
  if(!webllmEngine) throw new Error("Le modèle n'est pas chargé.");
  aiLog("Génération commencée");
  const myToken = ++webllmGenerationToken;
  const messages = turns.map(t => ({ role: t.role, content: t.content }));
  let full = "";
  const stream = await webllmEngine.chat.completions.create({
    messages,
    stream: true,
    temperature: 0.6,
  });
  for await (const chunk of stream){
    if(signal && signal.cancelled) {
      try{ await webllmEngine.interruptGenerate(); }catch(e){}
      break;
    }
    if(myToken !== webllmGenerationToken) break;
    const delta = chunk.choices && chunk.choices[0] ? (chunk.choices[0].delta.content || "") : "";
    if(delta){
      full += delta;
      if(onText) onText({ text: full });
    }
  }
  aiLog("Réponse reçue", full.length + " caractères");
  return { text: full };
}

async function webllmJsonChat(turns, { signal } = {}){
  if(!webllmEngine) throw new Error("Le modèle n'est pas chargé.");
  const myToken = ++webllmGenerationToken;
  const messages = turns.map(t => ({ role: t.role, content: t.content }));
  const res = await webllmEngine.chat.completions.create({
    messages,
    stream: false,
    temperature: 0.4,
  });
  if(signal && signal.cancelled) return null;
  if(myToken !== webllmGenerationToken) return null;
  const text = (res.choices && res.choices[0] && res.choices[0].message) ? res.choices[0].message.content : "";
  const match = text.match(/\[[\s\S]*\]/);
  if(!match) throw new Error("format inattendu");
  return JSON.parse(match[0]);
}

function stripHtml(html){
  return String(html || "")
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/(p|li|h3|h2|tr|div)>/gi, "\n")
    .replace(/<[^>]+>/g, " ")
    .replace(/&nbsp;/g, " ")
    .replace(/&amp;/g, "&")
    .replace(/[ \t]+/g, " ")
    .replace(/\n\s*\n+/g, "\n")
    .trim();
}
function clip(txt, max){
  max = max || MAX_CONTENT_CHARS;
  return txt.length > max ? txt.slice(0, max) + "\n[...]" : txt;
}

function chapterContext(chId){
  const ch = CHAPTERS.find(c => c.id === chId);
  if(!ch) return "";
  const fiche = stripHtml(FICHES[ch.id]);
  const qs = QUESTIONS.filter(q => ch.themes.includes(q.theme));
  const qlist = qs.map(q => "- " + q.q + " → " + q.opts[q.correct]).join("\n");
  const cm = chapterMetrics(ch);
  return clip(
    "CHAPITRE " + ch.num + " (" + ch.level + ") : " + ch.title + "\n" + ch.desc +
    "\n\nFICHE DE COURS :\n" + fiche +
    "\n\nPOINTS ÉVALUÉS (question → bonne réponse) :\n" + qlist +
    "\n\nNIVEAU DE L'ÉTUDIANT SUR CE CHAPITRE : maîtrise " + cm.mastery + "%, " + cm.answered + "/" + cm.total + " questions travaillées."
  );
}

function questionContext(q, givenIdx){
  const ch = CHAPTERS.find(c => c.themes.includes(q.theme));
  const s = qstat(q);
  return clip(
    "QUESTION DU COURS" + (ch ? " (chapitre " + ch.num + " — " + ch.title + ")" : "") + " :\n" + q.q +
    "\nOptions :\n" + q.opts.map((o,i) => (i === q.correct ? "✔ " : "- ") + o).join("\n") +
    (givenIdx !== null && givenIdx !== undefined ? "\nRéponse donnée par l'étudiant : " + q.opts[givenIdx] : "") +
    "\nExplication du cours : " + q.exp +
    (s ? "\nHistorique de l'étudiant sur cette question : " + s.correct + "/" + s.seen + " réussies." : "")
  );
}

function errorsContext(limit){
  limit = limit || 12;
  const weak = poolReview(limit);
  const list = (weak.length ? weak : poolWrong().slice(0, limit));
  if(list.length === 0) return "";
  return clip(list.map(q => {

  }).join("\n\n"));
}

function assistantTodayContext(){

    if(day && day.tasks.length){

/* Détection d'intention (§4) : heuristique locale par mots-clés, jamais un
   second appel au modèle pour classifier (coût/latence inutiles — voir
   §21, performance). Volontairement simple et explicable : chaque mot-clé
   déclenche une intention précise plutôt qu'un score opaque. Repli sur
   "chapter" (contexte du chapitre actuellement sélectionné), le
   comportement déjà existant pour une question libre. */
function detectAssistantIntent(text){
  const s = (text || "").toLowerCase();
  const has = (...words) => words.some(w => s.includes(w));
  if(has("aujourd'hui", "aujourd’hui", "today", "hoy", "heute", "oggi")) return "today";
  if(has("planning", "échéance", "echeance", "contrôle", "controle", "examen", "devoir", "deadline", "cette semaine", "semana", "settimana", "woche")) return "planning";
  if(has("erreur", "trompe", "rate", "error", "mistake", "errore", "fehler", "wrong")) return "errors";
  if(has("réviser", "reviser", "révise-moi", "interroge", "fais-moi réviser", "revise me", "quiz me", "test me")) return "revise";
  return "chapter";
}

/* Point d'entrée unique du contexte "assistant personnel" (§3) : construit
   UNIQUEMENT le bloc nécessaire à l'intention détectée — jamais tout le
   profil pédagogique d'un coup. */
function buildAssistantContext(intent){
  if(intent === "today") return assistantTodayContext();
  if(intent === "planning") return assistantPlanningContext();
  if(intent === "errors") return errorsContext();
  if(intent === "revise") return assistantTodayContext();
  return assistantPerformanceContext();
}

  if(action === "cards"){

      "\n\nTÂCHE : génère 8 flashcards de révision sur ce chapitre, différentes des questions déjà listées ci-dessus. Pour chaque carte, \"sourceQuote\" doit être une COURTE citation EXACTE (mot pour mot, sans reformulation) copiée depuis la FICHE DE COURS ci-dessus, qui justifie la réponse. Si un exemple lié y apparaît, ajoute \"exampleQuote\" (citation exacte) ; sinon laisse-le vide. Réponds UNIQUEMENT par un tableau JSON, sans texte autour, au format : [{\"front\":\"notion ou question courte\",\"back\":\"réponse en une ou deux phrases\",\"sourceQuote\":\"...\",\"exampleQuote\":\"...\"}]";
  }
  if(action === "quiz"){
    return aiSystemPrompt() + "\n\n" + chapterContext(state.aiChapter) + fileBlock +
      "\n\nTÂCHE : génère 5 questions à choix multiples inédites sur ce chapitre, avec exactement 4 options chacune et une seule bonne réponse. Pour chaque question, \"sourceQuote\" doit être une COURTE citation EXACTE (mot pour mot, sans reformulation) copiée depuis la FICHE DE COURS ci-dessus, qui justifie la bonne réponse. Si un exemple lié y apparaît, ajoute \"exampleQuote\" (citation exacte) ; sinon laisse-le vide. Réponds UNIQUEMENT par un tableau JSON, sans texte autour, au format : [{\"q\":\"énoncé\",\"opts\":[\"a\",\"b\",\"c\",\"d\"],\"correct\":0,\"exp\":\"explication courte\",\"sourceQuote\":\"...\",\"exampleQuote\":\"...\"}] où correct est l'index (0-3) de la bonne option.";

function aiErrorMessage(e){
  if(e && e.message === "cancelled") return "Génération annulée.";
  if(e && e.message === "not_ready"){
    if(state.aiStatus === "nogpu"){
      return (state.aiGpuDiag ? state.aiGpuDiag.message : "L'IA locale n'est pas disponible sur cet appareil.") + " Cette action a besoin d'un vrai modèle IA — le mode simplifié ne peut pas la remplacer de façon fiable.";
    }
    return "L'assistant n'est pas encore chargé : clique sur « Charger l'assistant IA » ci-dessus.";
  }
  return "L'assistant n'a pas pu répondre" + (e && e.message ? " (" + e.message + ")" : "") + ". Tu peux réessayer.";
}

async function aiRun(action, extra){
  if(state.aiBusy) return;
  const a = AI_ACTIONS[action];
  if(!a) return;
  state.aiAction = action;
  state.aiMode = a.mode || "text";
  state.aiCardsDraft = null;
  state.aiQuizDraft = null;
  state.aiError = null;
  state.aiContextLabel = (extra && extra.contextLabel) || defaultContextLabel(action);

  // IA locale indisponible : pour les actions marquées "heuristic" (résumé,
  // quiz, flashcards sur un chapitre), on retombe sur le mode simplifié
  // (règles locales, sans modèle) plutôt que de bloquer l'action. Si le
  // mode simplifié ne peut rien produire d'honnête, on repasse par le
  // chemin normal, qui affichera l'erreur explicite (aiErrorMessage).
  if(state.aiStatus !== "ready" && a.heuristic && aiRunHeuristicChapterAction(action)) return;

  const prompt = buildPrompt(action, extra);
  const display = (extra && extra.display) || defaultDisplay(action);
  state.aiThread = [{role:"user", content: prompt, display: display}];
  await aiSend();
}

/* Variante sans IA de "Résumer un chapitre" / "Générer un quiz" / "Créer des
   flashcards" pour un chapitre du programme (fiche déjà rédigée), à partir
   des règles locales de buildHeuristicCourseMaterials/heuristicSummary.
   Retourne false si rien d'honnête n'a pu être produit. */
function aiRunHeuristicChapterAction(action){
  const ch = CHAPTERS.find(c => c.id === state.aiChapter);
  if(!ch || !FICHES[ch.id]) return false;
  const raw = stripHtml(FICHES[ch.id]);
  const display = AI_ACTIONS[action].label + " — " + ch.title + " (mode simplifié)";
  if(action === "summary"){
    const summary = heuristicSummary(raw);
    if(!summary) return false;
    state.aiThread = [
      {role:"user", content:"", display},
      {role:"assistant", content: "⚙️ Mode simplifié (sans IA) — généré à partir de la fiche de ce chapitre, sans modèle de langage.\n\n" + stripHtml(summary)},
    ];
    render();
    return true;
  }
  const h = buildHeuristicCourseMaterials(raw);
  if(action === "quiz"){
    if(!h.quiz.length) return false;
    state.aiQuizDraft = h.quiz.map(q => Object.assign({}, q, {chapterId: ch.id}));
    state.aiThread = [{role:"user", content:"", display}];
    render();
    return true;
  }
  if(action === "cards"){
    if(!h.flashcards.length) return false;
    state.aiCardsDraft = h.flashcards.map(c => Object.assign({}, c, {chapterId: ch.id}));
    state.aiThread = [{role:"user", content:"", display}];
    render();
    return true;
  }
  return false;
}

function defaultContextLabel(action){
  const a = AI_ACTIONS[action];
  if(!a) return "";
  if(a.needs === "chapter" || action === "free"){
    const ch = CHAPTERS.find(c => c.id === state.aiChapter);
    return ch ? "Contexte : chapitre " + ch.num + " — " + ch.title : "";
  }
  if(action === "errors") return "Contexte : tes questions les moins maîtrisées";
  if(action === "examprep") return "Contexte : ton niveau de maîtrise par chapitre";
  return "";
}
function defaultDisplay(action){
  const a = AI_ACTIONS[action];
  if(action === "explain" || action === "free") return state.aiTopic;
  if(a && a.needs === "chapter"){
    const ch = CHAPTERS.find(c => c.id === state.aiChapter);
    return a.label + " — " + (ch ? ch.title : "");
  }
  return a ? a.label : "";
}

async function aiFollowUp(text){

  await aiSend();
}

let aiCurrentSignal = null;

async function aiSend(){
  if(state.aiBusy) return;
  if(aiEngineBusy()) return; // une génération est déjà en cours ailleurs (ex. fiche de cours) : un seul modèle à la fois
  if(state.aiStatus !== "ready" || !webllmEngine){
    state.aiError = aiErrorMessage({message:"not_ready"});
    render();
    return;
  }
  state.aiBusy = true;
  state.aiError = null;
  const signal = { cancelled: false };
  aiCurrentSignal = signal;
  render();

  const turns = state.aiThread.map(m => ({role:m.role, content:m.content}));

  try{
    if(state.aiMode === "cards" || state.aiMode === "quiz"){
      const arr = await webllmJsonChat(turns, { signal });
      if(signal.cancelled) throw new Error("cancelled");
      if(!arr || !arr.length) throw new Error("format inattendu");
      if(state.aiMode === "cards"){
        state.aiCardsDraft = arr
          .filter(c => c && c.front && c.back)
          .map(c => ({
            front:String(c.front), back:String(c.back), ai:true, chapterId: state.aiChapter,
            sourceQuote: c.sourceQuote ? String(c.sourceQuote) : "",
            exampleQuote: c.exampleQuote ? String(c.exampleQuote) : "",
          }));
      } else {
        state.aiQuizDraft = arr
          .filter(q => q && q.q && Array.isArray(q.opts) && q.opts.length >= 2 && typeof q.correct === "number")
          .map((q,i) => ({
            uid: "ai-" + Date.now() + "-" + i,
            ai: true,
            theme: "ai",
            q: String(q.q),
            opts: q.opts.slice(0,4).map(String),
            correct: Math.max(0, Math.min(q.opts.length-1, q.correct)),
            exp: q.exp ? String(q.exp) : "",
            chapterId: state.aiChapter,
            sourceQuote: q.sourceQuote ? String(q.sourceQuote) : "",
            exampleQuote: q.exampleQuote ? String(q.exampleQuote) : "",
          }));
      }
      state.aiThread.push({role:"assistant", content: JSON.stringify(arr)});
    } else {
      const res = await webllmChat(turns, {
        signal,
        onText: ({text}) => {
          const el = document.getElementById("ai-stream");
          if(el) el.innerHTML = renderAIMarkdown(text);
        },
      });
      const text = (res && res.text) ? res.text : "";
      if(signal.cancelled){
        if(text) state.aiThread.push({role:"assistant", content:text + "\n\n*(génération interrompue)*"});
      } else {
        if(!text) throw new Error("réponse vide");
        state.aiThread.push({role:"assistant", content:text});
        const first = state.aiThread[0];
        state.aiHistory.push({
          type: state.aiAction,
          typeLabel: AI_ACTIONS[state.aiAction] ? AI_ACTIONS[state.aiAction].label : "Assistant",
          prompt: first.display || "",
          contextLabel: state.aiContextLabel,
          text: text,
          date: new Date().toISOString(),
        });
        saveAIHistory();
      }
    }
  }catch(e){
    if(!signal.cancelled) state.aiError = aiErrorMessage(e);
  }finally{
    state.aiBusy = false;
    aiCurrentSignal = null;
    render();
  }
}

function aiCancelGeneration(){
  if(aiCurrentSignal) aiCurrentSignal.cancelled = true;
  if(webllmEngine){
    try{ webllmEngine.interruptGenerate(); }catch(e){}
  }
}

function readFileAsText(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Lecture du fichier impossible"));
    reader.readAsText(file);
  });
}

async function handleFilesSelected(fileList){
  for(const file of Array.from(fileList)){
    const nameLower = file.name.toLowerCase();
    const isText = TEXT_EXTENSIONS.some(ext => nameLower.endsWith(ext));
    if(!isText){
      state.aiError = "Le fichier « " + file.name + " » n'est pas un format texte pris en charge (.txt, .md, .csv, .json). Ouvre-le et colle son contenu dans le champ de texte à la place.";
      render();
      continue;
    }
    try{
      const text = await readFileAsText(file);
      state.aiFiles.push({ name: file.name, content: text });
      state.aiError = null;
    }catch(e){
      state.aiError = "Impossible de lire « " + file.name + " ».";
    }
    render();
  }
}

function removeAIFile(idx){
  state.aiFiles.splice(idx,1);
  render();
}

function combinedFileContent(){
  if(state.aiFiles.length === 0) return "";
  let combined = state.aiFiles.map(f => "--- " + f.name + " ---\n" + f.content).join("\n\n");
  if(combined.length > MAX_CONTENT_CHARS){
    combined = combined.slice(0, MAX_CONTENT_CHARS) + "\n\n[...contenu tronqué...]";
  }
  return combined;
}

function renderAIMarkdown(text){
  const lines = String(text).split("\n");
  let html = "";
  let listBuffer = [];
  let listType = null;

  const flushList = () => {
    if(listBuffer.length){
      html += "<" + listType + ">" + listBuffer.map(li => "<li>" + li + "</li>").join("") + "</" + listType + ">";
      listBuffer = [];
      listType = null;
    }
  };
  const inline = (s) => s
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/\*(.+?)\*/g, "<i>$1</i>");

  lines.forEach(raw => {
    const line = raw.trim();
    if(!line){ flushList(); return; }
    if(/^#{1,4}\s+/.test(line)){
      flushList();
      html += "<h4>" + inline(line.replace(/^#{1,4}\s+/,"")) + "</h4>";
    } else if(/^[-*]\s+/.test(line)){
      if(listType !== "ul"){ flushList(); listType = "ul"; }
      listBuffer.push(inline(line.replace(/^[-*]\s+/,"")));
    } else if(/^\d+[.)]\s+/.test(line)){
      if(listType !== "ol"){ flushList(); listType = "ol"; }
      listBuffer.push(inline(line.replace(/^\d+[.)]\s+/,"")));
    } else {
      flushList();
      html += "<p>" + inline(line) + "</p>";
    }
  });
  flushList();
  return html;
}

/* ---- rendu premium des fiches de cours (nouveau format JSON structuré,
   avec repli propre sur les anciennes fiches texte/Markdown ou HTML) ---- */
function renderFicheStructuredHtml(data){
  let html = "";
  if(data.introduction) html += `<p class="fiche-intro">${escapeHtml(data.introduction)}</p>`;
  data.sections.forEach((sec, i)=>{
    html += `<h3><span class="fiche-secnum">${i+1}</span>${escapeHtml(sec.title)}</h3>`;
    if(sec.type === "steps"){
      html += `<ol class="fiche-steps">${sec.items.map(it=>
        `<li><span class="fiche-step-num"></span><span class="fiche-step-content">${escapeHtml(it.content)}</span></li>`
      ).join("")}</ol>`;
    } else if(sec.type === "data"){
      html += `<ul class="fiche-list">${sec.items.map(it=>
        `<li>${it.label ? `<b>${escapeHtml(it.label)}</b>` : ""}${it.label && it.value ? " : " : ""}${it.value ? escapeHtml(it.value) : ""}</li>`
      ).join("")}</ul>`;
    } else if(sec.type === "examples"){
      html += sec.items.map(it => `<div class="fiche-tip">${escapeHtml(it.content)}</div>`).join("");
    } else {
      html += sec.items.map(it => `<div class="fiche-notion">
        ${it.title ? `<div class="fiche-notion-title">${escapeHtml(it.title)}</div>` : ""}
        ${it.content ? `<div class="fiche-notion-content">${escapeHtml(it.content)}</div>` : ""}
        ${it.example ? `<div class="fiche-notion-example"><span class="lbl">Exemple</span> ${escapeHtml(it.example)}</div>` : ""}
      </div>`).join("");
    }
  });
  if(data.keyPoints.length){
    html += `<div class="fiche-keypoints">
      <div class="fiche-keypoints-title">À retenir</div>
      <ul class="fiche-keypoints-list">${data.keyPoints.map(p=>`<li>${escapeHtml(p)}</li>`).join("")}</ul>
    </div>`;
  }
  return html;
}

/* Anciennes fiches (texte brut / Markdown généré par l'IA avant l'introduction
   du format JSON) : filtre d'abord les lignes creuses ("[information
   manquante]"…), puis réutilise le même moteur que les bulles de chat —
   juste retitré en <h3> pour s'aligner avec le nouveau rendu. */
function markdownLiteFicheHtml(text){
  const filtered = String(text || "").split("\n").filter(l => !isPlaceholderLine(l.trim())).join("\n");
  return renderAIMarkdown(filtered).replace(/<h4>/g, "<h3>").replace(/<\/h4>/g, "</h3>");
}

/* Point d'entrée unique pour afficher le contenu d'une fiche, quel que soit
   son format d'origine : nouvelles fiches structurées (JSON), fiches HTML
   déjà construites (mode simplifié), ou anciennes fiches texte/Markdown. */
function renderFicheContent(raw){
  const text = String(raw || "").trim();
  if(!text) return "";
  if(text[0] === "{"){
    try{
      const parsed = JSON.parse(text);
      if(parsed && Array.isArray(parsed.sections)) return renderFicheStructuredHtml(parsed);
    }catch(e){ /* pas un JSON valide : traité comme du texte plus bas */ }
  }
  if(/^\s*<(h\d|p|ul|ol|div)[ >]/i.test(text)) return text;
  return markdownLiteFicheHtml(text);
}
