function aiProgressDetails(){
  const text = state.aiLoadText || "";
  const progress = (state.aiLoadProgress || 0) / 100;
  const elapsed = state.aiLoadStartedAt ? (Date.now() - state.aiLoadStartedAt) / 1000 : 0;
  const mbMatch = text.match(/([\d.]+)\s*MB fetched/i);
  const fetchedMB = mbMatch ? parseFloat(mbMatch[1]) : null;
  let estTotalMB = null, etaLabel = null;
  if(fetchedMB !== null && progress > 0.03){
    estTotalMB = Math.round(fetchedMB / progress);
  }
  if(progress > 0.03 && progress < 0.995 && elapsed > 2){
    const remaining = elapsed * (1 - progress) / progress;
    etaLabel = remaining < 60 ? `~${Math.round(remaining)} s restantes` : `~${Math.round(remaining/60)} min restantes`;
  }
  return { fetchedMB, estTotalMB, etaLabel };
}

    const det = aiProgressDetails();
    const detailBits = [];
    if(det.fetchedMB !== null) detailBits.push(`${Math.round(det.fetchedMB)} Mo téléchargés` + (det.estTotalMB ? ` sur ~${det.estTotalMB} Mo estimés` : ""));
    if(det.etaLabel) detailBits.push(det.etaLabel);
    return `<div class="ai-status checking"><span class="ai-spinner"></span><div style="flex:1;"><b>Chargement du modèle IA… ${pct}%</b>
      <div class="ai-loadbar"><div class="ai-loadbar-fill" style="width:${pct}%;"></div></div>
      <div class="s">${escapeHtml(state.aiLoadText || "Téléchargement en cours…")}${detailBits.length ? "<br>" + escapeHtml(detailBits.join(" · ")) : ""}<br>Ne ferme pas cet onglet. Ce téléchargement ne se fera qu'une seule fois : il sera ensuite conservé en cache par ton navigateur.</div>
      <button class="btn outline small" id="ai-cancel-load" style="margin-top:10px;">✕ Annuler le chargement</button>
      </div></div>`;
  }

  if(state.aiStatus === "error"){
    return `<div class="ai-status ko"><span class="dot"></span><div><b>Le chargement de l'IA a échoué</b>
      ${state.aiDiagnostic ? aiDiagnosticHtml(state.aiDiagnostic) : `<div class="s">${escapeHtml(state.aiError || "Erreur inconnue.")}</div>`}
      ${aiModelPickerHtml()}
      <div style="margin-top:10px; display:flex; gap:14px; align-items:center; flex-wrap:wrap;">
        <button class="btn red small" id="ai-load-btn">🔄 Réessayer</button>
        <button class="btn-text" id="ai-reset-cache">Réinitialiser le cache IA</button>
      </div>
      ${state.aiCacheResetMsg ? `<div class="s" style="margin-top:8px;">${escapeHtml(state.aiCacheResetMsg)}</div>` : ""}
      </div></div>`;
  }

  const meta = aiModelMeta(state.aiModelId);
  return `<div class="ai-status ok"><span class="dot"></span><div><b>Assistant IA prêt (100% local)</b>
    <div class="s">Modèle chargé : <b>${escapeHtml(meta.label)}</b> (${meta.size}). Tout tourne dans ton navigateur, sans serveur ni clé API — tes questions restent privées.</div>
    <button class="btn-text" id="ai-reset-cache" style="margin-top:6px;">Réinitialiser le cache IA</button>
    ${state.aiCacheResetMsg ? `<div class="s" style="margin-top:6px;">${escapeHtml(state.aiCacheResetMsg)}</div>` : ""}
    </div></div>`;
}

function aiModelPickerHtml(){
  const current = state.aiModelId === AI_MODELS.small.id ? "small" : "large";
  return `<div class="ai-modelpicker">
    ${Object.entries(AI_MODELS).map(([key,m]) => `
      <button type="button" class="ai-modelchoice ${current===key ? "active" : ""}" data-aimodel="${key}">
        <span class="t">${m.label}</span><span class="sz">${m.size}</span>
        <span class="n">${m.note}</span>
      </button>`).join("")}
  </div>`;
}

/* ============================================================
   14bis. ASSISTANT IA PERSONNEL — modes, suggestions, actions directes
   ------------------------------------------------------------
   Aucune de ces fonctions ne recrée un moteur de quiz/flashcards/planning :
   chacune orchestre les points d'entrée déjà existants (aiRun/AI_ACTIONS,
   startSmartSession, startModeQuiz, switchTab) — voir §5/§9/§24 du cahier
   des charges. "Discuter/Comprendre/S'entraîner/Analyser" réutilisent
   entièrement la grille d'actions existante ; seuls "Réviser" (aperçu du
   jour, sans re-décider les priorités) et "Organiser" (résumé du planning
   déjà existant) sont de nouveaux flux, tous deux strictement des résumés
   en langage naturel de données déjà calculées ailleurs (jamais un calcul
   dupliqué).
   ============================================================ */

/* Extrait de l'ancien handler [data-aiaction], pour être réutilisable
   aussi bien par un clic sur la grille d'actions que par un "mode" de
   l'assistant personnel (§5 : "Comprendre"→explain, "S'entraîner"→quiz,
   "Analyser"→errors) — jamais une seconde copie de cette logique. */
function aiSelectAction(k){
  if(!AI_ACTIONS[k]) return;
  // Un chapitre de bibliothèque récemment consulté (libRunUserChapterAI/
  // libRunUserChapterFree) met volontairement state.aiChapter à null (ce
  // n'est pas un chapitre du programme intégré) — sans repli, une action
  // du programme intégré sélectionnée juste après (ex. depuis le mode
  // "S'entraîner") n'aurait plus aucun chapitre valide alors que le menu
  // déroulant affiche visuellement le premier de la liste : jamais un
  // décalage silencieux entre ce que l'utilisateur voit et l'état réel.
  if(AI_ACTIONS[k].needs === "chapter" && !CHAPTERS.some(c => c.id === state.aiChapter)) state.aiChapter = CHAPTERS[0].id;
  state.aiAction = k;
  state.aiMode = AI_ACTIONS[k].mode || "text";
  state.aiThread = [];
  state.aiCardsDraft = null;
  state.aiQuizDraft = null;
  state.aiError = null;
  state.aiContextLabel = "";
  state.aiPersonalIntent = null;
  render();
  const focusEl = document.getElementById("ai-topic-input");
  if(focusEl) focusEl.focus();
  else {
    const run = document.getElementById("ai-run-btn");
    if(run && !run.disabled && AI_ACTIONS[k].needs !== "topic") run.click();
  }
}

/* Lance l'interrogation orale existante (action "drill") sur un chapitre
   précis, qu'il soit du programme intégré ou de la bibliothèque — mêmes
   deux points d'entrée déjà utilisés ailleurs dans le site (aiOpenFromChapter
   / libRunUserChapterAI), jamais un troisième mécanisme de "faire réviser". */
function aiDrillChapter(chapterId){
  const ch = findAnyChapter(chapterId);
  if(!ch) return;
  if(isUserChapter(chapterId)) libRunUserChapterAI(ch, "drill");
  else aiOpenFromChapter("drill", chapterId);
}

/* Suggestions dynamiques (§6) : toujours dérivées de données réelles déjà
   disponibles (planning, Révision intelligente, erreurs) — jamais un texte
   générique inventé indépendamment de l'état réel de l'étudiant. Au plus
   4 pour ne jamais surcharger l'écran d'accueil (§25). */
function assistantSuggestedPrompts(){
  const list = [];
  list.push({ kind: "today", label: t("assistant.suggestion_today") });
  const plan = state.studyPlan;
  if(plan && plan.deadlineAt){
    list.push({ kind: "planning", label: t("assistant.suggestion_exam_prep", { label: plan.deadlineLabel || t("planning.deadline_default_label") }) });
  } else {
    list.push({ kind: "planning", label: t("assistant.suggestion_organize") });
  }
  const recos = getSmartRevisionRecommendations();
  if(recos.length){
    list.push({ kind: "drill", chapterId: recos[0].chapterId, label: t("assistant.suggestion_drill_chapter", { chapter: recos[0].title }) });
  }
  if(Object.keys(state.dash.wrongQuestions).length > 0){
    list.push({ kind: "errors", label: t("assistant.suggestion_errors") });
  }
  return list.slice(0, 4);
}

/* Flux "assistant personnel" à une intention fixe, déclenché par un mode
   ("Réviser"/"Organiser") ou une suggestion — construit le contexte via
   buildAssistantContext() (§3/§4), jamais un contexte ad hoc. */
function aiRunPersonalMode(intent, displayLabel){
  if(aiEngineBusy()) return;
  state.aiAction = "personal";
  state.aiPersonalIntent = intent;
  if(state.aiStatus !== "ready"){
    state.aiError = aiErrorMessage({message:"not_ready"});
    render();
    return;
  }
  const ctx = buildAssistantContext(intent);
  const taskByIntent = {
    today: "TÂCHE : dis à l'étudiant, en langage naturel et en 5 phrases maximum, ce qu'il devrait réviser en priorité à partir des informations ci-dessus (jamais une donnée inventée). Termine par une phrase d'encouragement neutre, sans pression ni promesse de réussite.",
    revise: "TÂCHE : dis à l'étudiant, en langage naturel et en 5 phrases maximum, ce qu'il devrait réviser en priorité à partir des informations ci-dessus (jamais une donnée inventée). Termine par une phrase d'encouragement neutre, sans pression ni promesse de réussite.",
    planning: "TÂCHE : résume à l'étudiant sa situation de planning et d'échéances en 4 phrases maximum, en langage naturel, à partir des informations ci-dessus. Ne présente jamais un taux d'avancement comme une prédiction de réussite.",
  };
  state.aiMode = "text";
  state.aiCardsDraft = null; state.aiQuizDraft = null; state.aiError = null;
  state.aiContextLabel = t("assistant.context_" + intent);
  state.aiThread = [{ role: "user", content: aiSystemPrompt() + "\n\n" + ctx + "\n\n" + (taskByIntent[intent] || taskByIntent.today), display: displayLabel }];
  aiSend();
}

/* Question libre tapée dans la barre de l'assistant personnel (§4) :
   détecte l'intention par mots-clés, construit uniquement le contexte
   nécessaire, puis réutilise exactement le même pipeline d'envoi
   (aiSend) que le reste de l'assistant. */
function aiRunPersonalQuery(text){
  if(aiEngineBusy()) return;
  const q = (text || "").trim();
  if(!q) return;
  state.aiAction = "personal";
  if(state.aiStatus !== "ready"){
    state.aiError = aiErrorMessage({message:"not_ready"});
    render();
    return;
  }
  const intent = detectAssistantIntent(q);
  const ctx = buildAssistantContext(intent);
  state.aiPersonalIntent = intent;
  state.aiMode = "text";
  state.aiCardsDraft = null; state.aiQuizDraft = null; state.aiError = null;
  state.aiPersonalQuery = "";
  state.aiContextLabel = t("assistant.context_" + intent);
  state.aiThread = [{ role: "user", content: aiSystemPrompt() + "\n\n" + ctx + "\n\nQUESTION OU DEMANDE DE L'ÉTUDIANT : " + q, display: q }];
  aiSend();
}

/* Action directe "Réviser maintenant" (§24) : réutilise EXACTEMENT le
   moteur de Révision intelligente (buildSmartSessionPlan/startSmartSession,
   déjà utilisés par la page "Révision intelligente" elle-même) — jamais un
   second moteur de session dans le chat. */
function aiActionReviseNow(){
  const plan = buildSmartSessionPlan(state.smartSessionLength || 20);
  switchTab("smart");
  if(plan.items && plan.items.length) startSmartSession(plan.items);
}

/* Boutons d'action sous la dernière réponse de l'assistant (§24), dérivés
   de l'INTENTION réellement utilisée pour construire le contexte — jamais
   d'une lecture devinée du texte généré par le modèle. */
function assistantMessageActionsHtml(){
  const intent = state.aiPersonalIntent;
  if(!intent || state.aiBusy) return "";
  if(!state.aiThread.length || state.aiThread[state.aiThread.length-1].role !== "assistant") return "";
  if(intent === "today" || intent === "revise"){
    return `<div class="ai-msg-actions"><button type="button" class="btn-text" id="ai-action-revise-now">🧠 ${t("assistant.action_revise_now")}</button></div>`;
  }
  if(intent === "planning"){
    return `<div class="ai-msg-actions"><button type="button" class="btn-text" id="ai-action-open-planning">📅 ${t("assistant.action_open_planning")}</button></div>`;
  }
  if(intent === "errors"){
    return `<div class="ai-msg-actions"><button type="button" class="btn-text" id="ai-action-review-errors">🔁 ${t("assistant.action_review_errors")}</button></div>`;
  }
  return "";
}

/* Actions rapides de niveau d'explication (§10) : renvoient un simple
   message de suivi via aiFollowUp(), déjà existant — jamais une nouvelle
   mécanique de conversation. Affichées après une réponse texte issue de
   "Comprendre" ou d'une question libre de l'assistant personnel. */
function assistantExplainQuickActionsHtml(){
  return `<div class="ai-quickrow">
    <button type="button" class="btn-text" data-ai-quick="simpler">${t("assistant.explain_simpler")}</button>
    <button type="button" class="btn-text" data-ai-quick="detailed">${t("assistant.explain_detailed")}</button>
    <button type="button" class="btn-text" data-ai-quick="example">${t("assistant.explain_example")}</button>
    <button type="button" class="btn-text" data-ai-quick="check">${t("assistant.explain_check")}</button>
  </div>`;
}

function renderAssistantModeChipsHtml(){
  const ready = state.aiStatus === "ready";
  const modes = [
    { key:"discuss", icon:"💬", labelKey:"assistant.mode_discuss", enabled: ready },
    { key:"understand", icon:"📚", labelKey:"assistant.mode_understand", enabled: ready },
    { key:"revise", icon:"🧠", labelKey:"assistant.mode_revise", enabled: ready },
    { key:"practice", icon:"✍️", labelKey:"assistant.mode_practice", enabled: true },
    { key:"analyze", icon:"📊", labelKey:"assistant.mode_analyze", enabled: ready },
    { key:"organize", icon:"📅", labelKey:"assistant.mode_organize", enabled: ready },
  ];
  return `<div class="ai-modechips" role="group" aria-label="${t("assistant.panel_title")}">
    ${modes.map(m=>`<button type="button" class="ai-modechip" data-assistant-mode="${m.key}" ${m.enabled?"":"disabled"}>
      <span class="ico" aria-hidden="true">${m.icon}</span><span class="t">${t(m.labelKey)}</span>
    </button>`).join("")}
  </div>`;
}

/* Repli honnête quand l'IA locale n'est pas disponible (§20/§29) : jamais
   un blocage total de l'application — liste de navigation directe vers ce
   qui reste pleinement utilisable, chaque lien réutilisant switchTab(). */
function assistantNoAiFallbackHtml(){
  return `<div class="ai-noai-fallback">
    <div class="t">${t("assistant.noai_title")}</div>
    <p class="s">${t("assistant.noai_body")}</p>
    <div class="ai-noai-actions">
      <button type="button" class="btn-text" data-assistant-goto="smart">${t("nav.smart_revision")}</button>
      <button type="button" class="btn-text" data-assistant-goto="quiz">📝 ${t("nav.activities_quiz")}</button>
      <button type="button" class="btn-text" data-assistant-goto="flash">🃏 ${t("nav.activities_flash")}</button>
      <button type="button" class="btn-text" data-assistant-goto="stats">📊 ${t("stats.title")}</button>
      <button type="button" class="btn-text" data-assistant-goto="planning">📅 ${t("planning.title")}</button>
    </div>
  </div>`;
}

/* Le bandeau "assistant personnel" (modes + question libre) reste toujours
   visible et actif, même quand un panneau/une conversation est déjà ouvert
   — exactement comme la grille d'actions existante, qui permet déjà de
   changer d'action en un clic sans devoir "Fermer" d'abord (voir le handler
   [data-aiaction]). Seuls l'accroche complète, les suggestions et le repli
   "sans IA" (qui n'ont de sens qu'à l'écran d'accueil) sont masqués une fois
   qu'une conversation est en cours, pour ne jamais surcharger (§25). */
function renderAssistantHeroHtml(){
  const authed = window.LyonAuth && LyonAuth.available && LyonAuth.state.status === "signed-in" && LyonAuth.state.user;
  const profile = authed ? LyonAuth.state.profile : null;
  const firstName = profile && (profile.first_name || profile.display_name) ? (profile.first_name || profile.display_name) : null;
  const suggestions = assistantSuggestedPrompts();
  const ready = state.aiStatus === "ready";
  const showFull = !state.aiAction;
  return `<div class="dash-section ai-hero">
    <div class="section-title">${t("assistant.panel_title")}</div>
    ${showFull ? `<p class="ai-intro">${firstName ? t("greeting.hello_name_plain", {name: firstName}) + " — " : ""}${t("assistant.intro")}</p>` : ""}
    ${renderAssistantModeChipsHtml()}
    <div class="ai-queryrow">
      <label class="sr-only" for="assistant-query-input">${t("assistant.query_placeholder")}</label>
      <input type="text" class="ai-select" id="assistant-query-input" placeholder="${t("assistant.query_placeholder")}" value="${escapeHtml(state.aiPersonalQuery)}" ${ready?"":"disabled"}>
      <button type="button" class="btn red" id="assistant-query-btn" ${ready && !aiEngineBusy() ? "" : "disabled"}>${t("assistant.query_btn")}</button>
    </div>
    ${showFull && suggestions.length ? `<div class="ai-suggestions">
      ${suggestions.map(s=>`<button type="button" class="ai-suggestion-chip" data-assistant-suggestion-kind="${s.kind}" ${s.chapterId?`data-assistant-suggestion-chapter="${escapeHtml(s.chapterId)}"`:""} ${ready?"":"disabled"}>${escapeHtml(s.label)}</button>`).join("")}
    </div>` : ""}
    ${showFull && !ready ? assistantNoAiFallbackHtml() : ""}
  </div>`;
}

function attachAssistantHeroEvents(){
  document.querySelectorAll("[data-assistant-mode]").forEach(btn=>{
    if(btn.disabled) return;
    btn.addEventListener("click", ()=>{
      const mode = btn.dataset.assistantMode;
      if(mode === "discuss"){
        state.aiAction = "personal";
        state.aiPersonalIntent = null;
        state.aiThread = [];
        state.aiCardsDraft = null; state.aiQuizDraft = null; state.aiError = null;
        state.aiContextLabel = "";
        render();
        const input = document.getElementById("assistant-query-input");
        if(input) input.focus();
        return;
      }
      if(mode === "understand"){ aiSelectAction("explain"); return; }
      if(mode === "practice"){ aiSelectAction("quiz"); return; }
      if(mode === "analyze"){ aiSelectAction("errors"); return; }
      if(mode === "revise"){ aiRunPersonalMode("today", t("assistant.mode_revise")); return; }
      if(mode === "organize"){ aiRunPersonalMode("planning", t("assistant.mode_organize")); return; }
    });
  });

  document.querySelectorAll("[data-assistant-suggestion-kind]").forEach(btn=>{
    if(btn.disabled) return;
    btn.addEventListener("click", ()=>{
      const kind = btn.dataset.assistantSuggestionKind;
      if(kind === "drill"){ aiDrillChapter(btn.dataset.assistantSuggestionChapter); return; }
      if(kind === "errors"){ aiSelectAction("errors"); return; }
      if(kind === "today") { aiRunPersonalMode("today", btn.textContent.trim()); return; }
      if(kind === "planning") { aiRunPersonalMode("planning", btn.textContent.trim()); return; }
    });
  });

  document.querySelectorAll("[data-assistant-goto]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const tab = btn.dataset.assistantGoto;
      if(tab === "planning") state.planning.view = "study";
      switchTab(tab);
    });
  });

  const queryInput = document.getElementById("assistant-query-input");
  const queryBtn = document.getElementById("assistant-query-btn");
  if(queryInput){
    queryInput.addEventListener("input", ()=>{ state.aiPersonalQuery = queryInput.value; });
    queryInput.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" && !queryBtn.disabled){ e.preventDefault(); aiRunPersonalQuery(queryInput.value); }
    });
  }
  if(queryBtn && !queryBtn.disabled) queryBtn.addEventListener("click", ()=> aiRunPersonalQuery(queryInput ? queryInput.value : state.aiPersonalQuery));

  const reviseNowBtn = document.getElementById("ai-action-revise-now");
  if(reviseNowBtn) reviseNowBtn.addEventListener("click", aiActionReviseNow);
  const openPlanningBtn = document.getElementById("ai-action-open-planning");
  if(openPlanningBtn) openPlanningBtn.addEventListener("click", ()=>{ state.planning.view = "study"; switchTab("planning"); });
  const reviewErrorsBtn = document.getElementById("ai-action-review-errors");
  if(reviewErrorsBtn) reviewErrorsBtn.addEventListener("click", ()=> startModeQuiz("wrong"));

  document.querySelectorAll("[data-ai-quick]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const map = {
        simpler: t("assistant.explain_simpler_prompt"),
        detailed: t("assistant.explain_detailed_prompt"),
        example: t("assistant.explain_example_prompt"),
        check: t("assistant.explain_check_prompt"),
      };
      const msg = map[btn.dataset.aiQuick];
      if(msg) aiFollowUp(msg);
    });
  });
}

function renderAI(){
  const ready = state.aiStatus === "ready";
  const action = state.aiAction === "personal"
    ? { icon: "🤖", label: t("assistant.panel_title"), needs: "none", heuristic: false }
    : (state.aiAction ? AI_ACTIONS[state.aiAction] : null);

  let html = `
    <h1 class="page-title">Assistant de révision</h1>
    <p class="ai-intro">Choisis une action : l'assistant reçoit automatiquement le contexte utile — la fiche du chapitre, les questions du cours, tes erreurs ou ton niveau de maîtrise réel. Il tourne localement dans ton navigateur, sans serveur ni clé API.</p>
    ${aiStatusHtml()}
    ${aiDiagnosticPanelHtml()}
    ${renderAssistantHeroHtml()}
    <div class="section-title" style="margin-top:22px;">${t("assistant.more_actions")}</div>
    <div class="ai-actiongrid">
      ${Object.entries(AI_ACTIONS).map(([k,a])=>{
        const usable = ready || a.heuristic;
        return `<button class="ai-action ${state.aiAction===k?"active":""}" data-aiaction="${k}" ${usable?"":"disabled"}>
          <span class="ico">${a.icon}</span>
          <span class="t">${a.label}</span>
          <span class="d">${(!ready && a.heuristic) ? "Mode simplifié (sans IA)" : a.desc}</span>
        </button>`;}).join("")}
    </div>
  `;

  if(action){
    const needsChapter = action.needs === "chapter" || state.aiAction === "free";
    const needsTopic = action.needs === "topic";
    html += `<div class="card ai-panel">
      <div class="ai-panel-head">
        <div class="ai-panel-title">${action.icon} ${action.label}</div>
        <div style="display:flex; gap:14px; align-items:center;">
          ${state.aiThread.length ? `<button class="btn-text" id="ai-clear-thread">Effacer la conversation</button>` : ""}
          <button class="btn-text" id="ai-close">Fermer</button>
        </div>
      </div>`;

    if(needsChapter){
      html += `<div class="ai-field">
        <label for="ai-chapter-select">Chapitre</label>
        <select class="ai-select" id="ai-chapter-select">
          ${CHAPTERS.map(c=>`<option value="${c.id}" ${state.aiChapter===c.id?"selected":""}>${c.num} · ${c.title} (${levelName(c.level)})</option>`).join("")}
        </select>
      </div>`;
    }
    if(needsTopic){
      html += `<div class="ai-field">
        <label for="ai-topic-input">${state.aiAction === "free" ? "Ta question" : "Notion à expliquer"}</label>
        <textarea class="ai-textarea" id="ai-topic-input" style="min-height:74px;" placeholder="${action.placeholder || ""}">${escapeHtml(state.aiTopic)}</textarea>
      </div>`;
    }

    const isPersonal = state.aiAction === "personal";

    if(!isPersonal){
      html += `<details class="ai-extra">
        <summary>Joindre un document (optionnel)</summary>
        <div class="ai-filezone" id="ai-filezone" role="button" tabindex="0" aria-label="Ajouter un fichier texte">
          <div class="txt">📎 Ajouter un fichier texte</div>
          <div class="sub">.txt, .md, .csv, .json — pour un PDF ou un Word, colle le texte dans le champ ci-dessus</div>
        </div>
        <input type="file" id="ai-file-input" multiple accept=".txt,.md,.csv,.json,.markdown" style="display:none;">
        ${state.aiFiles.length > 0 ? `<div class="ai-filelist">${state.aiFiles.map((f,i)=>`
          <div class="ai-fileitem"><span class="fname">📄 ${escapeHtml(f.name)}</span><button data-removefile="${i}" aria-label="Retirer ${escapeHtml(f.name)}">✕</button></div>`).join("")}</div>` : ""}
      </details>`;

      html += `<div class="ai-generate-row">
        <span class="ai-charcount">${state.aiContextLabel ? escapeHtml(state.aiContextLabel) : defaultContextLabel(state.aiAction)}</span>
        <span style="display:flex; gap:10px;">
          ${state.aiBusy ? `<button class="btn outline" id="ai-cancel-btn">✕ Annuler</button>` : ""}
          <button class="btn red" id="ai-run-btn" ${aiEngineBusy() || !(ready || (action && action.heuristic)) ? "disabled" : ""}>${state.aiBusy ? "En cours…" : (state.aiThread.length ? "Relancer" : "Lancer")}</button>
        </span>
      </div>`;
      if(!ready && action && action.heuristic){
        html += `<p class="ai-hint" style="margin-top:6px;">⚙️ IA locale indisponible : ce bouton utilisera le <b>mode simplifié</b> (règles locales, sans modèle), à partir de la fiche de ce chapitre. Si le chapitre n'a pas assez de définitions repérables, un message clair te le dira plutôt qu'un faux résultat.</p>`;

/* ============================================================
   MA PROGRESSION — centre de pilotage des révisions
   ------------------------------------------------------------
   Chaque chiffre affiché provient d'une donnée déjà enregistrée par
   l'app (voir commentaires) : jamais de statistique fabriquée. Deux
   sources de maîtrise coexistent et ne sont jamais confondues :
     - chapitres intégrés (CHAPTERS/QUESTIONS) : maîtrise par question
       (masteryOf/qstat), erreurs récentes réelles (d.wrongQuestions) ;
     - chapitres utilisateur/IA (state.userChapters) : les questions IA
       ne sont jamais comptées dans qstats (voir trackQuizAnswer), donc
       seul un signal agrégé existe : meilleur score de quiz/flashcards
       (state.progress/state.flashProgress, via userChapterProgress) —
       jamais présenté comme un compte d'erreurs qui n'existe pas.
   ============================================================ */

/* Chapitres les plus utiles à revoir, toutes sources confondues, sans
   jamais mélanger les deux signaux ci-dessus dans un même nombre. */
function buildChaptersToReview(limit){
  limit = limit || 5;
  const items = [];
  const wrongByTheme = {};
  Object.values(state.dash.wrongQuestions).forEach(w=>{
    wrongByTheme[w.theme] = (wrongByTheme[w.theme] || 0) + w.wrongCount;
  });
  CHAPTERS.forEach(ch=>{
    let count = 0;
    (ch.themes||[]).forEach(th=>{ count += wrongByTheme[th] || 0; });
    if(count > 0) items.push({ chapterId: ch.id, subjectId: ch.subjectId, title: ch.title, kind: "errors", value: count });
  });
  state.userChapters.forEach(ch=>{
    const p = userChapterProgress(ch);
    if(p !== null && p < 70) items.push({ chapterId: ch.id, subjectId: ch.subjectId, title: ch.title, kind: "score", value: p });
  });
  items.sort((a,b)=>{
    if(a.kind !== b.kind) return a.kind === "errors" ? -1 : 1;
    return a.kind === "errors" ? (b.value - a.value) : (a.value - b.value);
  });
  return items.slice(0, limit);
}

/* Sévérité purement dérivée des valeurs déjà calculées ci-dessus — pas un
   nouvel indicateur, juste un code couleur sur une donnée réelle. */
function reviewItemSeverity(item){
  if(item.kind === "errors") return item.value >= 6 ? "high" : "mid";
  return item.value < 40 ? "high" : "mid";
}

/* Historique de scores exploitable pour un graphique d'évolution : quiz et
   examens seulement (les seuls types d'activité avec un pourcentage de
   réussite comparable dans le temps), le plus ancien en premier. */
function buildScoreEvolution(){
  return state.dash.recentActivity
    .filter(a => (a.type === "quiz" || a.type === "exam") && typeof a.pct === "number")
    .slice(0, 12)
    .slice()
    .reverse();
}

/* Recommandation "Continue tes révisions" : réutilise tel quel le chapitre
   le plus prioritaire de buildChaptersToReview — aucune nouvelle logique. */
function buildRevisionRecommendation(){
  const items = buildChaptersToReview(1);
  return items.length ? items[0] : null;
}

/* ============================================================
   RÉVISION INTELLIGENTE — pont entre l'état réel de l'app et le moteur
   pur window.LyonSmartRevision (voir smart-revision.js).
   ------------------------------------------------------------
   Toute la logique de priorisation vit dans smart-revision.js (testable
   isolément, sans DOM). Ici, on se contente de LIRE l'état déjà existant
   (qstats, state.progress, state.flashProgress, state.dash.*) pour
   construire des "faits" par chapitre, sans jamais dupliquer une source de
   vérité : mêmes fonctions que "Ma progression" (chapterMetrics,
   userChapterProgress, chaptersOfSubject...), voir aussi §17 de la demande
   (aucune donnée d'un utilisateur ne doit apparaître pour un autre — ces
   fonctions lisent exclusivement l'état local déjà en mémoire, jamais un
   identifiant de compte).
   ============================================================ */

/* Maîtrise honnête d'un chapitre : null si aucune interaction (jamais 0%
   par défaut). chapterMetrics() renvoie 0 même pour un chapitre jamais
   répondu (voir sa définition) — on corrige ça ici pour ne jamais laisser
   croire à une maîtrise nulle mesurée. Réutilisé par "Ma progression"
   indirectement via les mêmes fonctions sources, sans les modifier. */
function honestChapterMastery(ch){
  if(isUserChapter(ch.id)) return userChapterProgress(ch);
  const cm = chapterMetrics(ch);
  return cm.answered > 0 ? cm.mastery : null;
}

/* Dernière révision connue d'un chapitre : le plus récent des deux seuls
   historiques universels (quiz + IA) déjà enregistrés par l'app —
   state.dash.recentChapters (visites, 8 dernières, quiz+flash) et
   state.dash.recentActivity (sessions terminées, 20 dernières, quiz+
   examen+flash). Ni l'un ni l'autre n'est un historique complet : si le
   chapitre n'apparaît dans aucun des deux, on retourne null plutôt que de
   deviner une date. */
function lastRevisionTimestamp(chapterId){
  let best = null;
  (state.dash.recentChapters || []).forEach(rc=>{
    if(rc.chapterId === chapterId && (best === null || rc.ts > best)) best = rc.ts;
  });
  (state.dash.recentActivity || []).forEach(a=>{
    if(chapterIdFromQuizScope(a.scope) !== chapterId) return;
    const ts = typeof a.ts === "number" ? a.ts : Date.parse(a.ts);
    if(ts && !isNaN(ts) && (best === null || ts > best)) best = ts;
  });
  return best;
}

/* Tendance récente d'un chapitre : seulement si >=2 vraies sessions quiz/
   examen avec score en %, comparant la dernière session à la moyenne des
   précédentes (seuil de 8 points pour ignorer le bruit). null si moins de 2
   points — jamais de tendance inventée sur une seule mesure. */
function computeChapterTrend(chapterId){
  const entries = (state.dash.recentActivity || [])
    .filter(a => (a.type === "quiz" || a.type === "exam") && typeof a.pct === "number" && chapterIdFromQuizScope(a.scope) === chapterId)
    .slice()
    .reverse(); // recentActivity est du plus récent au plus ancien -> on remet dans l'ordre chronologique
  if(entries.length < 2) return null;
  const last = entries[entries.length - 1].pct;
  const prevAvg = entries.slice(0, -1).reduce((a, e) => a + e.pct, 0) / (entries.length - 1);
  const delta = last - prevAvg;
  if(delta >= 8) return "up";
  if(delta <= -8) return "down";
  return "flat";
}

/* ============================================================
   MES STATISTIQUES — pont entre l'état réel de l'app et le moteur pur
   window.LyonStatistics (voir statistics.js).
   ------------------------------------------------------------
   Même principe que le pont "Révision intelligente" ci-dessus : toute la
   logique de calcul (pondération, seuils, confiance) vit dans
   statistics.js ; ici on se contente de LIRE l'état déjà existant via les
   fonctions déjà en place (chapterMetrics, qstat, userChapterProgress,
   buildScoreEvolution, buildChaptersToReview, lastRevisionTimestamp,
   computeChapterTrend — ces deux dernières déjà écrites pour "Révision
   intelligente", réutilisées ici sans modification).
   ============================================================ */

/* Somme réelle answered/correct sur une plage de jours glissante (0 =
   aujourd'hui), à partir de state.dash.dailyStats — seule source à
   granularité JOURNALIÈRE et NON plafonnée (contrairement à
   recentActivity, limité à 20 entrées) : la bonne source pour une
   comparaison hebdomadaire fiable. Quiz du programme intégré uniquement
   (dailyStats ne compte pas les questions IA, voir trackQuizAnswer). */
function sumDailyStatsRange(startOffsetDays, endOffsetDaysExclusive){
  let correct = 0, total = 0;
  for(let i = startOffsetDays; i < endOffsetDaysExclusive; i++){
    const d = new Date(); d.setDate(d.getDate() - i);
    const rec = state.dash.dailyStats[dateKey(d)];
    if(rec){ correct += rec.correct || 0; total += rec.answered || 0; }
  }
  return { correct, total };
}

/* Matière la plus active cette semaine, seulement si le signal est net
   (au moins 2 activités, et strictement en tête — jamais un "focus"
   affirmé sur une égalité ou une activité isolée). Basé sur
   recentActivity (20 dernières entrées, même limite déjà connue et
   acceptée ailleurs dans l'app) : peut manquer une activité plus ancienne
   cette semaine si l'utilisateur a été très actif — limite réelle,
   assumée, pas corrigée ici (voir le rapport d'étape). */
function topSubjectThisWeek(){
  const cutoff = Date.now() - 7 * 86400000;
  const counts = {};
  (state.dash.recentActivity || []).forEach(a=>{
    const ts = typeof a.ts === "number" ? a.ts : Date.parse(a.ts);
    if(!ts || isNaN(ts) || ts < cutoff) return;
    const chId = chapterIdFromQuizScope(a.scope);
    const ch = chId ? findAnyChapter(chId) : null;
    const subj = ch ? findSubject(ch.subjectId) : null;
    if(!subj) return;
    counts[subj.name] = (counts[subj.name] || 0) + 1;
  });
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if(entries.length === 0 || entries[0][1] < 2) return null;
  if(entries.length > 1 && entries[0][1] === entries[1][1]) return null;
  return entries[0][0];
}

/* Statistiques d'un chapitre — réutilise chapterMetrics/qstat pour les
   chapitres intégrés, userChapterProgress/state.progress/flashProgress
   pour les chapitres utilisateur/IA (jamais mélangés, même séparation que
   "Ma progression"/"Révision intelligente"). */
function getChapterStatistics(chapterId){
  const ch = findAnyChapter(chapterId);
  if(!ch) return null;
  const isUser = isUserChapter(chapterId);
  let mastery, questionsTotal, questionsAnswered, correctCount, seenCount,
      hasErrorData, recentErrorCount, sessionsCount, flashcardCount;

  if(isUser){
    questionsTotal = ch.aiQuiz ? ch.aiQuiz.length : 0;
    questionsAnswered = null; correctCount = null; seenCount = null;
    flashcardCount = ch.aiFlashcards ? ch.aiFlashcards.length : 0;
    mastery = userChapterProgress(ch);
    hasErrorData = false;
    recentErrorCount = 0;
    const qp = state.progress["chapter:" + ch.id];
    const fp = state.flashProgress[ch.id];
    sessionsCount = (qp ? qp.attempts : 0) + (fp ? fp.attempts : 0);
  } else {
    const cm = chapterMetrics(ch);
    questionsTotal = cm.total;
    questionsAnswered = cm.answered;
    flashcardCount = deckCards(ch.id).length;
    mastery = cm.answered > 0 ? cm.mastery : null;
    hasErrorData = true;
    let correct = 0, seen = 0;
    QUESTIONS.filter(q => (ch.themes || []).includes(q.theme)).forEach(q=>{
      const s = qstat(q);
      if(s){ correct += s.correct; seen += s.seen; }
    });
    correctCount = correct; seenCount = seen;
    const wrongByTheme = {};
    Object.values(state.dash.wrongQuestions).forEach(w => { wrongByTheme[w.theme] = (wrongByTheme[w.theme] || 0) + w.wrongCount; });
    recentErrorCount = (ch.themes || []).reduce((sum, th) => sum + (wrongByTheme[th] || 0), 0);
    const qp = state.progress["chapter:" + ch.id];
    sessionsCount = qp ? qp.attempts : 0;
  }

  const successRate = (seenCount !== null && seenCount > 0) ? Math.round((correctCount / seenCount) * 100) : null;
  return {
    chapterId, title: ch.title, subjectId: ch.subjectId, isUser,
    mastery, questionsTotal, questionsAnswered, flashcardCount,
    successRate, correctCount, seenCount, hasErrorData, recentErrorCount, sessionsCount,
    lastRevisionAt: lastRevisionTimestamp(ch.id),
    trend: computeChapterTrend(ch.id),
    confidence: LyonStatistics.confidenceOf(isUser ? sessionsCount : questionsAnswered),
  };
}

/* Statistiques d'une matière : agrège les statistiques de chacun de ses
   chapitres (getChapterStatistics ci-dessus), jamais recalculées
   séparément — une seule source de vérité par chapitre. */
function getSubjectStatistics(subjectId){
  const subj = findSubject(subjectId);
  if(!subj) return null;
  const chs = chaptersOfSubject(subjectId);
  const chapterStats = chs.map(ch => getChapterStatistics(ch.id)).filter(Boolean);
  let questionsTotal = 0, questionsAnswered = 0, correctSum = 0, seenSum = 0;
  chapterStats.forEach(cs=>{
    questionsTotal += cs.questionsTotal || 0;
    if(cs.questionsAnswered) questionsAnswered += cs.questionsAnswered;
    if(cs.hasErrorData){ correctSum += cs.correctCount || 0; seenSum += cs.seenCount || 0; }
  });
  return {
    subjectId, name: subj.name, icon: subj.icon, color: subj.color,
    mastery: subjectProgress(subjectId),
    chapterCount: chs.length, questionsTotal, questionsAnswered,
    successRate: seenSum > 0 ? Math.round((correctSum / seenSum) * 100) : null,
    chapters: chapterStats,
  };
}

/* Évolution des scores : réutilise buildScoreEvolution() (déjà écrit pour
   "Ma progression") tel quel comme source de sessions, LyonStatistics ne
   fait que déterminer si le volume est suffisant et dans quel sens ça va. */
function getPerformanceEvolution(){
  return LyonStatistics.computeEvolution(buildScoreEvolution());
}

/* Temps de révision : aujourd'hui/semaine/mois/total + barres journalières
   des 7 derniers jours (jours sans donnée = 0, jamais inventés). Même
   source que "Ma progression" (state.dash.dailyTimeSeconds, universel
   quiz+flashcards, intégré+IA, alimenté par accrueTime()). */
function getRevisionStatistics(){
  const bars = [];
  let weekSecs = 0, monthSecs = 0;
  for(let i = 0; i < 30; i++){
    const d = new Date(); d.setDate(d.getDate() - i);
    const secs = state.dash.dailyTimeSeconds[dateKey(d)] || 0;
    if(i < 7){ weekSecs += secs; bars.push({ dateKey: dateKey(d), seconds: secs }); }
    monthSecs += secs;
  }
  bars.reverse();
  return {
    today: state.dash.dailyTimeSeconds[todayKey()] || 0,
    week: weekSecs, month: monthSecs, total: state.dash.timeSpentSeconds,
    weeklyBars: bars,
  };
}

/* Point d'entrée principal — vue d'ensemble de "Mes statistiques".
   Indépendant de l'interface comme getSmartRevisionRecommendations() :
   réutilisable par le dashboard (aperçu), une future appli mobile, ou un
   futur planning automatique. Recalculé à chaque appel (même volumétrie
   que globalMetrics(), pas de cache nécessaire — voir le rapport d'étape
   pour la mesure réelle). */
function getStatistics(){
  const g = globalMetrics();
  const userChapterFacts = state.userChapters.map(ch => ({
    mastery: userChapterProgress(ch),
    weight: (ch.aiQuiz ? ch.aiQuiz.length : 0) + (ch.aiFlashcards ? ch.aiFlashcards.length : 0),
  }));
  // g.mastery vaut toujours un nombre (0 y compris pour un programme jamais
  // touché, voir globalMetrics()) — on ne pondère le programme intégré dans
  // le calcul QUE s'il a réellement été entamé, sinon son poids est nul et
  // seuls les chapitres utilisateur (s'il y en a) décident du résultat :
  // jamais un "0% de maîtrise" affiché pour un compte qui n'a encore rien fait.
  const builtinWeight = g.answered > 0 ? QUESTIONS.length : 0;
  const globalMastery = LyonStatistics.computeGlobalMastery(g.mastery, builtinWeight, userChapterFacts);
  const evolution = getPerformanceEvolution();
  const comparison = LyonStatistics.computeComparison(sumDailyStatsRange(0, 7), sumDailyStatsRange(7, 14));
  const toReviewTop = buildChaptersToReview(1);
  const topErrorChapter = (toReviewTop.length && toReviewTop[0].kind === "errors") ? toReviewTop[0].title : null;
  const insights = LyonStatistics.computeInsights({
    evolution, comparison, topWeeklySubject: topSubjectThisWeek(), topErrorChapter,
  });
  const chaptersEvaluated = CHAPTERS.filter(ch => chapterMetrics(ch).answered > 0).length
    + state.userChapters.filter(ch => userChapterProgress(ch) !== null).length;

  return {
    globalMastery,
    questionsAnswered: g.answered, questionsTotal: g.total, successRate: g.successRate,
    chaptersEvaluated, chaptersTotal: allChaptersFlat().length,
    quizzesCompleted: state.dash.quizzesCompleted,
    wrongQuestionsCount: Object.values(state.dash.wrongQuestions).reduce((s, w) => s + w.wrongCount, 0),
    time: getRevisionStatistics(),
    evolution, comparison, insights,
  };
}

/* Construit les "faits" par chapitre consommés par LyonSmartRevision.
   Aucun chapitre sans quiz NI flashcards disponibles n'est inclus (rien de
   concret à proposer). Les deux sources de maîtrise (chapitres intégrés vs
   utilisateur/IA) restent séparées exactement comme dans "Ma progression"
   (voir son commentaire d'en-tête) : jamais de qstats pour une question IA
   (trackQuizAnswer les exclut explicitement), donc hasErrorData=false pour
   un chapitre utilisateur — jamais de "plusieurs erreurs récentes" inventé
   là où on n'a tout simplement pas la donnée. */
function buildChapterFacts(){
  const facts = [];
  allChaptersFlat().forEach(ch=>{
    const isUser = isUserChapter(ch.id);
    let mastery, masterySampleSize, hasErrorData, recentErrorCount;
    let quizQuestionCount, flashcardCount, hasQuiz, hasFlashcards;

    if(isUser){
      quizQuestionCount = ch.aiQuiz ? ch.aiQuiz.length : 0;
      hasQuiz = quizQuestionCount > 0;
      // Un chapitre utilisateur stocke ses flashcards dans ch.aiFlashcards
      // (voir la bibliothèque : startFlashDeck(ch.id, ..., ch.aiFlashcards)),
      // jamais dans deckCards()/state.aiCards qui ne concernent que les
      // cartes IA ajoutées à un chapitre INTÉGRÉ.
      flashcardCount = ch.aiFlashcards ? ch.aiFlashcards.length : 0;
      hasFlashcards = flashcardCount > 0;
      mastery = userChapterProgress(ch);
      const qp = state.progress["chapter:" + ch.id];
      const fp = state.flashProgress[ch.id];
      masterySampleSize = (qp ? qp.attempts : 0) + (fp ? fp.attempts : 0);
      hasErrorData = false;
      recentErrorCount = 0;
    } else {
      const cm = chapterMetrics(ch);
      quizQuestionCount = cm.total;
      hasQuiz = cm.total > 0;
      mastery = cm.answered > 0 ? cm.mastery : null;
      masterySampleSize = QUESTIONS.filter(q => (ch.themes || []).includes(q.theme)).filter(q => { const s = qstat(q); return s && s.seen > 0; }).length;
      hasErrorData = true;
      const wrongByTheme = {};
      Object.values(state.dash.wrongQuestions).forEach(w => { wrongByTheme[w.theme] = (wrongByTheme[w.theme] || 0) + w.wrongCount; });
      recentErrorCount = (ch.themes || []).reduce((sum, th) => sum + (wrongByTheme[th] || 0), 0);
      flashcardCount = deckCards(ch.id).length;
      hasFlashcards = flashcardCount > 0;
    }

    if(!hasQuiz && !hasFlashcards) return;

    facts.push({
      chapterId: ch.id, subjectId: ch.subjectId, title: ch.title,
      mastery, masterySampleSize, hasErrorData, recentErrorCount,
      lastRevisionAt: lastRevisionTimestamp(ch.id), trend: computeChapterTrend(ch.id),
      hasQuiz, hasFlashcards, quizQuestionCount, flashcardCount,
    });
  });
  return facts;
}

/* Point d'entrée public du moteur — indépendant de l'interface (voir §2 de
   la demande) : ne fait aucune hypothèse sur qui l'appelle. Recalculé à
   chaque appel plutôt que mis en cache, exactement comme globalMetrics()/
   chapterMetrics() déjà recalculés à chaque rendu sans cache — même ordre
   de grandeur de données (nombre de chapitres/questions du programme, pas
   des milliers de lignes), donc pas de coût de calcul à amortir (voir le
   rapport d'étape pour la mesure réelle). */
function getSmartRevisionRecommendations(){
  return LyonSmartRevision.computeRecommendations(buildChapterFacts(), { now: Date.now() });
}

/* Repli honnête quand l'utilisateur n'a pas (encore) assez de chapitres/
   données pour remplir une session : réutilise tel quel le pool "révision
   express" déjà existant (mélange pondéré erreurs/à revoir/jamais faites/
   aléatoire, voir poolExpress) plutôt que d'inventer un nouveau mécanisme. */
function buildFallbackSessionItem(targetMinutes){
  const n = Math.max(6, Math.round(targetMinutes * 60 / 40));
  const pool = poolExpress(n);
  if(!pool.length) return null;
  return {
    chapterId: null, subjectId: null, title: t("smart.fallback_title"),
    reasonKey: "smart.reason_fallback_review", reasonVars: null,
    mastery: null, masterySampleSize: 0, confidence: "insufficient",
    suggestedMode: "quiz", estimatedMinutes: Math.max(2, Math.min(15, Math.round(pool.length * 40 / 60))),
    hasQuiz: true, hasFlashcards: false, isFallback: true,
    execMode: "quiz", payload: pool,
  };
}

/* Attache le contenu jouable (questions/cartes) à un item déjà retenu dans
   une session — fait exprès APRÈS la sélection (pas pour chaque chapitre
   candidat) pour rester léger : voir §18, pas de calcul inutile sur des
   chapitres qui ne seront finalement pas proposés. Pour un chapitre intégré,
   cible en priorité les questions jamais faites ou de faible maîtrise
   (cohérent avec "quiz ciblé" du mock-up §5). */
function attachSessionPayload(item){
  if(item.isFallback) return item;
  const ch = findAnyChapter(item.chapterId);
  if(!ch) return Object.assign({}, item, { execMode: null, payload: [] });

  const wantsFlash = item.suggestedMode === "flash" || (item.suggestedMode === "course_flash" && !item.hasQuiz);
  if(wantsFlash){
    const cards = isUserChapter(ch.id) ? (ch.aiFlashcards || []).slice() : deckCards(ch.id);
    return Object.assign({}, item, { execMode: "flash", payload: cards });
  }
  if(isUserChapter(ch.id)){
    return Object.assign({}, item, { execMode: "quiz", payload: (ch.aiQuiz || []).slice() });
  }
  const themed = QUESTIONS.filter(q => (ch.themes || []).includes(q.theme));
  const weak = themed.filter(q => { const m = masteryOf(q); return m === null || m < 75; });
  const targetCount = Math.max(4, Math.min(themed.length, Math.round(item.estimatedMinutes * 60 / 40)));
  const pool = (weak.length ? shuffle(weak) : shuffle(themed)).slice(0, targetCount);
  return Object.assign({}, item, { execMode: "quiz", payload: pool.length ? pool : themed });
}

/* Construit le plan de session complet (recommandations + repli + contenu
   jouable) pour une durée cible donnée (10/20/30 min, voir §8). */
function buildSmartSessionPlan(targetMinutes){
  const recos = getSmartRevisionRecommendations();
  const fallback = buildFallbackSessionItem(targetMinutes);
  const plan = LyonSmartRevision.buildSession(recos, targetMinutes, fallback);
  plan.items = plan.items.map(attachSessionPayload).filter(it => it.payload && it.payload.length);
  return plan;
}

/* ---------- Session de révision intelligente : orchestration ----------
   Réutilise entièrement startQuiz()/startFlashDeck() (mêmes écrans, mêmes
   clés de sauvegarde — voir §7/§21 : "ne crée pas une nouvelle interface
   parallèle"). Seuls nextQuestion()/judgeCard()/backToPicker()/
   backToFlashPicker() reçoivent un petit hook conditionnel (actif
   uniquement si state.smartSession existe) pour enchaîner les étapes au
   lieu d'afficher l'écran de résultat autonome à chaque étape. */
function startSmartSession(items){
  if(!items || !items.length) return;
  const beforeMastery = {};
  items.forEach(it=>{
    if(!it.chapterId) return;
    const ch = findAnyChapter(it.chapterId);
    if(ch) beforeMastery[it.chapterId] = honestChapterMastery(ch);
  });
  state.smartSession = { items, stepIndex: 0, results: [], startedAt: Date.now(), beforeMastery };
  launchSmartSessionStep();
}

function launchSmartSessionStep(){
  const s = state.smartSession;
  if(!s) return;
  const item = s.items[s.stepIndex];
  if(!item || !item.payload || !item.payload.length){ advanceSmartSession(); return; }
  if(item.execMode === "flash"){
    startFlashDeck(item.chapterId, item.title, item.payload);
  } else {
    startQuiz(item.chapterId ? "chapter:" + item.chapterId : "smart-review", item.title, null, item.payload);
  }
}

function recordSmartSessionStep(result){
  if(!state.smartSession) return;
  state.smartSession.results.push(result);
}

function advanceSmartSession(){
  const s = state.smartSession;
  if(!s) return;
  s.stepIndex++;
  if(s.stepIndex < s.items.length) launchSmartSessionStep();
  else finishSmartSession();
}

function finishSmartSession(){
  const s = state.smartSession;
  if(!s) return;
  const progressed = [], newlyAssessed = [];
  Object.keys(s.beforeMastery).forEach(chId=>{
    const ch = findAnyChapter(chId);
    if(!ch) return;
    const before = s.beforeMastery[chId];
    const after = honestChapterMastery(ch);
    if(before === null && after !== null) newlyAssessed.push({ chapterId: chId, title: ch.title, after });
    else if(before !== null && after !== null && after > before) progressed.push({ chapterId: chId, title: ch.title, before, after });
  });
  s.progressed = progressed;
  s.newlyAssessed = newlyAssessed;
  s.finishedAt = Date.now();
  state.tab = "smart";
  state.smartScreen = "recap";
  render();
  window.scrollTo(0, 0);
}

/* Abandon propre d'une session en cours (bouton quitter/changer de thème
   pendant une étape) : pas de bilan partiel présenté comme un résultat
   réel, on revient simplement à l'accueil de la révision intelligente. */
function abortSmartSession(){
  state.smartSession = null;
  state.tab = "smart";
  state.smartScreen = "home";
  render();
}

/* ============================================================
   RÉVISION INTELLIGENTE — rendu
   ============================================================ */
const SMART_ERROR_REASON_KEYS = ["smart.reason_recurring_errors", "smart.reason_errors_recent", "smart.reason_declining_trend"];

function smartReasonHtml(item){
  const icon = SMART_ERROR_REASON_KEYS.includes(item.reasonKey) ? "⚠️" : "💡";
  return `<span class="sr-reason">${icon} ${t(item.reasonKey, item.reasonVars || {})}</span>`;
}

function smartModeInfo(mode){
  switch(mode){
    case "flash": return { icon: "🃏", label: t("smart.mode_flash") };
    case "course_flash": return { icon: "📖", label: t("smart.mode_course_flash") };
    case "course_quiz": return { icon: "📖", label: t("smart.mode_course_quiz") };
    default: return { icon: "📝", label: t("smart.mode_quiz") };
  }
}

function smartRecoCardHtml(item){
  const subject = item.subjectId ? findSubject(item.subjectId) : null;
  const modeInfo = smartModeInfo(item.suggestedMode);
  const showConfidence = item.confidence === "insufficient" || item.confidence === "low";
  const tier = item.mastery !== null ? masteryTier(item.mastery) : null;
  return `<div class="sr-card">
    <div class="sr-card-top">
      <span class="sr-card-subject">${subject ? (subject.icon || "📘") + " " + escapeHtml(subject.name) : ""}</span>
      ${showConfidence ? `<span class="sr-confidence">${t("smart.confidence_low")}</span>` : ""}
    </div>
    <h3 class="sr-card-title">${escapeHtml(item.title)}</h3>
    ${item.mastery !== null ? `<div class="sr-card-mastery"><span class="m-chip ${tier.key}">${t("smart.mastery_label", {pct: item.mastery})}</span></div>` : ""}
    ${smartReasonHtml(item)}
    <div class="sr-card-meta">
      <span class="sr-card-mode">${modeInfo.icon} ${modeInfo.label}</span>
      <span class="sr-card-time">~${item.estimatedMinutes} min</span>
    </div>
    <button class="btn red small" data-smart-start-one="${item.chapterId}">${t("smart.review_now_btn")} →</button>
  </div>`;
}

function renderSmartHome(){
  // L'utilisateur qui n'a strictement RIEN fait ne doit jamais voir une
  // liste de recommandations (même honnête, "jamais travaillé" qualifierait
  // TOUS les chapitres du programme) : voir §11, l'état vide doit rester
  // positif et court, jamais "voici tout ce que tu n'as pas fait".
  const hasAnyData = state.dash.recentActivity.length > 0
    || QUESTIONS.some(q => qstat(q))
    || state.userChapters.some(ch => userChapterProgress(ch) !== null);
  const hasChapters = allChaptersFlat().length > 0;

  let html = `<h1 class="page-title">🧠 ${t("smart.title")}</h1>
    <p class="ai-intro">${t("smart.subtitle")}</p>`;

  if(!hasAnyData){
    html += `<div class="dash-section sr-empty-hero">
      <p>${t("smart.subtitle_empty")}</p>
      <div class="sr-empty-actions">
        ${hasChapters ? `<button class="btn red" id="smart-empty-quiz-btn">${t("smart.empty_cta_quiz")}</button>` : `<button class="btn red" id="smart-empty-import-btn">${t("smart.empty_cta_import")}</button>`}
        <button class="btn outline" id="smart-empty-subjects-btn">${t("smart.empty_cta_subjects")}</button>
      </div>
    </div>`;
    return html;
  }

  const recos = getSmartRevisionRecommendations();
  const top = recos.slice(0, 5);

  if(top.length === 0){
    html += `<div class="dash-section"><p class="dash-empty">${t("smart.all_good")}</p></div>`;
    return html;
  }

  html += `<div class="dash-section">
    <div class="section-title">${t("smart.now_title")}</div>
    <div class="sr-grid">${top.map(smartRecoCardHtml).join("")}</div>
  </div>`;

  const targetMinutes = state.smartSessionLength || 20;
  const plan = buildSmartSessionPlan(targetMinutes);
  html += `<div class="dash-section">
    <div class="section-title">${t("smart.session_title")}</div>
    <div class="sr-length-chips">
      ${[10,20,30].map(n=>`<button type="button" data-smart-length="${n}" class="${targetMinutes===n?'active':''}">${n} min</button>`).join("")}
    </div>`;
  if(plan.items.length === 0){
    html += `<p class="dash-empty">${t("smart.session_empty")}</p></div>`;
  } else {
    html += `<div class="sr-session-preview">${plan.items.map((it,i)=>`
      <div class="sr-session-row">
        <span class="sr-session-num">${i+1}</span>
        <div class="sr-session-body">
          <span class="sr-session-title">${escapeHtml(it.title)}</span>
          <span class="sr-session-mode">${smartModeInfo(it.execMode === "flash" ? "flash" : "quiz").label} · ~${it.estimatedMinutes} min</span>
        </div>
      </div>`).join("")}</div>
      <div class="sr-session-total">${t("smart.session_preview_total", {n: plan.totalMinutes})}</div>
      <button class="btn red" id="smart-session-start-btn">${t("smart.session_start_btn")}</button>
    </div>`;
  }

  return html;
}

function renderSmartRecap(){
  const s = state.smartSession;
  if(!s) return renderSmartHome();
  const quizResults = s.results.filter(r => r.mode === "quiz");
  const flashResults = s.results.filter(r => r.mode === "flash");
  const totalQuestions = quizResults.reduce((a,r)=>a+r.total,0);
  const totalCorrect = quizResults.reduce((a,r)=>a+r.score,0);
  const totalCards = flashResults.reduce((a,r)=>a+r.total,0);
  const totalKnown = flashResults.reduce((a,r)=>a+r.score,0);
  const notionsCount = new Set(s.results.map(r=>r.chapterId).filter(Boolean)).size;
  const elapsedSeconds = s.finishedAt ? Math.max(0, Math.round((s.finishedAt - s.startedAt)/1000)) : 0;

  let html = `<h1 class="page-title">${t("smart.recap_title")} 🎉</h1>`;

  html += `<div class="dash-section"><div class="pg-overview">`;
  if(totalQuestions > 0){
    html += `<div class="pg-tile"><div class="pg-tile-num">${totalQuestions}</div><div class="pg-tile-lbl">${t("smart.recap_questions_lbl")}</div></div>
      <div class="pg-tile"><div class="pg-tile-num">${totalCorrect}</div><div class="pg-tile-lbl">${t("smart.recap_correct_lbl")}</div></div>`;
  }
  if(totalCards > 0){
    html += `<div class="pg-tile"><div class="pg-tile-num">${totalCards}</div><div class="pg-tile-lbl">${t("smart.recap_cards_lbl")}</div></div>
      <div class="pg-tile"><div class="pg-tile-num">${totalKnown}</div><div class="pg-tile-lbl">${t("smart.recap_known_lbl")}</div></div>`;
  }
  html += `<div class="pg-tile"><div class="pg-tile-num">${notionsCount}</div><div class="pg-tile-lbl">${t("smart.recap_chapters_lbl")}</div></div>
    <div class="pg-tile"><div class="pg-tile-num">${fmtDuration(elapsedSeconds)}</div><div class="pg-tile-lbl">${t("dashboard.revision_time")}</div></div>`;
  html += `</div></div>`;

  if(s.progressed.length > 0){
    html += `<div class="dash-section">
      <div class="section-title">${t("smart.recap_progressed_title")}</div>
      <ul class="sr-progressed-list">${s.progressed.map(p=>`<li>${escapeHtml(p.title)} <b>${p.before}% → ${p.after}%</b></li>`).join("")}</ul>
    </div>`;
  } else if(s.newlyAssessed.length > 0){
    html += `<div class="dash-section">
      <div class="section-title">${t("smart.recap_newlyassessed_title")}</div>
      <ul class="sr-progressed-list">${s.newlyAssessed.map(p=>`<li>${escapeHtml(p.title)} <b>${p.after}%</b></li>`).join("")}</ul>
    </div>`;
  } else {
    html += `<div class="dash-section"><p class="dash-empty">${t("smart.recap_none_progressed")}</p></div>`;
  }

  const touchedIds = new Set(s.items.map(it=>it.chapterId).filter(Boolean));
  const soon = getSmartRevisionRecommendations().filter(r => !touchedIds.has(r.chapterId)).slice(0, 2);
  if(soon.length > 0){
    html += `<div class="dash-section">
      <div class="section-title">${t("smart.recap_soon_title")}</div>
      <div class="pg-review-list">${soon.map(r=>`<div class="pg-review-item" style="cursor:default;">
        <span class="pg-review-dot">🟠</span>

/* Lance la révision d'un chapitre en réutilisant EN PRIORITÉ le moteur de
   "Révision intelligente" (même recommandation, mêmes clés de session —
   voir §16 : ne jamais recréer une logique de recommandation). Si ce
   chapitre n'est pas actuellement dans les priorités (déjà bien maîtrisé,
   par exemple), repli sur les mêmes points d'entrée que la bibliothèque
   (startQuiz/startFlashDeck), inchangés. */
function statsReviseChapter(chapterId){
  const reco = getSmartRevisionRecommendations().find(r => r.chapterId === chapterId);
  if(reco){
    const item = attachSessionPayload(reco);
    if(item.payload && item.payload.length){
      switchTab("smart");
      startSmartSession([item]);
      return;
    }
  }
  const ch = findAnyChapter(chapterId);
  if(!ch) return;
  if(isUserChapter(chapterId)){
    if(ch.aiQuiz && ch.aiQuiz.length){ startQuiz("chapter:" + ch.id, ch.title, null, ch.aiQuiz.slice()); return; }
    if(ch.aiFlashcards && ch.aiFlashcards.length){ startFlashDeck(ch.id, ch.title, ch.aiFlashcards.slice()); return; }
  } else {
    startQuiz("chapter:" + ch.id, ch.title, ch.themes);
  }
}

function statsGoTo(view, ids){
  state.statsView = { view, subjectId: (ids && ids.subjectId) || null, chapterId: (ids && ids.chapterId) || null };
  render();
  window.scrollTo(0, 0);
}

/* Regroupe une liste d'activités par jour, comme "Ma progression" — une
   copie volontairement séparée (pas un refactor de renderProgress(), déjà
   testé et en production) plutôt qu'une dépendance croisée entre deux
   fonctions de rendu indépendantes ; les DONNÉES elles-mêmes (state.dash.
   recentActivity) ne sont jamais dupliquées, seule cette petite fonction de
   regroupement l'est. */
function groupActivityByDay(items){
  const groups = [];
  let lastKey = null;
  items.forEach(a=>{
    if(a.date !== lastKey){ groups.push({ date: a.date, items: [] }); lastKey = a.date; }
    groups[groups.length - 1].items.push(a);
  });
  return groups;
}

function renderWeeklyBars(bars){
  const max = Math.max(1, ...bars.map(b => b.seconds));
  const dayLabels = [t("date.mon"), t("date.tue"), t("date.wed"), t("date.thu"), t("date.fri"), t("date.sat"), t("date.sun")];
  return `<div class="st-weekbars">` + bars.map((b, i)=>{
    const d = new Date(b.dateKey + "T00:00:00");
    const dow = (d.getDay() + 6) % 7; // 0 = lundi
    const h = b.seconds > 0 ? Math.max(6, Math.round((b.seconds / max) * 64)) : 0;
    return `<div class="st-weekbar-col">
      <div class="st-weekbar-track"><div class="st-weekbar-fill" style="height:${h}px;" title="${fmtDuration(b.seconds)}"></div></div>
      <span class="st-weekbar-lbl">${dayLabels[dow]}</span>
    </div>`;
  }).join("") + `</div>`;
}
