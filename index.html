/* Récupération des anciennes erreurs (dashboard-stats.wrongQuestions)
   vers le nouveau suivi par question — uniquement si celui-ci est vide. */
function migrateLegacyWrongQuestions(){
  if(state.qstats && Object.keys(state.qstats).length > 0) return;
  const legacy = state.dash.wrongQuestions || {};
  const ids = Object.keys(legacy);
  if(ids.length === 0) return;
  ids.forEach(id => {
    const q = QUESTIONS[Number(id)];
    if(!q) return;
    const n = legacy[id].wrongCount || 1;
    state.qstats[q.uid] = {
      seen: n, correct: 0, wrong: n, streak: 0,
      last: "ko", lastDate: legacy[id].lastWrong || todayKey(),
      history: [0], theme: q.theme,
    };
  });
  saveQStats();
}

/* ============================================================
   5bis. MOTEUR DE MAÎTRISE PAR QUESTION
   ============================================================ */
function qstat(q){ return state.qstats[q.uid] || null; }

function recordQuestionResult(q, ok){
  const s = state.qstats[q.uid] || {seen:0, correct:0, wrong:0, streak:0, last:null, lastDate:null, history:[], theme:q.theme};
  s.seen++;
  if(ok){ s.correct++; s.streak = s.streak > 0 ? s.streak + 1 : 1; s.last = "ok"; }
  else   { s.wrong++;   s.streak = 0;                               s.last = "ko"; }
  s.history.push(ok ? 1 : 0);
  if(s.history.length > 10) s.history = s.history.slice(-10);
  s.lastDate = todayKey();
  s.theme = q.theme;
  state.qstats[q.uid] = s;
  saveQStats();
  return s;
}

/* Niveau de maîtrise 0-100, ou null si la question n'a jamais été répondue.
   Les réponses les plus récentes pèsent davantage, et une série de bonnes
   réponses donne un bonus (mémorisation consolidée). */
function masteryOf(q){
  const s = qstat(q);
  if(!s || !s.seen) return null;
  const h = s.history.slice(-5);
  let sum = 0, weights = 0;
  h.forEach((v,i) => { const w = i + 1; sum += v * w; weights += w; });
  let m = weights ? (sum / weights) * 100 : 0;
  if(s.streak >= 3) m = Math.min(100, m + 10);
  if(s.seen === 1) m = m * 0.9;            // une seule réponse = maîtrise non confirmée
  return Math.max(0, Math.min(100, Math.round(m)));
}

function successRateOf(q){
  const s = qstat(q);
  if(!s || !s.seen) return null;
  return Math.round((s.correct / s.seen) * 100);
}

function masteryTier(m){
  if(m === null || m === undefined) return {key:"new",       label:"Jamais faite"};
  if(m >= 85) return {key:"mastered", label:"Maîtrisée"};
  if(m >= 60) return {key:"good",     label:"Acquise"};
  if(m >= 35) return {key:"weak",     label:"Fragile"};
  return {key:"critical", label:"À revoir"};
}

/* --- Sélections automatiques --- */
function poolNever(){
  return QUESTIONS.filter(q => { const s = qstat(q); return !s || !s.seen; });
}
function poolWrong(){
  return QUESTIONS.filter(q => { const s = qstat(q); return s && s.last === "ko"; });
}
function poolHard(){
  return QUESTIONS
    .filter(q => { const s = qstat(q); return s && s.seen >= 2 && (s.correct / s.seen) < 0.5; })
    .sort((a,b) => (successRateOf(a) - successRateOf(b)) || (qstat(b).wrong - qstat(a).wrong));
}
/* "À revoir" : les questions déjà vues dont la maîtrise est la plus faible. */
function poolReview(limit){
  const list = QUESTIONS
    .filter(q => { const m = masteryOf(q); return m !== null && m < 75; })
    .sort((a,b) => masteryOf(a) - masteryOf(b));
  return typeof limit === "number" ? list.slice(0, limit) : list;
}
/* Révision express : priorité aux points faibles, complétée par du neuf et de l'aléatoire. */
function poolExpress(n){
  n = n || 10;
  const picked = [];
  const seen = {};
  const add = arr => arr.forEach(q => { if(!seen[q.uid] && picked.length < n){ seen[q.uid]=true; picked.push(q); } });
  add(shuffle(poolWrong()));
  add(poolReview().slice(0, n));
  add(shuffle(poolNever()));
  add(shuffle(QUESTIONS));
  return shuffle(picked);
}

/* --- Agrégats --- */
function globalMetrics(){
  let answered = 0, sumMastery = 0, totalSeen = 0, totalCorrect = 0, mastered = 0;
  QUESTIONS.forEach(q => {
    const m = masteryOf(q);
    if(m !== null){ answered++; sumMastery += m; if(m >= 85) mastered++; }
    const s = qstat(q);
    if(s){ totalSeen += s.seen; totalCorrect += s.correct; }
  });
  const total = QUESTIONS.length;
  return {
    total,
    answered,
    never: total - answered,
    coverage: Math.round((answered / total) * 100),
    mastery: Math.round(sumMastery / total),           // les questions jamais faites comptent 0
    masteredCount: mastered,
    successRate: totalSeen ? Math.round((totalCorrect / totalSeen) * 100) : null,
    totalSeen,
    totalCorrect,
  };
}

function themeMastery(themeId){
  const qs = QUESTIONS.filter(q => q.theme === themeId);
  if(qs.length === 0) return null;
  let sum = 0;
  qs.forEach(q => { const m = masteryOf(q); sum += (m === null ? 0 : m); });
  return Math.round(sum / qs.length);
}

function chapterMetrics(ch){
  const qs = QUESTIONS.filter(q => (ch.themes||[]).includes(q.theme));
  let answered = 0;
  qs.forEach(q => { if(masteryOf(q) !== null) answered++; });
  const mastery = qs.length ? Math.round(qs.reduce((acc,q)=>{ const m = masteryOf(q); return acc + (m===null?0:m); },0) / qs.length) : 0;
  return {
    total: qs.length,
    answered,
    coverage: qs.length ? Math.round((answered/qs.length)*100) : 0,
    mastery,
    mastered: mastery >= 80 && answered === qs.length && qs.length > 0,
  };
}

function masteredChaptersCount(){
  return CHAPTERS.filter(ch => chapterMetrics(ch).mastered).length;
}

/* Progression globale affichée sur l'accueil : niveau de maîtrise réel. */
function globalProgressPct(){ return globalMetrics().mastery; }

/* ============================================================
   5quater. TRACKING DES ACTIVITÉS
   ============================================================ */
function accrueTime(){
  const now = Date.now();
  if(lastActionTs){
    const delta = now - lastActionTs;
    if(delta > 0 && delta < 3*60*1000){
      state.dash.timeSpentSeconds += Math.round(delta/1000);
    }
  }
  lastActionTs = now;
}

function markTodayActive(){
  const today = todayKey();
  if(state.dash.activityDates.indexOf(today) === -1){
    state.dash.activityDates.push(today);
  }
}

function trackQuizAnswer(q, correct){
  accrueTime();
  if(q.ai){ markTodayActive(); saveDashboardStats(); return; }
  const d = state.dash;
  d.totalAnswered++;
  if(correct) d.totalCorrect++;
  if(correct){
    d.correctStreak = (d.correctStreak || 0) + 1;
    if(d.correctStreak > (d.bestCorrectStreak || 0)) d.bestCorrectStreak = d.correctStreak;
  } else {
    d.correctStreak = 0;
  }
  const today = todayKey();
  if(!d.dailyStats[today]) d.dailyStats[today] = {answered:0, correct:0};
  d.dailyStats[today].answered++;
  if(correct) d.dailyStats[today].correct++;
  markTodayActive();

  if(correct){
    if(d.wrongQuestions[q.id]) delete d.wrongQuestions[q.id];
  } else {
    const existing = d.wrongQuestions[q.id];
    d.wrongQuestions[q.id] = {
      theme: q.theme,
      q: q.q,
      wrongCount: existing ? existing.wrongCount + 1 : 1,
      lastWrong: today,
    };
  }
  saveDashboardStats();

  recordQuestionResult(q, correct);
  evaluateBadges();
}

function trackFlashActivity(){
  accrueTime();
  markTodayActive();
  saveDashboardStats();
}

function trackChapterVisit(chapterId, type){
  if(!chapterId) return;
  const d = state.dash;
  d.recentChapters = d.recentChapters.filter(c => c.chapterId !== chapterId);
  d.recentChapters.unshift({chapterId, type, ts: Date.now()});
  if(d.recentChapters.length > 8) d.recentChapters.length = 8;
  saveDashboardStats();
}

function logActivity(type, scope, label, score, total){
  const d = state.dash;
  const now = new Date();
  const pct = total ? Math.round((score/total)*100) : 0;
  d.recentActivity.unshift({
    ts: now.toISOString(), date: dateKey(now), type, scope, label,
    score, total, pct,
  });
  if(d.recentActivity.length > 20) d.recentActivity.length = 20;
  if(type === "quiz" || type === "exam") d.quizzesCompleted = (d.quizzesCompleted || 0) + 1;
  if(total >= 10 && pct >= 90) d.best90Achieved = true;
  saveDashboardStats();
  evaluateBadges();
}

/* ============================================================
   6. QUIZ — LOGIQUE
   ============================================================ */
function startQuiz(scope, label, themeKeys, customPool){
  const source = customPool ? customPool : (themeKeys === "all" ? QUESTIONS : QUESTIONS.filter(q => themeKeys.includes(q.theme)));
  if(!source || source.length === 0) return;
  state.playing = { scope, label, themeKeys, custom: !!customPool };
  state.pool = shuffle(source);
  state.index = 0;
  state.score = 0;
  state.answered = false;
  state.selectedOpt = null;
  state.recap = [];
  state.screen = "quiz";
  state.tab = "quiz";
  const chId = chapterIdFromQuizScope(scope);
  if(chId) trackChapterVisit(chId, "quiz");
  render();
  window.scrollTo(0,0);
}

function selectOption(i){
  if(state.answered) return;
  state.answered = true;
  state.selectedOpt = i;
  const q = state.pool[state.index];
  const isCorrect = i === q.correct;
  if(isCorrect) state.score++;
  state.recap.push({q: q.q, ok: isCorrect});
  trackQuizAnswer(q, isCorrect);
  render();
}

function nextQuestion(){
  if(state.index < state.pool.length - 1){
    state.index++;
    state.answered = false;
    state.selectedOpt = null;
    render();
  } else {
    const pct = Math.round((state.score / state.pool.length) * 100);
    saveProgress(state.playing.scope, pct);
    logActivity("quiz", state.playing.scope, state.playing.label, state.score, state.pool.length);
    state.screen = "results";
    render();
  }
}

function backToPicker(){
  state.screen = "picker";
  render();
}

/* ============================================================
   7bis. MODES DE RÉVISION INTELLIGENTS
   ============================================================ */
function startModeQuiz(mode){
  if(mode === "express"){
    const pool = poolExpress(10);
    if(pool.length) startQuiz("express", "Révision express (" + pool.length + " questions)", null, pool);
    return;
  }
  if(mode === "wrong"){
    const pool = poolWrong();
    if(pool.length) startQuiz("wrong", "Mes erreurs à revoir", null, shuffle(pool));
    return;
  }
  if(mode === "hard"){
    const pool = poolHard();
    if(pool.length) startQuiz("hard", "Questions difficiles", null, shuffle(pool));
    return;
  }
  if(mode === "never"){
    const pool = poolNever();
    if(pool.length) startQuiz("never", "Questions jamais faites", null, shuffle(pool));
    return;
  }
  if(mode === "review"){
    const pool = poolReview(15);
    if(pool.length) startQuiz("review", "À revoir en priorité", null, shuffle(pool));
    return;
  }
}

function continueRevision(){
  const d = state.dash;
  if(d.recentChapters && d.recentChapters.length > 0){
    const rc = d.recentChapters[0];
    const ch = findAnyChapter(rc.chapterId);
    if(ch){
      if(isUserChapter(ch.id)){
        if(rc.type === "flash" && ch.aiFlashcards && ch.aiFlashcards.length){
          state.tab = "flash";
          startFlashDeck(ch.id, ch.title, ch.aiFlashcards.slice());
          return;
        }
        if(ch.aiQuiz && ch.aiQuiz.length){
          startQuiz("chapter:"+ch.id, ch.title, null, ch.aiQuiz.slice());
          return;
        }
        libGoto("chapterDetail", {subjectId: ch.subjectId, chapterId: ch.id});
        switchTab("library");
        return;
      }
      if(rc.type === "flash"){
        state.tab = "flash";
        startFlashDeck(ch.id, ch.num + " · " + ch.title, deckCards(ch.id));
        return;
      }
      startQuiz("chapter:"+ch.id, ch.title, ch.themes);
      return;
    }
  }
  state.tab = "quiz";
  state.screen = "picker";
  render();
  window.scrollTo(0,0);
}

      <div class="dash-revision-main">

/* "Mon emploi du temps" — aperçu du planning du jour directement sur le dashboard,
   avec détection du cours en cours et accès direct à l'espace de notes. */
function renderDashboardSchedule(){
  const previewDay = state.dashSchedulePreview === "tomorrow" ? 1 : 0;
  let html = `<div class="dash-card dash-schedule-card" id="dash-schedule-card">
    <div class="dash-card-head">
      <span class="section-title" style="margin-bottom:0;">🗓️ Mon emploi du temps</span>
      <div class="dash-schedule-nav">
        <button class="dash-schedule-navbtn ${previewDay===0?"active":""}" data-schedule-day="today">Aujourd'hui</button>
        <button class="dash-schedule-navbtn ${previewDay===1?"active":""}" data-schedule-day="tomorrow">Demain</button>
        <button class="dash-schedule-navbtn" id="dash-schedule-week">Semaine</button>
      </div>
    </div>`;

  if(state.planning.events.length === 0){
    html += `<p class="dash-empty">Aucun planning importé pour l'instant.</p>
      <button class="btn outline small" id="dash-schedule-setup" style="margin-top:6px;">Configurer mon planning</button></div>`;
    return html;
  }

  const targetDate = new Date(Date.now() + previewDay * 86400000);
  const todaysEvents = eventsOnDay(targetDate).slice().sort((a,b)=>a.start-b.start);
  const current = previewDay === 0 ? getCurrentCourse() : null;

  if(current){
    const cd = getCourseData(current.id);
    const total = (current.end || current.start) - current.start;
    const elapsed = Math.min(total, Math.max(0, Date.now() - current.start));
    const pct = total > 0 ? Math.round((elapsed / total) * 100) : 0;
    const remainMin = Math.max(0, Math.round(((current.end || current.start) - Date.now()) / 60000));
    html += `<div class="dash-current-course" data-open-event="${current.id}" tabindex="0" role="button" aria-label="${escapeHtml(current.summary)} — en cours">
      <span class="badge-current">🟢 En cours${cd.favorite ? " · ★" : ""}</span>
      <div class="ccourse-title">${escapeHtml(current.summary)}</div>
      <div class="ccourse-meta">${fmtEventTimeRange(current)}${current.location ? " · " + escapeHtml(current.location) : ""}</div>
      <div class="ccourse-progressbar" id="dash-ccourse-progress" data-ev-start="${current.start}" data-ev-end="${current.end || current.start}">
        <div class="ccourse-progressbar-fill" id="dash-ccourse-fill" style="width:${pct}%;"></div>
      </div>
      <div class="ccourse-remaining" id="dash-ccourse-text">${pct}% · ${remainMin >= 60 ? Math.round(remainMin/6)/10 + " h" : remainMin + " min"} restantes</div>
      <button class="btn red small" data-open-event-notes="${current.id}" style="margin-top:8px;">✏️ Prendre des notes</button>
    </div>`;
  }

  const others = todaysEvents.filter(e => !current || e.id !== current.id);
  if(others.length){
    html += `<div class="dash-schedule-list">` + others.map(e=>{
      const st = getCourseStatus(e);
      const stLabel = st === "past" ? "Terminé" : (st === "current" ? "En cours" : "À venir");
      return `<div class="dash-schedule-row status-${st}" data-open-event="${e.id}" tabindex="0" role="button" aria-label="${escapeHtml(e.summary)}">
        <span class="dash-schedule-time">${fmtEventTimeRange(e)}</span>
        <span class="dash-schedule-title">${escapeHtml(e.summary)}</span>
        <span class="dash-schedule-badge">${stLabel}</span>
      </div>`;
    }).join("") + `</div>`;
  } else if(!current){
    html += `<p class="dash-empty">Aucun cours ${previewDay === 0 ? "aujourd'hui" : "demain"}.</p>`;
  }

  html += `<button class="btn-text" id="dash-schedule-full" style="margin-top:10px;">Voir le planning complet →</button>`;
  html += `</div>`;
  return html;
}

/* Matières à mettre en avant sur le dashboard : les plus récemment consultées d'abord. */
function recentSubjectsPreview(limit){
  const seen = new Set();
  const result = [];
  (state.dash.recentChapters||[]).forEach(rc=>{
    const ch = findAnyChapter(rc.chapterId);
    const subj = ch ? subjectOfChapter(ch) : null;
    if(subj && !seen.has(subj.id)){ seen.add(subj.id); result.push(subj); }
  });
  allSubjects().forEach(s=>{ if(result.length < limit && !seen.has(s.id)){ seen.add(s.id); result.push(s); } });
  return result.slice(0, limit);
}

/* Fusionne sessions terminées + ajouts récents pour le fil d'activité du dashboard. */
function recentFeedItems(limit){
  const items = [];
  (state.dash.recentActivity||[]).forEach(a=>{
    const typeLbl = a.type === "exam" ? "Examen" : (a.type === "quiz" ? "Quiz" : "Flashcards");
    items.push({ ts: new Date(a.ts).getTime(), html: "Tu as terminé : <b>" + typeLbl + " — " + escapeHtml(a.label) + "</b> (" + a.pct + "%)" });
  });
  (state.dash.recentAdds||[]).forEach(a=>{
    items.push({ ts: a.ts, html: "Tu as ajouté : <b>" + escapeHtml(a.label) + "</b>" });
  });
  items.sort((x,y)=> y.ts - x.ts);
  return items.slice(0, limit).map(it => it.html);
}

/* ============================================================
   7quinto. MES MATIÈRES — bibliothèque de cours (nouveau)
   ============================================================ */
function libGoto(view, extra){
  state.library.view = view;
  if(extra) Object.assign(state.library, extra);
  render();
  window.scrollTo(0,0);
}

function libBreadcrumb(parts){
  // parts: [{label, view, extra} ...] — le dernier est toujours "courant" (non cliquable)
  let html = '<div class="breadcrumb">';
  parts.forEach((p,i)=>{
    if(i>0) html += '<span class="sep">›</span>';
    if(i === parts.length-1) html += `<span class="current">${escapeHtml(p.label)}</span>`;
    else html += `<button data-crumb="${i}">${escapeHtml(p.label)}</button>`;
  });
  html += '</div>';
  return {html, parts};
}
function attachBreadcrumbEvents(parts){
  document.querySelectorAll("[data-crumb]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const p = parts[parseInt(btn.dataset.crumb)];
      libGoto(p.view, p.extra);
    });
  });
}

function renderLibrary(){
  const lib = state.library;
  if(lib.view === "subjectForm") return renderSubjectForm();
  if(lib.view === "chapterForm") return renderChapterForm();
  if(lib.view === "chapterDetail") return renderChapterDetail();
  if(lib.view === "subjectDetail") return renderSubjectDetail();
  if(lib.view === "import") return renderCourseImportWizard();
  return renderSubjectsList();
}

function renderSubjectDetail(){

  html += `<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap;">
    <span class="icon subject-card" style="background:${s.color}22;">${s.icon||"📘"}</span>

    } else {
      html += `<div class="card" style="margin-bottom:20px;">
        <div class="dash-card-head"><span class="section-title" style="margin-bottom:0;">Fiche de cours</span>
          <button class="btn-text" id="lib-regen-fiche" >🔄 Régénérer</button></div>
        <div class="ai-result-body" style="white-space:pre-wrap;max-height:340px;overflow:auto;">${escapeHtml(ch.content)}</div>
      </div>`;

      if(ch.summary){
        html += `<div class="card" style="margin-bottom:20px;">
          <div class="dash-card-head"><span class="section-title" style="margin-bottom:0;">Résumé</span>
            <button class="btn-text" id="lib-regen-summary">🔄 Régénérer</button></div>
          <div class="ai-result-body" style="white-space:pre-wrap;">${escapeHtml(ch.summary)}</div>
        </div>`;
      }

      html += `<div class="ai-actiongrid" style="grid-template-columns:repeat(2,1fr);">
        <button class="ai-action" id="lib-ai-summary"><span class="ico">📖</span><span class="t">Résumer ce chapitre</span><span class="d">Fiche de révision générée par l'IA</span></button>
        <button class="ai-action" id="lib-ai-drill"><span class="ico">🎤</span><span class="t">Me faire réviser</span><span class="d">Interrogation orale par l'IA</span></button>
        <button class="ai-action" id="lib-ai-quiz"><span class="ico">🧠</span><span class="t">Générer un quiz</span><span class="d">${(ch.aiQuiz&&ch.aiQuiz.length) ? ch.aiQuiz.length+" questions déjà générées" : "QCM inédits sur ce chapitre"}</span></button>
        <button class="ai-action" id="lib-ai-cards"><span class="ico">🃏</span><span class="t">Générer des flashcards</span><span class="d">${(ch.aiFlashcards&&ch.aiFlashcards.length) ? ch.aiFlashcards.length+" cartes déjà générées" : "Cartes recto/verso sur ce chapitre"}</span></button>
      </div>`;

      if(ch.aiQuiz && ch.aiQuiz.length){
        html += `<button class="btn red small" id="lib-play-quiz" style="margin-top:14px;">▶️ Rejouer le quiz généré (${ch.aiQuiz.length} questions)</button>`;
      }
      if(ch.aiFlashcards && ch.aiFlashcards.length){
        html += `<button class="btn outline small" id="lib-play-flash" style="margin-top:14px;margin-left:10px;">🃏 Réviser les flashcards générées (${ch.aiFlashcards.length})</button>`;
      }
      html += `<div id="lib-ai-status"></div>`;

      if(ch.aiReviewQuestions && ch.aiReviewQuestions.length){
        html += `<div class="card" style="margin-top:20px;">
          <div class="dash-card-head"><span class="section-title" style="margin-bottom:0;">Questions de révision (${ch.aiReviewQuestions.length})</span>
            <button class="btn-text" id="lib-regen-reviewq">🔄 Régénérer</button></div>
          <div class="lib-reviewq-list">${ch.aiReviewQuestions.map((rq,i)=>`
            <details class="lib-reviewq-item"><summary>${i+1}. ${escapeHtml(rq.q)}</summary><div class="a">${escapeHtml(rq.a)}</div></details>`).join("")}</div>
        </div>`;
      }

      if(ch.aiFlashcards && ch.aiFlashcards.length){
        html += `<details class="ai-extra" style="margin-top:16px;">
          <summary>✏️ Modifier les flashcards (${ch.aiFlashcards.length})</summary>
          <div class="lib-editor-list">${ch.aiFlashcards.map((c,i)=>`
            <div class="lib-editor-item">
              <input class="ai-select" data-card-front="${i}" value="${escapeHtml(c.front)}" placeholder="Question">
              <input class="ai-select" data-card-back="${i}" value="${escapeHtml(c.back)}" placeholder="Réponse">
              <div class="lib-editor-item-actions">
                <button class="btn-text" data-card-save="${i}">Enregistrer</button>
                <button class="btn-text" data-card-delete="${i}" style="color:var(--red-dark);">Supprimer</button>
              </div>
            </div>`).join("")}</div>
          <div class="lib-editor-add">
            <input class="ai-select" id="lib-newcard-front" placeholder="Nouvelle question">
            <input class="ai-select" id="lib-newcard-back" placeholder="Nouvelle réponse">
            <button class="btn outline small" id="lib-newcard-add">+ Ajouter une carte</button>
          </div>
        </details>`;
      }

      if(ch.aiQuiz && ch.aiQuiz.length){
        html += `<details class="ai-extra" style="margin-top:10px;">
          <summary>✏️ Modifier les questions du quiz (${ch.aiQuiz.length})</summary>
          <div class="lib-editor-list">${ch.aiQuiz.map((q,i)=>`
            <div class="lib-editor-item">
              <input class="ai-select" data-q-text="${i}" value="${escapeHtml(q.q)}" placeholder="Question">
              ${q.opts.map((o,oi)=>`<div style="display:flex;gap:8px;align-items:center;">
                <input type="radio" name="lib-q-correct-${i}" data-q-correct="${i}" value="${oi}" ${q.correct===oi?"checked":""}>
                <input class="ai-select" data-q-opt="${i}-${oi}" value="${escapeHtml(o)}" style="flex:1;">
              </div>`).join("")}
              <input class="ai-select" data-q-exp="${i}" value="${escapeHtml(q.exp||"")}" placeholder="Explication (optionnel)">
              <div class="lib-editor-item-actions">
                <button class="btn-text" data-q-save="${i}">Enregistrer</button>
                <button class="btn-text" data-q-delete="${i}" style="color:var(--red-dark);">Supprimer</button>
              </div>
            </div>`).join("")}</div>
        </details>`;
      }
    }
  } else {
    // Chapitre intégré : on renvoie simplement vers les outils déjà existants, avec le contexte pré-rempli.
    html += `<div class="mode-grid">
      <button class="mode-card" id="lib-goto-fiche"><div class="mc-top"><span class="mc-title">📖 Voir la fiche</span></div><span class="mc-desc">Fiche de révision complète du chapitre.</span></button>
      <button class="mode-card" id="lib-goto-quiz"><div class="mc-top"><span class="mc-title">🧠 Lancer le quiz</span></div><span class="mc-desc">Toutes les questions du chapitre.</span></button>
      <button class="mode-card" id="lib-goto-flash"><div class="mc-top"><span class="mc-title">🃏 Réviser les flashcards</span></div><span class="mc-desc">Le paquet complet du chapitre.</span></button>
      <button class="mode-card" id="lib-goto-ai"><div class="mc-top"><span class="mc-title">🤖 Assistant IA</span></div><span class="mc-desc">Résumé, interrogation ou question libre.</span></button>
    </div>`;
    if(FICHES[ch.id]){
      html += `<div class="card" id="chapterdetail-fiche" style="margin-top:20px;">
        <div class="section-title">Fiche de cours</div>
        ${FICHES[ch.id]}
      </div>`;
    }
  }

  return html;
}

function statusTierGeneric(pct){
  if(pct === null || pct === undefined) return {key:"none", label:"Non commencé", pct:0};
  if(pct >= 75) return {key:"done", label:"Terminé", pct};
  return {key:"progress", label:"En cours", pct};
}

    <div class="ai-field"><label for="sf-name">Nom de la matière</label>

function attachLibraryEvents(){
  const lib = state.library;

  if(lib.view === "subjects"){
    const addBtn = document.getElementById("lib-add-subject-btn");
    if(addBtn) addBtn.addEventListener("click", ()=> libGoto("subjectForm", {editingSubjectId:null}));
    const importBtn = document.getElementById("lib-import-course-btn");
    if(importBtn) importBtn.addEventListener("click", ()=> goToCourseImport());
    document.querySelectorAll("[data-open-subject]").forEach(el=>{
      el.addEventListener("click", ()=> libGoto("subjectDetail", {subjectId: el.dataset.openSubject}));
    });
  }

  if(lib.view === "subjectDetail"){
    attachBreadcrumbEvents(libBreadcrumb([{label:"x",view:"subjects"},{label:"y"}]).parts); // no-op fallback
    document.querySelectorAll("[data-crumb]").forEach(btn=>{}); // handled below with real parts
    // ré-attache proprement via les vraies parts (on reconstruit car renderSubjectDetail a ses propres crumbs)
    const s = findSubject(lib.subjectId);
    const parts = [{label:"Mes matières", view:"subjects"}, {label: s?s.name:""}];
    document.querySelectorAll("[data-crumb]").forEach(btn=>{
      btn.addEventListener("click", ()=> libGoto(parts[parseInt(btn.dataset.crumb)].view));
    });
    const addCh = document.getElementById("lib-add-chapter-btn");
    if(addCh) addCh.addEventListener("click", ()=> libGoto("chapterForm", {editingChapterId:null}));
    const editS = document.getElementById("lib-edit-subject-btn");
    if(editS) editS.addEventListener("click", ()=> libGoto("subjectForm", {editingSubjectId: lib.subjectId}));
    const delS = document.getElementById("lib-delete-subject-btn");
    if(delS) delS.addEventListener("click", ()=>{
      const chs = chaptersOfSubject(lib.subjectId);
      if(!confirm("Supprimer cette matière" + (chs.length? " et ses "+chs.length+" chapitre(s)" : "") + " ? Cette action est définitive.")) return;
      state.userSubjects = state.userSubjects.filter(x=>x.id!==lib.subjectId);
      state.userChapters = state.userChapters.filter(x=>x.subjectId!==lib.subjectId);
      saveUserSubjects(); saveUserChapters();
      libGoto("subjects");
    });
    document.querySelectorAll("[data-open-chapter]").forEach(el=>{
      el.addEventListener("click", ()=> libGoto("chapterDetail", {chapterId: el.dataset.openChapter}));
    });
  }

  if(lib.view === "chapterDetail"){
    const ch = findAnyChapter(lib.chapterId);
    const s = subjectOfChapter(ch);
    const parts = [{label:"Mes matières", view:"subjects"}, {label: s?s.name:"", view:"subjectDetail", extra:{subjectId: ch?ch.subjectId:null}}, {label: ch?ch.title:""}];
    document.querySelectorAll("[data-crumb]").forEach(btn=>{
      const p = parts[parseInt(btn.dataset.crumb)];
      btn.addEventListener("click", ()=> libGoto(p.view, p.extra));
    });

    if(ch && isUserChapter(ch.id)){
      const editBtn = document.getElementById("lib-edit-chapter-btn");
      if(editBtn) editBtn.addEventListener("click", ()=> libGoto("chapterForm", {subjectId: ch.subjectId, editingChapterId: ch.id}));
      const delBtn = document.getElementById("lib-delete-chapter-btn");
      if(delBtn) delBtn.addEventListener("click", ()=>{
        if(!confirm("Supprimer ce chapitre ? Cette action est définitive.")) return;
        const subjId = ch.subjectId;
        if(ch.hasOriginalFile) deleteCourseFileBlob(ch.id).catch(()=>{});
        state.userChapters = state.userChapters.filter(c=>c.id!==ch.id);
        saveUserChapters();
        libGoto("subjectDetail", {subjectId: subjId});
      });
      const sumBtn = document.getElementById("lib-ai-summary");
      if(sumBtn) sumBtn.addEventListener("click", ()=> libRunUserChapterAI(ch, "summary"));
      const drillBtn = document.getElementById("lib-ai-drill");
      if(drillBtn) drillBtn.addEventListener("click", ()=> libRunUserChapterAI(ch, "drill"));
      const quizBtn = document.getElementById("lib-ai-quiz");
      if(quizBtn) quizBtn.addEventListener("click", ()=> libGenerateUserChapterQuiz(ch));
      const cardsBtn = document.getElementById("lib-ai-cards");
      if(cardsBtn) cardsBtn.addEventListener("click", ()=> libGenerateUserChapterCards(ch));
      const playQuizBtn = document.getElementById("lib-play-quiz");
      if(playQuizBtn) playQuizBtn.addEventListener("click", ()=> startQuiz("chapter:"+ch.id, ch.title, null, ch.aiQuiz.slice()));
      const playFlashBtn = document.getElementById("lib-play-flash");
      if(playFlashBtn) playFlashBtn.addEventListener("click", ()=> startFlashDeck(ch.id, ch.title, ch.aiFlashcards.slice()));

      const markReviewedBtn = document.getElementById("lib-mark-reviewed-btn");
      if(markReviewedBtn) markReviewedBtn.addEventListener("click", ()=>{
        ch.markedReviewed = !ch.markedReviewed;
        saveUserChapters();
        render();
      });
      const openPdfBtn = document.getElementById("lib-open-pdf-btn");
      if(openPdfBtn) openPdfBtn.addEventListener("click", async ()=>{
        openPdfBtn.disabled = true;
        try{
          const blob = await getCourseFileBlob(ch.id);
          if(!blob){ alert("Le PDF original n'est plus disponible dans ce navigateur."); return; }
          const url = URL.createObjectURL(blob);
          window.open(url, "_blank", "noopener");
          setTimeout(()=> URL.revokeObjectURL(url), 60000);
        }catch(e){
          alert("Impossible d'ouvrir le PDF (" + (e.message||"erreur") + ").");
        }finally{
          openPdfBtn.disabled = false;
        }
      });
      const downloadPdfBtn = document.getElementById("lib-download-pdf-btn");
      if(downloadPdfBtn) downloadPdfBtn.addEventListener("click", async ()=>{
        try{
          const blob = await getCourseFileBlob(ch.id);
          if(!blob){ alert("Le PDF original n'est plus disponible dans ce navigateur."); return; }
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = ch.originalFileName || (ch.title + ".pdf");
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(()=> URL.revokeObjectURL(url), 60000);
        }catch(e){
          alert("Impossible de télécharger le PDF (" + (e.message||"erreur") + ").");
        }
      });
      const regenFiche = document.getElementById("lib-regen-fiche");
      if(regenFiche) regenFiche.addEventListener("click", ()=> libRegeneratePart(ch, "fiche"));
      const regenSummary = document.getElementById("lib-regen-summary");
      if(regenSummary) regenSummary.addEventListener("click", ()=> libRegeneratePart(ch, "summary"));
      const regenReviewQ = document.getElementById("lib-regen-reviewq");
      if(regenReviewQ) regenReviewQ.addEventListener("click", ()=> libRegeneratePart(ch, "reviewQuestions"));

      /* ---- édition des flashcards ---- */
      document.querySelectorAll("[data-card-save]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const i = parseInt(btn.dataset.cardSave);
          const front = document.querySelector(`[data-card-front="${i}"]`).value;
          const back = document.querySelector(`[data-card-back="${i}"]`).value;
          if(!front.trim() || !back.trim()){ alert("La question et la réponse sont obligatoires."); return; }
          libUpdateFlashcard(ch, i, front, back);
          render();
        });
      });
      document.querySelectorAll("[data-card-delete]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          if(!confirm("Supprimer cette flashcard ?")) return;
          libDeleteFlashcard(ch, parseInt(btn.dataset.cardDelete));
          render();
        });
      });
      const newCardAdd = document.getElementById("lib-newcard-add");
      if(newCardAdd) newCardAdd.addEventListener("click", ()=>{
        const front = document.getElementById("lib-newcard-front").value;
        const back = document.getElementById("lib-newcard-back").value;
        if(!front.trim() || !back.trim()){ alert("La question et la réponse sont obligatoires."); return; }
        libAddFlashcard(ch, front, back);
        render();
      });

      /* ---- édition des questions du quiz ---- */
      document.querySelectorAll("[data-q-save]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const i = parseInt(btn.dataset.qSave);
          const q = document.querySelector(`[data-q-text="${i}"]`).value;
          const opts = Array.from(document.querySelectorAll(`[data-q-opt^="${i}-"]`)).map(inp=>inp.value);
          const correctInput = document.querySelector(`input[name="lib-q-correct-${i}"]:checked`);
          const correct = correctInput ? parseInt(correctInput.value) : 0;
          const exp = document.querySelector(`[data-q-exp="${i}"]`).value;
          if(!q.trim() || opts.some(o=>!o.trim())){ alert("La question et toutes les options sont obligatoires."); return; }
          libUpdateQuizQuestion(ch, i, q, opts, correct, exp);
          render();
        });
      });
      document.querySelectorAll("[data-q-delete]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          if(!confirm("Supprimer cette question ?")) return;
          libDeleteQuizQuestion(ch, parseInt(btn.dataset.qDelete));
          render();
        });
      });
    } else if(ch){
      const gf = document.getElementById("lib-goto-fiche");
      if(gf) gf.addEventListener("click", ()=>{
        const el = document.getElementById("chapterdetail-fiche");
        if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
      });
      const gq = document.getElementById("lib-goto-quiz");
      if(gq) gq.addEventListener("click", ()=> startQuiz("chapter:"+ch.id, ch.title, ch.themes));
      const gfl = document.getElementById("lib-goto-flash");
      if(gfl) gfl.addEventListener("click", ()=> startFlashDeck(ch.id, ch.num+" · "+ch.title, deckCards(ch.id)));
      const ga = document.getElementById("lib-goto-ai");
      if(ga) ga.addEventListener("click", ()=> aiOpenFromChapter("summary", ch.id));
    }
  }

  if(lib.view === "subjectForm"){
    document.querySelectorAll("#sf-colors button").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        document.querySelectorAll("#sf-colors button").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("sf-color-val").value = btn.dataset.color;
      });
    });
    const cancel = document.getElementById("sf-cancel-btn");
    if(cancel) cancel.addEventListener("click", ()=> libGoto(lib.editingSubjectId ? "subjectDetail" : "subjects", {subjectId: lib.editingSubjectId}));
    const save = document.getElementById("sf-save-btn");
    if(save) save.addEventListener("click", ()=>{
      const name = document.getElementById("sf-name").value.trim();
      if(!name){ alert("Le nom de la matière est obligatoire."); return; }
      const semesterId = document.getElementById("sf-semester").value;
      const icon = document.getElementById("sf-icon").value.trim() || "📘";
      const color = document.getElementById("sf-color-val").value;
      const description = document.getElementById("sf-desc").value.trim();
      if(lib.editingSubjectId){
        const idx = state.userSubjects.findIndex(x=>x.id===lib.editingSubjectId);
        if(idx>-1){ state.userSubjects[idx] = Object.assign({}, state.userSubjects[idx], {name, semesterId, icon, color, description}); }
        saveUserSubjects();
        libGoto("subjectDetail", {subjectId: lib.editingSubjectId});
      } else {
        // empêche les doublons accidentels (nom identique dans le même semestre)
        const dup = allSubjects().some(s => s.semesterId===semesterId && s.name.toLowerCase()===name.toLowerCase());
        if(dup && !confirm("Une matière portant ce nom existe déjà dans ce semestre. Créer quand même ?")) return;
        const id = genLibId("subj");
        state.userSubjects.push({id, name, semesterId, icon, color, description, builtin:false});
        saveUserSubjects();
        logRecentAdd("Nouvelle matière — " + name);
        libGoto("subjectDetail", {subjectId:id});
      }
    });
  }

  if(lib.view === "chapterForm"){
    const cancel = document.getElementById("cf-cancel-btn");
    if(cancel) cancel.addEventListener("click", ()=> libGoto(lib.editingChapterId ? "chapterDetail" : "subjectDetail", {chapterId: lib.editingChapterId, subjectId: lib.subjectId}));
    const save = document.getElementById("cf-save-btn");
    if(save) save.addEventListener("click", ()=>{
      const title = document.getElementById("cf-title").value.trim();
      if(!title){ alert("Le titre du chapitre est obligatoire."); return; }
      const num = document.getElementById("cf-num").value.trim();
      const desc = document.getElementById("cf-desc").value.trim();
      const content = document.getElementById("cf-content").value;
      if(lib.editingChapterId){
        const idx = state.userChapters.findIndex(x=>x.id===lib.editingChapterId);
        if(idx>-1){ state.userChapters[idx] = Object.assign({}, state.userChapters[idx], {title, num, desc, content}); }
        saveUserChapters();
        libGoto("chapterDetail", {chapterId: lib.editingChapterId});
      } else {
        const id = genLibId("chap");
        state.userChapters.push({id, subjectId: lib.subjectId, num, title, desc, content, aiQuiz:[], aiFlashcards:[]});
        saveUserChapters();
        logRecentAdd("Nouveau chapitre — " + title);
        libGoto("chapterDetail", {chapterId:id});
      }
    });
  }

  if(lib.view === "import") attachCourseImportEvents();
}

/* ---------- Actions IA pour un chapitre créé par l'utilisateur ----------
   Réutilise intégralement le moteur WebLLM déjà en place (webllmChat /
   webllmJsonChat), sans dupliquer de logique. */
function libChapterContext(ch){
  return clip("CHAPITRE : " + ch.title + (ch.desc ? " — " + ch.desc : "") + "\n\nCONTENU DU COURS :\n" + (ch.content || ""));
}

async function libRunUserChapterAI(ch, mode){
  state.aiChapter = null;
  state.aiAction = "course";
  if(!AI_ACTIONS.course) AI_ACTIONS.course = {icon:"📚", label:"Chapitre de ma bibliothèque", needs:"none", desc:""};
  state.aiMode = "text";
  state.aiThread = [];
  state.aiCardsDraft = null; state.aiQuizDraft = null; state.aiError = null;
  const ctx = libChapterContext(ch);
  const task = mode === "summary"
    ? "TÂCHE : rédige une synthèse de révision de ce chapitre (définitions clés, points essentiels en listes, puis 3 pièges classiques)."
    : "TÂCHE : fais réviser l'étudiant à l'oral sur ce chapitre. Pose UNE SEULE question ouverte à la fois, attends sa réponse, puis corrige brièvement avant d'enchaîner. Commence directement par la première question.";
  state.aiThread = [{role:"user", content: AI_SYSTEM + "\n\n" + ctx + "\n\n" + task, display: (mode==="summary"?"📖 Résumer — ":"🎤 Réviser — ") + ch.title}];
  state.aiContextLabel = "Contexte : chapitre « " + ch.title + "» (Ma bibliothèque)";
  state.tab = "ai";
  window.scrollTo(0,0);
  await aiSend();
}

/* Ouvre l'assistant IA sur ce chapitre, prêt à recevoir une question libre de l'élève
   (utilisé par le bouton "Poser une question à l'IA" après un import de cours). */
async function libRunUserChapterFree(ch){
  state.aiChapter = null;
  state.aiAction = "course";
  if(!AI_ACTIONS.course) AI_ACTIONS.course = {icon:"📚", label:"Chapitre de ma bibliothèque", needs:"none", desc:""};

  state.aiCardsDraft = null; state.aiQuizDraft = null; state.aiError = null;

async function libGenerateUserChapterQuiz(ch){
  const statusEl = () => document.getElementById("lib-ai-status");
  if(state.aiStatus !== "ready"){
    if(statusEl()) statusEl().innerHTML = `<div class="ai-error">L'assistant IA n'est pas chargé. Va dans l'onglet 🤖 Assistant IA pour le charger, puis reviens ici.</div>`;
    return;
  }
  if(!ch.content || !ch.content.trim()){
    if(statusEl()) statusEl().innerHTML = `<div class="ai-error">Ajoute du contenu à ce chapitre avant de générer un quiz.</div>`;
    return;
  }
  if(statusEl()) statusEl().innerHTML = `<div class="ai-loading"><span class="ai-spinner"></span>Génération du quiz…</div>`;
  const prompt = AI_SYSTEM + "\n\n" + libChapterContext(ch) +
    "\n\nTÂCHE : génère 6 questions à choix multiples inédites sur ce contenu, 4 options chacune, une seule bonne réponse. Réponds UNIQUEMENT par un tableau JSON : [{\"q\":\"...\",\"opts\":[\"a\",\"b\",\"c\",\"d\"],\"correct\":0,\"exp\":\"...\"}]";
  try{
    const arr = await webllmJsonChat([{role:"user", content: prompt}], {});
    const quiz = (arr||[]).filter(q=>q&&q.q&&Array.isArray(q.opts)&&q.opts.length>=2&&typeof q.correct==="number")
      .map((q,i)=>({ uid:"lib-"+ch.id+"-"+Date.now()+"-"+i, ai:true, theme:"ai", q:String(q.q), opts:q.opts.slice(0,4).map(String), correct:Math.max(0,Math.min(q.opts.length-1,q.correct)), exp:q.exp?String(q.exp):"" }));
    if(quiz.length === 0) throw new Error("format inattendu");
    ch.aiQuiz = quiz;
    saveUserChapters();
    render();
    startQuiz("chapter:"+ch.id, ch.title, null, quiz);
  }catch(e){
    if(statusEl()) statusEl().innerHTML = `<div class="ai-error">Échec de la génération du quiz (${escapeHtml(e.message||"erreur")}). Réessaie.</div>`;
  }
}

async function libGenerateUserChapterCards(ch){
  const statusEl = () => document.getElementById("lib-ai-status");
  if(state.aiStatus !== "ready"){
    if(statusEl()) statusEl().innerHTML = `<div class="ai-error">L'assistant IA n'est pas chargé. Va dans l'onglet 🤖 Assistant IA pour le charger, puis reviens ici.</div>`;
    return;
  }
  if(!ch.content || !ch.content.trim()){
    if(statusEl()) statusEl().innerHTML = `<div class="ai-error">Ajoute du contenu à ce chapitre avant de générer des flashcards.</div>`;
    return;
  }
  if(statusEl()) statusEl().innerHTML = `<div class="ai-loading"><span class="ai-spinner"></span>Génération des flashcards…</div>`;
  const prompt = AI_SYSTEM + "\n\n" + libChapterContext(ch) +
    "\n\nTÂCHE : génère 10 flashcards de révision sur ce contenu. Réponds UNIQUEMENT par un tableau JSON : [{\"front\":\"...\",\"back\":\"...\"}]";
  try{
    const arr = await webllmJsonChat([{role:"user", content: prompt}], {});
    const cards = (arr||[]).filter(c=>c&&c.front&&c.back).map(c=>({front:String(c.front), back:String(c.back), ai:true}));
    if(cards.length === 0) throw new Error("format inattendu");
    ch.aiFlashcards = cards;
    saveUserChapters();
    render();
    startFlashDeck(ch.id, ch.title, cards);
  }catch(e){
    if(statusEl()) statusEl().innerHTML = `<div class="ai-error">Échec de la génération des flashcards (${escapeHtml(e.message||"erreur")}). Réessaie.</div>`;
  }

/* ---------- édition manuelle des flashcards / questions générées ---------- */
function libUpdateFlashcard(ch, idx, front, back){
  if(!ch.aiFlashcards || !ch.aiFlashcards[idx]) return;
  ch.aiFlashcards[idx] = {front, back, ai: ch.aiFlashcards[idx].ai};
  saveUserChapters();
}
function libDeleteFlashcard(ch, idx){
  if(!ch.aiFlashcards) return;
  ch.aiFlashcards.splice(idx, 1);
  saveUserChapters();
}
function libAddFlashcard(ch, front, back){
  if(!front.trim() || !back.trim()) return;
  ch.aiFlashcards = ch.aiFlashcards || [];
  ch.aiFlashcards.push({front: front.trim(), back: back.trim(), ai: false});
  saveUserChapters();
}
function libUpdateQuizQuestion(ch, idx, q, opts, correct, exp){
  if(!ch.aiQuiz || !ch.aiQuiz[idx]) return;
  ch.aiQuiz[idx] = Object.assign({}, ch.aiQuiz[idx], {q, opts, correct, exp});
  saveUserChapters();
}
function libDeleteQuizQuestion(ch, idx){
  if(!ch.aiQuiz) return;
  ch.aiQuiz.splice(idx, 1);
  saveUserChapters();
}
function libAddQuizQuestion(ch, q, opts, correct, exp){
  if(!q.trim() || opts.some(o=>!o.trim())) return;
  ch.aiQuiz = ch.aiQuiz || [];
  ch.aiQuiz.push({uid:"manual-"+Date.now(), ai:false, theme:"ai", q:q.trim(), opts:opts.map(o=>o.trim()), correct, exp:exp.trim()});
  saveUserChapters();
}

/* ---- régénération indépendante d'un support (fiche / résumé / quiz / flashcards / questions) ----
   Repart du texte source d'origine si disponible (chapitre importé), sinon du contenu actuel
   (chapitre créé/édité à la main) — jamais d'un support déjà régénéré, pour éviter l'effet de dérive. */
function libChapterWorkingText(ch){ return (ch.originalText || ch.content || "").trim(); }
function libChapterMeta(ch){ return { title: ch.title, chapterTitle: ch.desc || "", notions: ch.keyNotions || [] }; }

async function libRegeneratePart(ch, key){
  const statusEl = () => document.getElementById("lib-ai-status");
  const setStatus = (html) => { const el = statusEl(); if(el) el.innerHTML = html; };
  if(state.aiStatus !== "ready"){
    setStatus(`<div class="ai-error">L'assistant IA n'est pas chargé. Va dans l'onglet 🤖 Assistant IA pour le charger, puis reviens ici.</div>`);
    return;
  }
  const text = libChapterWorkingText(ch);
  if(!text){
    setStatus(`<div class="ai-error">Ce chapitre n'a pas de contenu source à partir duquel régénérer.</div>`);
    return;
  }
  const labels = {fiche:"la fiche", summary:"le résumé", quiz:"le quiz", flashcards:"les flashcards", reviewQuestions:"les questions de révision"};
  const fns = { fiche: generateCourseFiche, summary: generateCourseSummary, quiz: generateCourseQuizFromText, flashcards: generateCourseFlashcardsFromText, reviewQuestions: generateCourseReviewQuestions };
  setStatus(`<div class="ai-loading"><span class="ai-spinner"></span>Régénération de ${labels[key]}…</div>`);
  try{
    const result = await fns[key](text, libChapterMeta(ch));
    if(key === "fiche") ch.content = result;
    else if(key === "summary") ch.summary = result;
    else if(key === "quiz") ch.aiQuiz = result;
    else if(key === "flashcards") ch.aiFlashcards = result;
    else if(key === "reviewQuestions") ch.aiReviewQuestions = result;
    ch.updatedAt = Date.now();
    saveUserChapters();
    render();
  }catch(e){
    setStatus(`<div class="ai-error">Échec de la régénération de ${labels[key]} (${escapeHtml(e.message||"erreur")}). Réessaie.</div>`);
  }
}

/* ============================================================
   7ter. IMPORTATION DE COURS
   Un fichier (ou du texte collé) → une fiche structurée, un résumé, un quiz,
   des flashcards et des questions de révision, générés automatiquement.
   Réutilise entièrement WebLLM (aiLoadModel / webllmChat / webllmJsonChat,
   verrouillé par aiEngineBusy()) et le système de matières/chapitres déjà en
   place : un cours importé devient un chapitre utilisateur normal
   (state.userChapters), avec les mêmes actions IA que celles déjà
   disponibles (libGenerateUserChapterQuiz / libGenerateUserChapterCards /
   libRunUserChapterAI) pour la régénération individuelle.
   ============================================================ */
const COURSE_IMPORT_MAX_BYTES = 15 * 1024 * 1024; // ~15 Mo par fichier
const COURSE_IMPORT_MIN_CHARS = 40;               // en dessous : considéré vide/illisible
const COURSE_CHUNK_CHARS = 5000;
const COURSE_CONDENSE_THRESHOLD = 9000;

/* ---- fichiers PDF originaux : trop volumineux pour localStorage, stockés dans IndexedDB,
   indexés par l'identifiant du chapitre (les métadonnées légères restent dans le chapitre
   lui-même, sauvegardé normalement via localStorage). ---- */
const COURSE_FILES_DB_NAME = "em-lyon-revision-files";
const COURSE_FILES_STORE = "pdfs";
let courseFilesDBPromise = null;
function openCourseFilesDB(){
  if(!window.indexedDB) return Promise.reject(new Error("IndexedDB non disponible sur ce navigateur."));
  if(!courseFilesDBPromise){
    courseFilesDBPromise = new Promise((resolve, reject)=>{
      const req = indexedDB.open(COURSE_FILES_DB_NAME, 1);
      req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains(COURSE_FILES_STORE)) req.result.createObjectStore(COURSE_FILES_STORE); };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error || new Error("Impossible d'ouvrir le stockage local des fichiers."));
    });
  }
  return courseFilesDBPromise;
}
async function saveCourseFileBlob(chapterId, blob){
  const db = await openCourseFilesDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(COURSE_FILES_STORE, "readwrite");
    tx.objectStore(COURSE_FILES_STORE).put(blob, chapterId);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function getCourseFileBlob(chapterId){
  const db = await openCourseFilesDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(COURSE_FILES_STORE, "readonly");
    const req = tx.objectStore(COURSE_FILES_STORE).get(chapterId);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = ()=> reject(req.error);
  });
}
async function deleteCourseFileBlob(chapterId){
  const db = await openCourseFilesDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(COURSE_FILES_STORE, "readwrite");
    tx.objectStore(COURSE_FILES_STORE).delete(chapterId);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}

/* ---- extraction de texte par format ---- */
let pdfjsModulePromise = null;
function loadPdfJsModule(){
  if(!pdfjsModulePromise){
    pdfjsModulePromise = import("https://esm.run/pdfjs-dist@4.0.379/build/pdf.min.mjs").then(mod=>{
      mod.GlobalWorkerOptions.workerSrc = "https://esm.run/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs";
      return mod;
    });
  }
  return pdfjsModulePromise;
}
async function extractPdfText(file, onProgress){
  let pdfjs;
  try{ pdfjs = await loadPdfJsModule(); }
  catch(e){ throw new Error("Impossible de charger le lecteur PDF (connexion internet nécessaire au premier import). Colle le texte de ton cours à la place."); }
  const buf = await file.arrayBuffer();
  const doc = await pdfjs.getDocument({data: buf}).promise;
  const numPages = doc.numPages;
  const maxPages = Math.min(numPages, 100);
  let text = "";
  for(let i=1; i<=maxPages; i++){
    if(onProgress) onProgress(i, maxPages);
    const page = await doc.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(" ") + "\n\n";
  }
  const trimmed = text.trim();
  return {
    text: trimmed,
    truncated: numPages > maxPages,
    numPages,
    isScanned: trimmed.length < 20, // quasiment aucun texte détecté → probablement des pages scannées (images)
  };
}

let mammothModulePromise = null;
function loadMammothModule(){
  if(!mammothModulePromise) mammothModulePromise = import("https://esm.run/mammoth");
  return mammothModulePromise;
}
async function extractDocxText(file){
  let mammoth;
  try{ mammoth = await loadMammothModule(); }
  catch(e){ throw new Error("Impossible de charger le lecteur DOCX (connexion internet nécessaire au premier import). Colle le texte de ton cours à la place."); }
  const buf = await file.arrayBuffer();
  const api = mammoth.extractRawText ? mammoth : mammoth.default;
  const result = await api.extractRawText({arrayBuffer: buf});
  return { text: (result.value || "").trim(), truncated: false, numPages: null, isScanned: false };
}

function courseFileKind(file){
  const name = file.name.toLowerCase();
  if(name.endsWith(".txt")) return "text";
  if(name.endsWith(".md") || name.endsWith(".markdown")) return "text";
  if(name.endsWith(".pdf")) return "pdf";
  if(name.endsWith(".docx")) return "docx";
  return null;
}

async function extractCourseFileText(file, onProgress){
  if(file.size > COURSE_IMPORT_MAX_BYTES){
    throw new Error("« " + file.name + " » est trop volumineux (limite ~15 Mo).");
  }
  const kind = courseFileKind(file);
  if(!kind){
    throw new Error("Format non pris en charge pour « " + file.name + " ». Formats acceptés : PDF, DOCX, TXT, Markdown. (PPTX et les images/OCR ne sont pas encore pris en charge — colle le texte directement à la place.)");
  }
  if(kind === "text") return { text: (await readFileAsText(file)).trim(), truncated: false, numPages: null, isScanned: false };
  if(kind === "pdf") return extractPdfText(file, onProgress);
  return extractDocxText(file);
}

/* ---- découpage + condensation pour les cours très longs ---- */
function chunkCourseText(text, size){
  size = size || COURSE_CHUNK_CHARS;
  const paras = text.split(/\n{2,}/);
  const chunks = [];
  let cur = "";
  paras.forEach(p=>{
    if(cur && (cur + "\n\n" + p).length > size){ chunks.push(cur); cur = p; }
    else cur = cur ? cur + "\n\n" + p : p;
    while(cur.length > size * 1.4){ chunks.push(cur.slice(0, size)); cur = cur.slice(size); }
  });
  if(cur) chunks.push(cur);
  return chunks;
}

async function condenseCourseChunk(chunkText, index, total){
  const prompt = AI_SYSTEM + "\n\nEXTRAIT " + (index+1) + "/" + total + " D'UN COURS :\n" + chunkText +
    "\n\nTÂCHE : condense cet extrait en une liste dense de points (définitions, faits, formules, exemples, dates, auteurs), sans rien inventer ni interpréter. Conserve le vocabulaire exact du cours. Réponds uniquement par la liste condensée, sans commentaire autour.";
  const res = await webllmChat([{role:"user", content: prompt}], {});
  return (res && res.text) ? res.text.trim() : "";
}

/* Pour un cours très long : condense chaque section avant de l'utiliser comme source pour
   le reste du pipeline, pour rester dans la capacité du modèle sans perdre d'information. */
async function buildWorkingCourseText(rawText, onProgress){
  const trimmed = rawText.trim();
  if(trimmed.length <= COURSE_CONDENSE_THRESHOLD) return { text: trimmed, wasCondensed: false, chunkCount: 1 };
  const chunks = chunkCourseText(trimmed);
  const digests = [];
  for(let i=0; i<chunks.length; i++){
    if(onProgress) onProgress(i, chunks.length);
    const digest = await condenseCourseChunk(chunks[i], i, chunks.length);
    if(digest) digests.push(digest);
  }
  return { text: clip(digests.join("\n\n"), 12000), wasCondensed: true, chunkCount: chunks.length };
}

/* ---- détection matière / titre / notions ---- */
function matchSubjectByName(name){
  if(!name) return null;
  const n = name.toLowerCase().trim();
  return allSubjects().find(s=>{
    const sn = s.name.toLowerCase();
    return sn === n || sn.includes(n) || n.includes(sn);
  }) || null;
}

/* Tente de récupérer un objet JSON même si la réponse du modèle contient du texte
   autour, des virgules en trop, etc. — ne jamais faire échouer toute l'importation
   pour un JSON imparfait : chaque champ a un repli sûr côté appelant. */
function extractJsonObject(text){
  const match = String(text || "").match(/\{[\s\S]*\}/);
  if(!match) return null;
  try{ return JSON.parse(match[0]); }
  catch(e){
    try{ return JSON.parse(match[0].replace(/,\s*([}\]])/g, "$1")); } // virgules traînantes
    catch(e2){ return null; }
  }
}

async function detectCourseMeta(workingText, fileName){
  const existingSubjects = allSubjects().map(s=>s.name).join(", ");
  const prompt = AI_SYSTEM + "\n\nDébut du cours (extrait) :\n" + clip(workingText, 3000) +
    "\n\nMatières déjà existantes sur ce site : " + (existingSubjects || "(aucune)") +
    "\n\nTÂCHE : à partir de cet extrait, déduis un titre court, la matière scolaire la plus probable (réutilise une matière existante ci-dessus si elle correspond, sinon choisis parmi : Mathématiques, SES, Physique-Chimie, Histoire-Géographie, Philosophie, Anglais, Français, Enseignement scientifique, Management, Économie, Autre), un titre de chapitre, un niveau probable (L1, L2 ou L3 — ou une chaîne vide si tu ne peux pas le déterminer), et une liste de 4 à 10 notions importantes réellement présentes dans le texte. Réponds UNIQUEMENT par un objet JSON (pas de tableau), au format : {\"title\":\"...\",\"subject\":\"...\",\"chapter\":\"...\",\"level\":\"...\",\"notions\":[\"...\"]}";
  const res = await webllmChat([{role:"user", content: prompt}], {});
  const parsed = extractJsonObject(res && res.text);
  const fallbackTitle = (fileName || "").replace(/\.[a-z0-9]+$/i, "").replace(/[_-]+/g, " ").trim();
  return {
    title: (parsed && parsed.title) ? String(parsed.title).slice(0,120) : (fallbackTitle || "Cours importé"),
    subjectName: (parsed && parsed.subject) ? String(parsed.subject).slice(0,60) : "",
    chapterTitle: (parsed && parsed.chapter) ? String(parsed.chapter).slice(0,120) : (fallbackTitle || "Chapitre importé"),
    level: (parsed && LEVELS.includes(parsed.level)) ? parsed.level : "",
    notions: (parsed && Array.isArray(parsed.notions)) ? parsed.notions.slice(0,10).map(String) : [],
  };
}

/* ---- génération des supports à partir du texte de travail ---- */
function courseGenContext(workingText, meta){
  return clip(
    "TITRE DU COURS : " + meta.title +
    (meta.chapterTitle ? "\nCHAPITRE : " + meta.chapterTitle : "") +
    (meta.notions && meta.notions.length ? "\nNOTIONS DÉTECTÉES : " + meta.notions.join(", ") : "") +
    "\n\nCONTENU DU COURS :\n" + workingText,
    9000
  );
}

async function generateCourseFiche(workingText, meta){
  const prompt = AI_SYSTEM + "\n\n" + courseGenContext(workingText, meta) +
    "\n\nTÂCHE : rédige une fiche de cours structurée à partir UNIQUEMENT de ce contenu, sans rien inventer. Utilise ces sections, seulement celles que le contenu permet de remplir :\n## Grandes parties\n## Définitions importantes\n## Notions essentielles\n## Mécanismes / raisonnements\n## Exemples\n## Formules ou dates si présentes\n## Points à retenir\nSignale entre crochets [information manquante] si un passage du cours semblait incomplet ou illisible.";
  const res = await webllmChat([{role:"user", content: prompt}], {});
  const text = (res && res.text) ? res.text.trim() : "";
  if(!text) throw new Error("la fiche générée est vide");
  return text;
}

async function generateCourseSummary(workingText, meta){
  const prompt = AI_SYSTEM + "\n\n" + courseGenContext(workingText, meta) +
    "\n\nTÂCHE : rédige, sans rien inventer : 1) un résumé court (3 à 5 phrases) ; 2) une liste des idées essentielles (une ligne chacune). Commence par « Résumé court » puis « Idées essentielles ».";
  const res = await webllmChat([{role:"user", content: prompt}], {});
  const text = (res && res.text) ? res.text.trim() : "";
  if(!text) throw new Error("le résumé généré est vide");
  return text;
}

async function generateCourseQuizFromText(workingText, meta){
  const prompt = AI_SYSTEM + "\n\n" + courseGenContext(workingText, meta) +
    "\n\nTÂCHE : génère 8 questions à choix multiples sur ce contenu UNIQUEMENT (définition, compréhension, application), 4 options chacune, une seule bonne réponse. Réponds UNIQUEMENT par un tableau JSON : [{\"q\":\"...\",\"opts\":[\"a\",\"b\",\"c\",\"d\"],\"correct\":0,\"exp\":\"...\"}]";
  const arr = await webllmJsonChat([{role:"user", content: prompt}], {});
  const quiz = (arr||[]).filter(q=>q&&q.q&&Array.isArray(q.opts)&&q.opts.length>=2&&typeof q.correct==="number")
    .map((q,i)=>({ uid:"import-"+Date.now()+"-"+i, ai:true, theme:"ai", q:String(q.q), opts:q.opts.slice(0,4).map(String), correct:Math.max(0,Math.min(q.opts.length-1,q.correct)), exp:q.exp?String(q.exp):"" }));
  if(quiz.length === 0) throw new Error("aucune question générée (format inattendu)");
  return quiz;
}

async function generateCourseFlashcardsFromText(workingText, meta){
  const prompt = AI_SYSTEM + "\n\n" + courseGenContext(workingText, meta) +
    "\n\nTÂCHE : génère 10 flashcards de révision (définitions, notions, formules, auteurs, dates, mécanismes, distinctions importantes) à partir UNIQUEMENT de ce contenu. Réponds UNIQUEMENT par un tableau JSON : [{\"front\":\"...\",\"back\":\"...\"}]";
  const arr = await webllmJsonChat([{role:"user", content: prompt}], {});
  const cards = (arr||[]).filter(c=>c&&c.front&&c.back).map(c=>({front:String(c.front), back:String(c.back), ai:true}));
  if(cards.length === 0) throw new Error("aucune flashcard générée (format inattendu)");
  return cards;
}

async function generateCourseReviewQuestions(workingText, meta){
  const prompt = AI_SYSTEM + "\n\n" + courseGenContext(workingText, meta) +
    "\n\nTÂCHE : génère 6 questions de révision variées sur ce contenu (définition, compréhension, application, et une question plus difficile si le contenu le permet), avec leur réponse. Réponds UNIQUEMENT par un tableau JSON : [{\"q\":\"...\",\"a\":\"...\"}]";
  const arr = await webllmJsonChat([{role:"user", content: prompt}], {});
  const qs = (arr||[]).filter(q=>q&&q.q&&q.a).map(q=>({q:String(q.q), a:String(q.a)}));
  if(qs.length === 0) throw new Error("aucune question de révision générée (format inattendu)");
  return qs;
}

/* ---- orchestration : file d'import, un fichier à la fois ---- */
async function ensureImportAIReady(){
  if(state.aiStatus === "ready") return;
  if(state.aiStatus === "checking") throw new Error("Vérification de la compatibilité de ton appareil en cours, réessaie dans un instant.");
  if(state.aiStatus === "nogpu") throw new Error("L'assistant IA n'est pas disponible sur cet appareil (WebGPU requis). Tu peux quand même créer ta matière et coller ton cours à la main.");
  if(state.aiStatus === "loading") throw new Error("Le modèle est en cours de chargement, réessaie dans quelques secondes.");
  await aiLoadModel(state.aiModelId || pickModelForDevice());
  if(state.aiStatus !== "ready") throw new Error("Le chargement du modèle IA a échoué. Réessaie, ou charge-le depuis l'onglet Assistant IA.");
}

const COURSE_IMPORT_STEP_LABELS = ["Création de la fiche", "Création du résumé", "Création des quiz", "Création des flashcards", "Création des questions de révision"];

function courseImportStart(){
  const ci = state.courseImport;
  if(ci.files.length === 0) return;
  if(aiEngineBusy()) return;
  ci.step = "detect";
  ci.activeIndex = ci.files.findIndex(f => f.status === "pending");
  if(ci.activeIndex === -1) ci.activeIndex = 0;
  // Les étapes détection/génération/résultat ont besoin de plus de place : elles s'affichent
  // toujours dans la page dédiée "Mes matières", que l'import ait démarré depuis Ressources ou non.
  libGoto("import");
  switchTab("library");
  courseImportProcessFile(ci.activeIndex);
}

/* Extraction + détection pour UN fichier de la file — s'arrête sur l'écran de confirmation
   (statut "review"), ou avance automatiquement au fichier suivant en cas d'échec. */
async function courseImportProcessFile(index){
  const ci = state.courseImport;
  const item = ci.files[index];
  if(!item) return;
  ci.activeIndex = index;

  item.status = "extracting";
  render();
  let extracted;
  try{
    extracted = item.file ? await extractCourseFileText(item.file, (page, total)=>{
      item.warning = "Lecture du PDF : page " + page + "/" + total + "…";
      render();
    }) : { text: item.extractedText, truncated: false, numPages: null, isScanned: false };
  }catch(e){
    item.status = "error";
    item.error = e.message || "Erreur lors de la lecture du fichier.";
    render();
    courseImportAdvanceIfNeeded(index);
    return;
  }
  item.extractedText = extracted.text;
  item.charCount = extracted.text.length;
  item.numPages = extracted.numPages || null;
  item.warning = extracted.truncated ? "Document très long : seules les 100 premières pages ont été lues." : null;

  if(extracted.isScanned){
    item.status = "error";
    item.error = "Ce PDF ne contient pas de texte exploitable (probablement des pages scannées/images). L'OCR n'est pas disponible pour l'instant. Importe un PDF contenant du vrai texte, ou colle le contenu directement.";
    render();
    courseImportAdvanceIfNeeded(index);
    return;
  }
  if(item.extractedText.trim().length < COURSE_IMPORT_MIN_CHARS){
    item.status = "error";
    item.error = "Ce fichier semble vide ou illisible. Ajoute du contenu, ou colle le texte de ton cours directement.";
    render();
    courseImportAdvanceIfNeeded(index);
    return;
  }

  item.status = "detecting";
  ci.busy = true;
  render();
  try{
    await ensureImportAIReady();
    const built = await buildWorkingCourseText(item.extractedText, (i,total)=>{
      item.error = null;
      item.warning = "Cours long : analyse en cours (" + (i+1) + "/" + total + ")…";
      render();
    });
    item.workingText = built.text;
    item.warning = built.wasCondensed ? "Cours long : condensé automatiquement en " + built.chunkCount + " section(s) avant génération." : item.warning;
    const meta = await detectCourseMeta(built.text, item.name);
    const matched = matchSubjectByName(meta.subjectName);
    item.detected = {
      title: meta.title,
      subjectId: matched ? matched.id : null,
      newSubjectName: matched ? "" : (meta.subjectName || "Autre"),
      chapterTitle: meta.chapterTitle,
      level: meta.level,
      semesterId: SEMESTERS[0].id,
      notions: meta.notions,
    };
    item.status = "review";
  }catch(e){
    item.status = "error";
    item.error = e.message || "Erreur lors de l'analyse du cours.";
  }finally{
    ci.busy = false;
    render();
  }
}

function courseImportAdvanceIfNeeded(index){
  const ci = state.courseImport;
  const next = ci.files.findIndex((f,i) => i > index && f.status === "pending");
  if(next !== -1){ courseImportProcessFile(next); return; }
  if(ci.files.every(f => f.status === "error" || f.status === "done")) ci.step = "result";
  render();
}

/* Génère les 5 supports pour le fichier en confirmation, étape par étape — une étape en échec
   n'empêche pas les suivantes, et reste individuellement relançable (courseImportRetryStep). */
async function courseImportGenerate(index){
  const ci = state.courseImport;
  const item = ci.files[index];
  if(!item || item.status !== "review" || aiEngineBusy()) return;
  item.status = "generating";
  item.failedSteps = [];
  ci.busy = true;
  ci.step = "generating";
  render();
  await courseImportRunAllSteps(item);
  ci.busy = false;
  await courseImportFinalize(index);
}

async function courseImportRunAllSteps(item){
  const meta = { title: item.detected.title, chapterTitle: item.detected.chapterTitle, notions: item.detected.notions };
  const steps = [
    {key:"fiche", fn: generateCourseFiche},
    {key:"summary", fn: generateCourseSummary},
    {key:"quiz", fn: generateCourseQuizFromText},
    {key:"flashcards", fn: generateCourseFlashcardsFromText},
    {key:"reviewQuestions", fn: generateCourseReviewQuestions},
  ];
  for(let i=0;i<steps.length;i++){
    item.genStepIndex = i;
    render();
    try{
      item.generated[steps[i].key] = await steps[i].fn(item.workingText, meta);
      item.failedSteps = item.failedSteps.filter(k => k !== steps[i].key);
    }catch(e){
      if(!item.failedSteps.includes(steps[i].key)) item.failedSteps.push(steps[i].key);
    }
  }
  item.genStepIndex = -1;
}

/* Relance uniquement l'étape indiquée (ex. après un échec), sans tout refaire. */
async function courseImportRetryStep(index, key){
  const ci = state.courseImport;
  const item = ci.files[index];
  if(!item || aiEngineBusy()) return;
  const fns = { fiche: generateCourseFiche, summary: generateCourseSummary, quiz: generateCourseQuizFromText, flashcards: generateCourseFlashcardsFromText, reviewQuestions: generateCourseReviewQuestions };
  if(!fns[key]) return;
  ci.busy = true;
  item.status = "generating";
  item.genStepIndex = COURSE_IMPORT_STEP_LABELS.length; // affiche juste "génération en cours" générique
  render();
  const meta = { title: item.detected.title, chapterTitle: item.detected.chapterTitle, notions: item.detected.notions };
  try{
    item.generated[key] = await fns[key](item.workingText, meta);
    item.failedSteps = item.failedSteps.filter(k => k !== key);
  }catch(e){
    if(!item.failedSteps.includes(key)) item.failedSteps.push(key);
  }
  item.genStepIndex = -1;
  ci.busy = false;
  if(item.resultChapterId){
    // le cours existe déjà (relance après finalisation) : on met simplement à jour le chapitre sauvegardé
    const ch = findAnyChapter(item.resultChapterId);
    if(ch) courseImportApplyGeneratedToChapter(ch, item);
    item.status = "done";
  } else {
    item.status = "review";
  }
  render();
}

function courseImportApplyGeneratedToChapter(ch, item){
  if(item.generated.fiche) ch.content = item.generated.fiche;
  if(item.generated.summary) ch.summary = item.generated.summary;
  if(item.generated.quiz) ch.aiQuiz = item.generated.quiz;
  if(item.generated.flashcards) ch.aiFlashcards = item.generated.flashcards;
  if(item.generated.reviewQuestions) ch.aiReviewQuestions = item.generated.reviewQuestions;
  ch.updatedAt = Date.now();
  saveUserChapters();
}

async function courseImportFinalize(index){
  const ci = state.courseImport;
  const item = ci.files[index];
  if(!item) return;
  const d = item.detected;

  let subjectId = d.subjectId;
  if(!subjectId){
    subjectId = genLibId("subj");
    state.userSubjects.push({
      id: subjectId, name: d.newSubjectName || "Autre", semesterId: d.semesterId || SEMESTERS[0].id,
      icon: "📥", color: SUBJECT_COLORS[state.userSubjects.length % SUBJECT_COLORS.length],
      description: "Matière créée automatiquement lors de l'import d'un cours.", builtin: false,
    });
    saveUserSubjects();
  }

  const chapterId = genLibId("chap");

  let hasOriginalFile = false;
  if(item.file && courseFileKind(item.file) === "pdf"){
    try{ await saveCourseFileBlob(chapterId, item.file); hasOriginalFile = true; }
    catch(e){ console.error("Impossible d'enregistrer le PDF original :", e); }
  }

  state.userChapters.push({
    id: chapterId, subjectId,
    num: pad2(chaptersOfSubject(subjectId).length + 1),
    title: d.title, desc: (d.chapterTitle && d.chapterTitle !== d.title) ? d.chapterTitle : "",
    level: d.level || "",
    content: item.generated.fiche || item.extractedText.slice(0, 4000),
    originalText: clip(item.extractedText, 20000),
    summary: item.generated.summary || "",
    aiQuiz: item.generated.quiz || [],
    aiFlashcards: item.generated.flashcards || [],
    aiReviewQuestions: item.generated.reviewQuestions || [],
    keyNotions: d.notions || [],
    sourceFileName: item.name || "",
    pageCount: item.numPages || null,
    hasOriginalFile,
    originalFileName: item.file ? item.file.name : "",
    originalFileMime: item.file ? item.file.type : "",
    createdAt: Date.now(), updatedAt: Date.now(),
    markedReviewed: false,
  });
  saveUserChapters();
  logRecentAdd("Cours importé — " + d.title);

  item.resultChapterId = chapterId;
  item.resultSubjectId = subjectId;
  item.status = item.failedSteps.length >= 5 ? "error" : "done";
  if(item.status === "error" && !item.error) item.error = "Aucun support n'a pu être généré. Réessaie depuis la fiche du chapitre.";

  const next = ci.files.findIndex((f,i) => i > index && f.status === "pending");
  if(next !== -1){ ci.step = "detect"; courseImportProcessFile(next); return; }
  ci.step = "result";
  render();
}

function courseImportReset(){

/* Point d'entrée commun (dashboard / Mes matières / Ressources) : repart d'un import
   vierge, sauf si une importation est déjà en cours (pour ne pas la perdre). */
function goToCourseImport(){
  const ci = state.courseImport;
  const hasActiveWork = ci.files.some(f => ["pending","extracting","detecting","review","generating"].includes(f.status));
  if(!hasActiveWork) state.courseImport = { step:"pick", busy:false, files:[], activeIndex:0, pasteText:"", dragOver:false };
  libGoto("import");
}

function fmtFileSize(bytes){
  if(bytes < 1024) return bytes + " o";
  if(bytes < 1024*1024) return Math.round(bytes/1024) + " Ko";
  return (Math.round(bytes/1024/1024*10)/10) + " Mo";
}

function renderImportGenerating(){
  const ci = state.courseImport;
  const item = ci.files[ci.activeIndex];
  if(!item) return renderImportPick();
  const curIdx = item.genStepIndex;
  let html = `<h1 style="font-size:22px;font-weight:800;margin:28px 0 4px;">Création de tes supports de révision…</h1>
  <p class="ai-intro">« ${escapeHtml(item.detected ? item.detected.title : item.name)} »</p>
  <div class="card import-progress-card">`;
  const steps = ["Lecture du contenu", "Analyse du cours"].concat(COURSE_IMPORT_STEP_LABELS, ["Finalisation"]);
  // Les deux premières étapes (lecture/analyse) sont déjà faites au moment où "generating" s'affiche.
  html += steps.map((label,i)=>{
    const stepOffset = i - 2; // aligne sur genStepIndex (0 = fiche)
    let state_ = "done";
    if(i < 2) state_ = "done";
    else if(stepOffset === curIdx) state_ = "current";
    else if(stepOffset > curIdx) state_ = "pending";
    return `<div class="import-step ${state_}">
      <span class="dot">${state_==="done" ? "✓" : (state_==="current" ? "" : "")}</span>
      <span class="lbl">${label}</span>
      ${state_==="current" ? `<span class="ai-spinner" style="margin-left:auto;"></span>` : ""}
    </div>`;
  }).join("");
  html += `</div>
  <footer class="hint">Cette étape peut prendre un moment selon la longueur du cours et ton appareil — ne ferme pas cette fenêtre.</footer>`;
  return html;
}

function qItemHtml(q){
  const m = masteryOf(q);
  const tier = masteryTier(m);
  const s = qstat(q);
  const rate = successRateOf(q);
  const themeLbl = THEME_META[q.theme] ? THEME_META[q.theme].short : "";
  const width = m === null ? 0 : m;
  let meta;
  if(!s || !s.seen){
    meta = "Jamais répondue";
  } else {
    meta = `${s.correct}/${s.seen} réussies · ${rate}% de réussite` + (s.lastDate ? ` · ${fmtRelativeDate(s.lastDate)}` : "");
  }
  return `<div class="q-item">
    <div class="q-top">
      <div>
        <div class="q-theme">${themeLbl}</div>
        <div class="q-text">${escapeHtml(q.q)}</div>
      </div>
      <span class="m-chip ${tier.key}">${tier.label}${m===null ? "" : " · "+m+"%"}</span>
    </div>
    <div class="q-bar-track"><div class="q-bar-fill ${tier.key}" style="width:${width}%"></div></div>
    <div class="q-meta">${meta}</div>
  </div>`;
}

/* ============================================================
   7quinquies. MODE EXAMEN
   ============================================================ */
const EXAM_SECONDS_PER_QUESTION = 60;
let examTimerId = null;

function examAvailableQuestions(){
  const ex = state.exam;
  const chs = ex.chapters.length ? CHAPTERS.filter(c => ex.chapters.includes(c.id)) : CHAPTERS;
  const themes = chs.flatMap(c => c.themes);
  return QUESTIONS.filter(q => themes.includes(q.theme));
}

function examCountResolved(){
  const avail = examAvailableQuestions().length;
  return state.exam.count === "all" ? avail : Math.min(state.exam.count, avail);
}

function examScopeLabel(){
  const ex = state.exam;
  if(ex.chapters.length === 0) return "Tout le programme";
  if(ex.chapters.length === 1){
    const ch = CHAPTERS.find(c => c.id === ex.chapters[0]);
    return ch ? ch.num + " · " + ch.title : "1 chapitre";
  }
  return ex.chapters.length + " chapitres";
}

function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60);
  const s = sec % 60;
  return pad2(m) + ":" + pad2(s);
}

function examElapsed(){
  if(!state.exam.startTs) return 0;
  return Math.round((Date.now() - state.exam.startTs)/1000);
}

function startExam(){
  const ex = state.exam;
  const n = examCountResolved();
  if(n === 0) return;
  ex.pool = shuffle(examAvailableQuestions()).slice(0, n);
  ex.answers = new Array(n).fill(null);
  ex.idx = 0;
  ex.startTs = Date.now();
  ex.limitSec = ex.timerMode === "down" ? n * EXAM_SECONDS_PER_QUESTION : null;
  ex.result = null;
  ex.screen = "running";
  state.tab = "exam";
  accrueTime();
  render();
  window.scrollTo(0,0);
}

function examTick(){
  const el = document.getElementById("exam-clock");
  if(!el) return;
  const ex = state.exam;
  if(ex.timerMode === "down"){
    const left = ex.limitSec - examElapsed();
    el.textContent = "⏱ " + fmtClock(left) + " restantes";
    el.classList.toggle("warn", left <= 60);
    if(left <= 0){ finishExam(true); }
  } else {
    el.textContent = "⏱ " + fmtClock(examElapsed());
  }
}

function startExamTimer(){
  stopExamTimer();
  if(state.exam.timerMode === "off") return;
  examTimerId = setInterval(examTick, 1000);
}
function stopExamTimer(){
  if(examTimerId){ clearInterval(examTimerId); examTimerId = null; }
}

function examSelect(i){
  state.exam.answers[state.exam.idx] = i;
  document.querySelectorAll("#exam-options .opt").forEach((btn,k)=>{
    btn.classList.toggle("selected", k === i);
  });
  const gridBtn = document.querySelector('.exam-grid button[data-goq="'+state.exam.idx+'"]');
  if(gridBtn) gridBtn.classList.add("done");
  const counter = document.getElementById("exam-answered");
  if(counter) counter.textContent = state.exam.answers.filter(a => a !== null).length + " / " + state.exam.pool.length + " répondues";
}

function examGoTo(i){
  const ex = state.exam;
  if(i < 0 || i >= ex.pool.length) return;
  ex.idx = i;
  render();
  window.scrollTo(0,0);
}

function finishExam(auto){
  const ex = state.exam;
  if(ex.screen !== "running") return;
  const unanswered = ex.answers.filter(a => a === null).length;
  if(!auto && unanswered > 0){
    if(!confirm("Il reste " + unanswered + " question" + (unanswered>1?"s":"") + " sans réponse. Elles seront comptées comme fausses. Terminer quand même ?")) return;
  }
  stopExamTimer();

  const timeUsed = ex.timerMode === "down"
    ? Math.min(examElapsed(), ex.limitSec)
    : examElapsed();

  let correct = 0;
  const details = [];
  ex.pool.forEach((q,i)=>{
    const given = ex.answers[i];
    const ok = given === q.correct;
    if(ok) correct++;
    trackQuizAnswer(q, ok);
    if(!ok){
      details.push({
        uid: q.uid,
        theme: q.theme,
        q: q.q,
        given: given === null ? null : q.opts[given],
        good: q.opts[q.correct],
        exp: q.exp,
      });
    }
  });

  const total = ex.pool.length;
  const pct = Math.round((correct/total)*100);
  const result = {
    date: new Date().toISOString(),
    dateKey: todayKey(),
    scopeLabel: examScopeLabel(),
    total, correct,
    wrong: total - correct,
    unanswered,
    pct,
    timeUsed,
    autoEnded: !!auto,
    wrongUids: details.map(d => d.uid),
    details,
  };
  ex.result = result;
  ex.history.unshift({
    date: result.date, dateKey: result.dateKey, scopeLabel: result.scopeLabel,
    total, correct, pct, timeUsed, unanswered,
  });
  if(ex.history.length > 20) ex.history.length = 20;
  saveExamHistory();
  logActivity("exam", "exam", "Examen — " + result.scopeLabel + " (" + total + " questions)", correct, total);

  ex.screen = "results";
  render();
  window.scrollTo(0,0);
}

function abandonExam(){
  if(!confirm("Quitter l'examen ? Tes réponses ne seront pas enregistrées.")) return;
  stopExamTimer();
  state.exam.screen = "setup";
  render();
  window.scrollTo(0,0);
}

    <div class="card">

        <div class="chipset">
