<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EM Lyon Révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --bg:#F8F9FB;
    --surface:#FFFFFF;
    --surface-2:#FCFCFD;
    --border:#E9EAF0;
    --border-strong:#DADCE5;
    --ink:#14151A;
    --ink-soft:#5A5C68;
    --muted:#787A87;
    --navy:#0F1F3D;
    --navy-dark:#0A1630;
    --navy-tint:#EAEEF6;
    --red:#E31C3D;
    --red-dark:#B4152F;
    --red-tint:#FDECEF;
    --red-tint-strong:#FBD9DF;
    --amber:#B4740E;
    --amber-tint:#FBF0DC;
    --amber-strong:#F0D8A8;
    --green:#1B7A54;
    --green-tint:#E6F5EE;
    --green-strong:#BFE5D3;
    --blue:#2C5FA8;
    --blue-tint:#E8EFF9;
    --ring: rgba(227,28,61,0.35);

    /* Alias centralisés (couleurs + typographie) — à ajuster ici pour changer tout le site */
    --font-main: "Inter", Arial, Helvetica, sans-serif;
    --font-heading: "Inter", Arial, Helvetica, sans-serif;
    --color-primary: var(--red);
    --color-primary-dark: var(--red-dark);
    --color-background: var(--bg);
    --color-surface: var(--surface);
    --color-text: var(--ink);
    --color-muted: var(--muted);
    --color-border: var(--border);
    --color-accent: var(--blue);
    --color-success: var(--green);

    /* ---- Échelle typographique (§3) ----
       Une vraie échelle, à la place des ~24 tailles ad hoc (9 → 22px) qui
       coexistaient en style inline. Chaque niveau a un rôle, pas juste une
       taille : voir .page-title / .section-title / .meta plus bas. */
    --text-display:26px;  /* hero du dashboard uniquement */
    --text-h1:22px;       /* titre de page (niveau 1) */
    --text-h2:15.5px;     /* titre de section (niveau 2) */
    --text-h3:13.5px;     /* titre de bloc/carte (niveau 3) */
    --text-body:13px;     /* texte principal */
    --text-sm:12.5px;     /* texte secondaire */
    --text-xs:11.5px;     /* metadata, légendes */
    --text-2xs:10.5px;    /* eyebrow, micro-label */

    /* ---- Échelle d'espacement (§15/§38) ----
       L'espace exprime la hiérarchie : plus le niveau est élevé, plus
       l'espace qui l'entoure est grand. */
    --space-2xs:4px;
    --space-xs:6px;
    --space-sm:10px;
    --space-md:14px;
    --space-lg:18px;
    --space-xl:22px;
    --space-2xl:28px;

    --radius-xl:18px;
    --radius-lg:14px;
    --radius-md:10px;
    --radius-sm:7px;
    --shadow-xs: 0 1px 2px rgba(20,21,26,0.05);
    --shadow-sm: 0 1px 3px rgba(20,21,26,0.06), 0 1px 2px rgba(20,21,26,0.04);
    --shadow-md: 0 4px 14px rgba(20,21,26,0.07), 0 1px 3px rgba(20,21,26,0.05);
    --shadow-lg: 0 12px 28px rgba(20,21,26,0.10), 0 2px 6px rgba(20,21,26,0.05);
    --ease: cubic-bezier(.22,.9,.32,1);
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  html{ scroll-behavior:smooth; }

  body{
    background: var(--color-background);
    color: var(--color-text);
    font-family: var(--font-main);
    min-height:100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
    letter-spacing: -0.003em;
  }

  ::selection{ background: var(--red-tint-strong); color: var(--red-dark); }

  a, button{ font-family: inherit; }
  h1, h2, h3, h4{ font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.015em; }

  :focus-visible{
    outline: 2.5px solid var(--red);
    outline-offset: 2px;
    border-radius: 6px;
  }
  button:focus:not(:focus-visible){ outline:none; }

  .wrap{ max-width: 920px; margin: 0 auto; padding: 0 22px 90px; }
  .quizwrap{ max-width: 620px; margin: 0 auto; padding: 34px 20px 70px; }

  /* ===== CONTENT TRANSITION ===== */
  #content{ animation: content-in 0.32s var(--ease); }
  @keyframes content-in{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* ===== TOPBAR ===== */
  .topbar{
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(115deg, var(--red) 0%, var(--red-dark) 100%);
    box-shadow: 0 2px 10px rgba(180,21,47,0.25);
  }
  .topbar-inner{ max-width: 1120px; margin:0 auto; padding: 0 22px; }
  .brandrow{ display:flex; align-items:center; justify-content:space-between; gap: 18px; min-height: 62px; }
  .brand-text{ display:flex; align-items:center; gap: 11px; flex-shrink:0; }
  .brand-mark{
    width: 36px; height: 36px; flex-shrink:0; border-radius: 10px;
    background: var(--red-dark);
    border: 1.5px solid rgba(255,255,255,0.55);
    box-shadow: 0 1px 4px rgba(0,0,0,0.22);
    color: #fff; font-family: var(--font-heading); font-weight:800; font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .brand-text h1{ font-size: 17px; font-weight: 800; margin: 0; letter-spacing:-0.01em; line-height:1.2; color:#fff; }

  /* ===== NAVIGATION PRINCIPALE ===== */
  .mainnav{ display:flex; align-items:stretch; gap: 2px; flex:1; justify-content:center; }
  .mainnav-item{ position:relative; display:flex; }
  .mainnav-link{
    border:none; background:none; padding: 0 13px; height:62px; border-radius:0;
    font-family: var(--font-main); font-weight: 600; font-size: 13.5px; color: rgba(255,255,255,0.88); cursor:pointer;
    display:flex; align-items:center; gap:5px; white-space: nowrap;
    transition: background 0.16s var(--ease), color 0.16s var(--ease);
    position:relative;
  }
  .mainnav-link .caret{ font-size:9px; opacity:0.8; transition: transform 0.16s var(--ease); }
  .mainnav-link:hover{ background: rgba(255,255,255,0.10); color:#fff; }
  .mainnav-item.active-group > .mainnav-link{ color:#fff; }
  .mainnav-item.active-group > .mainnav-link::after{
    content:""; position:absolute; left:14px; right:14px; bottom:8px; height:3px;
    background:#fff; border-radius:2px;
  }
  .mainnav-item.open > .mainnav-link{ background: rgba(255,255,255,0.14); color:#fff; }
  .mainnav-item.open > .mainnav-link .caret{ transform: rotate(180deg); }

  .dropdown-menu{
    position:absolute; top: 100%; left:0; min-width: 240px; margin-top:2px;
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); padding:8px; display:none; z-index: 120;
  }
  .mainnav-item.open > .dropdown-menu{ display:block; }
  .dropdown-menu .dd-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.07em; font-weight:800; color: var(--muted);
    padding: 8px 10px 4px;
  }
  .dropdown-menu button, .dropdown-menu a{
    display:flex; width:100%; text-align:left; border:none; background:none; cursor:pointer;
    padding: 9px 10px; border-radius: var(--radius-sm); font-size:13.5px; font-weight:600; color: var(--ink);
    font-family: var(--font-main); text-decoration:none;
  }
  .dropdown-menu button:hover, .dropdown-menu a:hover{ background: var(--red-tint); color: var(--red-dark); }
  .dropdown-menu hr{ border:none; border-top:1px solid var(--border); margin: 6px 2px; }
  .dropdown-menu .dd-add{ color: var(--red); font-weight:800; }
  .dropdown-menu button[aria-current="true"]{ background: var(--red-tint); color: var(--red-dark); }
  .dropdown-menu button[aria-current="true"]::after{ content:"✓"; margin-left:auto; padding-left:8px; }
  #lang-trigger-code{ font-weight:800; letter-spacing:0.03em; }

  .topbar-right{ display:flex; align-items:center; gap:14px; flex-shrink:0; }
  .topbar-divider{ width:1px; height:28px; background: rgba(255,255,255,0.28); }
  .profile-chip{
    display:flex; align-items:center; gap:8px; color:#fff; font-size:13.5px; font-weight:600;
    background:none; border:none; cursor:pointer; padding:6px 4px; font-family: var(--font-main);
  }
  .profile-avatar{
    width:28px; height:28px; border-radius:50%; background: rgba(255,255,255,0.22);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; color:#fff;
  }
  .profile-avatar.has-photo{ background-size:cover; background-position:center; }
  .hamburger-btn{
    display:none; border:none; background:none; color:#fff; font-size:22px; cursor:pointer;
    width:38px; height:38px; align-items:center; justify-content:center; border-radius:8px; flex-shrink:0;
  }
  .hamburger-btn:hover{ background: rgba(255,255,255,0.12); }

  /* ===== BULLE ASSISTANT IA (flottante, déplaçable librement) =====
     Nom de classe distinct de .ai-bubble (utilisée par les messages du
     chat IA) pour éviter tout conflit de style. */
  .ai-fab{
    position:fixed; right:20px; bottom:20px; width:56px; height:56px; border-radius:50%; z-index:200;
    background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
    border: none; color:#fff; cursor:grab;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 18px rgba(180,21,47,0.38), 0 2px 6px rgba(0,0,0,0.12);
    touch-action:none; -webkit-user-select:none; user-select:none;
    transition: box-shadow 0.15s var(--ease), transform 0.1s var(--ease);
    animation: ai-fab-bob 3.4s ease-in-out infinite;
  }
  .ai-fab:hover{ box-shadow: 0 8px 22px rgba(180,21,47,0.46), 0 3px 8px rgba(0,0,0,0.16); }
  .ai-fab:active{ cursor:grabbing; transform: scale(0.96); }
  .ai-fab svg{ width:28px; height:28px; pointer-events:none; }
  .ai-fab:focus-visible{ outline: 2.5px solid #fff; outline-offset: 3px; }
  @keyframes ai-fab-bob{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-5px); } }
  @media (prefers-reduced-motion: reduce){ .ai-fab{ animation:none; } }
  body.exam-focus .ai-fab{ display:none; }
  @media (max-width:680px){
    .ai-fab{ width:50px; height:50px; }
  }

  /* ===== STAT BAR ===== */
  .statbar{ display:grid; grid-template-columns: repeat(3,1fr); gap: 13px; margin: 28px 0 24px; }
  .stat{
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 17px 19px; box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s var(--ease), transform 0.2s var(--ease), border-color 0.2s var(--ease);
  }
  .stat:hover{ box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--border-strong); }
  .stat .num{ font-size: 26px; font-weight: 800; color: var(--ink); line-height:1; font-variant-numeric: tabular-nums; letter-spacing:-0.02em; }
  .stat .num.accent{ color: var(--red); }
  .stat .lbl{ font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin-top: 7px; }

  /* ===== HERO / MIX ALL ===== */
  .hero-mix{
    display:flex; align-items:center; justify-content:space-between; gap: 16px;
    background: linear-gradient(120deg, #FFFFFF 0%, #FFFFFF 45%, var(--red-tint) 130%);
    border: 1px solid var(--border); border-radius: var(--radius-xl);
    padding: 22px 24px; margin-bottom: 32px; box-shadow: var(--shadow-sm);
    position: relative; overflow:hidden;
  }
  .hero-mix::before{
    content:""; position:absolute; top:-40%; right:-6%; width:200px; height:200px;
    background: radial-gradient(circle, rgba(227,28,61,0.10) 0%, rgba(227,28,61,0) 70%);
    pointer-events:none;
  }
  .hero-mix .txt{ position:relative; }
  .hero-mix .txt .h{ font-weight: 800; font-size: 16px; margin-bottom: 4px; letter-spacing:-0.01em; }
  .hero-mix .txt .d{ font-size: 13px; color: var(--ink-soft); }
  .hero-mix-import{ background: linear-gradient(120deg, #FFFFFF 0%, #FFFFFF 45%, var(--green-tint) 130%); margin-bottom:16px; }

  .planning-source-bar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin-bottom:16px; padding:2px 2px 14px; border-bottom:1px solid var(--border);
  }
  .planning-source-bar .s{ font-size:11.5px; color: var(--muted); }

  /* ===== IMPORTATION DE COURS ===== */
  .import-dropzone{
    background: var(--surface); border:2px dashed var(--border-strong); border-radius: var(--radius-xl);
    padding:38px 24px; text-align:center; cursor:pointer; transition: border-color .15s var(--ease), background .15s var(--ease);
  }
  .import-dropzone:hover, .import-dropzone:focus-visible{ border-color: var(--red); outline:none; }
  .import-dropzone.is-dragover{ border-color: var(--red); background: var(--red-tint); }
  .import-dropzone-icon{ font-size:34px; margin-bottom:10px; }
  .import-dropzone-title{ font-size:15px; font-weight:800; color: var(--ink); margin-bottom:5px; }
  .import-dropzone-sub{ font-size:12.5px; color: var(--ink-soft); margin-bottom:8px; }
  .import-dropzone-formats{ font-size:11px; color: var(--muted); }

  .import-filelist{ display:flex; flex-direction:column; gap:6px; margin-top:16px; }
  .import-file-row{
    display:flex; align-items:center; gap:10px; background: var(--surface-2); border:1px solid var(--border);
    border-radius: var(--radius-sm); padding:9px 12px; font-size:12.5px;
  }
  .import-file-row .name{ flex:1; font-weight:700; color: var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .import-file-row .size{ color: var(--muted); flex-shrink:0; }

  .import-stats-row{ display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color: var(--ink-soft); margin:14px 0 4px; }
  .import-notion-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .import-notion-tag{
    font-size:11px; font-weight:700; background: var(--surface-2); color: var(--ink-soft);
    border:1px solid var(--border); border-radius:20px; padding:4px 11px;
  }

  .import-progress-card{ display:flex; flex-direction:column; gap:4px; }
  .import-step{ display:flex; align-items:center; gap:12px; padding:11px 4px; font-size:13.5px; color: var(--muted); border-bottom:1px solid var(--bg); }
  .import-step:last-child{ border-bottom:none; }
  .import-step .dot{
    width:22px; height:22px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; border:2px solid var(--border);
  }
  .import-step.done{ color: var(--ink); }
  .import-step.done .dot{ background: var(--green); border-color: var(--green); color:#fff; }
  .import-step.current{ color: var(--ink); font-weight:800; }
  .import-step.current .dot{ border-color: var(--red); }
  .import-step.pending .dot{ background: var(--bg); }

  .import-result-hero{ text-align:center; padding:32px 24px; }
  .import-result-icon{ font-size:42px; }
  .import-result-actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:18px; }
  .import-result-hero .import-stats-row{ justify-content:center; }
  .import-result-list{ display:flex; flex-direction:column; gap:8px; }
  .import-result-row{
    display:flex; align-items:center; gap:12px; background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius-md); padding:12px 14px; font-size:13px;
  }
  .import-result-row.ko{ background: var(--amber-tint); border-color: var(--amber-strong); }
  .import-result-row .name{ flex:1; font-weight:700; color: var(--ink); }
  .import-result-row .meta{ font-size:11.5px; color: var(--muted); flex-shrink:0; }

  .lib-reviewq-list{ display:flex; flex-direction:column; gap:8px; }
  .lib-reviewq-item{ border:1px solid var(--border); border-radius: var(--radius-sm); padding:10px 13px; background: var(--surface-2); }
  .lib-reviewq-item summary{ font-weight:700; font-size:13px; cursor:pointer; color: var(--ink); }
  .lib-reviewq-item .a{ margin-top:8px; font-size:12.5px; color: var(--ink-soft); line-height:1.6; padding-top:8px; border-top:1px solid var(--border); }

  .lib-editor-list{ display:flex; flex-direction:column; gap:12px; margin-top:10px; }
  .lib-editor-item{ display:flex; flex-direction:column; gap:8px; border:1px solid var(--border); border-radius: var(--radius-sm); padding:12px; background: var(--surface-2); }
  .lib-editor-item-actions{ display:flex; gap:14px; }
  .lib-editor-add{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; align-items:center; }
  .lib-editor-add input{ flex:1; min-width:160px; }

  /* ===== BUTTONS (unified system) ===== */
  .btn{
    font-family: "Inter", sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.01em;
    padding: 12px 20px; border-radius: var(--radius-md); cursor: pointer; border: 1px solid transparent;
    background: var(--ink); color: #fff; white-space: nowrap;
    transition: background 0.16s var(--ease), color 0.16s var(--ease), border-color 0.16s var(--ease),
                transform 0.12s var(--ease), box-shadow 0.16s var(--ease);
    box-shadow: var(--shadow-xs);
  }
  .btn:hover{ background: #26272E; box-shadow: var(--shadow-sm); transform: translateY(-1px); }
  .btn:active{ transform: translateY(0) scale(0.98); }
  .btn.outline{ background: #fff; color: var(--ink); border: 1.5px solid var(--border-strong); box-shadow:none; }
  .btn.outline:hover{ border-color: var(--red); color: var(--red-dark); background: var(--red-tint); }
  .btn.red{ background: var(--red); }
  .btn.red:hover{ background: var(--red-dark); }
  .btn.green{ background: var(--green); }
  .btn.green:hover{ background:#145E40; }
  .btn.small{ padding: 8px 14px; font-size: 12px; }
  .btn:disabled{ background: var(--border) !important; color: var(--muted) !important; cursor: not-allowed; box-shadow:none !important; transform:none !important; border-color: var(--border) !important; }
  .btn-text{
    background:none; border:none; color: var(--ink-soft); font-family:"Inter",sans-serif;
    font-size: 12.5px; font-weight: 700; cursor:pointer; padding: 6px 2px;
    border-bottom: 1.5px solid transparent; transition: color 0.15s var(--ease), border-color 0.15s var(--ease);
  }
  .btn-text:hover{ color: var(--red); border-color: var(--red); }
  .btn-text.active{ color: var(--red); border-color: var(--red); }

  /* ===== MON COMPTE / MON ESPACE (V2 premium) ===== */
  .myspace-greeting{ font-size:22px; font-weight:800; letter-spacing:-0.01em; margin:28px 0 2px; }
  .myspace-subtext{ font-size:13.5px; color:var(--muted); font-weight:600; margin:0 0 22px; }
  .account-status-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--green); vertical-align:middle; }

  /* -- carte profil premium (identité, en haut de page) -- */
  .myspace-hero-card{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg);
    padding:26px 28px; margin:0 0 18px; box-shadow: var(--shadow-sm);
    display:flex; align-items:center; gap:22px; flex-wrap:wrap;
  }
  .myspace-hero-avatar, .myspace-hero-avatar-photo{ width:88px; height:88px; border-radius:50%; flex-shrink:0; }
  .myspace-hero-avatar{
    background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
    color:#fff; font-size:32px; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  .myspace-hero-avatar-photo{ object-fit:cover; border:1px solid var(--border); }
  .myspace-hero-identity{ flex:1; min-width:180px; }
  .myspace-hero-name{ font-size:19px; font-weight:800; letter-spacing:-0.01em; margin:0 0 2px; }
  .myspace-hero-handle{ font-size:13px; color:var(--muted); font-weight:700; }
  .myspace-hero-email{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; }
  .myspace-hero-status{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--green); margin-top:10px; }
  .myspace-hero-card-actions{ display:flex; flex-direction:column; gap:8px; flex-shrink:0; align-items:flex-end; }
  @media (max-width:640px){
    .myspace-hero-card{ flex-direction:column; text-align:center; padding:24px 20px; }
    .myspace-hero-identity{ text-align:center; }
    .myspace-hero-status{ justify-content:center; }
    .myspace-hero-card-actions{ align-items:stretch; width:100%; }
    .myspace-hero-card-actions .btn, .myspace-hero-card-actions .btn-text{ width:100%; text-align:center; }
  }


  /* -- mes raccourcis -- */
  .myspace-shortcuts-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap:12px; }
  .myspace-shortcut{
    display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--border); border-radius: var(--radius-md);
    padding:15px 16px; text-align:left; cursor:pointer; font-family: var(--font-main);
    transition: border-color 0.15s var(--ease), transform 0.15s var(--ease);
  }
  .myspace-shortcut:hover{ border-color: var(--red); transform: translateY(-1px); }
  .myspace-shortcut:active{ transform: scale(0.98); }
  .myspace-shortcut .ico{
    font-size:19px; flex-shrink:0; width:38px; height:38px; border-radius:10px;
    background: var(--red-tint); display:flex; align-items:center; justify-content:center;
  }

  /* ============================================================
     SYSTÈME DE CARTES (§6/§7)
     ------------------------------------------------------------
     Une carte = une unité logique réelle (une matière, une séance, une
     recommandation, un formulaire, une fonctionnalité autonome) — jamais
     un simple paragraphe ni un bouton isolé.

     Les deux conteneurs historiques du projet (.card et .dash-section)
     servaient au même rôle avec des décorations différentes (18px vs 14px
     de rayon, deux ombres, deux paddings) : c'était la principale source
     d'incohérence visuelle entre les pages. Ils forment désormais UNE
     famille — même rayon, même bordure, même ombre — et ne se distinguent
     plus que par la DENSITÉ :

       .card          → variante spacieuse (formulaire, panneau, quiz)
       .dash-section  → variante standard (section de contenu)

     Ne pas imbriquer une carte dans une carte : au-delà d'un niveau, le
     regroupement doit se faire par l'espace et la typographie (§5).
     ============================================================ */
  .card{ background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px 22px; box-shadow: var(--shadow-sm); }
  /* Une carte posée à l'intérieur d'une autre surface ne réaffiche ni ombre
     ni relief : elle se distingue par sa bordure seule (évite l'effet
     « carte dans une carte dans une carte »). */
  .dash-section .card, .card .card{ box-shadow: none; background: var(--surface-2); }

  .progress-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 17px; gap:10px; }
  .progress-row .label{ font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
  .progress-row .score{ font-size: 13.5px; color: var(--red); font-weight: 800; flex-shrink:0; font-variant-numeric: tabular-nums; }
  .bar-track{ height: 6px; background: var(--bg); border-radius: 999px; margin-bottom: 24px; overflow:hidden; border: 1px solid var(--border); }
  .bar-fill{ height:100%; background: linear-gradient(90deg, var(--red) 0%, var(--red-dark) 100%); border-radius: 999px; transition: width 0.4s var(--ease); }

  .qtheme{ font-size: 11px; color: var(--red); font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 11px; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }

  h2.question{ font-size: 19.5px; font-weight: 700; line-height: 1.45; margin: 0 0 24px; color: var(--ink); letter-spacing:-0.01em; }

  .options{ display:flex; flex-direction:column; gap: 9px; margin-bottom: 6px; }
  .opt{
    display:flex; align-items:flex-start; gap: 13px; text-align:left; background: var(--surface);
    border: 1.5px solid var(--border); padding: 14px 15px; font-family: "Inter", sans-serif; font-size: 14.5px;
    color: var(--ink); cursor:pointer; border-radius: var(--radius-md); line-height:1.5;
    transition: border-color 0.14s var(--ease), background 0.14s var(--ease), transform 0.1s var(--ease);
  }
  .opt:hover:not(:disabled){ border-color: var(--ink); background: var(--surface-2); }
  .opt:active:not(:disabled){ transform: scale(0.995); }
  .opt .letter{
    font-weight: 800; color: var(--muted); flex-shrink:0; width:22px; height:22px; border-radius:7px;
    background: var(--bg); display:flex; align-items:center; justify-content:center; font-size:12.5px;
    transition: background 0.14s var(--ease), color 0.14s var(--ease);
  }
  .opt:disabled{ cursor:default; }
  .opt.correct{ border-color: var(--green); background: var(--green-tint); border-left-width: 4px; font-weight: 700; }
  .opt.correct .letter{ color:#fff; background: var(--green); }
  .opt.incorrect{ background: var(--bg); border-color: var(--border); color: var(--muted); text-decoration: line-through; }
  .opt.incorrect .letter{ color: #fff; background: var(--red); text-decoration:none; }
  .opt.dim{ opacity: 0.45; }

  .feedback{
    margin-top: 22px; padding: 16px 17px; border-left: 3px solid var(--ink); background: var(--bg);
    font-size: 14px; line-height: 1.65; color: var(--ink-soft); border-radius: 0 10px 10px 0;
  }
  .feedback.wrong{ border-left-color: var(--red); }
  .feedback .verdict{ font-weight: 800; display:block; margin-bottom: 5px; color: var(--ink); }
  .feedback.wrong .verdict{ color: var(--red-dark); }
  .feedback .masteryline{ display:block; margin-top:9px; font-size:12px; color: var(--muted); font-weight:700; }

  .actions{ display:flex; justify-content: space-between; align-items:center; margin-top: 26px; gap:10px; flex-wrap:wrap; }

  /* ============================================================
     QUIZ PREMIUM — namespace "qz-" dédié, entièrement séparé de .opt/.card/
     .feedback/.progress-row/.actions/.scoretag/.bigscore ci-dessus (réutilisés
     par l'écran d'examen — voir renderExamRunning/renderExamResults) : aucune
     règle existante n'est modifiée, ces classes ne sont utilisées que par
     renderQuiz()/renderResults()/renderQuizErrorReview().
     ============================================================ */
  .qz-screen{ max-width:640px; margin:0 auto; padding: 18px 0 40px; }
  .qz-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .qz-quit{ background:none; border:none; cursor:pointer; font-weight:700; font-size:13px; color:var(--muted); padding:8px 4px; font-family:var(--font-main); }
  .qz-quit:hover{ color:var(--red-dark); }
  .qz-quit:focus-visible{ outline:2.5px solid var(--red); outline-offset:2px; border-radius:4px; }
  .qz-header-info{ text-align:right; }
  .qz-chapter{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:800; color:var(--red); }
  .qz-counter{ display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-top:2px; }
  .qz-progress-track{ height:6px; border-radius:99px; background:var(--bg); overflow:hidden; margin-bottom:10px; }
  .qz-progress-fill{ height:100%; background:var(--red); border-radius:99px; }
  .qz-score-row{ font-size:12.5px; color:var(--ink-soft); font-weight:700; margin-bottom:18px; }
  .qz-score-row b{ color:var(--ink); }

  .qz-card{ background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-xl); padding:28px 26px; box-shadow:var(--shadow-sm); }
  .qz-meta{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .qz-tag{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--red); }
  .qz-question{ font-size:21px; font-weight:800; line-height:1.4; margin:0 0 22px; color:var(--ink); }

  .qz-options{ display:flex; flex-direction:column; gap:11px; }
  .qz-opt{
    display:flex; align-items:center; gap:13px; width:100%; text-align:left; min-height:52px;
    padding:14px 17px; border-radius:var(--radius-lg); border:1.5px solid var(--border-strong);
    background:#fff; font-family:var(--font-main); font-size:15px; font-weight:600; color:var(--ink); cursor:pointer;
  }
  .qz-opt:hover:not(:disabled){ border-color:var(--red); background:var(--red-tint); }
  .qz-opt:focus-visible{ outline:2.5px solid var(--red); outline-offset:2px; }
  .qz-opt:disabled{ cursor:default; }
  .qz-opt-letter{ flex-shrink:0; width:28px; height:28px; border-radius:50%; background:var(--bg); color:var(--ink-soft); font-weight:800; font-size:12.5px; display:flex; align-items:center; justify-content:center; }
  .qz-opt-text{ flex:1; }
  .qz-opt-correct{ border-color:var(--green); background:var(--green-tint); }
  .qz-opt-correct .qz-opt-letter{ background:var(--green); color:#fff; }
  .qz-opt-incorrect{ border-color:var(--red); background:var(--red-tint); }
  .qz-opt-incorrect .qz-opt-letter{ background:var(--red); color:#fff; }
  .qz-opt-dim{ opacity:.5; }
  @media (prefers-reduced-motion: no-preference){
    .qz-opt{ transition: transform .12s var(--ease), border-color .15s var(--ease), background .15s var(--ease); }
    .qz-opt:active:not(:disabled){ transform:scale(0.98); }
    .qz-progress-fill{ transition: width .4s var(--ease); }
    .qz-feedback{ animation: qzFeedbackIn .25s var(--ease); }
  }
  @keyframes qzFeedbackIn{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:translateY(0); } }

  .qz-feedback{ margin-top:20px; padding-top:18px; border-top:1.5px solid var(--border); }
  .qz-verdict{ font-size:15px; font-weight:800; margin-bottom:10px; }
  .qz-feedback.ok .qz-verdict{ color:var(--green); }
  .qz-feedback.ko .qz-verdict{ color:var(--red-dark); }
  .qz-why-label{ display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:800; color:var(--muted); margin-bottom:4px; }
  .qz-why p{ margin:0; font-size:14px; line-height:1.6; color:var(--ink-soft); }
  .qz-mastery-line{ display:block; margin-top:10px; font-size:11.5px; color:var(--muted); font-weight:700; }

  .qz-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:22px; gap:12px; flex-wrap:wrap; }
  .qz-actions-right{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .qz-next-btn{ min-width:170px; }

  /* Panneau "Dans ton cours" du quiz : même langage visuel que celui des
     flashcards (.flash-source-*), mais namespace propre "quiz-source-*" —
     aucune règle des flashcards n'est modifiée ni réutilisée. */
  .quiz-source{ margin-top:16px; padding:14px 18px; border:1.5px solid var(--border); border-radius:var(--radius-md); background:var(--surface-2); }
  .quiz-source-head{ display:flex; align-items:center; gap:7px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:800; color:var(--red-dark); }
  .quiz-source-toggle{ display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer; padding:6px 0 0; font-size:13px; font-weight:700; color:var(--red); font-family:var(--font-main); }
  .quiz-source-toggle:hover{ color:var(--red-dark); text-decoration:underline; }
  .quiz-source-toggle:focus-visible{ outline:2.5px solid var(--red); outline-offset:2px; }
  .quiz-source-collapse{ display:grid; grid-template-rows:0fr; opacity:0; }
  @media (prefers-reduced-motion: no-preference){
    .quiz-source-collapse{ transition: grid-template-rows .28s var(--ease), opacity .22s var(--ease); }
  }
  .quiz-source.open .quiz-source-collapse{ grid-template-rows:1fr; opacity:1; margin-top:10px; }
  .quiz-source-body{ overflow:hidden; min-height:0; }
  .quiz-source-excerpt{ font-size:13.5px; line-height:1.65; color:var(--ink-soft); white-space:pre-line; }
  .quiz-source-excerpt mark{ background:var(--red-tint); color:var(--red-dark); font-weight:700; border-radius:3px; padding:0 2px; }
  .quiz-source-example{ margin:10px 0 0; padding-top:10px; border-top:1px dashed var(--border); font-size:13px; line-height:1.6; color:var(--ink-soft); white-space:pre-line; }
  .quiz-source-empty{ margin:0; font-size:13px; color:var(--muted); font-style:italic; }

  /* Résultats */
  .qz-results{ max-width:560px; margin:0 auto; padding:18px 0 40px; text-align:center; }
  .qz-results-emoji{ font-size:15px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:8px; }
  .qz-results-pct{ font-size:56px; font-weight:800; color:var(--red); line-height:1; margin-bottom:6px; }
  .qz-results-frac{ font-size:16px; font-weight:700; color:var(--ink-soft); margin-bottom:16px; }
  .qz-results-msg{ font-size:14.5px; color:var(--ink); margin-bottom:22px; line-height:1.5; }
  .qz-results-stats{ display:flex; justify-content:center; gap:28px; padding:16px 0; border-top:1.5px solid var(--border); border-bottom:1.5px solid var(--border); margin-bottom:16px; flex-wrap:wrap; }
  .qz-results-stat{ font-size:14px; font-weight:700; }
  .qz-results-stat.ok{ color:var(--green); }
  .qz-results-stat.ko{ color:var(--red-dark); }
  .qz-results-time{ font-size:13px; color:var(--muted); font-weight:700; margin-bottom:18px; }
  .qz-review-block{ text-align:left; background:var(--surface-2); border-radius:var(--radius-lg); padding:16px 20px; margin-bottom:22px; }
  .qz-review-title{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:800; color:var(--red-dark); margin-bottom:10px; }
  .qz-review-item{ font-size:13.5px; color:var(--ink-soft); padding:4px 0; line-height:1.5; }
  .qz-review-item.muted{ color:var(--muted); }
  .qz-results-actions{ display:flex; flex-direction:column; gap:10px; }

  /* Revoir mes erreurs (session en cours) */
  .qz-errlist{ display:flex; flex-direction:column; gap:16px; }
  .qz-erritem{ background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-lg); padding:20px 22px; text-align:left; }
  .qz-erritem .q{ font-size:16px; font-weight:800; margin:0 0 14px; color:var(--ink); }
  .qz-erritem .row{ font-size:13.5px; margin-bottom:8px; line-height:1.5; }
  .qz-erritem .row .lbl{ font-weight:800; text-transform:uppercase; font-size:10.5px; letter-spacing:.05em; color:var(--muted); display:block; margin-bottom:2px; }
  .qz-erritem .row .val{ color:var(--ink-soft); }
  .qz-erritem .row.given .val{ color:var(--red-dark); font-weight:600; }
  .qz-erritem .row.correct .val{ color:var(--green); font-weight:600; }
  .qz-erritem-actions{ margin-top:14px; }

  @media (max-width:560px){
    .qz-card{ padding:20px 18px; }
    .qz-question{ font-size:18px; margin-bottom:18px; }
    .qz-opt{ font-size:14px; padding:13px 14px; }
    .qz-results-pct{ font-size:44px; }
    .qz-erritem{ padding:16px 17px; }
  }

  /* En-tête compact de page « Mes matières » : titre + actions secondaires discrètes,
     à la place des gros bandeaux colorés qui occupaient tout le haut de la page. */
  .lib-pagehead{ display:flex; align-items:center; justify-content:space-between; gap:14px; margin:28px 0 22px; flex-wrap:wrap; }
  @media (max-width:560px){ .lib-pagehead{ margin:20px 0 18px; } }

  /* Cartes de chapitre compactes de « Mes matières » : un seul repère visuel clair
     (numéro, titre, contenu dispo, progression) et une action « Réviser » dominante. */
  .lib-chgrid{ display:flex; flex-direction:column; gap:12px; margin-bottom:8px; }
  .lib-chcard{ background:#fff; border:1.5px solid var(--border); border-radius: var(--radius-lg); padding:17px 19px; cursor:pointer; transition: border-color 0.15s, box-shadow 0.15s; }
  .lib-chcard:hover{ border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
  .lib-chcard-top{ display:flex; align-items:flex-start; gap:13px; margin-bottom:11px; }
  .lib-chcard-num{ flex-shrink:0; width:34px; height:34px; border-radius:10px; background:var(--bg); color:var(--ink-soft); font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .lib-chcard-titles{ min-width:0; }
  .lib-chcard-titles h2{ font-size:15.5px; font-weight:800; margin:0; letter-spacing:-0.01em; }
  .lib-chcard-titles p{ margin:3px 0 0; font-size:12px; color:var(--ink-soft); line-height:1.5; }
  .lib-chcard-meta{ font-size:11.5px; color:var(--muted); font-weight:700; margin-bottom:11px; }
  .lib-chcard-progress{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .lib-chcard-progress .chapter-progress-track{ flex:1; }
  .lib-chcard-pct{ font-size:11.5px; font-weight:800; color:var(--ink-soft); white-space:nowrap; }
  .lib-chcard-foot{ display:flex; justify-content:flex-end; }
  @media (max-width:560px){ .lib-chcard{ padding:15px 16px; } .lib-chcard-foot .btn{ flex:1; text-align:center; } }

  /* ===== RESULTS (quiz) ===== */
  .results h2{ font-size: 21px; font-weight: 800; margin: 0 0 4px; letter-spacing:-0.01em; }
  .results .scoretag{ font-size: 10.5px; text-transform:uppercase; letter-spacing:0.06em; color: var(--muted); font-weight:700; margin-bottom: 18px; }
  .results .bigscore{ font-size: 50px; font-weight: 800; color: var(--red); line-height:1; margin: 6px 0 6px; font-variant-numeric: tabular-nums; letter-spacing:-0.02em; }
  .results .bigscore span{ font-size: 14.5px; color: var(--ink-soft); font-weight:500; margin-left:4px; letter-spacing:normal; }
  .results p.msg{ color: var(--ink-soft); margin: 6px 0 24px; font-size: 14px; }

  .recap{ border-top: 1px solid var(--border); padding-top: 4px; margin-top: 4px; }
  .recap-item{ display:flex; gap: 11px; align-items:flex-start; padding: 11px 0; border-bottom: 1px solid var(--bg); font-size: 13.5px; }
  .recap-item:last-child{ border-bottom:none; }
  .recap-mark{
    flex-shrink:0; width: 19px; height:19px; border-radius:6px; font-weight: 800; font-size:11px;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .recap-mark.ok{ color:#fff; background: var(--green); }
  .recap-mark.ko{ color:#fff; background: var(--red); }
  .recap-q{ color: var(--ink-soft); line-height:1.5; }

  .results .actions{ justify-content:flex-start; gap: 12px; }

  footer.hint{ text-align:center; color: var(--muted); font-size: 12px; margin-top: 30px; line-height:1.6; }

  /* ===== FLASHCARDS ===== */
  .flash-deckgrid{ display:grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-bottom: 14px; }
  @media (max-width:560px){ .flash-deckgrid{ grid-template-columns: 1fr; } }
  .flash-deckcard{
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 18px 19px; box-shadow: var(--shadow-sm); display:flex; flex-direction:column; gap:12px;
    transition: box-shadow 0.2s var(--ease), border-color 0.2s var(--ease), transform 0.2s var(--ease);
  }
  .flash-deckcard:hover{ box-shadow: var(--shadow-md); border-color: var(--border-strong); transform: translateY(-2px); }
  .flash-deckcard .top{ display:flex; align-items:flex-start; justify-content:space-between; gap: 10px; }
  .flash-deckcard .name{ font-weight: 800; font-size: 14.5px; line-height:1.4; }
  .flash-deckcard .desc{ font-size: 12px; color: var(--ink-soft); margin-top:4px; line-height:1.5; }
  .flash-deckcard .count{ font-size: 11px; color: var(--muted); font-weight:700; white-space:nowrap; }
  .flash-deckcard .deckbar-track{ height: 5px; background: var(--bg); border-radius: 999px; overflow:hidden; }
  .flash-deckcard .deckbar-fill{ height:100%; border-radius: 999px; transition: width 0.4s var(--ease); }
  .flash-deckcard .deckbar-fill.none{ background: var(--border-strong); }
  .flash-deckcard .deckbar-fill.progress{ background: var(--amber); }
  .flash-deckcard .deckbar-fill.done{ background: var(--green); }
  .flash-deckcard .bottom{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .flash-deckcard .mastery{ font-size: 10.5px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); }
  .flash-deckcard .mastery.progress{ background: var(--amber-tint); color: var(--amber); }
  .flash-deckcard .mastery.done{ background: var(--green-tint); color: var(--green); }

  .flash-play-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 18px; gap: 10px; flex-wrap:wrap; }
  .flash-play-top .lbl{ font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
  .flash-counters{ display:flex; gap: 14px; font-size: 12.5px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .flash-counters .c-known{ color: var(--green); }
  .flash-counters .c-unknown{ color: var(--red); }

  .flash-stage{ display:flex; flex-direction:column; align-items:center; }
  .flashcard{
    width: 100%; max-width: 480px; aspect-ratio: 4/3; cursor: pointer;
    perspective: 1200px; margin-bottom: 22px; border-radius: var(--radius-xl);
  }
  .flashcard:focus-visible .flashcard-face{ outline: 2.5px solid var(--red); outline-offset: 3px; }
  .flashcard-inner{
    position:relative; width:100%; height:100%;
    transform-style: preserve-3d; transition: transform 0.5s var(--ease);
  }
  .flashcard.flipped .flashcard-inner{ transform: rotateY(180deg); }
  .flashcard-face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius: var(--radius-xl); display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 32px; text-align:center; box-shadow: var(--shadow-md); border: 1.5px solid var(--border);
  }
  .flashcard-front{ background: var(--surface); color: var(--ink); }
  .flashcard-front .q{ font-size: 19px; font-weight: 800; line-height:1.45; letter-spacing:-0.01em; }
  .flashcard-front .hint{ position:absolute; bottom:18px; font-size: 11px; color: var(--muted); font-weight:600; }
  .flashcard-back{ background: linear-gradient(160deg,#fff 0%, var(--red-tint) 130%); color: var(--ink); transform: rotateY(180deg); border-color: var(--red-tint-strong); }
  .flashcard-back .a{ font-size: 15.5px; font-weight: 600; line-height:1.6; }
  .flashcard-back .lbl{ position:absolute; top:16px; left:20px; font-size: 10px; text-transform:uppercase; letter-spacing:0.06em; color: var(--red-dark); font-weight:800; }

  .flash-judge{ display:flex; gap: 12px; width:100%; max-width: 480px; }
  .flash-judge button{
    flex:1; padding: 15px 10px; border-radius: var(--radius-md); border: 1.5px solid var(--border-strong);
    background:#fff; font-family:"Inter",sans-serif; font-weight: 800; font-size: 13.5px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    transition: transform 0.14s var(--ease), border-color 0.14s var(--ease), background 0.14s var(--ease), box-shadow 0.14s var(--ease);
  }
  .flash-judge button .emoji{ font-size: 21px; }
  .flash-judge button.unknown:hover{ border-color: var(--red); color: var(--red-dark); background: var(--red-tint); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
  .flash-judge button.known:hover{ border-color: var(--green); color: var(--green); background: var(--green-tint); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
  .flash-judge button:active{ transform: translateY(0) scale(0.97); }
  .flash-judge button:disabled{ opacity: 0.35; cursor:not-allowed; transform:none; }
  .flash-hintline{ text-align:center; font-size: 12px; color: var(--muted); margin-bottom: 16px; }

  /* ---------- Flashcards : "📖 Dans ton cours" (passage source) ---------- */
  .flash-source{
    width:100%; max-width:480px; margin: 4px 0 18px; padding: 14px 18px;
    border:1.5px solid var(--border); border-radius: var(--radius-md); background: var(--surface-2);
    animation: flashSourceIn 0.22s var(--ease);
  }
  @keyframes flashSourceIn{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:translateY(0); } }
  .flash-source-head{ display:flex; align-items:center; gap:7px; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; font-weight:800; color: var(--red-dark); }
  .flash-source-toggle{
    display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer;
    padding: 6px 0 0; font-size: 13px; font-weight:700; color: var(--red); font-family: var(--font-main);
  }
  .flash-source-toggle:hover{ color: var(--red-dark); text-decoration: underline; }
  .flash-source-collapse{
    display:grid; grid-template-rows: 0fr; transition: grid-template-rows 0.28s var(--ease), opacity 0.22s var(--ease); opacity:0;
  }
  .flash-source.open .flash-source-collapse{ grid-template-rows: 1fr; opacity:1; margin-top:10px; }
  .flash-source-body{ overflow:hidden; min-height:0; }
  .flash-source-excerpt{ font-size: 13.5px; line-height:1.65; color: var(--ink-soft); white-space:pre-line; }
  .flash-source-excerpt mark.flash-source-mark{ background: var(--red-tint); color: var(--red-dark); font-weight:700; border-radius:3px; padding: 0 2px; }
  .flash-source-example{ margin: 10px 0 0; padding-top:10px; border-top:1px dashed var(--border); font-size:13px; line-height:1.6; color: var(--ink-soft); white-space:pre-line; }
  .flash-source-empty{ margin:0; font-size:13px; color: var(--muted); font-style:italic; }

  .flash-summary{ text-align:center; padding: 8px 0 4px; }
  .flash-summary .ring{
    width: 132px; height:132px; border-radius:50%; margin: 8px auto 20px; position:relative;
    display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow-sm);
  }
  .flash-summary .ring .pct{ font-size: 27px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing:-0.02em; }
  .flash-summary .sub{ font-size: 13px; color: var(--ink-soft); margin-bottom: 22px; }
  .flash-review-list{ text-align:left; border-top:1px solid var(--border); padding-top: 8px; margin-top: 8px; }
  .flash-review-list .item{ display:flex; gap:11px; align-items:flex-start; padding:10px 0; font-size:13.5px; border-bottom:1px solid var(--bg); }
  .flash-review-list .item:last-child{ border-bottom:none; }
  .flash-review-list .mark{ color: var(--red); flex-shrink:0; font-weight:800; }

  /* ===== ASSISTANT IA ===== */
  /* Historiquement le sous-titre de page de l'assistant IA, puis réutilisé
     tel quel par ~24 écrans sans rapport avec l'IA. Conservé comme alias
     strict de .page-subtitle (même rendu, une seule source de vérité) pour
     ne casser aucun appelant existant — le nouveau code utilise
     .page-subtitle. */
  .ai-intro{ font-size: var(--text-body); color: var(--ink-soft); font-weight:400; margin: 0 0 var(--space-xl); max-width: 560px; line-height:1.65; }
  .ai-notice{ background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 13px 15px; font-size: 12px; color: var(--ink-soft); margin-bottom: 24px; line-height:1.65; }
  .ai-notice b{ color: var(--ink); }

  .ai-field{ margin-bottom: 18px; }
  .ai-field label{ display:block; font-size: 11.5px; font-weight: 800; color: var(--ink); margin-bottom: 7px; text-transform:uppercase; letter-spacing:0.05em; }
  .ai-select, .ai-textarea{
    width:100%; border: 1.5px solid var(--border-strong); border-radius: var(--radius-md);
    font-family: "Inter", sans-serif; font-size: 14px; color: var(--ink); background:#fff;
    padding: 12px 14px; outline:none; transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }
  .ai-select:focus, .ai-textarea:focus{ border-color: var(--red); box-shadow: 0 0 0 3.5px var(--ring); }
  .ai-textarea{ resize: vertical; min-height: 112px; line-height:1.6; }
  .ai-hint{ font-size: 11px; color: var(--muted); margin-top: 5px; }

  .ai-filezone{
    border: 1.5px dashed var(--border-strong); border-radius: var(--radius-md); padding: 18px;
    text-align:center; cursor:pointer; background: var(--bg); transition: border-color .16s var(--ease), background .16s var(--ease);
  }
  .ai-filezone:hover{ border-color: var(--red); background: var(--red-tint); }
  .ai-filezone .big{ font-size: 21px; }
  .ai-filezone .txt{ font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; font-weight:600; }
  .ai-filezone .sub{ font-size: 11px; color: var(--muted); margin-top: 3px; }

  .ai-filelist{ display:flex; flex-direction:column; gap:7px; margin-top: 11px; }
  .ai-fileitem{
    display:flex; align-items:center; justify-content:space-between; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 9px 13px; font-size: 12.5px;
  }
  .ai-fileitem .fname{ display:flex; align-items:center; gap:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ai-fileitem button{ border:none; background:none; color: var(--muted); font-size: 14px; cursor:pointer; flex-shrink:0; transition: color 0.15s var(--ease); }
  .ai-fileitem button:hover{ color: var(--red); }

  .ai-generate-row{ display:flex; align-items:center; justify-content:space-between; margin-top: 22px; gap: 12px; flex-wrap:wrap; }
  .ai-charcount{ font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .ai-error{ background: var(--red-tint); border-left: 3px solid var(--red); color: var(--red-dark); font-size: 13px; padding: 13px 15px; border-radius: 0 10px 10px 0; margin-top: 18px; line-height:1.6; }

  .ai-loading{ display:flex; align-items:center; gap: 11px; font-size: 13.5px; color: var(--ink-soft); padding: 20px 0; }
  .ai-spinner{ width:17px; height:17px; border-radius:50%; border: 2.5px solid var(--border); border-top-color: var(--red); animation: ai-spin 0.7s linear infinite; }
  @keyframes ai-spin{ to{ transform: rotate(360deg); } }

  /* Toast discret : pour signaler un échec ponctuel (régénération, génération…)
     sans laisser de gros bloc rouge permanent dans la page. */
  .app-toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(14px);
    background: var(--ink); color:#fff; font-size:13px; font-weight:600; line-height:1.4;
    padding:12px 18px; border-radius:999px; box-shadow: var(--shadow-md);
    opacity:0; pointer-events:none; transition: opacity 0.22s ease, transform 0.22s ease;
    z-index: 500; max-width: min(420px, calc(100vw - 32px)); text-align:center;
  }
  .app-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  @media (max-width:560px){ .app-toast{ bottom:18px; font-size:12.5px; padding:11px 16px; } }

  .ai-result{ margin-top: 24px; animation: content-in 0.3s var(--ease); }
  .ai-result-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 13px; gap: 10px; flex-wrap:wrap; }
  .ai-result-head .tag{ font-size: 11px; font-weight: 800; text-transform:uppercase; letter-spacing:0.05em; color: var(--red); }
  .ai-result-body{ font-size: 14px; line-height: 1.75; color: var(--ink); }
  .ai-result-body h4{ font-size: 15px; font-weight: 800; margin: 17px 0 7px; letter-spacing:-0.005em; }
  .ai-result-body h4:first-child{ margin-top:0; }
  .ai-result-body ul, .ai-result-body ol{ margin: 7px 0 13px; padding-left: 21px; }
  .ai-result-body li{ margin-bottom: 5px; }
  .ai-result-body p{ margin: 0 0 13px; }
  .ai-result-body b{ color: var(--ink); }

  .ai-history{ margin-top: 36px; }
  .ai-history-item{
    display:flex; align-items:center; justify-content:space-between; gap: 10px;
    padding: 13px 15px; border-radius: var(--radius-md); background: var(--surface);
    border: 1px solid var(--border); margin-bottom: 8px; cursor:pointer; text-align:left; width:100%;
    font-family:"Inter",sans-serif; transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease), transform 0.15s var(--ease);
  }
  .ai-history-item:hover{ border-color: var(--red); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
  .ai-history-item .htype{ font-size: 10.5px; font-weight: 800; color: var(--red); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:3px; }
  .ai-history-item .hprompt{ font-size: 13px; color: var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 420px; }
  .ai-history-item .hdate{ font-size: 11px; color: var(--muted); flex-shrink:0; }

  /* ===== DASHBOARD ===== */
  .dash-hero{
    background: linear-gradient(120deg, #FFFFFF 0%, #FFFFFF 40%, var(--red-tint) 140%);
    border: 1px solid var(--border); border-radius: var(--radius-xl);
    padding: 26px 26px 22px; margin: 28px 0 22px; box-shadow: var(--shadow-md);
  }
  .dash-hero-top{ display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .dash-hero-eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--red); font-weight:800; margin-bottom:6px; }
  .dash-hero-title{ font-size:23px; font-weight:800; margin:0 0 6px; letter-spacing:-0.015em; }
  .dash-hero-sub{ font-size:13.5px; color:var(--ink-soft); margin:0; max-width:420px; line-height:1.55; }
  .dash-ring{
    width:92px; height:92px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow-sm);
  }
  .dash-ring-inner{ width:72px; height:72px; border-radius:50%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .dash-ring-pct{ font-size:19px; font-weight:800; letter-spacing:-0.02em; line-height:1; }
  .dash-ring-lbl{ font-size:9.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.05em; margin-top:2px; }

  .dash-cta-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
  .dash-cta{ flex:1; min-width:170px; text-align:center; }
  .dash-cta:disabled, .btn-disabled-soft{ opacity:0.5; cursor:not-allowed; }
  .dash-cta:disabled:hover{ transform:none; box-shadow:var(--shadow-xs); background:#fff; color:var(--ink); border-color:var(--border-strong); }

  .dash-statgrid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; margin-bottom:24px; }
  .dash-stat{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg);
    padding:16px 15px; text-align:center; box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s var(--ease), transform 0.2s var(--ease);
  }
  .dash-stat:hover{ box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .dash-stat-icon{ font-size:18px; margin-bottom:6px; }
  .dash-stat-num{ font-size:21px; font-weight:800; letter-spacing:-0.01em; font-variant-numeric: tabular-nums; }
  .dash-stat-lbl{ font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.05em; margin-top:4px; line-height:1.4; }

  /* ============================================================
     MA PROGRESSION — namespace "pg-" dédié. Réutilise volontairement
     .dash-section/.section-title/.dash-empty/.deckbar-track/.mastery/.btn
     (déjà partagés dans toute l'app) pour rester cohérent ; les classes
     ci-dessous ne couvrent que les éléments réellement nouveaux.
     ============================================================ */
  .pg-overview{ display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; margin-bottom:24px; }
  .pg-tile{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg);
    padding:18px 14px; text-align:center; box-shadow: var(--shadow-sm);
  }
  @media (prefers-reduced-motion: no-preference){
    .pg-tile{ transition: box-shadow 0.2s var(--ease), transform 0.2s var(--ease); }
    .pg-tile:hover{ box-shadow: var(--shadow-md); transform: translateY(-2px); }
  }
  .pg-tile-num{ font-size:22px; font-weight:800; letter-spacing:-0.01em; font-variant-numeric: tabular-nums; color:var(--ink); }
  .pg-tile-lbl{ font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.05em; margin-top:4px; }

  .pg-mastery-section{ background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-xl); padding:24px 26px; }
  .pg-mastery-row{ display:flex; align-items:center; gap:32px; flex-wrap:wrap; margin-top:6px; }
  .pg-ring{
    width:120px; height:120px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow-sm);
  }
  .pg-ring-inner{ width:96px; height:96px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; }
  .pg-ring-pct{ font-size:24px; font-weight:800; color:var(--ink); font-variant-numeric: tabular-nums; }
  .pg-mastery-side{ display:flex; flex-direction:column; gap:10px; flex:1; min-width:200px; }
  .pg-mastery-stat{ display:flex; align-items:baseline; gap:8px; font-size:13px; color:var(--ink-soft); font-weight:700; }
  .pg-mastery-stat b{ font-size:16px; color:var(--ink); }
  .pg-mastery-note{ margin:4px 0 0; font-size:11.5px; color:var(--muted); line-height:1.5; }

  .pg-subjects-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:14px; }
  .pg-subject-card{ background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-lg); padding:18px 19px; }
  .pg-subject-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:9px; }
  .pg-subject-name{ font-weight:700; font-size:14.5px; color:var(--ink); }
  .pg-subject-meta{ display:flex; flex-wrap:wrap; gap:5px 12px; font-size:11.5px; color:var(--muted); font-weight:600; margin:8px 0 4px; }

  .pg-review-list{ display:flex; flex-direction:column; gap:8px; }
  .pg-review-item{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:1.5px solid var(--border);
    background:var(--surface); border-radius:var(--radius-md); padding:13px 15px; cursor:pointer; font-family:var(--font-main);
  }
  .pg-review-item:hover{ border-color:var(--red); background:var(--red-tint); }
  .pg-review-item:focus-visible{ outline:2.5px solid var(--red); outline-offset:2px; }
  .pg-review-dot{ font-size:15px; flex-shrink:0; }
  .pg-review-body{ display:flex; flex-direction:column; flex:1; gap:2px; }
  .pg-review-title{ font-weight:700; font-size:13.5px; color:var(--ink); }
  .pg-review-sub{ font-size:11.5px; color:var(--muted); font-weight:600; }
  .pg-review-arrow{ color:var(--muted); font-weight:700; }

  .pg-recommend-card{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; background:var(--red-tint); border-radius:var(--radius-lg); padding:18px 20px; }
  .pg-recommend-body{ display:flex; align-items:flex-start; gap:12px; }
  .pg-recommend-ico{ font-size:22px; flex-shrink:0; }
  .pg-recommend-title{ font-weight:800; font-size:15px; color:var(--ink); margin-bottom:3px; }
  .pg-recommend-reason{ margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.5; max-width:38ch; }

  .pg-evolution{ background:var(--surface-2); border-radius:var(--radius-lg); padding:14px 10px; }
  .pg-evolution-svg{ width:100%; height:110px; display:block; }

  .pg-timeline{ display:flex; flex-direction:column; gap:16px; }
  .pg-timeline-date{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:800; color:var(--red-dark); margin-bottom:8px; }
  .pg-timeline-item{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-soft); padding:6px 0; border-bottom:1px solid var(--bg); }
  .pg-timeline-item:last-child{ border-bottom:none; }
  .pg-timeline-item .ico{ flex-shrink:0; }
  .pg-timeline-item .txt{ flex:1; }
  .pg-timeline-item .pct{ font-weight:800; color:var(--ink); font-variant-numeric: tabular-nums; }

  .pg-time-row{ display:flex; gap:28px; flex-wrap:wrap; }
  .pg-time-stat{ display:flex; flex-direction:column; gap:3px; }
  .pg-time-stat b{ font-size:19px; font-weight:800; color:var(--ink); font-variant-numeric: tabular-nums; }
  .pg-time-stat span{ font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }

  @media (max-width:680px){
    .pg-overview{ grid-template-columns: repeat(2, 1fr); }
    .pg-mastery-row{ gap:20px; }
    .pg-ring{ width:96px; height:96px; }
    .pg-ring-inner{ width:76px; height:76px; }
    .pg-ring-pct{ font-size:19px; }
    .pg-subjects-grid{ grid-template-columns: 1fr; }
    .pg-mastery-section{ padding:18px 18px; }
  }

  /* ============================================================
     RÉVISION INTELLIGENTE — namespace sr- (distinct de pg-/qz-/exam/
     flashcards, mêmes tokens de design que le reste de l'app — voir
     variables --red/--border/--surface/--radius-lg déjà définies plus haut).
     ============================================================ */
  .sr-empty-hero{ text-align:center; padding:32px 20px; }
  .sr-empty-hero p{ color:var(--ink-soft); font-size:15px; max-width:420px; margin:0 auto 18px; line-height:1.5; }
  .sr-empty-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  .sr-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:14px; }
  .sr-card{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg);
    padding:16px 17px; display:flex; flex-direction:column; gap:8px;
    transition: box-shadow 0.16s var(--ease), transform 0.16s var(--ease);
  }
  @media (prefers-reduced-motion: no-preference){
    .sr-card:hover{ box-shadow: var(--shadow-md); transform: translateY(-1px); }
  }
  .sr-card-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .sr-card-subject{ font-size:12px; font-weight:700; color:var(--muted); }
  .sr-confidence{ font-size:10.5px; font-weight:700; color:var(--muted); background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:2px 8px; white-space:nowrap; }
  .sr-card-title{ font-size:15.5px; font-weight:800; color:var(--ink); margin:0; line-height:1.3; }
  .sr-card-mastery{ display:flex; }
  .sr-reason{ font-size:13px; color:var(--ink-soft); line-height:1.4; }
  .sr-card-meta{ display:flex; align-items:center; justify-content:space-between; font-size:12.5px; color:var(--muted); font-weight:700; margin-top:2px; }
  .sr-card button[data-smart-start-one]{ margin-top:4px; width:100%; }

  .sr-length-chips{ display:flex; gap:8px; margin:4px 0 14px; flex-wrap:wrap; }
  .sr-length-chips button{
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
    font-weight:700; font-size:13px; padding:7px 16px; border-radius:999px; cursor:pointer;
    transition: background 0.14s var(--ease), color 0.14s var(--ease), border-color 0.14s var(--ease);
  }
  .sr-length-chips button:hover{ border-color: var(--red); color: var(--red); }
  .sr-length-chips button.active{ background: var(--red); border-color: var(--red); color:#fff; }
  .sr-length-chips button:focus-visible{ outline:2.5px solid var(--red); outline-offset:2px; }

  .sr-session-preview{ display:flex; flex-direction:column; gap:2px; margin-bottom:12px; }
  .sr-session-row{ display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--bg); }
  .sr-session-row:last-child{ border-bottom:none; }
  .sr-session-num{
    flex-shrink:0; width:24px; height:24px; border-radius:50%; background:var(--red-tint); color:var(--red-dark);
    font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  .sr-session-body{ display:flex; flex-direction:column; gap:1px; }
  .sr-session-title{ font-size:13.5px; font-weight:700; color:var(--ink); }
  .sr-session-mode{ font-size:12px; color:var(--muted); }
  .sr-session-total{ font-size:13px; font-weight:800; color:var(--ink-soft); margin-bottom:12px; }

  .sr-step-badge{
    display:inline-block; font-size:11px; font-weight:800; color:var(--red);
    background:var(--red-tint); border-radius:999px; padding:2px 10px; margin-bottom:3px;
  }

  .sr-progressed-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .sr-progressed-list li{ font-size:13.5px; color:var(--ink-soft); display:flex; justify-content:space-between; gap:10px; }
  .sr-progressed-list li b{ color: var(--green); font-variant-numeric: tabular-nums; white-space:nowrap; }

  @media (max-width:680px){
    .sr-grid{ grid-template-columns: 1fr; }
    .sr-empty-actions{ flex-direction:column; }
    .sr-empty-actions .btn{ width:100%; }
  }

  .dash-card-links{ display:flex; gap:14px; flex-wrap:wrap; margin-top:2px; }

  /* ============================================================
     MES STATISTIQUES — namespace st- (distinct de pg-/sr-/qz-/exam ;
     réutilise les mêmes tokens de design et les mêmes composants
     génériques que le reste de l'app : .pg-overview/.pg-tile/.pg-review-*/
     .dash-section/.m-chip/.deckbar-track, jamais redéfinis ici).
     ============================================================ */
  .st-compare-row{ display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .st-compare-col{ display:flex; flex-direction:column; gap:3px; }
  .st-compare-col b{ font-size:20px; font-weight:800; color:var(--ink); font-variant-numeric: tabular-nums; }
  .st-compare-col span{ font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .st-compare-delta{ font-size:14px; font-weight:800; padding:5px 12px; border-radius:999px; }
  .st-compare-delta.up{ background:var(--green-tint); color:var(--green); }
  .st-compare-delta.down{ background:var(--red-tint); color:var(--red-dark); }

  .st-weekbars{ display:flex; gap:10px; margin-top:16px; align-items:flex-end; }
  .st-weekbar-col{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; }
  .st-weekbar-track{ width:100%; max-width:28px; height:70px; display:flex; align-items:flex-end; }
  .st-weekbar-fill{
    width:100%; background: linear-gradient(180deg, var(--red) 0%, var(--red-dark) 100%);
    border-radius:5px 5px 2px 2px; min-height:0;
    transition: height 0.4s var(--ease);
  }
  .st-weekbar-lbl{ font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; }

  .st-insights-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .st-insights-list li{
    font-size:13.5px; color:var(--ink-soft); line-height:1.5; padding-left:20px; position:relative;
  }
  .st-insights-list li::before{ content:"•"; position:absolute; left:4px; color:var(--red); font-weight:800; }

  @media (prefers-reduced-motion: reduce){
    .st-weekbar-fill{ transition:none; }
  }

  @media (max-width:680px){
    .st-compare-row{ gap:14px; }
    .st-weekbar-track{ height:52px; }
  }

  /* ============================================================
     MON PLANNING INTELLIGENT — namespace pln- (distinct de pg-/sr-/st-/qz-/
     exam ; réutilise les mêmes tokens et composants génériques que le reste
     de l'app : .dash-section/.pg-overview/.pg-tile/.deckbar-track/.btn,
     jamais redéfinis ici).
     ============================================================ */
  .pln-mode-toggle{ display:inline-flex; gap:4px; background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:3px; margin:24px 0 4px; }
  .pln-mode-toggle button{
    border:none; background:none; padding:7px 16px; border-radius:999px; font-weight:700; font-size:13px;
    color:var(--muted); cursor:pointer; transition: background 0.14s var(--ease), color 0.14s var(--ease);
  }
  .pln-mode-toggle button.active{ background:var(--surface); color:var(--ink); box-shadow: var(--shadow-xs); }
  .pln-mode-toggle button:focus-visible{ outline:2.5px solid var(--red); outline-offset:2px; }

  .pln-empty-hero{ text-align:center; padding:40px 20px; }
  .pln-empty-ico{ font-size:38px; margin-bottom:10px; }
  .pln-empty-hero h2{ font-size:19px; font-weight:800; margin:0 0 8px; }
  .pln-empty-hero p{ color:var(--ink-soft); max-width:420px; margin:0 auto 18px; line-height:1.5; }
  .pln-empty-hint{ font-size:12.5px; color:var(--muted); margin-top:12px !important; }

  .pln-wizard{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:22px 22px 24px; box-shadow:var(--shadow-sm); max-width:640px; margin:0 auto; }
  .pln-wizard-steps{ display:flex; gap:6px; justify-content:center; margin-bottom:20px; }
  .pln-wizard-step{
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; background:var(--bg); color:var(--muted); border:1px solid var(--border);
  }
  .pln-wizard-step.active{ background:var(--red); color:#fff; border-color:var(--red); }
  .pln-wizard-step.done{ background:var(--green-tint); color:var(--green); border-color:var(--green-strong); }
  .pln-step-title{ font-size:17px; font-weight:800; margin:0 0 16px; text-align:center; }

  .pln-goal-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .pln-goal-card{
    display:flex; flex-direction:column; align-items:center; gap:8px; padding:20px 12px;
    border:1.5px solid var(--border); border-radius:var(--radius-md); background:var(--surface); cursor:pointer;
    transition: border-color 0.14s var(--ease), background 0.14s var(--ease);
  }
  .pln-goal-card .ico{ font-size:24px; }
  .pln-goal-card .lbl{ font-size:13px; font-weight:700; text-align:center; color:var(--ink); }
  .pln-goal-card.active{ border-color:var(--red); background:var(--red-tint); }
  .pln-goal-card:focus-visible{ outline:2.5px solid var(--red); outline-offset:2px; }

  .pln-deadline-list{ display:flex; flex-direction:column; gap:8px; max-height:280px; overflow-y:auto; }
  .pln-deadline-card, .pln-deadline-custom .pln-deadline-card{
    display:flex; flex-direction:column; gap:2px; text-align:left; padding:10px 14px;
    border:1.5px solid var(--border); border-radius:var(--radius-md); background:var(--surface); cursor:pointer; width:100%;
