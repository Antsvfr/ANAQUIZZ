/* ---------- édition manuelle des flashcards / questions générées ---------- */
function libUpdateFlashcard(ch, idx, front, back){
  if(!ch.aiFlashcards || !ch.aiFlashcards[idx]) return;
  // Object.assign (et non un objet neuf) : préserve chapterId/sourceQuote/
  // exampleQuote déjà attachés à la carte — modifier le texte recto/verso
  // ne doit pas faire perdre son lien "Dans ton cours".
  ch.aiFlashcards[idx] = Object.assign({}, ch.aiFlashcards[idx], {front, back});
  saveUserChapters();
}
function libDeleteFlashcard(ch, idx){
  if(!ch.aiFlashcards) return;
  ch.aiFlashcards.splice(idx, 1);
  saveUserChapters();
}
function libAddFlashcard(ch, front, back){
  if(!front.trim() || !back.trim()) return;
  ch.aiFlashcards = ch.aiFlashcards || [];
  ch.aiFlashcards.push({front: front.trim(), back: back.trim(), ai: false});
  saveUserChapters();
}
function libUpdateQuizQuestion(ch, idx, q, opts, correct, exp){
  if(!ch.aiQuiz || !ch.aiQuiz[idx]) return;
  ch.aiQuiz[idx] = Object.assign({}, ch.aiQuiz[idx], {q, opts, correct, exp});
  saveUserChapters();
}
function libDeleteQuizQuestion(ch, idx){
  if(!ch.aiQuiz) return;
  ch.aiQuiz.splice(idx, 1);
  saveUserChapters();
}
function libAddQuizQuestion(ch, q, opts, correct, exp){
  if(!q.trim() || opts.some(o=>!o.trim())) return;
  ch.aiQuiz = ch.aiQuiz || [];
  ch.aiQuiz.push({uid:"manual-"+Date.now(), ai:false, theme:"ai", q:q.trim(), opts:opts.map(o=>o.trim()), correct, exp:exp.trim()});
  saveUserChapters();
}

/* ---- régénération indépendante d'un support (fiche / résumé / quiz / flashcards / questions) ----
   Repart du texte source d'origine si disponible (chapitre importé), sinon du contenu actuel
   (chapitre créé/édité à la main) — jamais d'un support déjà régénéré, pour éviter l'effet de dérive. */
function libChapterWorkingText(ch){ return chapterSourceText(ch).trim(); }
function libChapterMeta(ch){ return { title: ch.title, chapterTitle: ch.desc || "", notions: ch.keyNotions || [] }; }

async function libRegeneratePart(ch, key){
  const labels = {fiche:"la fiche", summary:"le résumé", quiz:"le quiz", flashcards:"les flashcards", reviewQuestions:"les questions de révision"};
  if(state.aiStatus !== "ready"){
    showToast("Assistant IA non chargé — va dans l'onglet 🤖 Assistant IA.");
    return;
  }
  const text = libChapterWorkingText(ch);
  if(!text){
    showToast("Ce chapitre n'a pas encore de contenu à régénérer.");
    return;
  }
  const fns = { fiche: generateCourseFiche, summary: generateCourseSummary, quiz: generateCourseQuizFromText, flashcards: generateCourseFlashcardsFromText, reviewQuestions: generateCourseReviewQuestions };
  state.libToolsBusy = key;
  render();
  try{
    const result = await fns[key](text, libChapterMeta(ch));
    if(key === "fiche") ch.content = result;
    else if(key === "summary") ch.summary = result;
    else if(key === "quiz") ch.aiQuiz = result;
    else if(key === "flashcards") ch.aiFlashcards = result;
    else if(key === "reviewQuestions") ch.aiReviewQuestions = result;
    ch.updatedAt = Date.now();
    saveUserChapters();
    state.libToolsBusy = null;
    render();
  }catch(e){
    state.libToolsBusy = null;
    render();
    showToast("Impossible de régénérer " + labels[key] + " — l'ancienne version est conservée.");
  }
}

/* ============================================================
   7ter. IMPORTATION DE COURS
   Un fichier (ou du texte collé) → une fiche structurée, un résumé, un quiz,
   des flashcards et des questions de révision, générés automatiquement.
   Réutilise entièrement WebLLM (aiLoadModel / webllmChat / webllmJsonChat,
   verrouillé par aiEngineBusy()) et le système de matières/chapitres déjà en
   place : un cours importé devient un chapitre utilisateur normal
   (state.userChapters), avec les mêmes actions IA que celles déjà
   disponibles (libGenerateUserChapterQuiz / libGenerateUserChapterCards /
   libRunUserChapterAI) pour la régénération individuelle.
   ============================================================ */
const COURSE_IMPORT_MAX_BYTES = 15 * 1024 * 1024; // ~15 Mo par fichier
const COURSE_IMPORT_MIN_CHARS = 40;               // en dessous : considéré vide/illisible
/* Budget de contexte envoyé au modèle pour LA génération des supports (fiche,
   résumé, quiz, flashcards, questions) — une seule constante réutilisée
   partout pour rester cohérent, au lieu de plusieurs limites différentes
   choisies au hasard à chaque fonction. ~7000 caractères ≈ 1700-1800 tokens :
   large pour un seul chapitre/document, mais assez petit pour que le
   pré-traitement (prefill) du modèle 3B reste rapide sur GPU grand public. */
const COURSE_GEN_CONTEXT_CHARS = 7000;
/* Un cours qui dépasse ce seuil est condensé par blocs avant d'être utilisé —
   mais SEULEMENT au-delà de cette taille : condenser un cours qui tient déjà
   dans COURSE_GEN_CONTEXT_CHARS + une marge raisonnable n'apporterait rien et
   coûterait plusieurs appels IA inutiles. Fixé nettement au-dessus du budget
   de génération pour éviter de condenser des cours seulement "un peu longs". */
const COURSE_CONDENSE_THRESHOLD = 20000;
/* Chunks plus larges = moins d'allers-retours avec le modèle pour condenser
   un cours très long (chaque appel a un coût fixe de pré-traitement, donc
   moins d'appels vaut mieux que des chunks plus petits mais plus nombreux). */
const COURSE_CHUNK_CHARS = 9000;

/* ---- fichiers PDF originaux : trop volumineux pour localStorage, stockés dans IndexedDB,
   indexés par l'identifiant du chapitre (les métadonnées légères restent dans le chapitre
   lui-même, sauvegardé normalement via localStorage). ---- */
const COURSE_FILES_DB_NAME = "em-lyon-revision-files";
const COURSE_FILES_STORE = "pdfs";
let courseFilesDBPromise = null;
function openCourseFilesDB(){
  if(!window.indexedDB) return Promise.reject(new Error("IndexedDB non disponible sur ce navigateur."));
  if(!courseFilesDBPromise){
    courseFilesDBPromise = new Promise((resolve, reject)=>{
      const req = indexedDB.open(COURSE_FILES_DB_NAME, 1);
      req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains(COURSE_FILES_STORE)) req.result.createObjectStore(COURSE_FILES_STORE); };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error || new Error("Impossible d'ouvrir le stockage local des fichiers."));
    });
  }
  return courseFilesDBPromise;
}
async function saveCourseFileBlob(chapterId, blob){
  const db = await openCourseFilesDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(COURSE_FILES_STORE, "readwrite");
    tx.objectStore(COURSE_FILES_STORE).put(blob, chapterId);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function getCourseFileBlob(chapterId){
  const db = await openCourseFilesDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(COURSE_FILES_STORE, "readonly");
    const req = tx.objectStore(COURSE_FILES_STORE).get(chapterId);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = ()=> reject(req.error);
  });
}
async function deleteCourseFileBlob(chapterId){
  const db = await openCourseFilesDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(COURSE_FILES_STORE, "readwrite");
    tx.objectStore(COURSE_FILES_STORE).delete(chapterId);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}

/* ---- extraction de texte par format ---- */
let pdfjsModulePromise = null;
function loadPdfJsModule(){
  if(!pdfjsModulePromise){
    pdfjsModulePromise = import("https://esm.run/pdfjs-dist@4.0.379/build/pdf.min.mjs").then(mod=>{
      mod.GlobalWorkerOptions.workerSrc = "https://esm.run/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs";
      return mod;
    });
  }
  return pdfjsModulePromise;
}
async function extractPdfText(file, onProgress){
  let pdfjs;
  try{ pdfjs = await loadPdfJsModule(); }
  catch(e){ throw new Error("Impossible de charger le lecteur PDF (connexion internet nécessaire au premier import). Colle le texte de ton cours à la place."); }
  const buf = await file.arrayBuffer();
  const doc = await pdfjs.getDocument({data: buf}).promise;
  const numPages = doc.numPages;
  const maxPages = Math.min(numPages, 100);
  let text = "";
  for(let i=1; i<=maxPages; i++){
    if(onProgress) onProgress(i, maxPages);
    const page = await doc.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(" ") + "\n\n";
  }
  const trimmed = text.trim();
  return {
    text: trimmed,
    truncated: numPages > maxPages,
    numPages,
    isScanned: trimmed.length < 20, // quasiment aucun texte détecté → probablement des pages scannées (images)
  };
}

let mammothModulePromise = null;
function loadMammothModule(){
  if(!mammothModulePromise) mammothModulePromise = import("https://esm.run/mammoth");
  return mammothModulePromise;
}
async function extractDocxText(file){
  let mammoth;
  try{ mammoth = await loadMammothModule(); }
  catch(e){ throw new Error("Impossible de charger le lecteur DOCX (connexion internet nécessaire au premier import). Colle le texte de ton cours à la place."); }
  const buf = await file.arrayBuffer();
  const api = mammoth.extractRawText ? mammoth : mammoth.default;
  const result = await api.extractRawText({arrayBuffer: buf});
  return { text: (result.value || "").trim(), truncated: false, numPages: null, isScanned: false };
}

function courseFileKind(file){
  const name = file.name.toLowerCase();
  if(name.endsWith(".txt")) return "text";
  if(name.endsWith(".md") || name.endsWith(".markdown")) return "text";
  if(name.endsWith(".pdf")) return "pdf";
  if(name.endsWith(".docx")) return "docx";
  return null;
}

async function extractCourseFileText(file, onProgress){
  if(file.size > COURSE_IMPORT_MAX_BYTES){
    throw new Error("« " + file.name + " » est trop volumineux (limite ~15 Mo).");
  }
  const kind = courseFileKind(file);
  if(!kind){
    throw new Error("Format non pris en charge pour « " + file.name + " ». Formats acceptés : PDF, DOCX, TXT, Markdown. (PPTX et les images/OCR ne sont pas encore pris en charge — colle le texte directement à la place.)");
  }
  if(kind === "text") return { text: (await readFileAsText(file)).trim(), truncated: false, numPages: null, isScanned: false };
  if(kind === "pdf") return extractPdfText(file, onProgress);
  return extractDocxText(file);
}

/* ---- découpage + condensation pour les cours très longs ---- */
/* Découpe un bloc trop long au dernier espace/saut de ligne avant `size`,
   plutôt qu'à un index de caractère arbitraire — évite de couper au milieu
   d'un mot. Retombe sur une coupe brute seulement si aucun espace n'existe
   dans la zone (texte sans espaces, cas très rare). */
function splitAtWordBoundary(text, size){
  if(text.length <= size) return [text, ""];
  let cut = text.lastIndexOf(" ", size);
  if(cut < size * 0.5) cut = text.lastIndexOf("\n", size);
  if(cut < size * 0.5) cut = size; // aucun espace/saut de ligne raisonnable trouvé : dernier recours
  return [text.slice(0, cut).trim(), text.slice(cut).trim()];
}
function chunkCourseText(text, size){
  size = size || COURSE_CHUNK_CHARS;
  const paras = text.split(/\n{2,}/);
  const chunks = [];
  let cur = "";
  paras.forEach(p=>{
    if(cur && (cur + "\n\n" + p).length > size){ chunks.push(cur); cur = p; }
    else cur = cur ? cur + "\n\n" + p : p;
    while(cur.length > size * 1.4){
      const [head, rest] = splitAtWordBoundary(cur, size);
      chunks.push(head);
      cur = rest;
    }
  });
  if(cur) chunks.push(cur);
  return chunks;
}

/* ============================================================
   GÉNÉRATION DE COURS — progression, minuteur, annulation
   ============================================================ */

/* Phases affichées à l'utilisateur pendant l'analyse + la génération,
   mappées sur un pourcentage continu 0-100 (jamais une fausse valeur figée). */
const COURSE_GEN_PHASES = [
  { key:"extract",   group:1, pctFrom:0,  pctTo:15,  label:"Préparation de ton cours…" },
  { key:"chunk",      group:1, pctFrom:15, pctTo:30,  label:"L'IA lit les différentes parties du document…" },
  { key:"meta",       group:1, pctFrom:30, pctTo:45,  label:"Identification des notions importantes…" },
  { key:"fiche",      group:2, pctFrom:45, pctTo:63,  label:"Création de ta fiche de révision…" },
  { key:"summary",    group:2, pctFrom:63, pctTo:76,  label:"Rédaction de ton résumé…" },
  { key:"quiz",       group:2, pctFrom:76, pctTo:86,  label:"Génération des questions de quiz…" },
  { key:"flashcards", group:2, pctFrom:86, pctTo:94,  label:"Création de tes flashcards…" },
  { key:"finalize",   group:3, pctFrom:94, pctTo:100, label:"Finalisation de tes supports de révision…" },
];
const COURSE_GEN_GROUP_LABELS = { 1:"Lecture et analyse du cours", 2:"Génération des supports de révision", 3:"Finalisation" };
const COURSE_GEN_GROUP_COUNT = 3;

function coursePhasePercent(phase, frac){
  frac = Math.max(0, Math.min(1, frac == null ? 1 : frac));
  return Math.round(phase.pctFrom + (phase.pctTo - phase.pctFrom) * frac);
}

/* Calcule {percent, label, groupIndex, groupLabel} à partir de l'état réel
   de l'item — jamais une progression inventée : dérivée du statut, de la
   progression d'extraction/de découpage, ou de l'étape de génération en
   cours (item.genStepIndex). */
function courseImportProgressInfo(item){
  if(item.status === "extracting"){
    const p = item.extractProgress;
    const frac = (p && p.total) ? p.page / p.total : 0;
    const phase = COURSE_GEN_PHASES[0];
    return { percent: coursePhasePercent(phase, frac), label: phase.label, groupIndex: phase.group };
  }
  if(item.status === "detecting"){
    const p = item.chunkProgress;
    if(p && p.total > 1){
      const phase = COURSE_GEN_PHASES[1];
      return { percent: coursePhasePercent(phase, (p.i+1)/p.total), label: phase.label, groupIndex: phase.group };
    }
    // Cours court (pas de découpage) ou détection des métadonnées après le découpage.
    const phase = COURSE_GEN_PHASES[2];
    return { percent: coursePhasePercent(phase, 0.5), label: phase.label, groupIndex: phase.group };
  }
  if(item.status === "generating"){
    const genPhases = COURSE_GEN_PHASES.slice(3, 7); // fiche, summary, quiz, flashcards
    if(item.genStepIndex >= 0 && item.genStepIndex < genPhases.length){
      const phase = genPhases[item.genStepIndex];
      return { percent: coursePhasePercent(phase, 0.5), label: phase.label, groupIndex: phase.group };
    }
    if(item.genStepIndex >= genPhases.length){
      // 5ᵉ étape interne (questions de révision) : fait partie de la finalisation à l'écran.
      const phase = COURSE_GEN_PHASES[7];
      return { percent: coursePhasePercent(phase, 0.3), label: "Préparation des questions de révision…", groupIndex: phase.group };
    }
    const phase = COURSE_GEN_PHASES[7];
    return { percent: coursePhasePercent(phase, 1), label: phase.label, groupIndex: phase.group };
  }
  return { percent: 0, label: COURSE_GEN_PHASES[0].label, groupIndex: 1 };
}

function fmtElapsed(ms){
  const s = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m > 0 ? (m + " min " + String(r).padStart(2,"0") + " s") : (r + " s");
}

let courseImportTimerHandle = null;
/* Démarre (ou redémarre) le minuteur affiché pendant l'extraction/analyse/génération.
   Un seul minuteur actif à la fois — repartir d'un nouvel appel arrête l'ancien. */
function courseImportStartTimer(item){
  courseImportStopTimer();
  item.genStartedAt = Date.now();
  courseImportTimerHandle = setInterval(()=>{
    if(state.tab === "library") render();
  }, 1000);
}
function courseImportStopTimer(){
  if(courseImportTimerHandle){ clearInterval(courseImportTimerHandle); courseImportTimerHandle = null; }
}

/* Distingue le type d'erreur pour afficher un message utile plutôt qu'un
   message générique — d'après des motifs réels connus des erreurs WebGPU/
   WebLLM, jamais une supposition présentée comme certaine. */
function classifyGenerationError(e){
  const msg = (e && e.message) ? e.message : String(e || "");
  const low = msg.toLowerCase();
  if(/out of memory|oom|allocation failed|memory/i.test(low)){
    return { kind:"memory", message:"L'IA manque probablement de mémoire pour traiter ce cours en une seule fois. Essaie avec un cours plus court, ou découpe ton document en plusieurs parties." };
  }
  if(/device was lost|gpudevice|webgpu|context lost|adapter/i.test(low)){
    return { kind:"webgpu", message:"L'accélération graphique n'est plus disponible. Recharge la page ou vérifie les paramètres graphiques de ton navigateur." };
  }
  if(/cancelled/i.test(low)){
    return { kind:"cancelled", message:"Génération annulée." };
  }
  if(/^timeout:/i.test(msg)){
    return { kind:"timeout", message:"Cette étape a pris trop de temps et a été interrompue. Ton cours original est conservé — tu peux réessayer cette étape, ou choisir le modèle léger." };
  }
  return { kind:"generic", message:"La génération a rencontré un problème. Ton cours original est conservé. Tu peux réessayer.", detail: msg };
}

async function condenseCourseChunk(chunkText, index, total, signal){
  const prompt = aiSystemPrompt() + "\n\nEXTRAIT " + (index+1) + "/" + total + " D'UN COURS :\n" + chunkText +
    "\n\nTÂCHE : condense cet extrait en une liste dense de points (définitions, faits, formules, exemples, dates, auteurs), sans rien inventer ni interpréter. Conserve le vocabulaire exact du cours. Réponds uniquement par la liste condensée, sans commentaire autour, sans introduction ni conclusion.";
  const res = await withGenTimeout(webllmChat([{role:"user", content: prompt}], { signal }), 60000, "condensation");
  return (res && res.text) ? res.text.trim() : "";
}

/* Pour un cours très long : condense chaque section avant de l'utiliser comme source pour
   le reste du pipeline, pour rester dans la capacité du modèle sans perdre d'information.
   `signal` (optionnel, {cancelled}) permet d'interrompre proprement entre deux sections. */
async function buildWorkingCourseText(rawText, onProgress, signal){
  const trimmed = rawText.trim();
  if(trimmed.length <= COURSE_CONDENSE_THRESHOLD) return { text: trimmed, wasCondensed: false, chunkCount: 1 };
  const chunks = chunkCourseText(trimmed);
  const digests = [];
  for(let i=0; i<chunks.length; i++){
    if(signal && signal.cancelled) return { text: clip(digests.join("\n\n"), COURSE_GEN_CONTEXT_CHARS), wasCondensed: true, chunkCount: chunks.length };
    if(onProgress) onProgress(i, chunks.length);
    const digest = await condenseCourseChunk(chunks[i], i, chunks.length, signal);
    if(digest) digests.push(digest);
  }
  return { text: clip(digests.join("\n\n"), COURSE_GEN_CONTEXT_CHARS), wasCondensed: true, chunkCount: chunks.length };
}

/* ---- détection matière / titre / notions ---- */
function matchSubjectByName(name){
  if(!name) return null;
  const n = name.toLowerCase().trim();
  return allSubjects().find(s=>{
    const sn = s.name.toLowerCase();
    return sn === n || sn.includes(n) || n.includes(sn);
  }) || null;
}

/* Tente de récupérer un objet JSON même si la réponse du modèle contient du texte
   autour, des virgules en trop, etc. — ne jamais faire échouer toute l'importation
   pour un JSON imparfait : chaque champ a un repli sûr côté appelant. */
function extractJsonObject(text){
  const match = String(text || "").match(/\{[\s\S]*\}/);
  if(!match) return null;
  try{ return JSON.parse(match[0]); }
  catch(e){
    try{ return JSON.parse(match[0].replace(/,\s*([}\]])/g, "$1")); } // virgules traînantes
    catch(e2){ return null; }
  }
}

async function detectCourseMeta(workingText, fileName, signal){
  const existingSubjects = allSubjects().map(s=>s.name).join(", ");
  const prompt = aiSystemPrompt() + "\n\nDébut du cours (extrait) :\n" + clip(workingText, 3000) +
    "\n\nMatières déjà existantes sur ce site : " + (existingSubjects || "(aucune)") +
    "\n\nTÂCHE : à partir de cet extrait, déduis un titre court, la matière scolaire la plus probable (réutilise une matière existante ci-dessus si elle correspond, sinon choisis parmi : Mathématiques, SES, Physique-Chimie, Histoire-Géographie, Philosophie, Anglais, Français, Enseignement scientifique, Management, Économie, Autre), un titre de chapitre, un niveau probable (L1, L2 ou L3 — ou une chaîne vide si tu ne peux pas le déterminer), et une liste de 4 à 10 notions importantes réellement présentes dans le texte. Réponds UNIQUEMENT par un objet JSON (pas de tableau), sans texte autour, au format : {\"title\":\"...\",\"subject\":\"...\",\"chapter\":\"...\",\"level\":\"...\",\"notions\":[\"...\"]}";
  const res = await withGenTimeout(webllmChat([{role:"user", content: prompt}], { signal }), 45000, "détection du cours");
  const parsed = extractJsonObject(res && res.text);
  const fallbackTitle = (fileName || "").replace(/\.[a-z0-9]+$/i, "").replace(/[_-]+/g, " ").trim();
  return {
    title: (parsed && parsed.title) ? String(parsed.title).slice(0,120) : (fallbackTitle || "Cours importé"),
    subjectName: (parsed && parsed.subject) ? String(parsed.subject).slice(0,60) : "",
    chapterTitle: (parsed && parsed.chapter) ? String(parsed.chapter).slice(0,120) : (fallbackTitle || "Chapitre importé"),
    level: (parsed && LEVELS.includes(parsed.level)) ? parsed.level : "",
    notions: (parsed && Array.isArray(parsed.notions)) ? parsed.notions.slice(0,10).map(String) : [],
  };
}

/* ---- génération des supports à partir du texte de travail ---- */
function courseGenContext(workingText, meta){
  return clip(
    "TITRE DU COURS : " + meta.title +
    (meta.chapterTitle ? "\nCHAPITRE : " + meta.chapterTitle : "") +
    (meta.notions && meta.notions.length ? "\nNOTIONS DÉTECTÉES : " + meta.notions.join(", ") : "") +
    "\n\nCONTENU DU COURS :\n" + workingText,
    COURSE_GEN_CONTEXT_CHARS
  );
}

/* Nombre d'éléments demandés au modèle (quiz / flashcards / questions de
   révision), proportionné à la taille réelle du cours : un cours d'une page
   n'a pas besoin d'autant de questions qu'un cours de 20 pages, et demander
   moins de contenu accélère directement la génération (le décodage est à
   peu près linéaire avec la longueur de la réponse). */
function courseItemCounts(charCount){
  if(charCount < 4000) return { quiz: 4, flashcards: 5, reviewQ: 3 };
  if(charCount < 12000) return { quiz: 6, flashcards: 8, reviewQ: 4 };
  return { quiz: 8, flashcards: 10, reviewQ: 6 };
}

/* Empêche un appel IA de bloquer indéfiniment l'interface (device GPU
   figé, promesse WebLLM jamais résolue…) : au-delà de `ms`, on considère
   l'appel en échec, on tente d'interrompre proprement la génération en
   cours côté moteur (best-effort, sans erreur si rien n'est en cours), et
   on relance une erreur "timeout" classifiable comme les autres échecs —
   jamais un blocage silencieux et permanent. */
function withGenTimeout(promise, ms, label){
  let timer = null;
  const timeout = new Promise((_, reject)=>{
    timer = setTimeout(async ()=>{
      try{ if(webllmEngine && webllmEngine.interruptGenerate) await webllmEngine.interruptGenerate(); }catch(e){}
      reject(new Error("timeout:" + (label || "génération") + " a dépassé " + Math.round(ms/1000) + " s sans réponse."));
    }, ms);
  });
  return Promise.race([promise, timeout]).finally(()=>{ if(timer) clearTimeout(timer); });
}

/* Repère les tournures creuses qu'un modèle peut produire pour une section
   sans contenu réel ("information manquante", "si applicable"…) — utilisé à
   la fois pour nettoyer les nouvelles fiches structurées (JSON) et pour
   filtrer les anciennes fiches déjà enregistrées en texte/Markdown. */
function isPlaceholderLine(s){
  return /information manquante|non précisé|non renseigné|à compléter|aucune information disponible|si applicable|si présent/i.test(String(s||""));
}

/* Types de section que le rendu sait afficher intelligemment. Toute valeur
   inconnue retombe sur "notions" (terme + définition), jamais une erreur. */
const FICHE_SECTION_TYPES = ["notions", "concepts", "steps", "data", "examples"];

/* Valide et nettoie la fiche JSON renvoyée par le modèle : supprime les
   sections/items vides ou creux, plafonne les quantités, ne garde que des
   champs textuels sûrs. Retourne null si rien d'exploitable n'a été produit
   (l'appelant traite alors ça comme un échec de cette étape, exactement
   comme un JSON invalide — le cours et les autres supports restent intacts). */
function sanitizeFicheData(parsed){
  if(!parsed || typeof parsed !== "object") return null;
  const cleanStr = (s) => {
    const v = String(s == null ? "" : s).trim();
    return (!v || isPlaceholderLine(v)) ? "" : v;
  };
  const sections = (Array.isArray(parsed.sections) ? parsed.sections : []).slice(0, 10).map(sec=>{
    const type = FICHE_SECTION_TYPES.includes(sec && sec.type) ? sec.type : "notions";
    const items = (Array.isArray(sec && sec.items) ? sec.items : []).slice(0, 12).map(it=>{
      if(type === "data") return { label: cleanStr(it && it.label), value: cleanStr(it && it.value) };
      if(type === "steps" || type === "examples") return { content: cleanStr(it && (it.content || it.label)) };
      return { title: cleanStr(it && it.title), content: cleanStr(it && it.content), example: cleanStr(it && it.example) };
    }).filter(it => type === "data" ? (it.label || it.value) : (it.content || it.title));
    const defaultTitle = type === "steps" ? "Méthode" : type === "data" ? "Chiffres et dates" : type === "examples" ? "Exemples" : "Notions essentielles";
    return { type, title: cleanStr(sec && sec.title) || defaultTitle, items };
  }).filter(sec => sec.items.length > 0);
  const keyPoints = (Array.isArray(parsed.keyPoints) ? parsed.keyPoints : []).map(cleanStr).filter(Boolean).slice(0, 8);
  const introduction = cleanStr(parsed.introduction);
  if(sections.length === 0 && keyPoints.length === 0 && !introduction) return null;
  return { introduction, sections, keyPoints };
}

async function generateCourseFiche(workingText, meta, signal){
  const prompt = aiSystemPrompt() + "\n\n" + courseGenContext(workingText, meta) +
    "\n\nTÂCHE : à partir UNIQUEMENT de ce contenu, sans rien inventer, produis une fiche de révision structurée au format JSON strict, sans aucun texte ni Markdown autour :\n" +
    "{\"introduction\":\"2-3 phrases max pour situer le sujet\",\"sections\":[{\"type\":\"notions\",\"title\":\"...\",\"items\":[{\"title\":\"terme\",\"content\":\"définition courte et claire\",\"example\":\"exemple concret, optionnel\"}]},{\"type\":\"steps\",\"title\":\"...\",\"items\":[{\"content\":\"étape\"}]},{\"type\":\"data\",\"title\":\"...\",\"items\":[{\"label\":\"...\",\"value\":\"...\"}]},{\"type\":\"examples\",\"title\":\"...\",\"items\":[{\"content\":\"...\"}]}],\"keyPoints\":[\"point essentiel court\"]}\n" +
    "RÈGLES STRICTES : n'inclus une section \"steps\", \"data\" ou \"examples\" QUE si le cours contient réellement des étapes/mécanismes, des chiffres/formules/dates, ou des exemples — sinon ne l'écris pas du tout. N'écris jamais \"information manquante\", \"non précisé\", \"si applicable\" ou une phrase équivalente : si une information n'existe pas, ne l'écris pas. 4 à 8 sections maximum, 5 à 8 \"keyPoints\" maximum (une phrase courte chacun). Contenu concis et reformulé, sans répéter le cours mot pour mot.";
  const res = await withGenTimeout(webllmChat([{role:"user", content: prompt}], { signal }), 90000, "fiche");
  const raw = (res && res.text) ? res.text.trim() : "";
  const clean = sanitizeFicheData(extractJsonObject(raw));
  if(!clean) throw new Error("la fiche générée est vide ou dans un format inattendu");
  return JSON.stringify(clean);
}

/* ---- orchestration : file d'import, un fichier à la fois ---- */
async function ensureImportAIReady(){
  if(state.aiStatus === "ready") return;
  if(state.aiStatus === "checking") throw new Error("Vérification de la compatibilité de ton appareil en cours, réessaie dans un instant.");
  if(state.aiStatus === "nogpu"){
    const diag = state.aiGpuDiag;
    throw new Error((diag ? diag.message : "L'IA locale n'est pas disponible sur cet appareil.") + " Tu peux enregistrer ton cours sans IA, ou utiliser le mode simplifié — rien n'est perdu.");
  }
  if(state.aiStatus === "loading") throw new Error("Le modèle est en cours de chargement, réessaie dans quelques secondes.");
  await aiLoadModel(state.aiModelId || pickModelForDevice());
  if(state.aiStatus !== "ready"){
    if(state.aiStatus === "error" && state.aiDiagnostic) throw new Error(state.aiDiagnostic.typeLabel + " : " + state.aiDiagnostic.message);
    throw new Error("Le chargement du modèle IA a échoué. Réessaie, ou charge-le depuis l'onglet Assistant IA.");
  }
}

/* Variante non bloquante : ne lance jamais d'exception, retourne juste si l'IA
   est utilisable — pour ne jamais faire échouer tout un import à cause de ça. */

}

/* ---- mode de secours (sans IA) : détection de titre + fiche/flashcards
   simples construites à partir de la structure du texte, sans jamais
   inventer de contenu absent du cours. ---- */
function heuristicExtractHeadings(text){
  return String(text || "").split(/\n+/).map(l=>l.trim()).filter(l=>{
    if(l.length < 3 || l.length > 90) return false;
    if(/^#{1,4}\s/.test(l)) return true;
    if(/^[A-ZÀ-Ý][^.!?]{2,80}$/.test(l) && !/[,;:]$/.test(l)) return true;
    return false;
  }).slice(0, 12).map(l=>l.replace(/^#{1,4}\s*/, ""));
}
function heuristicExtractDefinitions(text){
  const lines = String(text || "").split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const defs = [];
  const reColon = /^([A-ZÀ-Ý][\wÀ-ÿ' -]{1,40})\s*[:–-]\s+(.{10,220})$/;
  const reEst = /^([A-ZÀ-Ý][\wÀ-ÿ' -]{1,40})\s+(?:est|désigne|signifie|correspond à)\s+(.{10,220})$/i;
  for(const l of lines){
    const m = l.match(reColon) || l.match(reEst);
    if(m){
      defs.push({ term: m[1].trim(), def: m[2].trim().replace(/[.]+$/, ""), line: l });
      if(defs.length >= 12) break;
    }
  }
  return defs;
}
function heuristicDetectMeta(text, filename){
  const base = String(filename || "").replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").trim();
  const title = base ? base.charAt(0).toUpperCase() + base.slice(1) : "Cours importé";
  const headings = heuristicExtractHeadings(text);
  return {
    title,
    subjectName: "",
    chapterTitle: headings[0] || title,
    level: "",
    notions: heuristicExtractDefinitions(text).slice(0, 6).map(d=>d.term),
  };
}
function buildHeuristicCourseMaterials(rawText){
  const text = String(rawText || "").replace(/\r/g, "");
  const headings = heuristicExtractHeadings(text);
  const defs = heuristicExtractDefinitions(text);
  const paragraphs = text.split(/\n{2,}/).map(p=>p.trim()).filter(p=>p.length > 60).slice(0, 6);

  let fiche = `<p class="ai-hint" style="margin:0 0 14px;">⚙️ Fiche générée automatiquement <b>sans IA</b> (mode simplifié), à partir des titres et définitions repérés dans le texte. Aucun contenu n'a été inventé.</p>`;
  if(headings.length) fiche += `<h3>Plan repéré</h3><ul class="fiche-list">${headings.map(h=>`<li>${escapeHtml(h)}</li>`).join("")}</ul>`;
  if(defs.length) fiche += `<h3>Définitions repérées</h3><ul class="fiche-list">${defs.map(d=>`<li><b>${escapeHtml(d.term)}</b> : ${escapeHtml(d.def)}</li>`).join("")}</ul>`;
  if(paragraphs.length) fiche += `<h3>Extraits du cours</h3>` + paragraphs.map(p=>`<p>${escapeHtml(clip(p, 400))}</p>`).join("");
  if(!headings.length && !defs.length && !paragraphs.length){
    fiche += `<p>Le texte a bien été importé, mais aucune structure claire (titres, définitions) n'a pu être détectée automatiquement. Consulte le texte original du cours.</p>`;
  }

  const flashcards = defs.slice(0, 10).map(d => ({ front: d.term, back: d.def, heuristic: true, sourceQuote: d.line }));

  const quiz = [];
  if(defs.length >= 3){
    defs.slice(0, 6).forEach((d, i) => {
      const decoys = defs.filter((_, j) => j !== i).map(x => x.def);
      if(decoys.length < 3) return;
      const opts = shuffle([d.def].concat(shuffle(decoys).slice(0, 3)));
      quiz.push({ q: "Quelle est la définition de « " + d.term + " » ?", opts, correct: opts.indexOf(d.def), exp: "", heuristic: true, sourceQuote: d.line });
    });
  }
  return { fiche, flashcards, quiz };
}

/* Résumé heuristique (sans IA) : première phrase de chaque partie du texte,
   sans rien reformuler ni inventer. Utilisé quand l'IA locale est indisponible. */
function heuristicSummary(rawText){
  const text = String(rawText || "").replace(/\r/g, "");
  const headings = heuristicExtractHeadings(text);
  const paragraphs = text.split(/\n{2,}/).map(p=>p.trim()).filter(p=>p.length > 40).slice(0, 6);
  if(!paragraphs.length) return "";
  const bullets = paragraphs.map(p => {
    const m = p.match(/^[^.!?]{15,220}[.!?]/);
    return m ? m[0].trim() : clip(p, 180);
  });
  let out = `<p class="ai-hint" style="margin:0 0 10px;">⚙️ Résumé généré automatiquement <b>sans IA</b> (mode simplifié), à partir de la première phrase de chaque partie du texte.</p>`;
  if(headings.length) out += `<p style="margin:0 0 8px;"><b>Plan repéré :</b> ${headings.slice(0,6).map(h=>escapeHtml(h)).join(" · ")}</p>`;
  out += `<ul class="fiche-list">${bullets.map(b=>`<li>${escapeHtml(b)}</li>`).join("")}</ul>`;
  return out;
}

const COURSE_IMPORT_STEP_LABELS = ["Création de la fiche", "Création du résumé", "Création des quiz", "Création des flashcards", "Création des questions de révision"];

function courseImportStart(){
  const ci = state.courseImport;
  if(ci.files.length === 0) return;
  if(aiEngineBusy()) return;
  ci.step = "detect";
  ci.activeIndex = ci.files.findIndex(f => f.status === "pending");
  if(ci.activeIndex === -1) ci.activeIndex = 0;
  // Les étapes détection/génération/résultat ont besoin de plus de place : elles s'affichent
  // toujours dans la page dédiée "Mes matières", que l'import ait démarré depuis Ressources ou non.
  libGoto("import");
  switchTab("library");
  courseImportProcessFile(ci.activeIndex);
}

/* Extraction + détection pour UN fichier de la file — s'arrête sur l'écran de confirmation
   (statut "review"), ou avance automatiquement au fichier suivant en cas d'échec. */
async function courseImportProcessFile(index){
  const ci = state.courseImport;
  const item = ci.files[index];
  if(!item) return;
  ci.activeIndex = index;

  item.status = "extracting";
  item.cancelled = false;
  item.lastStepError = null;
  courseImportStartTimer(item);
  const signal = ci.genSignal = { cancelled: false };
  aiLog("Début de génération", item.name);
  render();
  let extracted;
  try{
    extracted = item.file ? await extractCourseFileText(item.file, (page, total)=>{
      item.extractProgress = { page, total };
      item.warning = "Lecture du PDF : page " + page + "/" + total + "…";
      render();
    }) : { text: item.extractedText, truncated: false, numPages: null, isScanned: false };
  }catch(e){
    courseImportStopTimer();
    item.status = "error";
    item.error = e.message || "Erreur lors de la lecture du fichier.";
    render();
    courseImportAdvanceIfNeeded(index);
    return;
  }
  if(signal.cancelled) return courseImportHandleCancelled(item);
  item.extractedText = extracted.text;
  item.charCount = extracted.text.length;
  item.numPages = extracted.numPages || null;
  item.warning = extracted.truncated ? "Document très long : seules les 100 premières pages ont été lues." : null;
  aiLog("Longueur du cours", item.charCount + " caractères");

  if(extracted.isScanned){
    courseImportStopTimer();
    item.status = "error";
    item.error = "Ce PDF ne contient pas de texte exploitable (probablement des pages scannées/images). L'OCR n'est pas disponible pour l'instant. Importe un PDF contenant du vrai texte, ou colle le contenu directement.";
    render();
    courseImportAdvanceIfNeeded(index);
    return;
  }
  if(item.extractedText.trim().length < COURSE_IMPORT_MIN_CHARS){
    courseImportStopTimer();
    item.status = "error";
    item.error = "Ce fichier semble vide ou illisible. Ajoute du contenu, ou colle le texte de ton cours directement.";
    render();
    courseImportAdvanceIfNeeded(index);
    return;
  }

  item.status = "detecting";
  ci.busy = true;
  aiLog("Étape 1/3 : analyse du contenu");
  render();
  // L'extraction a réussi : à partir d'ici, l'import ne doit plus jamais être
  // considéré comme un échec juste parce que l'IA locale est indisponible.
  // La détection automatique (titre/matière/notions) est une amélioration
  // optionnelle apportée par l'IA quand elle est prête ; sinon, on retombe
  // sur une détection simple basée sur le nom du fichier et la structure du
  // texte, et l'utilisateur complète/valide les champs à la main.
  const aiReady = await tryEnsureImportAIReady();
  try{
    let meta;
    if(aiReady){
      try{
        const built = await buildWorkingCourseText(item.extractedText, (i,total)=>{
          item.error = null;
          item.chunkProgress = { i, total };
          item.warning = "Cours long : analyse en cours (" + (i+1) + "/" + total + ")…";
          render();
        }, signal);
        if(signal.cancelled) return courseImportHandleCancelled(item);
        item.workingText = built.text;
        item.warning = built.wasCondensed ? "Cours long : condensé automatiquement en " + built.chunkCount + " section(s) avant génération." : item.warning;
        aiLog("Nombre de parties", built.chunkCount);
        meta = await detectCourseMeta(built.text, item.name, signal);
        if(signal.cancelled) return courseImportHandleCancelled(item);
      }catch(e){
        // La détection IA a échoué en cours de route : on ne perd pas le cours,
        // on retombe sur la détection simple.
        item.workingText = clip(item.extractedText, 20000);
        meta = heuristicDetectMeta(item.extractedText, item.name);
        item.aiUnavailable = true;
        item.aiError = "La détection automatique par IA a échoué (" + (e.message || "erreur inconnue") + "). Les champs ci-dessous ont été pré-remplis automatiquement à partir du fichier — vérifie-les.";
      }
    } else {
      item.workingText = clip(item.extractedText, 20000);
      meta = heuristicDetectMeta(item.extractedText, item.name);
      item.aiUnavailable = true;
    }
    const matched = matchSubjectByName(meta.subjectName);
    item.detected = {
      title: meta.title,
      subjectId: matched ? matched.id : null,
      newSubjectName: matched ? "" : (meta.subjectName || "Autre"),
      chapterTitle: meta.chapterTitle,
      level: meta.level,
      semesterId: SEMESTERS[0].id,
      notions: meta.notions,
    };
    item.status = "review";
  }catch(e){
    item.status = "error";
    item.error = e.message || "Erreur lors de l'analyse du cours.";
  }finally{
    ci.busy = false;
    courseImportStopTimer();
    render();
  }
}

/* Arrête proprement une génération annulée en cours d'analyse/extraction —
   ne touche jamais au texte déjà extrait ni aux données déjà sauvegardées. */
function courseImportHandleCancelled(item){
  courseImportStopTimer();
  state.courseImport.busy = false;
  item.status = "cancelled";
  item.cancelled = true;
  aiLog("Génération annulée");
  render();
}

function courseImportAdvanceIfNeeded(index){
  const ci = state.courseImport;
  const next = ci.files.findIndex((f,i) => i > index && f.status === "pending");
  if(next !== -1){ courseImportProcessFile(next); return; }
  if(ci.files.every(f => f.status === "error" || f.status === "done")) ci.step = "result";
  render();
}

/* Génère les 5 supports pour le fichier en confirmation, étape par étape — une étape en échec
   n'empêche pas les suivantes, et reste individuellement relançable (courseImportRetryStep). */
async function courseImportGenerate(index){
  const ci = state.courseImport;
  const item = ci.files[index];
  if(!item || item.status !== "review" || aiEngineBusy()) return;
  item.aiError = null;
  try{
    await ensureImportAIReady();
  }catch(e){
    // L'IA reste indisponible : on reste sur l'écran de révision (le cours
    // n'est ni généré ni perdu) avec un message précis et la possibilité
    // d'enregistrer sans IA à la place.
    item.aiError = e.message;
    render();
    return;
  }
  item.status = "generating";
  item.failedSteps = [];
  item.heuristicMode = false;
  item.lastStepError = null;
  item.cancelled = false;
  ci.busy = true;
  ci.step = "generating";
  const signal = ci.genSignal = { cancelled: false };
  courseImportStartTimer(item);
  aiLog("Étape 2/3 : génération des supports");
  render();
  await courseImportRunAllSteps(item, signal);
  ci.busy = false;
  if(signal.cancelled){
    courseImportHandleCancelled(item);
    return;
  }
  aiLog("Étape 3/3 : finalisation");
  await courseImportFinalize(index);
  courseImportStopTimer();
  aiLog("Génération terminée");
}

/* "Enregistrer sans IA" : sauvegarde immédiatement le cours avec le texte déjà
   extrait, plus une fiche/des flashcards/un quiz simples construits sans
   modèle (mode de secours). Le cours reste ensuite généralisable via
   "Générer avec l'IA" depuis sa fiche, dès que l'IA sera disponible. */
async function courseImportSaveWithoutAI(index){
  const ci = state.courseImport;
  const item = ci.files[index];
  if(!item || item.status !== "review" || ci.busy) return;
  courseImportStopTimer();
  ci.busy = true;
  item.status = "generating";
  item.heuristicMode = true;
  item.genStepIndex = -1;
  ci.step = "generating";
  render();
  const h = buildHeuristicCourseMaterials(item.extractedText);
  item.generated.fiche = h.fiche;
  item.failedSteps = ["summary", "reviewQuestions"];
  if(h.flashcards.length) item.generated.flashcards = h.flashcards; else item.failedSteps.push("flashcards");
  if(h.quiz.length) item.generated.quiz = h.quiz; else item.failedSteps.push("quiz");
  ci.busy = false;
  await courseImportFinalize(index, { aiSkipped: true });
}

async function courseImportRunAllSteps(item, signal){
  const meta = { title: item.detected.title, chapterTitle: item.detected.chapterTitle, notions: item.detected.notions, sourceCharCount: item.charCount };
  const steps = [
    {key:"fiche", fn: generateCourseFiche},
    {key:"summary", fn: generateCourseSummary},
    {key:"quiz", fn: generateCourseQuizFromText},
    {key:"flashcards", fn: generateCourseFlashcardsFromText},
    {key:"reviewQuestions", fn: generateCourseReviewQuestions},
  ];
  for(let i=0;i<steps.length;i++){
    if(signal && signal.cancelled) return;
    item.genStepIndex = i;
    item.currentStepStartedAt = Date.now();
    render();
    try{
      item.generated[steps[i].key] = await steps[i].fn(item.workingText, meta, signal);
      if(signal && signal.cancelled) return;
      item.failedSteps = item.failedSteps.filter(k => k !== steps[i].key);
      item.lastStepError = null;
    }catch(e){
      if(signal && signal.cancelled) return;
      if(!item.failedSteps.includes(steps[i].key)) item.failedSteps.push(steps[i].key);
      const classified = classifyGenerationError(e);
      item.lastStepError = classified;
      console.error("[EM Lyon Révision · IA] Erreur de génération :", steps[i].key, e);
    }
  }
  item.genStepIndex = -1;
}

/* Relance uniquement l'étape indiquée (ex. après un échec), sans tout refaire. */
async function courseImportRetryStep(index, key){
  const ci = state.courseImport;
  const item = ci.files[index];
  if(!item || aiEngineBusy()) return;
  const fns = { fiche: generateCourseFiche, summary: generateCourseSummary, quiz: generateCourseQuizFromText, flashcards: generateCourseFlashcardsFromText, reviewQuestions: generateCourseReviewQuestions };
  if(!fns[key]) return;
  ci.busy = true;
  item.status = "generating";
  item.genStepIndex = COURSE_IMPORT_STEP_LABELS.length; // affiche juste "génération en cours" générique
  render();
  const meta = { title: item.detected.title, chapterTitle: item.detected.chapterTitle, notions: item.detected.notions, sourceCharCount: item.charCount };
  try{
    item.generated[key] = await fns[key](item.workingText, meta);
    item.failedSteps = item.failedSteps.filter(k => k !== key);
    item.lastStepError = null;
  }catch(e){
    if(!item.failedSteps.includes(key)) item.failedSteps.push(key);
    item.lastStepError = classifyGenerationError(e);
    console.error("[EM Lyon Révision · IA] Erreur de génération :", key, e);
  }
  item.genStepIndex = -1;
  ci.busy = false;
  if(item.resultChapterId){
    // le cours existe déjà (relance après finalisation) : on met simplement à jour le chapitre sauvegardé
    const ch = findAnyChapter(item.resultChapterId);
    if(ch) courseImportApplyGeneratedToChapter(ch, item);
    item.status = "done";
  } else {
    item.status = "review";
  }
  render();
}

function courseImportApplyGeneratedToChapter(ch, item){
  if(item.generated.fiche) ch.content = item.generated.fiche;
  if(item.generated.summary) ch.summary = item.generated.summary;
  if(item.generated.quiz) ch.aiQuiz = item.generated.quiz;
  if(item.generated.flashcards) ch.aiFlashcards = item.generated.flashcards;
  if(item.generated.reviewQuestions) ch.aiReviewQuestions = item.generated.reviewQuestions;
  ch.updatedAt = Date.now();
  saveUserChapters();
}

/* Génère (ou complète) les supports IA d'un cours déjà enregistré (utilisé
   depuis le bandeau "Génération IA en attente" de la fiche du chapitre, ou
   depuis l'écran de résultat d'un import en mode simplifié). Ne réécrase pas
   le texte original ni les métadonnées déjà en place. */
async function libGenerateChapterAI(chapterId){
  const ch = findAnyChapter(chapterId);
  if(!ch || !isUserChapter(ch.id) || aiEngineBusy()) return;
  state.libGenerateError = "";
  try{
    await ensureImportAIReady();
  }catch(e){
    showToast("Assistant IA indisponible pour le moment.");
    return;
  }
  state.libGenerateBusy = chapterId;
  render();
  const sourceText = chapterSourceText(ch);
  const item = {
    workingText: clip(sourceText, COURSE_GEN_CONTEXT_CHARS),
    charCount: sourceText.length,
    detected: { title: ch.title, chapterTitle: ch.desc || ch.title, notions: ch.keyNotions || [] },
    generated: {}, failedSteps: [], genStepIndex: -1,
  };
  await courseImportRunAllSteps(item);
  courseImportApplyGeneratedToChapter(ch, item);
  ch.generationPending = false;
  ch.aiSkipped = false;
  ch.generationFailedSteps = item.failedSteps;
  saveUserChapters();
  state.libGenerateBusy = null;
  render();
}

async function courseImportFinalize(index, opts){
  opts = opts || {};
  const ci = state.courseImport;
  const item = ci.files[index];
  if(!item) return;
  const d = item.detected;

  let subjectId = d.subjectId;
  if(!subjectId){
    subjectId = genLibId("subj");
    state.userSubjects.push({
      id: subjectId, name: d.newSubjectName || "Autre", semesterId: d.semesterId || SEMESTERS[0].id,
      icon: "📥", color: SUBJECT_COLORS[state.userSubjects.length % SUBJECT_COLORS.length],
      description: "Matière créée automatiquement lors de l'import d'un cours.", builtin: false,
    });
    saveUserSubjects();
  }

  const chapterId = genLibId("chap");

  let hasOriginalFile = false;
  if(item.file && courseFileKind(item.file) === "pdf"){
    try{ await saveCourseFileBlob(chapterId, item.file); hasOriginalFile = true; }
    catch(e){ console.error("Impossible d'enregistrer le PDF original :", e); }
  }

  state.userChapters.push({
    id: chapterId, subjectId,
    num: pad2(chaptersOfSubject(subjectId).length + 1),
    title: d.title, desc: (d.chapterTitle && d.chapterTitle !== d.title) ? d.chapterTitle : "",
    level: d.level || "",
    content: item.generated.fiche || item.extractedText.slice(0, 4000),
    originalText: clip(item.extractedText, 20000),
    summary: item.generated.summary || "",
    aiQuiz: (item.generated.quiz || []).map(q => Object.assign({}, q, {chapterId})),
    aiFlashcards: (item.generated.flashcards || []).map(c => Object.assign({}, c, {chapterId})),
    aiReviewQuestions: item.generated.reviewQuestions || [],
    keyNotions: d.notions || [],
    sourceFileName: item.name || "",
    pageCount: item.numPages || null,
    hasOriginalFile,
    originalFileName: item.file ? item.file.name : "",
    originalFileMime: item.file ? item.file.type : "",
    createdAt: Date.now(), updatedAt: Date.now(),
    markedReviewed: false,
    aiSkipped: !!opts.aiSkipped,
    heuristicMode: !!item.heuristicMode,
    generationPending: !!opts.aiSkipped,
  });
  saveUserChapters();
  logRecentAdd("Cours importé — " + d.title);

  item.resultChapterId = chapterId;
  item.resultSubjectId = subjectId;
  // Le cours est déjà enregistré à ce stade (texte extrait + fiche minimale) :
  // l'import n'est donc jamais considéré comme un échec ici, même si aucune
  // génération IA n'a pu être obtenue.
  item.status = "done";

  const next = ci.files.findIndex((f,i) => i > index && f.status === "pending");
  if(next !== -1){ ci.step = "detect"; courseImportProcessFile(next); return; }
  ci.step = "result";
  render();
}

function courseImportReset(){
  courseImportStopTimer();
  state.courseImport = { step:"pick", busy:false, files:[], activeIndex:0, pasteText:"", dragOver:false, genSignal:null };
  render();
}

/* Point d'entrée commun (dashboard / Mes matières / Ressources) : repart d'un import
   vierge, sauf si une importation est déjà en cours (pour ne pas la perdre). */
function goToCourseImport(){
  const ci = state.courseImport;
  const hasActiveWork = ci.files.some(f => ["pending","extracting","detecting","review","generating"].includes(f.status));
  if(!hasActiveWork){
    courseImportStopTimer();
    state.courseImport = { step:"pick", busy:false, files:[], activeIndex:0, pasteText:"", dragOver:false, genSignal:null };
  }
  libGoto("import");
}

function fmtFileSize(bytes){
  if(bytes < 1024) return bytes + " o";
  if(bytes < 1024*1024) return Math.round(bytes/1024) + " Ko";
  return (Math.round(bytes/1024/1024*10)/10) + " Mo";
}

function renderCourseImportWizard(){
  const ci = state.courseImport;
  const activeItem = ci.files[ci.activeIndex];
  if(activeItem && activeItem.status === "cancelled") return renderImportCancelled(activeItem);
  if(ci.step === "generating") return renderImportGenerating();
  if(ci.step === "result") return renderImportResult();
  if(ci.step === "detect") return renderImportDetectOrReview();
  return renderImportPick();
}

/* Bloc de progression partagé (barre + %, étape sur 3, minuteur, annuler,
   avertissement adapté à la longueur, avertissement "ça prend du temps")
   — utilisé à la fois pendant l'analyse (extraction/découpage) et pendant
   la génération des supports, sur une échelle continue 0-100 %. */
function renderCourseGenProgressHtml(item){
  const info = courseImportProgressInfo(item);
  const elapsed = item.genStartedAt ? fmtElapsed(Date.now() - item.genStartedAt) : "0 s";
  const groupLabel = COURSE_GEN_GROUP_LABELS[info.groupIndex] || "";
  let html = `<div class="card import-progress-card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:2px;">
      <b style="font-size:13px;">Étape ${info.groupIndex} sur ${COURSE_GEN_GROUP_COUNT} — ${escapeHtml(groupLabel)}</b>
      <span style="font-size:12px;color:var(--muted);flex-shrink:0;">${info.percent} %</span>
    </div>
    <div class="ai-loadbar"><div class="ai-loadbar-fill" style="width:${info.percent}%;"></div></div>
    <p class="s" style="margin:8px 0 0;font-size:12.5px;color:var(--ink-soft);">${escapeHtml(info.label)}</p>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:10px;">
      <span style="font-size:12px;color:var(--muted);">⏱️ Temps écoulé : ${escapeHtml(elapsed)}</span>
      <button class="btn-text" id="import-cancel-gen-btn" style="color:var(--red-dark);">✕ Annuler la génération</button>
    </div>
  </div>`;

  const cc = item.charCount || 0;
  if(cc > 20000){
    html += `<div class="ai-notice" style="margin-top:12px;">📚 Ton cours est assez long.<br>L'IA peut prendre plusieurs minutes pour l'analyser. Tu peux laisser cette page ouverte pendant le traitement.<br>Ne ferme pas cet onglet tant que la génération n'est pas terminée.</div>`;
  } else if(cc > 8000){
    html += `<p class="ai-hint" style="margin-top:10px;">L'analyse peut prendre un peu de temps.</p>`;
  }

  const stepStarted = item.currentStepStartedAt || item.genStartedAt;
  if(stepStarted && (Date.now() - stepStarted) > 45000){
    html += `<div class="ai-error" style="margin-top:10px;">⏳ L'analyse prend plus de temps que prévu.<br>L'IA travaille peut-être encore sur ton cours. Tu peux attendre ou annuler la génération.</div>`;
  }
  if(item.lastStepError){
    html += `<div class="ai-error" style="margin-top:10px;">${escapeHtml(item.lastStepError.message)}</div>`;
  }
  return html;
}

/* "Annuler la génération" : demande confirmation seulement si la génération
   est déjà avancée, arrête le minuteur, signale l'annulation au traitement
   en cours (qui s'arrête à son prochain point de contrôle) — ne supprime
   jamais le texte déjà extrait ni les données déjà sauvegardées. */
function courseImportCancel(){
  const ci = state.courseImport;
  const item = ci.files[ci.activeIndex];
  if(!item) return;
  const info = courseImportProgressInfo(item);
  if(info.percent >= 10 && !confirm("Annuler la génération en cours ? Ton cours original (texte extrait) ne sera pas supprimé.")) return;
  if(ci.genSignal) ci.genSignal.cancelled = true;
}

/* Renvoie un fichier annulé vers l'étape appropriée pour relancer :
   l'écran de révision s'il avait déjà été détecté, ou une ré-analyse complète sinon. */
function courseImportRelaunch(index){
  const ci = state.courseImport;
  const item = ci.files[index];
  if(!item) return;
  item.cancelled = false;
  item.lastStepError = null;
  ci.step = "detect";
  if(item.detected){
    item.status = "review";
    render();
  } else {
    item.status = "pending";
    courseImportProcessFile(index);
  }
}

function renderImportGenerating(){
  const ci = state.courseImport;
  const item = ci.files[ci.activeIndex];
  if(!item) return renderImportPick();
  const curIdx = item.genStepIndex;
  let html = `<h1 class="page-title">Création de tes supports de révision…</h1>
  <p class="ai-intro">« ${escapeHtml(item.detected ? item.detected.title : item.name)} »</p>`;
  html += renderCourseGenProgressHtml(item);

  const steps = ["Lecture du contenu", "Analyse du cours"].concat(COURSE_IMPORT_STEP_LABELS, ["Finalisation"]);
  // Les deux premières étapes (lecture/analyse) sont déjà faites au moment où "generating" s'affiche.
  const doneCount = Math.min(steps.length, curIdx < 0 ? steps.length : curIdx + 2);
  html += `<details class="ai-extra" style="margin-top:12px;">
    <summary>Détail des étapes (${doneCount}/${steps.length} terminée${doneCount>1?"s":""})</summary>
    <div class="card import-progress-card" style="margin-top:8px;">`;
  html += steps.map((label,i)=>{
    const stepOffset = i - 2; // aligne sur genStepIndex (0 = fiche)
    let state_ = "done";
    if(i < 2) state_ = "done";
    else if(stepOffset === curIdx) state_ = "current";
    else if(stepOffset > curIdx) state_ = "pending";
    return `<div class="import-step ${state_}">
      <span class="dot">${state_==="done" ? "✓" : (state_==="current" ? "" : "")}</span>
      <span class="lbl">${label}</span>
      ${state_==="current" ? `<span class="ai-spinner" style="margin-left:auto;"></span>` : ""}
    </div>`;
  }).join("");
  html += `</div></details>
  <footer class="hint">Cette étape peut prendre un moment selon la longueur du cours et ton appareil — ne ferme pas cette fenêtre.</footer>`;
  return html;
}

function renderImportResult(){
  const ci = state.courseImport;
  const files = ci.files;
  if(files.length === 0) return renderImportPick();

  if(files.length === 1){
    const item = files[0];
    if(item.status === "error"){
      return `<h1 class="page-title">Import impossible</h1>
      <div class="ai-error">${escapeHtml(item.error || "Erreur inconnue.")}</div>
      <div class="actions" style="justify-content:flex-start;margin-top:16px;">
        <button class="btn-text" id="import-back-btn">← Retour à mes cours</button>
      </div>`;
    }

    const subj = ch ? findSubject(ch.subjectId) : null;
    const quizLen = (ch && ch.aiQuiz) ? ch.aiQuiz.length : 0;
    const cardsLen = (ch && ch.aiFlashcards) ? ch.aiFlashcards.length : 0;

      <div class="import-stats-row">
        <span>🧠 ${quizLen} question${quizLen>1?"s":""} de quiz</span>
        <span>🃏 ${cardsLen} flashcard${cardsLen>1?"s":""}</span>
        <span>🎯 ${qLen} question${qLen>1?"s":""} de révision</span>
        <span>💡 ${(item.detected.notions||[]).length} notion${(item.detected.notions||[]).length>1?"s":""}</span>
        <span>📅 importé le ${new Date(ch?ch.createdAt:Date.now()).toLocaleDateString(currentLocaleTag())}</span>

    if(item.heuristicMode){

      </div>`;
    } else if(item.failedSteps && item.failedSteps.length){
      const labels = {fiche:"la fiche", summary:"le résumé", quiz:"le quiz", flashcards:"les flashcards", reviewQuestions:"les questions de révision"};
      html += `<div class="ai-notice" style="margin-top:14px;">${item.failedSteps.map(k=>labels[k]).join(", ")} : à régénérer depuis les outils IA du chapitre.</div>`;
    }
    html += `<div class="import-result-actions">
        <button class="btn red" data-goto-chapter="${item.resultChapterId}">📖 Ouvrir la fiche de cours</button>
        ${quizLen ? `<button class="btn outline" data-goto-quiz="${item.resultChapterId}">🧠 Commencer le quiz</button>` : ""}
        ${cardsLen ? `<button class="btn outline" data-goto-flash="${item.resultChapterId}">🃏 Réviser les flashcards</button>` : ""}
        <button class="btn outline" data-goto-ask="${item.resultChapterId}">🤖 Poser une question à l'IA</button>
        <button class="btn-text" data-mark-reviewed="${item.resultChapterId}">✅ Marquer comme révisé</button>
      </div>
      <button class="btn-text" id="import-back-btn" style="margin-top:14px;">← Retour à mes cours</button>
    </div>`;
    return html;
  }

  // plusieurs fichiers : récapitulatif compact
  const doneCount = files.filter(f=>f.status==="done").length;
  let html = `<h1 class="page-title">${doneCount}/${files.length} cours prêts</h1>
  <div class="import-result-list">`;
  files.forEach(f=>{
    const ch = f.resultChapterId ? findAnyChapter(f.resultChapterId) : null;
    const ok = f.status === "done";
    html += `<div class="import-result-row ${ok?"ok":"ko"}">

      ${ok ? `<button class="btn-text" data-goto-chapter="${f.resultChapterId}">Ouvrir →</button>` : ""}
    </div>`;
  });
  html += `</div>
  <div class="actions" style="justify-content:flex-start;margin-top:16px;">
    <button class="btn-text" id="import-back-btn">← Retour à mes cours</button>
    <button class="btn outline" id="import-new-btn">Importer d'autres cours</button>

  return html;
}

function qItemHtml(q){
  const m = masteryOf(q);
  const tier = masteryTier(m);
  const s = qstat(q);
  const rate = successRateOf(q);
  const themeLbl = THEME_META[q.theme] ? THEME_META[q.theme].short : "";
  const width = m === null ? 0 : m;
  let meta;
  if(!s || !s.seen){
    meta = "Jamais répondue";
  } else {
    meta = `${s.correct}/${s.seen} réussies · ${rate}% de réussite` + (s.lastDate ? ` · ${fmtRelativeDate(s.lastDate)}` : "");
  }
  return `<div class="q-item">
    <div class="q-top">
      <div>
        <div class="q-theme">${themeLbl}</div>
        <div class="q-text">${escapeHtml(q.q)}</div>
      </div>
      <span class="m-chip ${tier.key}">${tier.label}${m===null ? "" : " · "+m+"%"}</span>
    </div>
    <div class="q-bar-track"><div class="q-bar-fill ${tier.key}" style="width:${width}%"></div></div>
    <div class="q-meta">${meta}</div>
  </div>`;
}

  html += `<footer class="hint">Réussies, échouées, jamais répondues : tout est conservé dans ce navigateur et survit à la fermeture de l'onglet.</footer>`;
  return html;
}

/* ============================================================
   7quinquies. MODE EXAMEN
   ============================================================ */
const EXAM_SECONDS_PER_QUESTION = 60;
let examTimerId = null;

function examAvailableQuestions(){
  const ex = state.exam;
  const chs = ex.chapters.length ? CHAPTERS.filter(c => ex.chapters.includes(c.id)) : CHAPTERS;
  const themes = chs.flatMap(c => c.themes);
  return QUESTIONS.filter(q => themes.includes(q.theme));
}

function examCountResolved(){
  const avail = examAvailableQuestions().length;
  return state.exam.count === "all" ? avail : Math.min(state.exam.count, avail);
}

function examScopeLabel(){
  const ex = state.exam;
  if(ex.chapters.length === 0) return "Tout le programme";
  if(ex.chapters.length === 1){
    const ch = CHAPTERS.find(c => c.id === ex.chapters[0]);
    return ch ? ch.num + " · " + ch.title : "1 chapitre";
  }
  return ex.chapters.length + " chapitres";
}

function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60);
  const s = sec % 60;
  return pad2(m) + ":" + pad2(s);
}

function examElapsed(){
  if(!state.exam.startTs) return 0;
  return Math.round((Date.now() - state.exam.startTs)/1000);
}

function startExam(){
  const ex = state.exam;
  const n = examCountResolved();
  if(n === 0) return;
  ex.pool = shuffle(examAvailableQuestions()).slice(0, n);
  ex.answers = new Array(n).fill(null);
  ex.idx = 0;
  ex.startTs = Date.now();
  ex.limitSec = ex.timerMode === "down" ? n * EXAM_SECONDS_PER_QUESTION : null;
  ex.result = null;
  ex.screen = "running";
  state.tab = "exam";
  accrueTime();
  render();
  window.scrollTo(0,0);
}

function examTick(){
  const el = document.getElementById("exam-clock");
  if(!el) return;
  const ex = state.exam;
  if(ex.timerMode === "down"){
    const left = ex.limitSec - examElapsed();
    el.textContent = "⏱ " + fmtClock(left) + " restantes";
    el.classList.toggle("warn", left <= 60);
    if(left <= 0){ finishExam(true); }
  } else {
    el.textContent = "⏱ " + fmtClock(examElapsed());
  }
}

function startExamTimer(){
  stopExamTimer();
  if(state.exam.timerMode === "off") return;
  examTimerId = setInterval(examTick, 1000);
}
function stopExamTimer(){
  if(examTimerId){ clearInterval(examTimerId); examTimerId = null; }
}

function examSelect(i){
  state.exam.answers[state.exam.idx] = i;
  document.querySelectorAll("#exam-options .opt").forEach((btn,k)=>{
    btn.classList.toggle("selected", k === i);
  });
  const gridBtn = document.querySelector('.exam-grid button[data-goq="'+state.exam.idx+'"]');
  if(gridBtn) gridBtn.classList.add("done");
  const counter = document.getElementById("exam-answered");
  if(counter) counter.textContent = state.exam.answers.filter(a => a !== null).length + " / " + state.exam.pool.length + " répondues";
}

function examGoTo(i){
  const ex = state.exam;
  if(i < 0 || i >= ex.pool.length) return;
  ex.idx = i;
  render();
  window.scrollTo(0,0);
}

function finishExam(auto){
  const ex = state.exam;
  if(ex.screen !== "running") return;
  const unanswered = ex.answers.filter(a => a === null).length;
  if(!auto && unanswered > 0){
    if(!confirm("Il reste " + unanswered + " question" + (unanswered>1?"s":"") + " sans réponse. Elles seront comptées comme fausses. Terminer quand même ?")) return;
  }
  stopExamTimer();

  const timeUsed = ex.timerMode === "down"
    ? Math.min(examElapsed(), ex.limitSec)
    : examElapsed();

  let correct = 0;
  const details = [];
  ex.pool.forEach((q,i)=>{
    const given = ex.answers[i];
    const ok = given === q.correct;
    if(ok) correct++;
    trackQuizAnswer(q, ok);
    if(!ok){
      details.push({
        uid: q.uid,
        theme: q.theme,
        q: q.q,
        given: given === null ? null : q.opts[given],
        good: q.opts[q.correct],
        exp: q.exp,
      });
    }
  });

  const total = ex.pool.length;
  const pct = Math.round((correct/total)*100);
  const result = {
    date: new Date().toISOString(),
    dateKey: todayKey(),
    scopeLabel: examScopeLabel(),
    total, correct,
    wrong: total - correct,
    unanswered,
    pct,
    timeUsed,
    autoEnded: !!auto,
    wrongUids: details.map(d => d.uid),
    details,
  };
  ex.result = result;
  ex.history.unshift({
    date: result.date, dateKey: result.dateKey, scopeLabel: result.scopeLabel,
    total, correct, pct, timeUsed, unanswered,
  });
  if(ex.history.length > 20) ex.history.length = 20;
  saveExamHistory();
  logActivity("exam", "exam", "Examen — " + result.scopeLabel + " (" + total + " questions)", correct, total);

  ex.screen = "results";
  render();
  window.scrollTo(0,0);
}

function abandonExam(){
  if(!confirm("Quitter l'examen ? Tes réponses ne seront pas enregistrées.")) return;
  stopExamTimer();
  state.exam.screen = "setup";
  render();
  window.scrollTo(0,0);
}

function statusTier(prog){
  if(!prog) return { key:"none", label:"Non commencé", pct:0 };
  if(prog.best >= 75) return { key:"done", label:"Terminé", pct:prog.best };
  return { key:"progress", label:"En cours", pct:prog.best };
}

function fmtScore(prog){
  const t = statusTier(prog);
  if(t.key === "none") return {cls:"none", txt:"Non commencé"};
  return {cls:t.key, txt: t.pct + "%"};
}

function chapterAvg(chapter, progressMap){
  const scores = (chapter.themes||[])
    .map(t => progressMap[t])
    .filter(Boolean)
    .map(p => p.best);
  if(scores.length === 0) return null;
  return Math.round(scores.reduce((a,b)=>a+b,0) / scores.length);
}

function chapterHtml(ch){
  const cm = chapterMetrics(ch);
  const tier = cm.answered === 0
    ? { key:"none", label:"Non commencé" }
    : (cm.mastered ? { key:"done", label:"Maîtrisé" } : { key:"progress", label:"En cours" });
  let html = `<div class="chapter">
    <div class="chapter-head">
      <div class="chapter-num">${ch.num}</div>
      <div class="chapter-headtext">
        <div class="title-row">
          <h2>${ch.title}</h2>
          <span class="level-badge ${ch.level}">${levelName(ch.level)}</span>
        </div>
        <p>${ch.desc}</p>
      </div>
      <div class="chapter-headright">
        <div class="avg ${cm.answered===0?'none':''}">${cm.answered===0 ? '—' : cm.mastery + '%'}</div>
        <div class="avglbl">maîtrise</div>
        <span class="status-pill ${tier.key}">${tier.label}</span>
      </div>
    </div>
    <div class="chapter-progress-track"><div class="chapter-progress-fill ${tier.key}" style="width:${cm.mastery}%"></div></div>
    <div class="subgrid">`;

  ch.themes.forEach(tid => {
    const qs = QUESTIONS.filter(q => q.theme === tid);
    const tm = themeMastery(tid);
    const answered = qs.filter(q => masteryOf(q) !== null).length;
    const badgeCls = answered === 0 ? "none" : (tm >= 80 ? "done" : "progress");
    const badgeTxt = answered === 0 ? "Non commencé" : tm + "%";
    html += `<button class="subcard" data-theme="${tid}">
      <div class="name">${THEME_META[tid].label}</div>
      <div class="meta">
        <span class="count">${qs.length} questions · ${answered} vue${answered>1?"s":""}</span>
        <span class="badge ${badgeCls}">${badgeTxt}</span>
      </div>
    </button>`;
  });

  html += `</div>
    <div class="chapter-actions">
      <button class="btn outline" data-mixchapter="${ch.id}">Réviser le chapitre complet</button>
    </div>
  </div>`;
  return html;
}

const LETTERS = ["A","B","C","D"];

/* ============================================================
   7bis. QUIZ — liaison "Dans ton cours" (cohérente avec les flashcards)
   ------------------------------------------------------------
   Réutilise TELLES QUELLES les fonctions génériques déjà construites pour
   les flashcards (flashcardSourceText, locateQuoteInText, extractKeywords,
   findBestKeywordMatch, findNearbyExampleSpan, buildHighlightedExcerptHtml,
   buildPlainExcerptHtml) — aucune n'est modifiée ici, seulement appelée.
   resolveFlashcardCourseRef()/renderFlashSourcePanel() (code propre aux
   flashcards) ne sont ni touchées ni réutilisées directement : le quiz a
   son propre cache et ses propres statuts, avec les mêmes règles de fond
   (citation exacte > réponse littérale > mots-clés question+réponse+
   explication, jamais de passage inventé). */
const quizSourceCache = new WeakMap();

/* Chapitre d'une question : la question elle-même si elle porte déjà
   chapterId (nouvelles questions IA), sinon le chapitre intégré propriétaire
   de son thème (question du programme, JAMAIS ambigu même dans un paquet
   mélangé puisque chaque thème appartient à un seul chapitre), sinon —
   seulement si le paquet en cours ne mélange pas plusieurs chapitres — le
   chapitre du paquet. Ne devine jamais dans un paquet mélangé. */
function resolveQuizQuestionChapterId(q, deckScope){
  if(!q) return null;
  if(q.chapterId) return q.chapterId;
  if(q.theme && q.theme !== "ai"){
    const ch = CHAPTERS.find(c => c.themes.includes(q.theme));
    if(ch) return ch.id;
  }
  if(typeof deckScope === "string" && deckScope.indexOf("chapter:") === 0) return deckScope.slice(8);
  return null;
}

function resolveQuizCourseRef(q, deckScope){
  if(!q) return { status: "no_chapter" };
  if(quizSourceCache.has(q)) return quizSourceCache.get(q);

  const chapterId = resolveQuizQuestionChapterId(q, deckScope);
  const text = chapterId ? flashcardSourceText(chapterId) : "";

  let result;
  if(!text){
    result = { status: "no_chapter" };
  } else {
    const correctText = Array.isArray(q.opts) ? q.opts[q.correct] : "";
    let loc = q.sourceQuote ? locateQuoteInText(text, q.sourceQuote) : null;
    if(!loc && correctText) loc = locateQuoteInText(text, correctText);
    if(!loc){
      const keywords = extractKeywords((q.q || "") + " " + (correctText || "") + " " + (q.exp || ""));
      loc = findBestKeywordMatch(text, keywords);
    }
    if(!loc){
      result = { status: "not_found" };
    } else {
      const excerptHtml = buildHighlightedExcerptHtml(text, loc.start, loc.end);
      let exampleHtml = null;
      if(q.exampleQuote){
        const exLoc = locateQuoteInText(text, q.exampleQuote);
        if(exLoc) exampleHtml = buildPlainExcerptHtml(text, exLoc.start, exLoc.end);
      }
      if(!exampleHtml){
        const nearby = findNearbyExampleSpan(text, loc.end, 400);
        if(nearby) exampleHtml = buildPlainExcerptHtml(text, nearby.start, nearby.end);
      }
      result = { status: "found", excerptHtml, exampleHtml };
    }
  }
  quizSourceCache.set(q, result);
  return result;
}

function renderQuizCoursePanel(q, open, deckScope){
  const ref = resolveQuizCourseRef(q, deckScope);
  if(ref.status === "no_chapter") return "";
  let body;
  if(ref.status === "not_found"){
    body = `<p class="quiz-source-empty">${t("quiz.source_not_found")}</p>`;
  } else {
    body = `<div class="quiz-source-excerpt">${ref.excerptHtml}</div>` +
      (ref.exampleHtml ? `<p class="quiz-source-example"><b>${t("quiz.example_label")}</b><br>${ref.exampleHtml}</p>` : "");
  }
  return `<div class="quiz-source${open ? " open" : ""}">
    <div class="quiz-source-head"><span class="ico" aria-hidden="true">📖</span><span class="lbl">${t("quiz.in_your_course")}</span></div>
    <button type="button" class="quiz-source-toggle" id="quiz-source-toggle" aria-expanded="${open ? "true" : "false"}">${open ? t("quiz.source_collapse") : t("quiz.source_expand")}</button>
    <div class="quiz-source-collapse"><div class="quiz-source-body">${body}</div></div>
  </div>`;
}

function renderQuiz(){
  const q = state.pool[state.index];
  const total = state.pool.length;
  const pct = Math.round(((state.index) / total) * 100);
  let optsHtml = "";
  q.opts.forEach((opt,i)=>{
    let cls = "qz-opt";
    if(state.answered){
      if(i === q.correct) cls += " qz-opt-correct";
      else if(i === state.selectedOpt) cls += " qz-opt-incorrect";
      else cls += " qz-opt-dim";
    }
    optsHtml += `<button type="button" class="${cls}" data-i="${i}" ${state.answered ? "disabled":""} aria-pressed="${i===state.selectedOpt}">
      <span class="qz-opt-letter" aria-hidden="true">${LETTERS[i]}</span><span class="qz-opt-text">${opt}</span>
    </button>`;
  });

  const isCorrect = state.answered && state.selectedOpt === q.correct;
  const m = masteryOf(q);
  const s = qstat(q);
  const preTier = !state.answered ? masteryTier(m) : null;
  const isLast = state.index === total - 1;

  const feedback = state.answered ? `
    <div class="qz-feedback ${isCorrect ? "ok" : "ko"}" aria-live="polite">
      <div class="qz-verdict">${isCorrect ? t("quiz.correct_verdict") : t("quiz.incorrect_verdict")}</div>
      <div class="qz-why"><span class="qz-why-label">${t("quiz.why_label")}</span><p>${q.exp}</p></div>
      <span class="qz-mastery-line">${s ? t("quiz.mastery_line", {pct: m, correct: s.correct, seen: s.seen}) : t("quiz.ai_not_counted")}</span>
      ${renderQuizCoursePanel(q, !!state.quizSourceOpen, state.playing.scope)}
    </div>` : "";

  return `
    <div class="qz-screen">
      <div class="qz-header">
        <button type="button" class="qz-quit" id="back-btn">${t("quiz.quit")}</button>
        <div class="qz-header-info">
          ${state.smartSession ? `<span class="sr-step-badge">${t("smart.session_step", {n: state.smartSession.stepIndex+1, total: state.smartSession.items.length})}</span>` : ""}
          <span class="qz-chapter">${escapeHtml(state.playing.label)}</span>
          <span class="qz-counter">${t("quiz.question_of", {n: state.index+1, total})}</span>
        </div>
      </div>
      <div class="qz-progress-track"><div class="qz-progress-fill" style="width:${pct}%"></div></div>
      <div class="qz-score-row">${t("quiz.score_prefix")} <b>${state.score}</b> ${state.score===1 ? t("quiz.correct_answer_singular") : t("quiz.correct_answer_plural")}</div>

      <div class="qz-card">
        <div class="qz-meta">
          <span class="qz-tag">${q.ai ? t("quiz.ai_generated") : (THEME_META[q.theme] ? THEME_META[q.theme].short : "")}</span>
          ${(!q.ai && preTier) ? `<span class="m-chip ${preTier.key}">${preTier.label}${m===null?"":" · "+m+"%"}</span>` : ""}
        </div>
        <h2 class="qz-question">${q.q}</h2>
        <div class="qz-options" role="group" aria-label="${t("quiz.options_aria")}">${optsHtml}</div>
        ${feedback}
      </div>

      <div class="qz-actions">
        <button class="btn-text" id="change-theme-btn">${t("quiz.change_theme")}</button>
        <div class="qz-actions-right">
          ${state.answered ? `<button class="ai-inline-btn" id="ai-help-btn">${t("quiz.explain_otherwise")}</button>` : ""}
          <button class="btn red qz-next-btn" id="next-btn" ${state.answered ? "" : "disabled"}>${isLast ? t("quiz.see_results") : t("quiz.next_question")}</button>
        </div>
      </div>

  `;
}

function renderResults(){
  const total = state.pool.length;
  const pct = Math.round((state.score/total)*100);
  const wrongCount = total - state.score;
  const g = globalMetrics();
  let msg;
  if(pct >= 90) msg = t("quiz.msg_excellent");
  else if(pct >= 70) msg = t("quiz.msg_good");
  else if(pct >= 50) msg = t("quiz.msg_ok");
  else msg = t("quiz.msg_weak");

  const sessionErrors = state.recap.filter(r => !r.ok);
  let reviewBlock = "";
  if(sessionErrors.length){
    const items = sessionErrors.slice(0, 6).map(r => {
      const themeLbl = r.q.ai ? t("quiz.ai_generated") : (THEME_META[r.q.theme] ? THEME_META[r.q.theme].label : "");
      return `<div class="qz-review-item">• ${escapeHtml(r.q.q)}${themeLbl ? ` <span class="muted">(${escapeHtml(themeLbl)})</span>` : ""}</div>`;
    }).join("");
    reviewBlock = `<div class="qz-review-block">
      <div class="qz-review-title">${t("quiz.to_review_title")}</div>
      ${items}
      ${sessionErrors.length > 6 ? `<div class="qz-review-item muted">+ ${sessionErrors.length - 6}…</div>` : ""}
    </div>`;
  }

  const timeLine = (typeof state.playing.timeUsed === "number") ? `<div class="qz-results-time">${t("quiz.time_label")} : ${fmtClock(state.playing.timeUsed)}</div>` : "";

  return `
    <div class="qz-results">
      <div class="qz-results-emoji">${t("quiz.finished_title")}</div>
      <div class="qz-results-pct">${pct}%</div>
      <div class="qz-results-frac">${state.score} / ${total}</div>
      <p class="qz-results-msg">${msg}<br><span style="font-size:12px;color:var(--muted);font-weight:700;">${t("quiz.global_mastery", {pct: g.mastery, answered: g.answered, total: g.total})}</span></p>
      <div class="qz-results-stats">
        <span class="qz-results-stat ok">✓ ${t("quiz.correct_count", {n: state.score})}</span>
        <span class="qz-results-stat ko">✕ ${t("quiz.wrong_count", {n: wrongCount})}</span>
      </div>
      ${timeLine}
      ${reviewBlock}
      <div class="qz-results-actions">
        <button class="btn red" id="retry-btn">${t("quiz.restart")}</button>
        ${sessionErrors.length ? `<button class="btn outline" id="review-errors-btn">${t("quiz.review_errors_count", {n: sessionErrors.length})}</button>` : ""}
        <button class="btn-text" id="picker-btn">${t("quiz.continue_revising")}</button>
      </div>
    </div>
  `;
}

function attachResultsEvents(){
  document.getElementById("retry-btn").addEventListener("click", ()=>{
    if(state.playing.custom){

function renderQuizErrorReview(){
  const errors = state.recap.filter(r => !r.ok);
  if(!errors.length){
    return `<div class="qz-results">
      <button class="btn-text" id="back-to-results-btn" style="margin-bottom:18px;">${t("quiz.back_to_results")}</button>
      <p class="qz-results-msg">${t("quiz.no_errors")}</p>
    </div>`;
  }
  const items = errors.map((r, idx) => {
    const q = r.q;
    const givenText = (Array.isArray(q.opts) && q.opts[r.selectedOpt] !== undefined) ? q.opts[r.selectedOpt] : "";
    const correctText = Array.isArray(q.opts) ? q.opts[q.correct] : "";
    return `<div class="qz-erritem">

      <div class="qz-erritem-actions">
        <button class="btn outline small" data-retake="${idx}">${t("quiz.retake_question")}</button>
      </div>

  return `
    <div class="qz-screen">
      <button class="btn-text" id="back-to-results-btn" style="margin-bottom:14px;">${t("quiz.back_to_results")}</button>
      <h2 class="qz-question" style="margin-bottom:6px;">${t("quiz.errors_title")}</h2>
      <p class="qz-results-time" style="text-align:left;margin-bottom:18px;">${t("quiz.errors_subtitle", {n: errors.length})}</p>
      <div class="qz-errlist">${items}</div>
    </div>
  `;
}

function attachQuizErrorReviewEvents(){
  const backBtn = document.getElementById("back-to-results-btn");
  if(backBtn) backBtn.addEventListener("click", ()=>{ state.screen = "results"; render(); });
  document.querySelectorAll("[data-retake]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const errors = state.recap.filter(r => !r.ok);
      const r = errors[parseInt(btn.dataset.retake)];
      if(r) retakeQuizQuestion(r.q);
    });
  });
  document.querySelectorAll(".quiz-source-toggle").forEach((btn, i)=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const panel = btn.closest(".quiz-source");
      const body = panel.querySelector(".quiz-source-collapse");
      const nowOpen = !panel.classList.contains("open");
      panel.classList.toggle("open", nowOpen);
      btn.textContent = nowOpen ? t("quiz.source_collapse") : t("quiz.source_expand");
      btn.setAttribute("aria-expanded", nowOpen ? "true" : "false");
    });
  });
}
