<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EM Lyon Révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --bg:#F8F9FB;
    --surface:#FFFFFF;
    --surface-2:#FCFCFD;
    --border:#E9EAF0;
    --border-strong:#DADCE5;
    --ink:#14151A;
    --ink-soft:#5A5C68;
    --muted:#787A87;
    --navy:#0F1F3D;
    --navy-dark:#0A1630;
    --navy-tint:#EAEEF6;
    --red:#E31C3D;
    --red-dark:#B4152F;
    --red-tint:#FDECEF;
    --red-tint-strong:#FBD9DF;
    --amber:#B4740E;
    --amber-tint:#FBF0DC;
    --amber-strong:#F0D8A8;
    --green:#1B7A54;
    --green-tint:#E6F5EE;
    --green-strong:#BFE5D3;
    --blue:#2C5FA8;
    --blue-tint:#E8EFF9;
    --ring: rgba(227,28,61,0.35);

    /* Alias centralisés (couleurs + typographie) — à ajuster ici pour changer tout le site */
    --font-main: "Inter", Arial, Helvetica, sans-serif;
    --font-heading: "Inter", Arial, Helvetica, sans-serif;
    --color-primary: var(--red);
    --color-primary-dark: var(--red-dark);
    --color-background: var(--bg);
    --color-surface: var(--surface);
    --color-text: var(--ink);
    --color-muted: var(--muted);
    --color-border: var(--border);
    --color-accent: var(--blue);
    --color-success: var(--green);

    --radius-xl:18px;
    --radius-lg:14px;
    --radius-md:10px;
    --radius-sm:7px;
    --shadow-xs: 0 1px 2px rgba(20,21,26,0.05);
    --shadow-sm: 0 1px 3px rgba(20,21,26,0.06), 0 1px 2px rgba(20,21,26,0.04);
    --shadow-md: 0 4px 14px rgba(20,21,26,0.07), 0 1px 3px rgba(20,21,26,0.05);
    --shadow-lg: 0 12px 28px rgba(20,21,26,0.10), 0 2px 6px rgba(20,21,26,0.05);
    --ease: cubic-bezier(.22,.9,.32,1);
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  html{ scroll-behavior:smooth; }

  body{
    background: var(--color-background);
    color: var(--color-text);
    font-family: var(--font-main);
    min-height:100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
    letter-spacing: -0.003em;
  }

  ::selection{ background: var(--red-tint-strong); color: var(--red-dark); }

  a, button{ font-family: inherit; }
  h1, h2, h3, h4{ font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.015em; }

  :focus-visible{
    outline: 2.5px solid var(--red);
    outline-offset: 2px;
    border-radius: 6px;
  }
  button:focus:not(:focus-visible){ outline:none; }

  .wrap{ max-width: 920px; margin: 0 auto; padding: 0 22px 90px; }
  .quizwrap{ max-width: 620px; margin: 0 auto; padding: 34px 20px 70px; }

  /* ===== CONTENT TRANSITION ===== */
  #content{ animation: content-in 0.32s var(--ease); }
  @keyframes content-in{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* ===== TOPBAR ===== */
  .topbar{
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(115deg, var(--red) 0%, var(--red-dark) 100%);
    box-shadow: 0 2px 10px rgba(180,21,47,0.25);
  }
  .topbar-inner{ max-width: 1120px; margin:0 auto; padding: 0 22px; }
  .brandrow{ display:flex; align-items:center; justify-content:space-between; gap: 18px; min-height: 62px; }
  .brand-text{ display:flex; align-items:center; gap: 11px; flex-shrink:0; }
  .brand-mark{
    width: 36px; height: 36px; flex-shrink:0; border-radius: 10px;
    background: var(--red-dark);
    border: 1.5px solid rgba(255,255,255,0.55);
    box-shadow: 0 1px 4px rgba(0,0,0,0.22);
    color: #fff; font-family: var(--font-heading); font-weight:800; font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .brand-text h1{ font-size: 17px; font-weight: 800; margin: 0; letter-spacing:-0.01em; line-height:1.2; color:#fff; }

  /* ===== NAVIGATION PRINCIPALE ===== */
  .mainnav{ display:flex; align-items:stretch; gap: 2px; flex:1; justify-content:center; }
  .mainnav-item{ position:relative; display:flex; }
  .mainnav-link{
    border:none; background:none; padding: 0 13px; height:62px; border-radius:0;
    font-family: var(--font-main); font-weight: 600; font-size: 13.5px; color: rgba(255,255,255,0.88); cursor:pointer;
    display:flex; align-items:center; gap:5px; white-space: nowrap;
    transition: background 0.16s var(--ease), color 0.16s var(--ease);
    position:relative;
  }
  .mainnav-link .caret{ font-size:9px; opacity:0.8; transition: transform 0.16s var(--ease); }
  .mainnav-link:hover{ background: rgba(255,255,255,0.10); color:#fff; }
  .mainnav-item.active-group > .mainnav-link{ color:#fff; }
  .mainnav-item.active-group > .mainnav-link::after{
    content:""; position:absolute; left:14px; right:14px; bottom:8px; height:3px;
    background:#fff; border-radius:2px;
  }
  .mainnav-item.open > .mainnav-link{ background: rgba(255,255,255,0.14); color:#fff; }
  .mainnav-item.open > .mainnav-link .caret{ transform: rotate(180deg); }

  .dropdown-menu{
    position:absolute; top: 100%; left:0; min-width: 240px; margin-top:2px;
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); padding:8px; display:none; z-index: 120;
  }
  .mainnav-item.open > .dropdown-menu{ display:block; }
  .dropdown-menu .dd-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.07em; font-weight:800; color: var(--muted);
    padding: 8px 10px 4px;
  }
  .dropdown-menu button, .dropdown-menu a{
    display:flex; width:100%; text-align:left; border:none; background:none; cursor:pointer;
    padding: 9px 10px; border-radius: var(--radius-sm); font-size:13.5px; font-weight:600; color: var(--ink);
    font-family: var(--font-main); text-decoration:none;
  }
  .dropdown-menu button:hover, .dropdown-menu a:hover{ background: var(--red-tint); color: var(--red-dark); }
  .dropdown-menu hr{ border:none; border-top:1px solid var(--border); margin: 6px 2px; }
  .dropdown-menu .dd-add{ color: var(--red); font-weight:800; }

  .topbar-right{ display:flex; align-items:center; gap:14px; flex-shrink:0; }
  .topbar-divider{ width:1px; height:28px; background: rgba(255,255,255,0.28); }
  .profile-chip{
    display:flex; align-items:center; gap:8px; color:#fff; font-size:13.5px; font-weight:600;
    background:none; border:none; cursor:pointer; padding:6px 4px; font-family: var(--font-main);
  }
  .profile-avatar{
    width:28px; height:28px; border-radius:50%; background: rgba(255,255,255,0.22);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; color:#fff;
  }
  .hamburger-btn{
    display:none; border:none; background:none; color:#fff; font-size:22px; cursor:pointer;
    width:38px; height:38px; align-items:center; justify-content:center; border-radius:8px; flex-shrink:0;
  }
  .hamburger-btn:hover{ background: rgba(255,255,255,0.12); }

  /* ===== BULLE ASSISTANT IA (flottante, déplaçable librement) =====
     Nom de classe distinct de .ai-bubble (utilisée par les messages du
     chat IA) pour éviter tout conflit de style. */
  .ai-fab{
    position:fixed; right:20px; bottom:20px; width:56px; height:56px; border-radius:50%; z-index:200;
    background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
    border: none; color:#fff; cursor:grab;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 18px rgba(180,21,47,0.38), 0 2px 6px rgba(0,0,0,0.12);
    touch-action:none; -webkit-user-select:none; user-select:none;
    transition: box-shadow 0.15s var(--ease), transform 0.1s var(--ease);
    animation: ai-fab-bob 3.4s ease-in-out infinite;
  }
  .ai-fab:hover{ box-shadow: 0 8px 22px rgba(180,21,47,0.46), 0 3px 8px rgba(0,0,0,0.16); }
  .ai-fab:active{ cursor:grabbing; transform: scale(0.96); }
  .ai-fab svg{ width:28px; height:28px; pointer-events:none; }
  .ai-fab:focus-visible{ outline: 2.5px solid #fff; outline-offset: 3px; }
  @keyframes ai-fab-bob{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-5px); } }
  @media (prefers-reduced-motion: reduce){ .ai-fab{ animation:none; } }
  body.exam-focus .ai-fab{ display:none; }
  @media (max-width:680px){
    .ai-fab{ width:50px; height:50px; }
  }

  /* ===== STAT BAR ===== */
  .statbar{ display:grid; grid-template-columns: repeat(3,1fr); gap: 13px; margin: 28px 0 24px; }
  .stat{
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 17px 19px; box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s var(--ease), transform 0.2s var(--ease), border-color 0.2s var(--ease);
  }
  .stat:hover{ box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--border-strong); }
  .stat .num{ font-size: 26px; font-weight: 800; color: var(--ink); line-height:1; font-variant-numeric: tabular-nums; letter-spacing:-0.02em; }
  .stat .num.accent{ color: var(--red); }
  .stat .lbl{ font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin-top: 7px; }

  /* ===== HERO / MIX ALL ===== */
  .hero-mix{
    display:flex; align-items:center; justify-content:space-between; gap: 16px;
    background: linear-gradient(120deg, #FFFFFF 0%, #FFFFFF 45%, var(--red-tint) 130%);
    border: 1px solid var(--border); border-radius: var(--radius-xl);
    padding: 22px 24px; margin-bottom: 32px; box-shadow: var(--shadow-sm);
    position: relative; overflow:hidden;
  }
  .hero-mix::before{
    content:""; position:absolute; top:-40%; right:-6%; width:200px; height:200px;
    background: radial-gradient(circle, rgba(227,28,61,0.10) 0%, rgba(227,28,61,0) 70%);
    pointer-events:none;
  }
  .hero-mix .txt{ position:relative; }
  .hero-mix .txt .h{ font-weight: 800; font-size: 16px; margin-bottom: 4px; letter-spacing:-0.01em; }
  .hero-mix .txt .d{ font-size: 13px; color: var(--ink-soft); }
  .hero-mix-import{ background: linear-gradient(120deg, #FFFFFF 0%, #FFFFFF 45%, var(--green-tint) 130%); margin-bottom:16px; }

  .planning-source-bar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin-bottom:16px; padding:2px 2px 14px; border-bottom:1px solid var(--border);
  }
  .planning-source-bar .s{ font-size:11.5px; color: var(--muted); }

  /* ===== IMPORTATION DE COURS ===== */
  .import-dropzone{
    background: var(--surface); border:2px dashed var(--border-strong); border-radius: var(--radius-xl);
    padding:38px 24px; text-align:center; cursor:pointer; transition: border-color .15s var(--ease), background .15s var(--ease);
  }
  .import-dropzone:hover, .import-dropzone:focus-visible{ border-color: var(--red); outline:none; }
  .import-dropzone.is-dragover{ border-color: var(--red); background: var(--red-tint); }
  .import-dropzone-icon{ font-size:34px; margin-bottom:10px; }
  .import-dropzone-title{ font-size:15px; font-weight:800; color: var(--ink); margin-bottom:5px; }
  .import-dropzone-sub{ font-size:12.5px; color: var(--ink-soft); margin-bottom:8px; }
  .import-dropzone-formats{ font-size:11px; color: var(--muted); }

  .import-filelist{ display:flex; flex-direction:column; gap:6px; margin-top:16px; }
  .import-file-row{
    display:flex; align-items:center; gap:10px; background: var(--surface-2); border:1px solid var(--border);
    border-radius: var(--radius-sm); padding:9px 12px; font-size:12.5px;
  }
  .import-file-row .name{ flex:1; font-weight:700; color: var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .import-file-row .size{ color: var(--muted); flex-shrink:0; }

  .import-stats-row{ display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color: var(--ink-soft); margin:14px 0 4px; }
  .import-notion-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .import-notion-tag{
    font-size:11px; font-weight:700; background: var(--surface-2); color: var(--ink-soft);
    border:1px solid var(--border); border-radius:20px; padding:4px 11px;
  }

  .import-progress-card{ display:flex; flex-direction:column; gap:4px; }
  .import-step{ display:flex; align-items:center; gap:12px; padding:11px 4px; font-size:13.5px; color: var(--muted); border-bottom:1px solid var(--bg); }
  .import-step:last-child{ border-bottom:none; }
  .import-step .dot{
    width:22px; height:22px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; border:2px solid var(--border);
  }
  .import-step.done{ color: var(--ink); }
  .import-step.done .dot{ background: var(--green); border-color: var(--green); color:#fff; }
  .import-step.current{ color: var(--ink); font-weight:800; }
  .import-step.current .dot{ border-color: var(--red); }
  .import-step.pending .dot{ background: var(--bg); }

  .import-result-hero{ text-align:center; padding:32px 24px; }
  .import-result-icon{ font-size:42px; }
  .import-result-actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:18px; }
  .import-result-hero .import-stats-row{ justify-content:center; }
  .import-result-list{ display:flex; flex-direction:column; gap:8px; }
  .import-result-row{
    display:flex; align-items:center; gap:12px; background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius-md); padding:12px 14px; font-size:13px;
  }
  .import-result-row.ko{ background: var(--amber-tint); border-color: var(--amber-strong); }
  .import-result-row .name{ flex:1; font-weight:700; color: var(--ink); }
  .import-result-row .meta{ font-size:11.5px; color: var(--muted); flex-shrink:0; }

  .lib-reviewq-list{ display:flex; flex-direction:column; gap:8px; }
  .lib-reviewq-item{ border:1px solid var(--border); border-radius: var(--radius-sm); padding:10px 13px; background: var(--surface-2); }
  .lib-reviewq-item summary{ font-weight:700; font-size:13px; cursor:pointer; color: var(--ink); }
  .lib-reviewq-item .a{ margin-top:8px; font-size:12.5px; color: var(--ink-soft); line-height:1.6; padding-top:8px; border-top:1px solid var(--border); }

  .lib-editor-list{ display:flex; flex-direction:column; gap:12px; margin-top:10px; }
  .lib-editor-item{ display:flex; flex-direction:column; gap:8px; border:1px solid var(--border); border-radius: var(--radius-sm); padding:12px; background: var(--surface-2); }
  .lib-editor-item-actions{ display:flex; gap:14px; }
  .lib-editor-add{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; align-items:center; }
  .lib-editor-add input{ flex:1; min-width:160px; }

  /* ===== BUTTONS (unified system) ===== */
  .btn{
    font-family: "Inter", sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.01em;
    padding: 12px 20px; border-radius: var(--radius-md); cursor: pointer; border: 1px solid transparent;
    background: var(--ink); color: #fff; white-space: nowrap;
    transition: background 0.16s var(--ease), color 0.16s var(--ease), border-color 0.16s var(--ease),
                transform 0.12s var(--ease), box-shadow 0.16s var(--ease);
    box-shadow: var(--shadow-xs);
  }
  .btn:hover{ background: #26272E; box-shadow: var(--shadow-sm); transform: translateY(-1px); }
  .btn:active{ transform: translateY(0) scale(0.98); }
  .btn.outline{ background: #fff; color: var(--ink); border: 1.5px solid var(--border-strong); box-shadow:none; }
  .btn.outline:hover{ border-color: var(--red); color: var(--red-dark); background: var(--red-tint); }
  .btn.red{ background: var(--red); }
  .btn.red:hover{ background: var(--red-dark); }
  .btn.green{ background: var(--green); }
  .btn.green:hover{ background:#145E40; }
  .btn.small{ padding: 8px 14px; font-size: 12px; }
  .btn:disabled{ background: var(--border) !important; color: var(--muted) !important; cursor: not-allowed; box-shadow:none !important; transform:none !important; border-color: var(--border) !important; }
  .btn-text{
    background:none; border:none; color: var(--ink-soft); font-family:"Inter",sans-serif;
    font-size: 12.5px; font-weight: 700; cursor:pointer; padding: 6px 2px;
    border-bottom: 1.5px solid transparent; transition: color 0.15s var(--ease), border-color 0.15s var(--ease);
  }
  .btn-text:hover{ color: var(--red); border-color: var(--red); }

  /* ===== LEVEL CHIPS (shared: quiz / fiches / flashcards) ===== */
  .levelchips{ display:flex; gap: 8px; margin: 26px 0 22px; flex-wrap:wrap; }
  .levelchips button{
    border: 1.5px solid var(--border-strong); background: #fff; border-radius: 999px; padding: 8px 17px;
    font-weight: 700; font-size: 12.5px; color: var(--ink-soft); cursor:pointer; font-family:"Inter",sans-serif;
    transition: all 0.16s var(--ease);
  }
  .levelchips button:hover:not(.active){ border-color: var(--ink); color: var(--ink); }
  .levelchips button.active{ background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: var(--shadow-xs); }
  .levelchips button.L3.active{ background: var(--red); border-color: var(--red); }

  /* ===== LEVEL HEADING ===== */
  .level-heading{ display:flex; align-items:center; gap: 11px; margin: 38px 0 16px; flex-wrap:wrap; }
  .level-heading:first-of-type{ margin-top: 4px; }
  .level-heading .tag{
    background: var(--ink); color:#fff; font-weight: 800; font-size: 11px; padding: 4.5px 12px;
    border-radius: 999px; flex-shrink:0; letter-spacing:0.03em;
  }
  .level-heading .tag.L1{ background: #EEEFF3; color: var(--ink-soft); }
  .level-heading .tag.L2{ background: var(--ink); color:#fff; }
  .level-heading .tag.L3{ background: var(--red); color:#fff; }
  .level-heading .name{ font-size: 13px; font-weight: 800; color: var(--ink); letter-spacing: -0.005em; }
  .level-heading .desc{ font-size: 12px; color: var(--muted); font-weight: 500; }
  .level-heading .line{ flex:1; height:1px; background: var(--border); min-width: 20px; }

  /* ===== CHAPTERS (quiz picker) ===== */
  .chapter{
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl);
    padding: 24px 26px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s var(--ease), border-color 0.2s var(--ease);
  }
  .chapter:hover{ box-shadow: var(--shadow-md); border-color: var(--border-strong); }
  .chapter-head{ display:flex; align-items:flex-start; gap: 15px; margin-bottom: 17px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .chapter-num{
    background: var(--red-tint); color: var(--red-dark); font-weight: 800; font-size: 12px;
    padding: 5px 11px; border-radius: 999px; flex-shrink:0; font-variant-numeric: tabular-nums;
  }
  .chapter-headtext{ flex:1; min-width: 180px; }
  .chapter-headtext .title-row{ display:flex; align-items:center; gap: 9px; flex-wrap:wrap; }
  .chapter-headtext h2{ font-size: 17.5px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  .chapter-headtext p{ margin: 6px 0 0; font-size: 12.5px; color: var(--ink-soft); line-height:1.5; }
  .level-badge{ font-size: 10px; font-weight: 800; letter-spacing: 0.04em; padding: 3.5px 9px; border-radius: 999px; }
  .level-badge.L1{ background:#EEEFF3; color: var(--ink-soft); }
  .level-badge.L2{ background: var(--ink); color: #fff; }
  .level-badge.L3{ background: var(--red); color: #fff; }
  .chapter-headright{ flex-shrink:0; text-align:right; min-width: 92px; }
  .chapter-headright .avg{ font-size: 19px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
  .chapter-headright .avg.none{ color: var(--muted); font-size: 12px; font-weight: 700; }
  .chapter-headright .avglbl{ font-size: 10px; text-transform:uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight:700; margin-top:2px; }
  .status-pill{
    display:inline-flex; align-items:center; gap:5px; font-size: 10.5px; font-weight: 800;
    padding: 4px 10px; border-radius: 999px; letter-spacing:0.02em; margin-top:4px;
  }
  .status-pill::before{ content:""; width:6px; height:6px; border-radius:50%; }
  .status-pill.none{ background: var(--bg); color: var(--muted); }
  .status-pill.none::before{ background: var(--muted); }
  .status-pill.progress{ background: var(--amber-tint); color: var(--amber); }
  .status-pill.progress::before{ background: var(--amber); }
  .status-pill.done{ background: var(--green-tint); color: var(--green); }
  .status-pill.done::before{ background: var(--green); }

  .chapter-progress-track{ height: 6px; background: var(--bg); border-radius: 999px; overflow:hidden; margin-bottom: 18px; }
  .chapter-progress-fill{ height:100%; border-radius: 999px; transition: width 0.5s var(--ease); }

  .fiche-tip b{ color: var(--ink); }

  /* ===== QUIZ CARD ===== */
  .card{ background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 32px 30px; box-shadow: var(--shadow-md); }

  .progress-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 17px; gap:10px; }
  .progress-row .label{ font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
  .progress-row .score{ font-size: 13.5px; color: var(--red); font-weight: 800; flex-shrink:0; font-variant-numeric: tabular-nums; }
  .bar-track{ height: 6px; background: var(--bg); border-radius: 999px; margin-bottom: 24px; overflow:hidden; border: 1px solid var(--border); }
  .bar-fill{ height:100%; background: linear-gradient(90deg, var(--red) 0%, var(--red-dark) 100%); border-radius: 999px; transition: width 0.4s var(--ease); }

  .qtheme{ font-size: 11px; color: var(--red); font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 11px; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }

  h2.question{ font-size: 19.5px; font-weight: 700; line-height: 1.45; margin: 0 0 24px; color: var(--ink); letter-spacing:-0.01em; }

  .options{ display:flex; flex-direction:column; gap: 9px; margin-bottom: 6px; }
  .opt{
    display:flex; align-items:flex-start; gap: 13px; text-align:left; background: var(--surface);
    border: 1.5px solid var(--border); padding: 14px 15px; font-family: "Inter", sans-serif; font-size: 14.5px;
    color: var(--ink); cursor:pointer; border-radius: var(--radius-md); line-height:1.5;
    transition: border-color 0.14s var(--ease), background 0.14s var(--ease), transform 0.1s var(--ease);
  }
  .opt:hover:not(:disabled){ border-color: var(--ink); background: var(--surface-2); }
  .opt:active:not(:disabled){ transform: scale(0.995); }
  .opt .letter{
    font-weight: 800; color: var(--muted); flex-shrink:0; width:22px; height:22px; border-radius:7px;
    background: var(--bg); display:flex; align-items:center; justify-content:center; font-size:12.5px;
    transition: background 0.14s var(--ease), color 0.14s var(--ease);
  }
  .opt:disabled{ cursor:default; }
  .opt.correct{ border-color: var(--green); background: var(--green-tint); border-left-width: 4px; font-weight: 700; }
  .opt.correct .letter{ color:#fff; background: var(--green); }
  .opt.incorrect{ background: var(--bg); border-color: var(--border); color: var(--muted); text-decoration: line-through; }
  .opt.incorrect .letter{ color: #fff; background: var(--red); text-decoration:none; }

  .feedback{

  }

  .feedback .verdict{ font-weight: 800; display:block; margin-bottom: 5px; color: var(--ink); }
  .feedback.wrong .verdict{ color: var(--red-dark); }
  .feedback .masteryline{ display:block; margin-top:9px; font-size:12px; color: var(--muted); font-weight:700; }

  .actions{ display:flex; justify-content: space-between; align-items:center; margin-top: 26px; gap:10px; flex-wrap:wrap; }

  /* ===== RESULTS (quiz) ===== */
  .results h2{ font-size: 21px; font-weight: 800; margin: 0 0 4px; letter-spacing:-0.01em; }
  .results .scoretag{ font-size: 10.5px; text-transform:uppercase; letter-spacing:0.06em; color: var(--muted); font-weight:700; margin-bottom: 18px; }
  .results .bigscore{ font-size: 50px; font-weight: 800; color: var(--red); line-height:1; margin: 6px 0 6px; font-variant-numeric: tabular-nums; letter-spacing:-0.02em; }

  .recap{ border-top: 1px solid var(--border); padding-top: 4px; margin-top: 4px; }

  .results .actions{ justify-content:flex-start; gap: 12px; }

  footer.hint{ text-align:center; color: var(--muted); font-size: 12px; margin-top: 30px; line-height:1.6; }

  .flash-play-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 18px; gap: 10px; flex-wrap:wrap; }
  .flash-play-top .lbl{ font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
  .flash-counters{ display:flex; gap: 14px; font-size: 12.5px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .flash-counters .c-known{ color: var(--green); }
  .flash-counters .c-unknown{ color: var(--red); }

  .flash-stage{ display:flex; flex-direction:column; align-items:center; }
  .flashcard{
    width: 100%; max-width: 480px; aspect-ratio: 4/3; cursor: pointer;
    perspective: 1200px; margin-bottom: 22px; border-radius: var(--radius-xl);
  }

    position:relative; width:100%; height:100%;

  }
  .flashcard.flipped .flashcard-inner{ transform: rotateY(180deg); }
  .flashcard-face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius: var(--radius-xl); display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 32px; text-align:center; box-shadow: var(--shadow-md); border: 1.5px solid var(--border);
  }
  .flashcard-front{ background: var(--surface); color: var(--ink); }

  .flashcard-back{ background: linear-gradient(160deg,#fff 0%, var(--red-tint) 130%); color: var(--ink); transform: rotateY(180deg); border-color: var(--red-tint-strong); }

  .flash-judge{ display:flex; gap: 12px; width:100%; max-width: 480px; }

  /* ===== GRILLE DE TABLEAU DE BORD (6 blocs) ===== */

  .dash-feed{ display:flex; flex-direction:column; gap:10px; }

  .dash-reminder-row{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); }

  .dash-schedule-card{ margin-bottom:18px; }
  .dash-schedule-nav{ display:flex; gap:6px; flex-wrap:wrap; }
  .dash-schedule-navbtn{
    background: var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:5px 12px;
    font-size:11px; font-weight:700; color: var(--ink-soft); cursor:pointer; font-family: var(--font-main);
    transition: border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease);
  }
  .dash-schedule-navbtn:hover{ border-color: var(--red); color: var(--red-dark); }
  .dash-schedule-navbtn.active{ background: var(--red); border-color: var(--red); color:#fff; }
  .dash-current-course{
    background: var(--green-tint); border:1.5px solid var(--green); border-radius: var(--radius-md);
    padding:14px 16px; margin-bottom:12px; cursor:pointer; transition: box-shadow 0.15s var(--ease);
  }
  .dash-current-course:hover, .dash-current-course:focus-visible{ box-shadow: var(--shadow-md); outline:none; }
  .badge-current{
    display:inline-block; font-size:10.5px; font-weight:800; color:#fff; background: var(--green);
    padding:3px 9px; border-radius:20px; margin-bottom:8px; letter-spacing:0.01em;
  }
  .ccourse-title{ font-size:16px; font-weight:800; color:var(--ink); }

  .ccourse-progressbar-fill{ height:100%; background: var(--green); border-radius:4px; transition:width 0.3s var(--ease); }
  .ccourse-remaining{ font-size:11px; color: var(--green); font-weight:700; margin-top:5px; }

  .dash-schedule-list{ display:flex; flex-direction:column; gap:4px; }
  .dash-schedule-row{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; cursor:pointer;
    font-size:12.5px; transition: background 0.15s var(--ease);
  }
  .dash-schedule-row:hover, .dash-schedule-row:focus-visible{ background: var(--bg); outline:none; }
  .dash-schedule-row.status-past{ opacity:0.55; }
  .dash-schedule-time{ font-weight:700; color:var(--ink); min-width:88px; flex-shrink:0; font-variant-numeric: tabular-nums; }
  .dash-schedule-title{ flex:1; color:var(--ink); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dash-schedule-badge{ font-size:9.5px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:0.02em; flex-shrink:0; }
  .dash-schedule-row.status-current .dash-schedule-badge{ color: var(--green); }

  .dash-revisions-list{ display:flex; flex-direction:column; gap:4px; }
  .dash-revision-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px; border-radius:8px;
    cursor:pointer; transition: background .15s var(--ease); flex-wrap:wrap;
  }
  .dash-revision-row:hover, .dash-revision-row:focus-visible{ background: var(--bg); outline:none; }
  .dash-revision-main .name{ font-weight:700; font-size:13px; color: var(--ink); }
  .dash-revision-main .meta{ font-size:11.5px; color: var(--muted); margin-top:2px; }
  .dash-revision-badges{ display:flex; gap:6px; flex-wrap:wrap; }
  .dash-revision-badge{
    font-size:10px; font-weight:800; padding:3px 9px; border-radius:20px; background: var(--surface-2);
    color: var(--ink-soft); white-space:nowrap;
  }
  .dash-revision-badge.warn{ background: var(--amber-tint); color: var(--amber); }
  .dash-revision-badge.ok{ background: var(--green-tint); color: var(--green); }

  @media (max-width: 860px){
    .dash-grid2{ grid-template-columns: 1fr; }
  }
  .dash-col-stack .dash-section:last-child{ margin-bottom:0; }

  .dash-empty{ font-size:12.5px; color:var(--muted); margin:0; }

  .dash-timeline{ display:flex; flex-direction:column; gap:2px; }
  .dash-timeline-item{ display:flex; gap:11px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--bg); }
  .dash-timeline-item:last-child{ border-bottom:none; }
  .dash-timeline-icon{ font-size:15px; flex-shrink:0; margin-top:1px; }
  .dash-timeline-label{ font-size:13px; font-weight:700; color:var(--ink); line-height:1.4; }
  .dash-timeline-meta{ font-size:11px; color:var(--muted); margin-top:2px; font-weight:600; }

  .dash-chapterlist{ display:flex; flex-direction:column; gap:8px; }
  .dash-chapterchip{
    display:flex; align-items:center; gap:9px; text-align:left; background: var(--surface-2);
    border:1px solid var(--border); border-radius: var(--radius-md); padding:10px 12px;
    font-family:"Inter",sans-serif; font-size:12.5px; font-weight:700; color:var(--ink); cursor:pointer;
    transition: border-color 0.15s var(--ease), background 0.15s var(--ease), transform 0.15s var(--ease);
  }
  .dash-chapterchip:hover{ border-color: var(--red); background:#fff; transform: translateY(-1px); }

  .dash-reviewlist{ display:flex; flex-direction:column; gap:9px; }
  .dash-reviewitem{ padding:9px 0; border-bottom:1px solid var(--bg); }
  .dash-reviewitem:last-child{ border-bottom:none; }
  .dash-review-theme{ display:block; font-size:10px; font-weight:800; color:var(--red); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:3px; }
  .dash-review-q{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
  .dash-review-more{ font-size:11.5px; color:var(--muted); margin:10px 0 0; font-weight:600; }

  /* ===== À REVOIR / MAÎTRISE ===== */
  .m-chip{
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:800;
    padding:3.5px 10px; border-radius:999px; letter-spacing:0.02em; white-space:nowrap;
  }
  .m-chip.new{ background: var(--bg); color: var(--muted); }
  .m-chip.critical{ background: var(--red-tint); color: var(--red-dark); }
  .m-chip.weak{ background: var(--amber-tint); color: var(--amber); }
  .m-chip.good{ background: var(--blue-tint); color: var(--blue); }
  .m-chip.mastered{ background: var(--green-tint); color: var(--green); }

  .mode-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:12px; margin-bottom:22px; }
  .mode-card{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg);

    box-shadow: var(--shadow-sm); display:flex; flex-direction:column; gap:7px;
    transition: border-color .16s var(--ease), transform .16s var(--ease), box-shadow .16s var(--ease);
  }

  .mode-card .mc-count{ font-size:11px; font-weight:800; color:var(--red); background:var(--red-tint); padding:3px 9px; border-radius:999px; }
  .mode-card .mc-count.zero{ color:var(--muted); background:var(--bg); }
  .mode-card .mc-desc{ font-size:12.5px; color: var(--ink-soft); line-height:1.55; }

  .q-list{ display:flex; flex-direction:column; gap:10px; }

    border:1px solid var(--border); background: var(--surface-2); border-radius: var(--radius-md);
    padding:13px 15px; display:flex; flex-direction:column; gap:9px;

  .q-bar-track{ height:5px; background: var(--bg); border-radius:999px; overflow:hidden; border:1px solid var(--border); }
  .q-bar-fill{ height:100%; border-radius:999px; }
  .q-bar-fill.critical{ background: var(--red); }
  .q-bar-fill.weak{ background: var(--amber); }
  .q-bar-fill.good{ background: var(--blue); }
  .q-bar-fill.mastered{ background: var(--green); }

  @media (max-width: 860px){
    .dash-cols{ grid-template-columns: 1fr; }

  /* ===== MODE EXAMEN ===== */
  body.exam-focus .mainnav,
  body.exam-focus .hamburger-btn,
  body.exam-focus .topbar-right{ display:none; }

  .exam-setup-group{ margin-bottom:22px; }

  .chipset{ display:flex; flex-wrap:wrap; gap:8px; }

    border:1.5px solid var(--border-strong); background:#fff; border-radius:999px; padding:9px 16px;

  .exam-summary-box{
    background: var(--bg); border:1px solid var(--border); border-radius: var(--radius-md);

  }

  .exam-topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin-bottom:14px;
  }
  .exam-clock{
    font-variant-numeric: tabular-nums; font-weight:800; font-size:15px; color:var(--ink);
    background: var(--surface); border:1.5px solid var(--border-strong); border-radius:999px; padding:7px 15px;
  }
  .exam-clock.warn{ color: var(--red-dark); border-color: var(--red); background: var(--red-tint); }
  .exam-meta{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); font-weight:700; }

  .opt.selected{ border-color: var(--red); background: var(--red-tint); font-weight:700; }
  .opt.selected .letter{ background: var(--red); color:#fff; }

  .exam-nav{ display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; }
  .exam-nav .btn{ flex:1; min-width:130px; text-align:center; }

  .exam-grid{ display:flex; flex-wrap:wrap; gap:6px; margin-top:20px; padding-top:18px; border-top:1px solid var(--border); }
  .exam-grid button{
    width:32px; height:32px; border-radius:8px; border:1.5px solid var(--border-strong); background:#fff;
    font-family:"Inter",sans-serif; font-weight:800; font-size:11.5px; color:var(--muted); cursor:pointer;
    font-variant-numeric: tabular-nums; transition: all .14s var(--ease);

  .exam-scorecell{ background: var(--surface-2); border:1px solid var(--border); border-radius: var(--radius-md); padding:13px 10px; text-align:center; }
  .exam-scorecell .n{ font-size:19px; font-weight:800; font-variant-numeric: tabular-nums; }
  .exam-scorecell .n.ok{ color: var(--green); }
  .exam-scorecell .n.ko{ color: var(--red); }
  .exam-scorecell .l{ font-size:10px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); font-weight:700; margin-top:4px; }

  .exam-err{ border:1px solid var(--border); border-radius: var(--radius-md); padding:14px 15px; margin-bottom:10px; background: var(--surface-2); }
  .exam-err .eq{ font-size:13.5px; font-weight:700; line-height:1.5; margin-bottom:9px; }
  .exam-err .line{ font-size:12.5px; line-height:1.6; margin-bottom:4px; }

  .exam-err .line.good{ color: var(--green); }

  .exam-err .why{ font-size:12.5px; color: var(--ink-soft); margin-top:8px; padding-top:8px; border-top:1px solid var(--border); line-height:1.6; }

  .exam-histitem{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:11px 0; border-bottom:1px solid var(--bg); font-size:12.5px;
  }
  .exam-histitem:last-child{ border-bottom:none; }
  .exam-histitem .hl{ font-weight:700; color:var(--ink); }
  .exam-histitem .hm{ font-size:11px; color:var(--muted); font-weight:600; margin-top:2px; }
  .exam-histitem .hp{ font-weight:800; font-variant-numeric: tabular-nums; }

  /* ===== ASSISTANT IA (v2) ===== */
  .ai-status{
    display:flex; gap:12px; align-items:flex-start; border-radius: var(--radius-md);
    padding:14px 16px; font-size:12.5px; line-height:1.6; margin: 18px 0 24px; border:1px solid var(--border);
    background: var(--surface);
  }
  .ai-status b{ font-size:13px; }
  .ai-status .s{ color: var(--ink-soft); margin-top:4px; }
  .ai-status .dot{ width:9px; height:9px; border-radius:50%; margin-top:5px; flex-shrink:0; }
  .ai-status.ok{ background: var(--green-tint); border-color: var(--green-strong); }
  .ai-status.ok .dot{ background: var(--green); }
  .ai-status.ko{ background: var(--amber-tint); border-color: var(--amber-strong); }
  .ai-status.ko .dot{ background: var(--amber); }
  .ai-status.checking{ align-items:center; }

  .ai-loadbar{ width:100%; height:8px; border-radius:999px; background: var(--border); overflow:hidden; margin:8px 0 2px; }
  .ai-loadbar-fill{ height:100%; background: var(--red); border-radius:999px; transition: width .25s var(--ease); }

  .ai-modelpicker{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .ai-modelchoice{
    display:flex; flex-direction:column; gap:2px; text-align:left; cursor:pointer; flex:1; min-width:180px;
    background: var(--surface); border:1.5px solid var(--border-strong); border-radius: var(--radius-md);
    padding:10px 13px; font-family:"Inter",sans-serif; transition: border-color .15s var(--ease);
  }
  .ai-modelchoice:hover{ border-color: var(--red); }
  .ai-modelchoice.active{ border-color: var(--red); background: var(--red-tint); }
  .ai-modelchoice .t{ font-size:12.5px; font-weight:800; color:var(--ink); }
  .ai-modelchoice .sz{ font-size:11px; font-weight:700; color: var(--red-dark); }
  .ai-modelchoice .n{ font-size:10.5px; color: var(--muted); line-height:1.4; margin-top:2px; }

  .ai-actiongrid{ display:grid; grid-template-columns: repeat(4,1fr); gap:10px; margin-bottom:22px; }
  @media (max-width:860px){ .ai-actiongrid{ grid-template-columns: repeat(2,1fr); } }
  @media (max-width:480px){ .ai-actiongrid{ grid-template-columns: 1fr; } }
  .ai-action{
    display:flex; flex-direction:column; gap:5px; text-align:left; cursor:pointer;
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-md);
    padding:14px 15px; font-family:"Inter",sans-serif; box-shadow: var(--shadow-xs);
    transition: border-color .15s var(--ease), transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  .ai-action:hover:not(:disabled){ border-color: var(--red); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .ai-action:disabled{ opacity:.45; cursor:not-allowed; }
  .ai-action.active{ border-color: var(--red); background: var(--red-tint); }
  .ai-action .ico{ font-size:18px; }
  .ai-action .t{ font-size:13px; font-weight:800; color:var(--ink); line-height:1.3; }
  .ai-action .d{ font-size:11.5px; color: var(--muted); line-height:1.45; }

  .ai-panel-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--border); }
  .ai-panel-title{ font-size:16px; font-weight:800; }

  .ai-extra{ margin-bottom:6px; }
  .ai-extra summary{ font-size:12px; font-weight:700; color: var(--ink-soft); cursor:pointer; padding:6px 0; list-style:none; }
  .ai-extra summary::marker{ content:""; }
  .ai-extra summary:hover{ color: var(--red); }
  .ai-extra .ai-filezone{ margin-top:8px; }

  .ai-thread{ display:flex; flex-direction:column; gap:12px; margin-top:22px; }
  .ai-bubble{ border-radius: var(--radius-md); padding:13px 15px; font-size:13.5px; line-height:1.65; }
  .ai-bubble.user{ background: var(--ink); color:#fff; align-self:flex-end; max-width:82%; font-weight:600; }
  .ai-bubble.assistant{ background: var(--surface-2); border:1px solid var(--border); }
  .ai-bubble.assistant .ai-result-body{ font-size:13.5px; }

  .ai-followrow{ display:flex; gap:9px; margin-top:16px; }
  .ai-followrow input{ flex:1; }

  .ai-draft{ margin-top:20px; border-top:1px solid var(--border); padding-top:16px; }
  .ai-draft-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; font-size:13.5px; }
  .ai-draftcard{ border:1px solid var(--border); border-radius: var(--radius-sm); padding:11px 13px; margin-bottom:8px; background: var(--surface-2); }
  .ai-draftcard .f{ font-size:13px; font-weight:700; margin-bottom:4px; }
  .ai-draftcard .b{ font-size:12.5px; color: var(--ink-soft); line-height:1.55; }
  .ai-draft-note{ font-size:11.5px; color: var(--muted); margin-top:8px; font-weight:600; }

  .ai-inline-btn{
    background:none; border:1.5px solid var(--border-strong); border-radius:999px; padding:6px 13px;
    font-family:"Inter",sans-serif; font-size:11.5px; font-weight:700; color: var(--ink-soft); cursor:pointer;
    transition: all .15s var(--ease); white-space:nowrap;
  }
  .ai-inline-btn:hover{ border-color: var(--red); color: var(--red-dark); background: var(--red-tint); }

  /* ===== RÉUSSITES (BADGES) — design sobre, type sceau/certification ===== */
  .badge-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; }
  @media (max-width:760px){ .badge-grid{ grid-template-columns: repeat(3,1fr); } }
  @media (max-width:520px){ .badge-grid{ grid-template-columns: repeat(2,1fr); } }
  .badge-tile{
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px;
    padding:18px 12px 14px; border:1px solid var(--border); border-radius: var(--radius-md);
    background: var(--surface-2);
  }
  .badge-tile.unlocked{ background: var(--surface); border-color: var(--border-strong); }
  .badge-seal{
    width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:800; border:2px solid var(--border-strong); color: var(--muted); background: var(--bg);
    font-variant-numeric: tabular-nums;
  }
  .badge-tile.unlocked .badge-seal{ border-color: var(--red); color: var(--red-dark); background: var(--red-tint); font-size:16px; }
  .badge-tile .b-name{ font-size:12px; font-weight:800; color: var(--ink); line-height:1.35; }
  .badge-tile.locked .b-name{ color: var(--muted); }
  .badge-tile .b-desc{ font-size:10.5px; color: var(--muted); line-height:1.45; }
  .badge-tile .b-date{ font-size:10px; color: var(--red-dark); font-weight:800; letter-spacing:0.01em; }
  .badge-newtag{
    display:inline-block; font-size:9px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase;
    background: var(--red); color:#fff; padding:2px 6px; border-radius:999px; margin-left:5px; vertical-align:middle;
  }
  .dash-goal-block + .dash-goal-block{ margin-top:18px; padding-top:18px; border-top:1px solid var(--border); }

  /* ===== SECTION TITLE (shared) ===== */
  .section-title{ font-size: 15.5px; font-weight: 800; margin-bottom: 12px; letter-spacing:-0.005em; }

  /* ===== MES MATIÈRES (bibliothèque de cours) ===== */
  .breadcrumb{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:26px 0 18px; font-size:12.5px; }
  .breadcrumb button{ background:none; border:none; color: var(--ink-soft); font-family:"Inter",sans-serif; font-weight:700; font-size:12.5px; cursor:pointer; padding:2px; }
  .breadcrumb button:hover{ color: var(--red); }
  .breadcrumb span.sep{ color: var(--border-strong); }
  .breadcrumb span.current{ color: var(--ink); font-weight:800; }
  .subject-card .icon{ font-size:22px; width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .empty-state{ text-align:center; padding:40px 20px; border:1.5px dashed var(--border-strong); border-radius: var(--radius-lg); color: var(--muted); font-size:13.5px; line-height:1.7; }
  .empty-state .big{ font-size:30px; margin-bottom:10px; }
  .form-row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:560px){ .form-row2{ grid-template-columns:1fr; } }
  .color-swatches{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .color-swatches button{ width:28px; height:28px; border-radius:8px; border:2px solid transparent; cursor:pointer; }
  .color-swatches button.active{ border-color: var(--ink); }
  .chapter-status-select{ display:flex; gap:8px; }

  /* ===== RESSOURCES — AUTOMATISER MES RÉVISIONS ===== */
  .automate-card{ margin:22px 0 28px; }
  .automate-head{ display:flex; align-items:flex-start; gap:14px; margin-bottom:18px; }
  .automate-head .ico{
    font-size:22px; width:44px; height:44px; border-radius:12px; flex-shrink:0;
    background: var(--red-tint); display:flex; align-items:center; justify-content:center;
  }
  .automate-head .h{ font-size:16px; font-weight:800; margin-bottom:4px; }
  .automate-head .d{ font-size:12.5px; color: var(--ink-soft); line-height:1.55; max-width:560px; }
  .import-dropzone-compact{ padding:26px 18px; }
  .automate-advanced{ margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
  .automate-advanced summary{ font-size:12px; font-weight:700; color: var(--ink-soft); cursor:pointer; list-style:none; }
  .automate-advanced summary::marker{ content:""; }
  .automate-advanced summary:hover{ color: var(--red); }

  /* ===== RESSOURCES — BIBLIOTHÈQUE DE COURS ===== */
  .course-filters-card{ padding:16px 18px; margin-bottom:20px; display:flex; flex-direction:column; gap:12px; }
  .course-filters-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .course-filters-row .ai-select{ width:100%; }
  .course-filters-footer{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .course-viewtoggle{ display:flex; gap:2px; background: var(--bg); border-radius:10px; padding:3px; }
  .course-viewbtn{
    border:none; background:none; padding:6px 12px; border-radius:8px; cursor:pointer;
    font-size:14px; color: var(--muted); line-height:1;
  }
  .course-viewbtn.active{ background: var(--surface); color: var(--ink); box-shadow: var(--shadow-xs); }

  .course-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:900px){ .course-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:600px){ .course-grid{ grid-template-columns:1fr; } }
  @media (max-width:760px){ .course-filters-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:520px){ .course-filters-row{ grid-template-columns:1fr; } }

  .course-card{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg);
    padding:16px 17px; cursor:pointer; box-shadow: var(--shadow-sm);
    display:flex; flex-direction:column; gap:9px;
    transition: border-color .16s var(--ease), transform .16s var(--ease), box-shadow .16s var(--ease);
  }
  .course-card:hover, .course-card:focus-visible{ border-color: var(--red); transform: translateY(-2px); box-shadow: var(--shadow-md); outline:none; }
  .course-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .course-card-icon{ font-size:19px; width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .course-card-badges{ display:flex; align-items:center; gap:6px; }
  .course-card-title{ font-size:14px; font-weight:800; line-height:1.3; color: var(--ink); }
  .course-card-meta{ font-size:11.5px; color: var(--ink-soft); }
  .course-card-stats{ display:flex; gap:10px; flex-wrap:wrap; font-size:11px; color: var(--muted); font-weight:600; }
  .course-card-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .course-card-chip{
    font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px;
    background: var(--green-tint); color: var(--green);
  }
  .course-card-chip.off{ background: var(--bg); color: var(--muted); }
  .course-card-chip.ok{ background:none; padding:0; font-size:13px; }
  .course-card-progress{ display:flex; align-items:center; gap:8px; margin-top:2px; }
  .course-card-progress .deckbar-track{ flex:1; height:5px; background: var(--bg); border-radius:999px; overflow:hidden; }
  .course-card-progress .deckbar-fill{ height:100%; border-radius:999px; transition: width .4s var(--ease); }
  .course-card-progress .deckbar-fill.none{ background: var(--border-strong); }
  .course-card-progress .deckbar-fill.progress{ background: var(--amber); }
  .course-card-progress .deckbar-fill.done{ background: var(--green); }
  .course-card-progress .pct{ font-size:11px; font-weight:700; color: var(--muted); flex-shrink:0; }
  .course-card-open{ align-self:flex-start; margin-top:4px; pointer-events:none; }

  .course-list{ display:flex; flex-direction:column; gap:10px; }
  .course-list .course-card{
    flex-direction:row; align-items:center; flex-wrap:wrap; padding:12px 16px; gap:14px;
  }
  .course-list .course-card-top{ flex-direction:column; align-items:flex-start; gap:6px; }
  .course-list .course-card-title{ min-width:160px; }
  .course-list .course-card-meta{ min-width:120px; }
  .course-list .course-card-chips{ margin-left:auto; }
  .course-list .course-card-progress{ width:110px; margin-top:0; }
  .course-list .course-card-open{ margin-top:0; }

  /* ===== PLANNING — CALENDRIER JOUR / SEMAINE / MOIS ===== */
  .cal-viewbtn{
    border:none; background:none; padding:7px 14px; border-radius:999px;
    font-family: var(--font-main); font-weight:700; font-size:12.5px; color: var(--ink-soft); cursor:pointer;
  }
  .cal-viewbtn.active{ background: var(--ink); color:#fff; }

  .cal-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .cal-headerrow{ display:grid; min-width:600px; }
  .cal-daylabel{
    text-align:center; padding:8px 4px; border-bottom:2px solid var(--border);
    font-size:11px; color: var(--muted); font-weight:700; cursor:pointer;
  }
  .cal-daylabel .wd{ text-transform:capitalize; }
  .cal-daylabel .dn{ font-size:15px; font-weight:800; color: var(--ink); margin-top:2px; }
  .cal-daylabel.is-today, .cal-daylabel.is-today .dn{ color: var(--red); }

  .cal-allday-row{ display:grid; min-width:600px; border-bottom:1px solid var(--border); }
  .cal-allday-label{ font-size:9.5px; color: var(--muted); padding:4px; align-self:center; }
  .cal-allday-cell{ padding:3px; display:flex; flex-direction:column; gap:2px; border-left:1px solid var(--bg); min-height:22px; }
  .cal-allday-chip{
    font-size:10px; font-weight:700; padding:2px 6px; border-radius:5px; cursor:pointer;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .cal-grid{ display:grid; position:relative; min-width:600px; }
  .cal-timecol{ position:relative; border-right:1px solid var(--border); }
  .cal-hour{
    position:absolute; right:8px; font-size:10px; color: var(--muted); transform:translateY(-6px);
  }
  .cal-daycol{ position:relative; border-left:1px solid var(--bg); }
  .cal-daycol.is-today{ background: var(--red-tint); }
  .cal-hourline{ position:absolute; left:0; right:0; border-top:1px solid var(--bg); }
  .cal-now-line{ position:absolute; left:0; right:0; border-top:2px solid var(--green); z-index:6; pointer-events:none; }
  .cal-now-line::before{
    content:""; position:absolute; left:-4px; top:-4px; width:8px; height:8px; border-radius:50%; background: var(--green);
  }
  .cal-now-time{
    position:absolute; right:2px; top:-8px; font-size:9px; font-weight:800; color:#fff;
    background: var(--green); padding:1px 5px; border-radius:4px;
  }
  .cal-event{
    position:absolute; border-radius:6px; padding:3px 6px; font-size:11px; overflow:hidden;
    cursor:pointer; transition: box-shadow .15s var(--ease), z-index 0s;
  }
  .cal-event:hover, .cal-event:focus-visible{ box-shadow: var(--shadow-md); z-index:4; outline:none; }
  .cal-event.is-current{ box-shadow: 0 0 0 1.5px var(--green); }
  .cal-event.is-past{ opacity:0.55; }
  .cal-event-badge{
    display:block; font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:0.02em;
    background: var(--green); color:#fff; padding:1px 4px; border-radius:4px; margin-bottom:2px; width:fit-content;
  }
  .cal-event-fav{ float:right; color: var(--amber); font-size:11px; line-height:1; }
  .cal-event-time{ font-size:9.5px; font-weight:700; opacity:0.85; }
  .cal-event-title{ font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cal-event-loc{ font-size:9.5px; opacity:0.8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .cal-monthgrid{
    display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background: var(--border);
    border:1px solid var(--border); border-radius: var(--radius-md); overflow:hidden;
  }
  .cal-monthhead{ background: var(--surface-2); padding:6px 4px; font-size:10px; font-weight:800; text-align:center; color: var(--muted); }
  .cal-monthcell{ background: var(--surface); min-height:88px; padding:4px; font-size:10px; }
  .cal-monthcell.is-outside{ background: var(--bg); color: var(--muted); }
  .cal-monthcell.is-today{ box-shadow: inset 0 0 0 1.5px var(--green); }
  .cal-monthcell .dn{ font-weight:800; margin-bottom:3px; cursor:pointer; display:inline-block; }
  .cal-monthcell.is-today .dn{ color:#fff; background: var(--green); border-radius:50%; width:19px; height:19px; line-height:19px; text-align:center; font-size:10.5px; }
  .cal-monthchip{
    font-size:9.5px; font-weight:700; padding:1px 5px; border-radius:4px; margin-bottom:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;
  }
  .cal-more{ border:none; background:none; font-size:9.5px; color: var(--muted); font-weight:700; cursor:pointer; padding:0; }

  .cal-modal-backdrop{ position:fixed; inset:0; background:rgba(20,21,26,0.55); z-index:300; display:flex; align-items:center; justify-content:center; padding:20px; }
  .cal-modal{ background: var(--surface); border-radius: var(--radius-lg); max-width:420px; width:100%; max-height:85vh; overflow-y:auto; padding:22px; box-shadow: var(--shadow-lg); }
  .cal-modal-wide{ max-width:560px; }

  .cw-toprow{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:4px; }
  .cw-title{ font-size:17px; font-weight:800; margin:0; flex:1; }
  .cw-fav-btn{ background:none; border:none; cursor:pointer; font-size:21px; line-height:1; color: var(--border-strong); padding:2px 4px; flex-shrink:0; }
  .cw-fav-btn.active{ color: var(--amber); }
  .cw-badges{ display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 14px; }
  .cw-badge{ font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:20px; letter-spacing:0.02em; }
  .cw-badge.current{ background: var(--green-tint); color: var(--green); }
  .cw-badge.past{ background: var(--bg); color: var(--muted); }
  .cw-badge.upcoming{ background: var(--red-tint); color: var(--red-dark); }
  .cw-progress-wrap{ margin-bottom:16px; }
  .cw-progress-label{ font-size:11px; color: var(--muted); margin-bottom:4px; display:flex; justify-content:space-between; gap:10px; }
  .cw-progressbar{ height:6px; border-radius:4px; background: var(--bg); overflow:hidden; }
  .cw-progressbar-fill{ height:100%; background: var(--green); border-radius:4px; transition: width 0.3s var(--ease); }
  .cw-section{ margin-top:18px; }
  .cw-section-label{ font-size:11px; font-weight:800; color: var(--ink); margin-bottom:7px; display:block; text-transform:uppercase; letter-spacing:0.03em; }
  .cw-revision-choices{ display:flex; gap:6px; flex-wrap:wrap; }
  .cw-revision-choices .status-pill{ cursor:pointer; border:1.5px solid transparent; font-family: var(--font-main); }
  .cw-revision-choices .status-pill.is-active{ border-color: currentColor; }
  .cw-checklist{ display:flex; flex-direction:column; gap:8px; }
  .cw-checklist label{ display:flex; align-items:center; gap:9px; font-size:13px; color: var(--ink); cursor:pointer; }
  .cw-checklist input[type="checkbox"]{ width:16px; height:16px; accent-color: var(--red); cursor:pointer; flex-shrink:0; }
  .cw-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:20px; padding-top:14px; border-top:1px solid var(--bg); }
  .cw-save-indicator{ font-size:11px; color: var(--muted); }

  /* ---- fiche de cours : disposition à deux volets (notes + assistant IA) ---- */
  .cal-modal-workspace{
    max-width:1020px; width:100%; max-height:90vh; padding:0; overflow:hidden;
    display:flex; flex-direction:column; position:relative;
  }
  .cal-modal-workspace .cw-main{ flex:1 1 auto; min-width:0; overflow-y:auto; padding:22px; }

  /* Un seul bouton pour fermer (dans l'en-tête du panneau) et un seul pour rouvrir
     (bouton plein, avec icône + texte) — jamais de glyphe ambigu sans libellé. */
  .cw-ai-openbtn{
    display:none; align-items:center; justify-content:center; gap:8px;

  .cw-ai-closebtn{
    display:flex; align-items:center; gap:6px; background: var(--surface); border:1.5px solid var(--border);
    border-radius:20px; padding:7px 14px 7px 12px; font-size:12px; font-weight:800; color: var(--ink-soft);
    cursor:pointer; font-family: var(--font-main); margin-left:auto; flex-shrink:0; min-height:34px;

  .cw-ai-closebtn:hover{ border-color: var(--red); color: var(--red-dark); background: var(--red-tint); }

  @media (max-width:420px){
    .cw-ai-closebtn .txt{ display:none; }

  .cw-aiside{ display:none; }

    display:flex; flex-direction:column; position:absolute; inset:0; background: var(--surface);

<script>
/* ============================================================
   1. DONNÉES — QUESTIONS DE QUIZ
   ============================================================ */
const QUESTIONS = [
  // ---------- THEME: fondamentaux ----------
  {theme:"fondamentaux", q:"Comment définit-on l'étude de marché ?", opts:[
    "Un processus systématique de collecte et d'analyse d'informations pour soutenir la prise de décision commerciale",
    "Une base de données de tous les concurrents d'un secteur",
    "Un outil de publicité destiné à promouvoir un produit",
    "Un audit financier de l'entreprise"
  ], correct:0, exp:"L'étude de marché est avant tout un processus de collecte et d'analyse d'informations qui aide le manager à prendre une décision."},

  {theme:"fondamentaux", q:"À quel moment faut-il, en théorie, mener une étude de marché ?", opts:[
    "Seulement avant le lancement d'un nouveau produit",
    "Chaque fois qu'un manager a besoin d'informations avant de prendre une décision",
    "Une fois par an, de façon systématique",
    "Uniquement quand les ventes chutent"
  ], correct:1, exp:"L'étude de marché sert à conseiller la direction : elle est utile dès qu'une décision nécessite des informations fiables."},

  {theme:"fondamentaux", q:"Lequel n'est PAS présenté comme un risque de ne pas mener d'étude de marché ?", opts:[
    "Négliger des opportunités",
    "Mauvaise compréhension des besoins des consommateurs",
    "Une hausse automatique du chiffre d'affaires",
    "Difficultés à attirer des financements"
  ], correct:2, exp:"Ne pas faire d'étude de marché n'apporte aucun bénéfice — c'est justement l'absence d'information qui fragilise les décisions."},

  {theme:"fondamentaux", q:"L'étude de marché suit une approche scientifique structurée en 4 étapes. Laquelle NE fait PAS partie de ces étapes ?", opts:[
    "Description", "Explication", "Certification", "Prédiction"
  ], correct:2, exp:"Les 4 étapes sont : Description, Explication, Prédiction, Contrôle."},

  {theme:"fondamentaux", q:"Quelle est la différence entre problématique commerciale et objectif de recherche ?", opts:[
    "Ce sont deux termes strictement synonymes",
    "La problématique commerciale est le problème du décideur (la décision à prendre) ; l'objectif de recherche définit l'information nécessaire pour l'éclairer",
    "L'objectif de recherche précède toujours la problématique commerciale",
    "La problématique commerciale concerne uniquement les données quantitatives"
  ], correct:1, exp:"La problématique commerciale correspond à la décision du manager ; l'objectif de recherche en découle et précise quelles informations aller chercher."},

  {theme:"fondamentaux", q:"À quoi sert le Research Brief ?", opts:[
    "À présenter le budget marketing de l'année",
    "À lister les concurrents directs de l'entreprise",
    "À énoncer explicitement les objectifs de recherche et les informations à recueillir",
    "À remplacer le rapport final de l'étude"
  ], correct:2, exp:"Le Research Brief formalise, de façon claire et explicite, les objectifs de recherche et les informations attendues."},

  {theme:"fondamentaux", q:"Quel est l'enchaînement correct des 5 étapes du processus général d'étude de marché ?", opts:[
    "Collecte des données → Définition de la problématique → Plan de recherche → Analyse → Rapport",
    "Définition de la problématique → Plan de recherche → Collecte des données → Analyse des données → Rapport",
    "Plan de recherche → Analyse des données → Définition de la problématique → Collecte → Rapport",
    "Rapport → Définition de la problématique → Collecte → Analyse → Plan de recherche"
  ], correct:1, exp:"L'ordre est : 1) problématique, 2) plan de recherche, 3) collecte des données (terrain), 4) analyse, 5) rapport."},

  {theme:"fondamentaux", q:"Quel est l'objectif principal d'un cahier des charges de recherche ?", opts:[
    "Résumer les résultats de l'enquête",
    "Présenter les objectifs de la recherche et les informations nécessaires",
    "Recruter des répondants",
    "Faire de la publicité pour l'entreprise"
  ], correct:1, exp:"Le cahier des charges (Research Brief) sert à présenter clairement les objectifs de la recherche et les informations à recueillir."},

  // ---------- THEME: donnees ----------
  {theme:"donnees", q:"Que sont les données secondaires ?", opts:[
    "Des données collectées pour la première fois pour la recherche en cours",
    "Des informations déjà collectées auparavant, à des fins différentes de la recherche actuelle",
    "Des données uniquement issues de sondages internes",
    "Des données jugées peu fiables et à éviter"
  ], correct:1, exp:"Les données secondaires existent déjà : elles ont été collectées pour un autre objectif que l'étude en cours."},

  {theme:"donnees", q:"Que sont les données primaires ?", opts:[
    "Des données collectées pour la première fois, spécifiquement pour traiter la problématique de recherche étudiée",
    "Des données gratuites disponibles sur Internet",
    "Des données historiques de plus de 10 ans",
    "Des statistiques publiées par l'INSEE"
  ], correct:0, exp:"Les données primaires sont recueillies spécifiquement pour répondre à la problématique actuelle — elles n'existaient pas avant l'étude."},

  {theme:"donnees", q:"Lequel N'EST PAS un avantage des données secondaires ?", opts:[
    "Facilement accessibles", "Relativement peu coûteuses", "Toujours parfaitement à jour et pertinentes", "Rapidement obtenues"
  ], correct:2, exp:"Au contraire, les données secondaires peuvent être obsolètes ou pas entièrement pertinentes — c'est justement une de leurs limites."},

  {theme:"donnees", q:"Laquelle de ces sources est une source INTERNE de données secondaires ?", opts:[
    "Statista", "Les chiffres de vente de l'entreprise", "L'INSEE", "Les études XERFI"
  ], correct:1, exp:"Les chiffres de vente (organisés par zone, produit, année) proviennent directement de l'entreprise : c'est une source interne."},

  {theme:"donnees", q:"Quand doit-on privilégier la collecte de données primaires ?", opts:[
    "Systématiquement, avant toute donnée secondaire",
    "Lorsque les données secondaires ne permettent pas de répondre à la problématique commerciale",
    "Uniquement pour les grandes entreprises cotées",
    "Jamais, car c'est trop coûteux"
  ], correct:1, exp:"On collecte des données primaires seulement quand les données secondaires, plus rapides et moins chères, ne suffisent pas."},

  {theme:"donnees", q:"D'après le cours, quelle précaution faut-il prendre avec les données secondaires générées par l'IA ?", opts:[
    "Aucune, elles sont automatiquement fiables",
    "Vérifier soigneusement leurs sources et leur fiabilité",
    "Les utiliser uniquement comme données primaires",
    "Les ignorer systématiquement"
  ], correct:1, exp:"L'IA peut fournir rapidement des données secondaires, mais leurs sources et leur fiabilité doivent être soigneusement évaluées."},

  {theme:"donnees", q:"Quel type de données correspond à des informations déjà collectées pour un autre objectif ?", opts:[
    "Données primaires", "Données expérimentales", "Données secondaires", "Données qualitatives"
  ], correct:2, exp:"C'est la définition même des données secondaires : elles ont été collectées auparavant, pour un autre objectif."},

  {theme:"donnees", q:"Lequel des éléments suivants est un exemple de source EXTERNE de données secondaires ?", opts:[
    "Registres de ventes de l'entreprise",
    "Base de données des réclamations clients",
    "Revues académiques",
    "Données internes du programme de fidélité"
  ], correct:2, exp:"Les revues académiques sont produites hors de l'entreprise : c'est une source externe, contrairement aux données internes de vente, réclamations ou fidélité."},

  // ---------- THEME: recherche ----------
  {theme:"recherche", q:"Quel objectif poursuit la recherche qualitative ?", opts:[
    "Comprendre le « QUOI » — obtenir des idées et perspectives sur un phénomène nouveau",
    "Comprendre le « COMMENT » via la mesure d'un phénomène",
    "Comprendre le « POURQUOI » via une relation de cause à effet",
    "Confirmer une hypothèse déjà solidement établie"
  ], correct:0, exp:"La recherche qualitative vise à comprendre un phénomène encore peu connu : elle répond au « QUOI »."},

  {theme:"recherche", q:"La recherche descriptive répond principalement à quelle question ?", opts:[
    "Pourquoi ?", "Quoi ?", "Comment ?", "Qui a décidé ?"
  ], correct:2, exp:"La recherche descriptive (quantitative) mesure la fréquence d'un phénomène et les relations entre variables : elle répond au « COMMENT »."},

  {theme:"recherche", q:"La recherche causale correspond à :", opts:[
    "Un plan expérimental visant à identifier une relation de cause à effet",
    "Une phase exploratoire sans hypothèse préalable",
    "Une simple collecte de données secondaires",
    "Une étude menée uniquement par entretiens"
  ], correct:0, exp:"La recherche causale teste des hypothèses en conditions contrôlées pour établir une relation de cause à effet — elle répond au « POURQUOI »."},

  {theme:"recherche", q:"Dans un projet de recherche typique, quel est l'enchaînement logique des trois types de recherche ?", opts:[
    "Causale → Descriptive → Qualitative",
    "Descriptive → Causale → Qualitative",
    "Qualitative (exploratoire) → Descriptive → Causale",
    "Les trois se déroulent toujours simultanément"
  ], correct:2, exp:"On explore d'abord en qualitatif, on mesure ensuite en descriptif, puis on teste les hypothèses en causal (phase conclusive)."},

  {theme:"recherche", q:"« Nous voulons tester la préférence des consommateurs pour différents tons de communication (ex : l'humour) » : de quel type de recherche s'agit-il ?", opts:[
    "Recherche qualitative", "Recherche descriptive", "Recherche causale", "Recherche documentaire"
  ], correct:2, exp:"Tester l'effet d'une variable (le ton) sur une préférence est une démarche causale, expérimentale."},

  {theme:"recherche", q:"Quelle affirmation est vraie concernant la connaissance préalable du sujet ?", opts:[
    "La recherche qualitative nécessite une connaissance approfondie et des hypothèses",
    "La recherche causale se mène avec une connaissance faible ou inexistante du sujet",
    "Descriptive et causale s'appuient sur une connaissance approfondie du sujet, contrairement à la qualitative",
    "Le niveau de connaissance préalable n'a aucune importance"
  ], correct:2, exp:"Qualitatif = connaissance faible/inexistante (exploration) ; descriptif et causal = connaissance approfondie permettant de formuler des hypothèses."},

  {theme:"recherche", q:"Quel est l'objectif principal de la recherche descriptive ?", opts:[
    "Comprendre pourquoi un phénomène se produit",
    "Quantifier et décrire un phénomène",
    "Générer uniquement des premiers enseignements",
    "Recruter des répondants"
  ], correct:1, exp:"La recherche descriptive vise à quantifier et décrire un phénomène, en mesurant sa fréquence et ses relations avec d'autres variables."},

  {theme:"recherche", q:"Quel type de recherche est généralement mené en premier lorsqu'on étudie un nouveau phénomène ?", opts:[
    "Recherche causale", "Recherche descriptive", "Recherche qualitative", "Recherche expérimentale"
  ], correct:2, exp:"On commence toujours par la recherche qualitative (exploratoire) avant de passer au descriptif puis au causal."},

  {theme:"recherche", q:"Quel type de recherche est principalement utilisé pour identifier des relations de cause à effet ?", opts:[
    "Recherche qualitative", "Recherche descriptive", "Recherche causale", "Recherche secondaire"
  ], correct:2, exp:"C'est la recherche causale, de nature expérimentale, qui permet d'établir une relation de cause à effet."},

  // ---------- THEME: echantillonnage ----------
  {theme:"echantillon", q:"Quelle est la différence essentielle entre échantillonnage probabiliste et non probabiliste ?", opts:[
    "Le probabiliste ne concerne que les grandes populations",
    "Dans le probabiliste, chaque individu a une probabilité égale d'être sélectionné de façon aléatoire ; le non probabiliste repose sur l'accessibilité ou le jugement du chercheur",

  let h = 5381;
  for(let i=0;i<s.length;i++){ h = (((h<<5)+h) ^ s.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}

})();

function shuffle(arr){

  for(let i=a.length-1;i>0;i--){

    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function pad2(n){ return n<10 ? "0"+n : ""+n; }
function dateKey(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayKey(){ return dateKey(new Date()); }
function mondayOfThisWeek(){
  const d = new Date();
  const day = d.getDay(); // 0 = dimanche, 1 = lundi, ...
  const diff = day === 0 ? -6 : 1 - day; // recule jusqu'au lundi
  d.setDate(d.getDate() + diff);
  return d;
}
function weeklyCount(){
  const monday = mondayOfThisWeek();
  const stats = state.dash.dailyStats;
  let total = 0;
  for(let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    const k = dateKey(d);
    if(stats[k]) total += stats[k].answered;
  }
  return total;
}
function diffDaysKeys(a,b){
  const da = new Date(a+"T00:00:00");
  const db = new Date(b+"T00:00:00");
  return Math.round((db-da)/86400000);
}

function computeStreaks(dateKeys){
  const set = new Set(dateKeys || []);
  if(set.size === 0) return {current:0, best:0};
  const sorted = Array.from(set).sort();
  let best = 1, run = 1;
  for(let i=1;i<sorted.length;i++){
    if(diffDaysKeys(sorted[i-1], sorted[i]) === 1) run++; else run = 1;
    if(run > best) best = run;
  }
  let cursor = new Date();
  let cKey = dateKey(cursor);
  if(!set.has(cKey)){
    cursor.setDate(cursor.getDate()-1);
    cKey = dateKey(cursor);
    if(!set.has(cKey)) return {current:0, best};
  }
  let current = 0;
  while(set.has(dateKey(cursor))){
    current++;
    cursor.setDate(cursor.getDate()-1);
  }
  return {current, best};
}

function fmtDuration(totalSeconds){
  const s = totalSeconds || 0;
  if(s < 60) return s + " sec";
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  if(h > 0) return h + "h" + (m>0 ? " "+pad2(m)+"min" : "");
  return m + " min";
}

function fmtRelativeDate(k){
  const today = todayKey();
  const yestDate = new Date(); yestDate.setDate(yestDate.getDate()-1);
  const yest = dateKey(yestDate);
  if(k === today) return "Aujourd'hui";
  if(k === yest) return "Hier";
  const diff = diffDaysKeys(k, today);
  if(diff < 7 && diff > 0) return "Il y a " + diff + " jours";
  const dt = new Date(k+"T00:00:00");
  return dt.toLocaleDateString("fr-FR", {day:"2-digit", month:"short"});
}

function chapterIdFromQuizScope(scope){
  if(typeof scope !== "string") return null;
  if(scope.indexOf("chapter:") === 0) return scope.slice(8);
  if(CHAPTERS.some(c=>c.id===scope)) return scope;
  const ch = CHAPTERS.find(c=>c.themes.includes(scope));
  return ch ? ch.id : null;
}

  return CHAPTERS.find(c => c.id === chId) || state.userChapters.find(c => c.id === chId) || null;

  if(!ch) return null;

/* Progression d'un chapitre "utilisateur" : basée sur les tentatives de quiz/flashcards
   générés par IA, enregistrées sous la même clé que le reste du site ("chapter:<id>"). */
function userChapterProgress(ch){
  const quizP = state.progress["chapter:"+ch.id];
  const flashP = state.flashProgress[ch.id];
  const vals = [];
  if(quizP) vals.push(quizP.best);
  if(flashP) vals.push(flashP.best);
  if(vals.length === 0) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}

function subjectProgress(subjectId){
  const chs = chaptersOfSubject(subjectId);
  if(chs.length === 0) return null;
  let sum = 0, n = 0;
  chs.forEach(ch=>{
    const p = isUserChapter(ch.id) ? userChapterProgress(ch) : chapterMetrics(ch).mastery;
    if(p !== null && p !== undefined){ sum += p; n++; }
  });
  return n ? Math.round(sum/n) : 0;
}

const LS_PREFIX = "revisions-etude-marche:";
const KEY_QUIZ   = "quiz-progress";
const KEY_FLASH  = "flashcard-progress";
const KEY_AI     = "ai-history";

const KEY_AIBUBBLE = "ai-bubble-pos";
const KEY_COURSE_DATA = "course-data";

const memoryFallback = {};   // utilisé si localStorage est indisponible
let storageAvailable = true;

function lsGet(key){
  try{
    const raw = localStorage.getItem(LS_PREFIX + key);
    if(raw === null) return null;
    return JSON.parse(raw);
  }catch(e){
    storageAvailable = false;
    return memoryFallback[key] !== undefined ? memoryFallback[key] : null;
  }
}

function lsSet(key, value){
  memoryFallback[key] = value;
  try{
    localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
    return true;
  }catch(e){
    storageAvailable = false;
    return false;
  }
}

/* Ancienne API de stockage (window.storage) : on l'importe une seule fois,
   sans jamais l'effacer, pour ne perdre aucune donnée déjà enregistrée. */
async function legacyGet(key){
  try{
    if(typeof window === "undefined" || !window.storage || !window.storage.get) return null;
    const res = await window.storage.get(key, false);
    if(res && res.value) return JSON.parse(res.value);
    return null;
  }catch(e){ return null; }
}

async function loadKey(key, fallback){
  const local = lsGet(key);
  if(local !== null && local !== undefined) return local;
  const legacy = await legacyGet(key);
  if(legacy !== null && legacy !== undefined){
    lsSet(key, legacy);   // migration non destructive
    return legacy;
  }
  return fallback;
}

async function loadAllData(){
  state.progress      = await loadKey(KEY_QUIZ, {});
  state.flashProgress = await loadKey(KEY_FLASH, {});
  state.aiHistory     = await loadKey(KEY_AI, []);

    state.dash.totalAnswered    = dash.totalAnswered || 0;
    state.dash.totalCorrect     = dash.totalCorrect || 0;
    state.dash.dailyStats       = dash.dailyStats || {};
    state.dash.activityDates    = dash.activityDates || [];
    state.dash.timeSpentSeconds = dash.timeSpentSeconds || 0;
    state.dash.recentActivity   = dash.recentActivity || [];
    state.dash.recentChapters   = dash.recentChapters || [];
    state.dash.wrongQuestions   = dash.wrongQuestions || {};
    state.dash.correctStreak     = dash.correctStreak || 0;
    state.dash.bestCorrectStreak = dash.bestCorrectStreak || 0;
    state.dash.quizzesCompleted = (dash.quizzesCompleted !== undefined)
      ? dash.quizzesCompleted
      : (dash.recentActivity || []).filter(a => a.type === "quiz" || a.type === "exam").length;
    state.dash.best90Achieved = (dash.best90Achieved !== undefined)
      ? dash.best90Achieved
      : (dash.recentActivity || []).some(a => a.pct >= 90 && a.total >= 10);
    state.dash.recentAdds = dash.recentAdds || [];
  }
  state.qstats = await loadKey(KEY_QSTATS, {});
  state.exam.history = await loadKey(KEY_EXAM, []);
  state.aiCards = await loadKey(KEY_AICARDS, {});
  state.badges = await loadKey(KEY_BADGES, {});
  state.userSubjects = await loadKey(KEY_USER_SUBJECTS, []);
  state.userChapters = await loadKey(KEY_USER_CHAPTERS, []);
  const savedProfile = await loadKey(KEY_PROFILE, null);
  if(savedProfile && typeof savedProfile.firstName === "string") state.profile.firstName = savedProfile.firstName;
  const savedPlanning = await loadKey(KEY_PLANNING, null);
  if(savedPlanning){
    state.planning.events = Array.isArray(savedPlanning.events) ? savedPlanning.events : [];
    state.planning.officialUrl = savedPlanning.officialUrl || "";
    state.planning.lastSyncAt = savedPlanning.lastSyncAt || null;
  }
  state.documents = await loadKey(KEY_DOCUMENTS, []);
  state.courseData = await loadKey(KEY_COURSE_DATA, {});
  const savedBubble = lsGet(KEY_AIBUBBLE);
  if(savedBubble && typeof savedBubble.x === "number" && typeof savedBubble.y === "number"){
    state.aiBubble.x = savedBubble.x;
    state.aiBubble.y = savedBubble.y;
  }
  const savedModelChoice = lsGet(KEY_AIMODEL);
  if(savedModelChoice === "small" || savedModelChoice === "large") state.aiModelChoice = savedModelChoice;
  migrateLegacyWrongQuestions();
  evaluateBadges(); // rattrape les badges déjà mérités par l'historique existant
}

const DEFAULT_CHECKLIST = { relire:false, exercices:false, definitions:false, prochain:false };

    aiThread: cd.aiThread || [],

      state.courseAIUI.selectionHint = null;
      state.courseAIUI.quizIndex = 0;
      state.courseAIUI.quizRevealed = false;

  state.planning.focusNotesOnOpen = !!focusNotes;

  const evId = state.planning.selectedEventId;

    if(ta) saveCourseData(evId, {[COURSE_TEXT_FIELDS[id]]: ta.value});
