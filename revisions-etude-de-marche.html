<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Révisions — Étude de marché</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F8FA;
    --surface:#FFFFFF;
    --border:#E7E8ED;
    --border-strong:#D7D9E1;
    --ink:#16171C;
    --ink-soft:#585A66;
    --muted:#93959F;
    --red:#E31C3D;
    --red-dark:#B4152F;
    --red-tint:#FDECEF;
    --green:#1E8A5F;
    --green-tint:#E7F6EF;
    --radius-lg:14px;
    --radius-md:10px;
    --radius-sm:7px;
    --shadow: 0 1px 3px rgba(16,17,20,0.06), 0 1px 2px rgba(16,17,20,0.04);
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", Arial, Helvetica, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  .wrap{ max-width: 900px; margin: 0 auto; padding: 0 20px 80px; }
  .quizwrap{ max-width: 620px; margin: 0 auto; padding: 32px 20px 60px; }

  /* ===== TOPBAR ===== */
  .topbar{
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner{ max-width: 900px; margin:0 auto; padding: 16px 20px; }
  .brandrow{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap: 14px; }
  .brand-text .eyebrow{
    font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--red); font-weight: 800; margin-bottom: 3px;
  }
  .brand-text h1{ font-size: 20px; font-weight: 800; margin: 0; letter-spacing:-0.01em; }
  .brand-text p{ margin: 2px 0 0; font-size: 12.5px; color: var(--ink-soft); }

  .tabnav{ display:flex; gap: 3px; background: var(--bg); padding: 4px; border-radius: 999px; border: 1px solid var(--border); flex-shrink:0; }
  .tabnav button{
    border:none; background:none; padding: 9px 16px; border-radius: 999px;
    font-family:"Inter",sans-serif; font-weight: 700; font-size: 13px; color: var(--ink-soft); cursor:pointer;
    transition: background 0.12s ease, color 0.12s ease;
    display:flex; align-items:center; gap:6px;
  }
  .tabnav button.active{ background: var(--ink); color: #fff; }
  .tabnav button:hover:not(.active){ color: var(--ink); }

  /* ===== STAT BAR ===== */
  .statbar{ display:grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin: 26px 0 22px; }
  .stat{ background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px 18px; box-shadow: var(--shadow); }
  .stat .num{ font-size: 25px; font-weight: 800; color: var(--ink); line-height:1; }
  .stat .num.accent{ color: var(--red); }
  .stat .lbl{ font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; margin-top: 6px; }

  /* ===== HERO / MIX ALL ===== */
  .hero-mix{
    display:flex; align-items:center; justify-content:space-between; gap: 16px;
    background: linear-gradient(135deg, #FFFFFF 55%, var(--red-tint));
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 20px 22px; margin-bottom: 30px; box-shadow: var(--shadow);
  }
  .hero-mix .txt .h{ font-weight: 800; font-size: 15.5px; margin-bottom: 3px; }
  .hero-mix .txt .d{ font-size: 13px; color: var(--ink-soft); }

  .btn{
    font-family: "Inter", sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.01em;
    padding: 12px 20px; border-radius: var(--radius-md); cursor: pointer; border: none;
    background: var(--ink); color: #fff; white-space: nowrap;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease, transform 0.1s ease;
  }
  .btn:hover{ background: var(--red); }
  .btn.outline{ background: #fff; color: var(--ink); border: 1.5px solid var(--border-strong); }
  .btn.outline:hover{ border-color: var(--red); color: var(--red); }
  .btn.red{ background: var(--red); }
  .btn.red:hover{ background: var(--red-dark); }
  .btn.green{ background: var(--green); }
  .btn.green:hover{ background:#166B49; }
  .btn.small{ padding: 8px 14px; font-size: 12px; }
  .btn:disabled{ background: var(--border) !important; color: var(--muted) !important; cursor: not-allowed; }
  .btn-text{
    background:none; border:none; color: var(--ink-soft); font-family:"Inter",sans-serif;
    font-size: 12.5px; font-weight: 700; text-decoration: underline; cursor:pointer; padding: 6px 0;
  }
  .btn-text:hover{ color: var(--red); }

  /* ===== LEVEL CHIPS (shared: quiz / fiches / flashcards) ===== */
  .levelchips{ display:flex; gap: 8px; margin: 24px 0 22px; flex-wrap:wrap; }
  .levelchips button{
    border: 1.5px solid var(--border-strong); background: #fff; border-radius: 999px; padding: 8px 16px;
    font-weight: 700; font-size: 12.5px; color: var(--ink-soft); cursor:pointer; font-family:"Inter",sans-serif;
  }
  .levelchips button.active{ background: var(--ink); color: #fff; border-color: var(--ink); }
  .levelchips button.L3.active{ background: var(--red); border-color: var(--red); }

  /* ===== LEVEL HEADING ===== */
  .level-heading{ display:flex; align-items:center; gap: 10px; margin: 32px 0 14px; flex-wrap:wrap; }
  .level-heading:first-of-type{ margin-top: 0; }
  .level-heading .tag{ background: var(--ink); color:#fff; font-weight: 800; font-size: 11.5px; padding: 4px 11px; border-radius: 999px; flex-shrink:0; }
  .level-heading .tag.L3{ background: var(--red); }
  .level-heading .name{ font-size: 12.5px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; }
  .level-heading .desc{ font-size: 12px; color: var(--muted); font-weight: 500; }
  .level-heading .line{ flex:1; height:1px; background: var(--border); min-width: 20px; }

  /* ===== CHAPTERS (quiz picker) ===== */
  .chapter{ background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px 24px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .chapter-head{ display:flex; align-items:flex-start; gap: 14px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .chapter-num{ background: var(--red-tint); color: var(--red-dark); font-weight: 800; font-size: 12px; padding: 4px 10px; border-radius: 999px; flex-shrink:0; }
  .chapter-headtext{ flex:1; min-width: 180px; }
  .chapter-headtext .title-row{ display:flex; align-items:center; gap: 8px; flex-wrap:wrap; }
  .chapter-headtext h2{ font-size: 17.5px; font-weight: 800; margin: 0; letter-spacing: -0.005em; }
  .chapter-headtext p{ margin: 5px 0 0; font-size: 12.5px; color: var(--ink-soft); }
  .level-badge{ font-size: 10px; font-weight: 800; letter-spacing: 0.04em; padding: 3px 8px; border-radius: 999px; }
  .level-badge.L1{ background:#EDEEF2; color: var(--ink-soft); }
  .level-badge.L2{ background:#DEE0E7; color: var(--ink); }
  .level-badge.L3{ background: var(--red); color: #fff; }
  .chapter-headright{ flex-shrink:0; text-align:right; }
  .chapter-headright .avg{ font-size: 19px; font-weight: 800; color: var(--ink); }
  .chapter-headright .avg.none{ color: var(--muted); font-size: 12px; font-weight: 700; }
  .chapter-headright .avglbl{ font-size: 10px; text-transform:uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight:700; }

  .subgrid{ display:grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .subcard{
    border: 1px solid var(--border); background: var(--surface); text-align:left; padding: 14px 15px; cursor:pointer;
    font-family: "Inter", sans-serif; border-radius: var(--radius-md);
    transition: border-color 0.12s ease, transform 0.1s ease, box-shadow 0.12s ease;
    display:flex; flex-direction:column; gap: 8px;
  }
  .subcard:hover{ border-color: var(--red); transform: translateY(-2px); box-shadow: var(--shadow); }
  .subcard .name{ font-size: 13.5px; font-weight: 700; color: var(--ink); line-height:1.3; }
  .subcard .meta{ display:flex; justify-content:space-between; align-items:center; }
  .subcard .count{ font-size: 11px; color: var(--muted); font-weight: 500; }
  .subcard .badge{ font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .subcard .badge.none{ color: var(--muted); background: var(--bg); }
  .subcard .badge.low{ color: var(--red-dark); background: var(--red-tint); }
  .subcard .badge.high{ color: #fff; background: var(--ink); }

  .chapter-actions{ display:flex; justify-content:flex-end; }

  /* ===== FICHES ===== */
  .fiche-card{ background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 26px 26px 24px; margin-bottom: 18px; box-shadow: var(--shadow); }
  .fiche-card-head{ display:flex; gap: 14px; align-items:flex-start; margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .fiche-card-head .title-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .fiche-card-head h2{ font-size: 18px; font-weight: 800; margin: 0; }
  .fiche-card-head p{ font-size: 13px; color: var(--ink-soft); margin: 5px 0 0; }
  .fiche-card h3{ font-size: 15px; font-weight: 800; margin: 22px 0 8px; color: var(--ink); }
  .fiche-card h3:first-of-type{ margin-top: 0; }
  .fiche-def{ background: var(--red-tint); border-left: 3px solid var(--red); padding: 12px 14px; border-radius: 8px; font-size: 13.5px; line-height:1.6; margin: 0 0 16px; color: var(--ink); }
  .fiche-def b{ color: var(--red-dark); }
  .fiche-list{ margin: 0 0 6px; padding-left: 20px; font-size: 13.5px; color: var(--ink-soft); line-height: 1.7; }
  .fiche-list li{ margin-bottom: 5px; }
  .fiche-list b{ color: var(--ink); }
  .table-wrap{ overflow-x:auto; margin: 10px 0 18px; }
  .fiche-table{ width:100%; border-collapse: collapse; font-size: 12.5px; min-width: 420px; }
  .fiche-table th{ background: var(--bg); text-align:left; padding: 8px 10px; font-weight: 800; border-bottom: 2px solid var(--border); white-space: normal; }
  .fiche-table td{ padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--ink-soft); white-space: normal; }
  .fiche-tip{ background: var(--bg); border-radius: 8px; padding: 11px 14px; font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; line-height:1.6; }
  .fiche-tip b{ color: var(--ink); }

  /* ===== QUIZ CARD ===== */
  .card{ background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 30px 28px; box-shadow: var(--shadow); }

  .progress-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 16px; gap:10px; }
  .progress-row .label{ font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
  .progress-row .score{ font-size: 13.5px; color: var(--red); font-weight: 800; flex-shrink:0; }
  .bar-track{ height: 5px; background: var(--border); border-radius: 3px; margin-bottom: 22px; overflow:hidden; }
  .bar-fill{ height:100%; background: var(--red); border-radius: 3px; transition: width 0.3s ease; }

  .qtheme{ font-size: 11px; color: var(--red); font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }

  h2.question{ font-size: 19px; font-weight: 700; line-height: 1.4; margin: 0 0 22px; color: var(--ink); }

  .options{ display:flex; flex-direction:column; gap: 9px; margin-bottom: 6px; }
  .opt{
    display:flex; align-items:flex-start; gap: 12px; text-align:left; background: var(--surface);
    border: 1.5px solid var(--border); padding: 13px 14px; font-family: "Inter", sans-serif; font-size: 14.5px;
    color: var(--ink); cursor:pointer; border-radius: var(--radius-md);
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .opt:hover:not(:disabled){ border-color: var(--ink); }
  .opt .letter{ font-weight: 800; color: var(--muted); flex-shrink:0; }
  .opt:disabled{ cursor:default; }
  .opt.correct{ border-color: var(--red); background: var(--red-tint); border-left-width: 4px; font-weight: 700; }
  .opt.correct .letter{ color: var(--red); }
  .opt.incorrect{ background: var(--bg); border-color: var(--border); color: var(--muted); text-decoration: line-through; }
  .opt.incorrect .letter{ color: var(--muted); }
  .opt.dim{ opacity: 0.45; }

  .feedback{ margin-top: 20px; padding: 15px 16px; border-left: 3px solid var(--ink); background: var(--bg); font-size: 14px; line-height: 1.6; color: var(--ink-soft); border-radius: 0 8px 8px 0; }
  .feedback.wrong{ border-left-color: var(--red); }
  .feedback .verdict{ font-weight: 800; display:block; margin-bottom: 4px; color: var(--ink); }
  .feedback.wrong .verdict{ color: var(--red); }

  .actions{ display:flex; justify-content: space-between; align-items:center; margin-top: 24px; gap:10px; flex-wrap:wrap; }

  /* ===== RESULTS (quiz) ===== */
  .results h2{ font-size: 21px; font-weight: 800; margin: 0 0 4px; }
  .results .scoretag{ font-size: 10.5px; text-transform:uppercase; letter-spacing:0.06em; color: var(--muted); font-weight:700; margin-bottom: 16px; }
  .results .bigscore{ font-size: 48px; font-weight: 800; color: var(--red); line-height:1; margin: 4px 0 4px; }
  .results .bigscore span{ font-size: 14.5px; color: var(--ink-soft); font-weight:500; margin-left:4px; }
  .results p.msg{ color: var(--ink-soft); margin: 6px 0 22px; font-size: 14px; }

  .recap{ border-top: 1px solid var(--border); padding-top: 4px; margin-top: 4px; }
  .recap-item{ display:flex; gap: 10px; align-items:flex-start; padding: 10px 0; border-bottom: 1px solid var(--bg); font-size: 13.5px; }
  .recap-item:last-child{ border-bottom:none; }
  .recap-mark{ flex-shrink:0; width: 16px; font-weight: 800; }
  .recap-mark.ok{ color: var(--ink); }
  .recap-mark.ko{ color: var(--red); }
  .recap-q{ color: var(--ink-soft); }

  .results .actions{ justify-content:flex-start; gap: 12px; }

  footer.hint{ text-align:center; color: var(--muted); font-size: 12px; margin-top: 26px; }

  /* ===== FLASHCARDS ===== */
  .flash-deckgrid{ display:grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-bottom: 14px; }
  @media (max-width:560px){ .flash-deckgrid{ grid-template-columns: 1fr; } }
  .flash-deckcard{
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 18px 19px; box-shadow: var(--shadow); display:flex; flex-direction:column; gap:10px;
  }
  .flash-deckcard .top{ display:flex; align-items:flex-start; justify-content:space-between; gap: 10px; }
  .flash-deckcard .name{ font-weight: 800; font-size: 14.5px; line-height:1.35; }
  .flash-deckcard .desc{ font-size: 12px; color: var(--ink-soft); margin-top:3px; }
  .flash-deckcard .count{ font-size: 11px; color: var(--muted); font-weight:700; white-space:nowrap; }
  .flash-deckcard .bottom{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .flash-deckcard .mastery{ font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--bg); color: var(--muted); }
  .flash-deckcard .mastery.done{ background: var(--green-tint); color: var(--green); }

  .flash-play-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 18px; gap: 10px; flex-wrap:wrap; }
  .flash-play-top .lbl{ font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
  .flash-counters{ display:flex; gap: 14px; font-size: 12.5px; font-weight: 700; }
  .flash-counters .c-known{ color: var(--green); }
  .flash-counters .c-unknown{ color: var(--red); }

  .flash-stage{ display:flex; flex-direction:column; align-items:center; }
  .flashcard{
    width: 100%; max-width: 480px; aspect-ratio: 4/3; cursor: pointer;
    perspective: 1200px; margin-bottom: 20px;
  }
  .flashcard-inner{
    position:relative; width:100%; height:100%;
    transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(.4,.2,.2,1);
  }
  .flashcard.flipped .flashcard-inner{ transform: rotateY(180deg); }
  .flashcard-face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius: var(--radius-lg); display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 30px; text-align:center; box-shadow: var(--shadow); border: 1.5px solid var(--border);
  }
  .flashcard-front{ background: var(--surface); color: var(--ink); }
  .flashcard-front .q{ font-size: 18.5px; font-weight: 800; line-height:1.4; }
  .flashcard-front .hint{ position:absolute; bottom:16px; font-size: 11px; color: var(--muted); font-weight:600; }
  .flashcard-back{ background: var(--red-tint); color: var(--ink); transform: rotateY(180deg); border-color:#F3C9CF; }
  .flashcard-back .a{ font-size: 15.5px; font-weight: 600; line-height:1.55; }
  .flashcard-back .lbl{ position:absolute; top:14px; left:18px; font-size: 10px; text-transform:uppercase; letter-spacing:0.06em; color: var(--red-dark); font-weight:800; }

  .flash-judge{ display:flex; gap: 12px; width:100%; max-width: 480px; }
  .flash-judge button{
    flex:1; padding: 14px 10px; border-radius: var(--radius-md); border: 1.5px solid var(--border-strong);
    background:#fff; font-family:"Inter",sans-serif; font-weight: 800; font-size: 13.5px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    transition: transform 0.1s ease, border-color 0.12s ease;
  }
  .flash-judge button .emoji{ font-size: 20px; }
  .flash-judge button.unknown:hover{ border-color: var(--red); color: var(--red-dark); transform: translateY(-2px); }
  .flash-judge button.known:hover{ border-color: var(--green); color: var(--green); transform: translateY(-2px); }
  .flash-judge button:disabled{ opacity: 0.35; cursor:not-allowed; transform:none; }
  .flash-hintline{ text-align:center; font-size: 12px; color: var(--muted); margin-bottom: 14px; }

  .flash-summary{ text-align:center; padding: 8px 0 4px; }
  .flash-summary .ring{
    width: 128px; height:128px; border-radius:50%; margin: 6px auto 18px; position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .flash-summary .ring .pct{ font-size: 26px; font-weight: 800; }
  .flash-summary .sub{ font-size: 13px; color: var(--ink-soft); margin-bottom: 22px; }
  .flash-review-list{ text-align:left; border-top:1px solid var(--border); padding-top: 6px; margin-top: 6px; }
  .flash-review-list .item{ display:flex; gap:10px; align-items:flex-start; padding:9px 0; font-size:13.5px; border-bottom:1px solid var(--bg); }
  .flash-review-list .item:last-child{ border-bottom:none; }
  .flash-review-list .mark{ color: var(--red); flex-shrink:0; font-weight:800; }

  @media (max-width: 560px){
    .brand-text h1{ font-size: 17px; }
    .statbar{ grid-template-columns: 1fr; }
    .subgrid{ grid-template-columns: 1fr; }
    .hero-mix{ flex-direction:column; align-items:flex-start; }
    .card{ padding: 22px 18px; }
    .chapter{ padding: 18px 16px; }
    .chapter-head{ flex-wrap:wrap; }
    .chapter-headright{ text-align:left; }
    .fiche-card{ padding: 20px 16px; }
    .fiche-card-head{ flex-wrap:wrap; }
    .flashcard-front .q{ font-size: 16.5px; }
    .flashcard-back .a{ font-size: 14px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brandrow">
      <div class="brand-text">
        <div class="eyebrow">Analyser et comprendre le marché — L1 · L2 · L3</div>
        <h1>Révisions — Étude de marché</h1>
        <p>Quiz, fiches et flashcards organisés par niveau et par chapitre.</p>
      </div>
      <div class="tabnav">
        <button id="tab-quiz">🧠 Quiz</button>
        <button id="tab-fiches">📖 Fiches</button>
        <button id="tab-flash">🃏 Flashcards</button>
      </div>
    </div>
  </div>
</div>

<div id="content" class="wrap"></div>

<script>
/* ============================================================
   1. DONNÉES — QUESTIONS DE QUIZ
   ============================================================ */
const QUESTIONS = [
  // ---------- THEME: fondamentaux ----------
  {theme:"fondamentaux", q:"Comment définit-on l'étude de marché ?", opts:[
    "Un processus systématique de collecte et d'analyse d'informations pour soutenir la prise de décision commerciale",
    "Une base de données de tous les concurrents d'un secteur",
    "Un outil de publicité destiné à promouvoir un produit",
    "Un audit financier de l'entreprise"
  ], correct:0, exp:"L'étude de marché est avant tout un processus de collecte et d'analyse d'informations qui aide le manager à prendre une décision."},

  {theme:"fondamentaux", q:"À quel moment faut-il, en théorie, mener une étude de marché ?", opts:[
    "Seulement avant le lancement d'un nouveau produit",
    "Chaque fois qu'un manager a besoin d'informations avant de prendre une décision",
    "Une fois par an, de façon systématique",
    "Uniquement quand les ventes chutent"
  ], correct:1, exp:"L'étude de marché sert à conseiller la direction : elle est utile dès qu'une décision nécessite des informations fiables."},

  {theme:"fondamentaux", q:"Lequel n'est PAS présenté comme un risque de ne pas mener d'étude de marché ?", opts:[
    "Négliger des opportunités",

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ============================================================
   5. PERSISTANCE
   ============================================================ */
async function loadProgress(){
  try {
    const res = await window.storage.get("quiz-progress", false);
    if(res && res.value){ state.progress = JSON.parse(res.value); }
  } catch(e){ state.progress = {}; }
  try {
    const res2 = await window.storage.get("flashcard-progress", false);
    if(res2 && res2.value){ state.flashProgress = JSON.parse(res2.value); }
  } catch(e){ state.flashProgress = {}; }
}

async function saveProgress(scope, scorePct){
  try {
    const prev = state.progress[scope];
    if(!prev || scorePct > prev.best){
      state.progress[scope] = { best: scorePct, attempts: (prev ? prev.attempts+1 : 1) };
    } else {
      state.progress[scope] = { best: prev.best, attempts: prev.attempts+1 };
    }
    await window.storage.set("quiz-progress", JSON.stringify(state.progress), false);
  } catch(e){ /* silent */ }
}

async function saveFlashProgress(scope, pct){
  try {
    const prev = state.flashProgress[scope];
    if(!prev || pct > prev.best){
      state.flashProgress[scope] = { best: pct, attempts: (prev ? prev.attempts+1 : 1) };
    } else {
      state.flashProgress[scope] = { best: prev.best, attempts: prev.attempts+1 };
    }
    await window.storage.set("flashcard-progress", JSON.stringify(state.flashProgress), false);
  } catch(e){ /* silent */ }
}

/* ============================================================
   6. QUIZ — LOGIQUE
   ============================================================ */
function startQuiz(scope, label, themeKeys){
  const source = themeKeys === "all" ? QUESTIONS : QUESTIONS.filter(q => themeKeys.includes(q.theme));
  state.playing = { scope, label, themeKeys };
  state.pool = shuffle(source);
  state.index = 0;
  state.score = 0;
  state.answered = false;
  state.selectedOpt = null;
  state.recap = [];
  state.screen = "quiz";
  render();
  window.scrollTo(0,0);
}

function selectOption(i){
  if(state.answered) return;
  state.answered = true;
  state.selectedOpt = i;
  const q = state.pool[state.index];
  const isCorrect = i === q.correct;
  if(isCorrect) state.score++;
  state.recap.push({q: q.q, ok: isCorrect});
  render();
}

function nextQuestion(){
  if(state.index < state.pool.length - 1){
    state.index++;
    state.answered = false;
    state.selectedOpt = null;
    render();
  } else {
    const pct = Math.round((state.score / state.pool.length) * 100);
    saveProgress(state.playing.scope, pct);
    state.screen = "results";
    render();
  }
}

function backToPicker(){
  state.screen = "picker";
  render();
}

function switchTab(tab){
  state.tab = tab;
  render();
  window.scrollTo(0,0);
}

function render(){
  document.getElementById("tab-quiz").classList.toggle("active", state.tab === "quiz");
  document.getElementById("tab-fiches").classList.toggle("active", state.tab === "fiches");
  document.getElementById("tab-flash").classList.toggle("active", state.tab === "flash");

  const content = document.getElementById("content");

  if(state.tab === "fiches"){
    content.className = "wrap";
    content.innerHTML = renderFiches();
    attachFichesEvents();
    return;
  }

  if(state.tab === "flash"){
    if(state.flashScreen === "picker"){
      content.className = "wrap";
      content.innerHTML = renderFlashPicker();
      attachFlashPickerEvents();
    } else if(state.flashScreen === "play"){
      content.className = "quizwrap";
      content.innerHTML = renderFlashPlay();
      attachFlashPlayEvents();
    } else {
      content.className = "quizwrap";
      content.innerHTML = renderFlashSummary();
      attachFlashSummaryEvents();
    }
    return;
  }

  // tab === "quiz"
  if(state.screen === "picker"){
    content.className = "wrap";
    content.innerHTML = renderPicker();
    attachPickerEvents();
  } else if(state.screen === "quiz"){
    content.className = "quizwrap";
    content.innerHTML = renderQuiz();
    attachQuizEvents();
  } else if(state.screen === "results"){
    content.className = "quizwrap";
    content.innerHTML = renderResults();
    attachResultsEvents();
  }
}

   ============================================================ */
function fmtScore(prog){
  if(!prog) return {cls:"none", txt:"Non commencé"};
  if(prog.best >= 70) return {cls:"high", txt: prog.best + "%"};
  return {cls:"low", txt: prog.best + "%"};
}

function chapterAvg(chapter, progressMap){
  const scores = chapter.themes
    .map(t => progressMap[t])
    .filter(Boolean)
    .map(p => p.best);
  if(scores.length === 0) return null;
  return Math.round(scores.reduce((a,b)=>a+b,0) / scores.length);
}

function chapterHtml(ch){
  const avg = chapterAvg(ch, state.progress);
  let html = `<div class="chapter">
    <div class="chapter-head">
      <div class="chapter-num">${ch.num}</div>
      <div class="chapter-headtext">
        <div class="title-row">
          <h2>${ch.title}</h2>
          <span class="level-badge ${ch.level}">${ch.level}</span>
        </div>
        <p>${ch.desc}</p>
      </div>
      <div class="chapter-headright">
        <div class="avg ${avg===null?'none':''}">${avg===null ? 'Non commencé' : avg + '%'}</div>
        ${avg===null ? '' : '<div class="avglbl">Moyenne</div>'}
      </div>
    </div>
    <div class="subgrid">`;

  ch.themes.forEach(tid => {
    const n = QUESTIONS.filter(q => q.theme === tid).length;
    const prog = state.progress[tid];
    const b = fmtScore(prog);
    html += `<button class="subcard" data-theme="${tid}">
      <div class="name">${THEME_META[tid].label}</div>
      <div class="meta">
        <span class="count">${n} questions</span>
        <span class="badge ${b.cls}">${b.txt}</span>
      </div>
    </button>`;
  });

  html += `</div>
    <div class="chapter-actions">
      <button class="btn outline" data-mixchapter="${ch.id}">Réviser le chapitre complet</button>
    </div>
  </div>`;
  return html;
}

function levelChips(activeKey, dataAttr){
  return `<div class="levelchips">
    <button data-${dataAttr}="all" class="${activeKey==='all'?'active':''}">Tous les niveaux</button>
    <button data-${dataAttr}="L1" class="${activeKey==='L1'?'active':''}">L1</button>
    <button data-${dataAttr}="L2" class="${activeKey==='L2'?'active':''}">L2</button>
    <button data-${dataAttr}="L3" class="${activeKey==='L3'?'active L3':''}">L3</button>
  </div>`;
}

function renderPicker(){
  const totalQ = QUESTIONS.length;
  const allProg = state.progress["all"];
  const chapterCount = CHAPTERS.length;
  const levelsToShow = state.quizLevel === "all" ? LEVELS : [state.quizLevel];

  let html = "";

  html += `
    <div class="statbar">
      <div class="stat">
        <div class="num">${totalQ}</div>
        <div class="lbl">Questions au total</div>
      </div>
      <div class="stat">

      </div>
      <div class="stat">
        <div class="num ${allProg ? 'accent':''}">${allProg ? allProg.best + '%' : '—'}</div>
        <div class="lbl">Meilleur score global</div>
      </div>
    </div>
  `;

  html += `
    <div class="hero-mix">
      <div class="txt">
        <div class="h">Réviser l'ensemble du programme</div>
        <div class="d">${totalQ} questions mélangées, tous chapitres et niveaux confondus.</div>
      </div>
      <button class="btn red" data-mixall="1">Tout mélanger</button>
    </div>
  `;

  html += levelChips(state.quizLevel, "quizlvl");

  levelsToShow.forEach(lv => {
    const chs = CHAPTERS.filter(c => c.level === lv);
    if(chs.length === 0) return;
    const lvAvg = (() => {
      const allThemes = chs.flatMap(c => c.themes);
      const scores = allThemes.map(t => state.progress[t]).filter(Boolean).map(p => p.best);
      return scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
    })();
    html += `<div class="level-heading">
      <span class="tag ${lv}">${lv}</span>
      <span class="name">${levelName(lv)}</span>
      <span class="desc">${levelDesc(lv)}${lvAvg!==null ? " · " + lvAvg + "% en moyenne" : ""}</span>
      <span class="line"></span>
      <button class="btn outline small" data-mixlevel="${lv}">Réviser ce niveau</button>
    </div>`;
    chs.forEach(ch => { html += chapterHtml(ch); });
  });

  html += `<footer class="hint">Ta progression par thème, par chapitre et par niveau est mémorisée pour cette révision.</footer>`;

  return html;
}

function attachPickerEvents(){
  document.querySelectorAll("[data-quizlvl]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.quizLevel = btn.dataset.quizlvl; render(); });
  });
  document.querySelectorAll(".subcard").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const tid = btn.dataset.theme;
      startQuiz(tid, THEME_META[tid].label, [tid]);
    });
  });
  document.querySelectorAll("[data-mixchapter]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const ch = CHAPTERS.find(c => c.id === btn.dataset.mixchapter);
      startQuiz("chapter:"+ch.id, ch.title, ch.themes);
    });
  });
  document.querySelectorAll("[data-mixlevel]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const lv = btn.dataset.mixlevel;
      const themes = CHAPTERS.filter(c=>c.level===lv).flatMap(c=>c.themes);
      startQuiz("level:"+lv, "Niveau " + lv + " — " + levelName(lv), themes);
    });
  });
  const mixAll = document.querySelector("[data-mixall]");
  if(mixAll){
    mixAll.addEventListener("click", ()=> startQuiz("all", "Tous chapitres confondus", "all"));
  }
}

const LETTERS = ["A","B","C","D"];

function renderQuiz(){
  const q = state.pool[state.index];
  const total = state.pool.length;
  const pct = Math.round(((state.index) / total) * 100);

    let cls = "opt";
    if(state.answered){
      if(i === q.correct) cls += " correct";

      else cls += " dim";
    }
    optsHtml += `<button class="${cls}" data-i="${i}" ${state.answered ? "disabled":""}>
      <span class="letter">${LETTERS[i]}</span><span>${opt}</span>
    </button>`;
  });

  const isCorrect = state.answered && state.selectedOpt === q.correct;
  const feedback = state.answered ? `
    <div class="feedback ${isCorrect ? "" : "wrong"}">
      <span class="verdict">${isCorrect ? "Exact." : "Pas tout à fait."}</span>
      ${q.exp}
    </div>` : "";

  const isLast = state.index === total - 1;

  return `
    <div class="card">
      <div class="progress-row">
        <span class="label">${state.playing.label} — Question ${state.index+1} / ${total}</span>
        <span class="score">${state.score} bonne${state.score>1?"s":""}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="qtheme">${THEME_META[q.theme].short}</div>
      <h2 class="question">${q.q}</h2>
      <div class="options">${optsHtml}</div>
      ${feedback}
      <div class="actions">
        <button class="btn-text" id="back-btn">Changer de thème</button>
        <button class="btn red" id="next-btn" ${state.answered ? "" : "disabled"}>${isLast ? "Voir mes résultats" : "Question suivante"}</button>
      </div>
    </div>
  `;
}

function attachQuizEvents(){
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.addEventListener("click", ()=> selectOption(parseInt(btn.dataset.i)));
  });
  document.getElementById("next-btn").addEventListener("click", nextQuestion);
  document.getElementById("back-btn").addEventListener("click", backToPicker);
}

function renderResults(){
  const total = state.pool.length;
  const pct = Math.round((state.score/total)*100);
  let msg;
  if(pct >= 90) msg = "Excellent — ce thème est maîtrisé.";
  else if(pct >= 70) msg = "Bon niveau, encore quelques détails à consolider.";
  else if(pct >= 50) msg = "Sur la bonne voie, relis la fiche sur les points ratés.";
  else msg = "Ce thème mérite une nouvelle relecture avant de retenter.";

  let recap = '<div class="recap">';
  state.recap.forEach(r=>{
    recap += `<div class="recap-item"><span class="recap-mark ${r.ok?"ok":"ko"}">${r.ok?"✓":"✕"}</span><span class="recap-q">${r.q}</span></div>`;
  });
  recap += '</div>';

  return `
    <div class="card results">
      <h2>${state.playing.label}</h2>
      <div class="scoretag">Résultat de la session</div>
      <div class="bigscore">${pct}%<span>— ${state.score}/${total} bonnes réponses</span></div>
      <p class="msg">${msg}</p>
      ${recap}
      <div class="actions">
        <button class="btn red" id="retry-btn">Rejouer</button>
        <button class="btn-text" id="picker-btn">Choisir un autre thème</button>
      </div>
    </div>
  `;
}

function attachResultsEvents(){
  document.getElementById("retry-btn").addEventListener("click", ()=> startQuiz(state.playing.scope, state.playing.label, state.playing.themeKeys));
  document.getElementById("picker-btn").addEventListener("click", backToPicker);
}

/* ============================================================
   9. FICHES — RENDU
   ============================================================ */
function renderFiches(){
  let html = levelChips(state.fichesLevel, "lvl");

  const levelsToShow = state.fichesLevel === "all" ? LEVELS : [state.fichesLevel];

  levelsToShow.forEach(lv => {
    const chs = CHAPTERS.filter(c => c.level === lv);
    if(chs.length === 0) return;
    html += `<div class="level-heading"><span class="tag ${lv}">${lv}</span><span class="name">${levelName(lv)}</span><span class="desc">${levelDesc(lv)}</span><span class="line"></span></div>`;
    chs.forEach(ch => {
      html += `<div class="fiche-card">
        <div class="fiche-card-head">
          <div class="chapter-num">${ch.num}</div>
          <div>
            <div class="title-row">
              <h2>${ch.title}</h2>
              <span class="level-badge ${ch.level}">${ch.level}</span>
            </div>
            <p>${ch.desc}</p>
          </div>
        </div>
        ${FICHES[ch.id]}
      </div>`;
    });
  });

  html += `<footer class="hint">Fiches synthétiques — à utiliser en complément des quiz et des flashcards pour ancrer les notions clés.</footer>`;

  return html;
}

function attachFichesEvents(){
  document.querySelectorAll("[data-lvl]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.fichesLevel = btn.dataset.lvl;
      render();
    });
  });
}

/* ============================================================
   10. FLASHCARDS — LOGIQUE
   ============================================================ */
function startFlashDeck(scope, label, cards){
  state.flashDeck = {
    scope, label,
    cards: shuffle(cards),
    idx: 0,
    flipped: false,
    known: [],
    unknown: [],
  };
  state.flashScreen = "play";
  render();
  window.scrollTo(0,0);
}

function flipCurrentCard(){
  state.flashDeck.flipped = !state.flashDeck.flipped;
  render();
}

function judgeCard(knewIt){
  const d = state.flashDeck;
  const card = d.cards[d.idx];
  if(knewIt) d.known.push(card); else d.unknown.push(card);

  if(d.idx < d.cards.length - 1){
    d.idx++;
    d.flipped = false;
    render();
  } else {
    const pct = Math.round((d.known.length / d.cards.length) * 100);
    saveFlashProgress(d.scope, pct);
    state.flashScreen = "summary";
    render();
  }
}

function replayUnknown(){
  const d = state.flashDeck;
  if(d.unknown.length === 0) return;
  startFlashDeck(d.scope, d.label + " (à revoir)", d.unknown);
}

function backToFlashPicker(){
  state.flashScreen = "picker";
  render();
}

/* ============================================================
   11. FLASHCARDS — RENDU
   ============================================================ */
function flashChapterAvg(ch){
  return chapterAvg(ch, state.flashProgress);
}

function renderFlashPicker(){
  const totalCards = Object.values(FLASHCARDS).reduce((a,arr)=>a+arr.length,0);
  const allProg = state.flashProgress["all"];
  const levelsToShow = state.flashLevel === "all" ? LEVELS : [state.flashLevel];

  let html = `
    <div class="statbar">
      <div class="stat">
        <div class="num">${totalCards}</div>
        <div class="lbl">Cartes au total</div>
      </div>
      <div class="stat">
        <div class="num">${CHAPTERS.length}</div>
        <div class="lbl">Paquets (chapitres)</div>
      </div>
      <div class="stat">
        <div class="num ${allProg ? 'accent':''}">${allProg ? allProg.best + '%' : '—'}</div>
        <div class="lbl">Meilleur score global</div>
      </div>
    </div>

    <div class="hero-mix">
      <div class="txt">
        <div class="h">Réviser toutes les flashcards</div>
        <div class="d">${totalCards} cartes mélangées, tous chapitres et niveaux confondus.</div>
      </div>
      <button class="btn red" data-flashall="1">Tout mélanger</button>
    </div>

    ${levelChips(state.flashLevel, "flashlvl")}
  `;

  levelsToShow.forEach(lv => {
    const chs = CHAPTERS.filter(c => c.level === lv);
    if(chs.length === 0) return;
    const lvCards = chs.flatMap(c => FLASHCARDS[c.id] || []);
    html += `<div class="level-heading">
      <span class="tag ${lv}">${lv}</span><span class="name">${levelName(lv)}</span>
      <span class="desc">${levelDesc(lv)}</span><span class="line"></span>
      <button class="btn outline small" data-flashlevelmix="${lv}">Réviser ce niveau (${lvCards.length})</button>
    </div>`;

    html += `<div class="flash-deckgrid">`;
    chs.forEach(ch => {
      const cards = FLASHCARDS[ch.id] || [];
      const prog = state.flashProgress[ch.id];
      const mastered = prog && prog.best >= 80;
      html += `<div class="flash-deckcard">
        <div class="top">
          <div>
            <div class="name">${ch.num} · ${ch.title}</div>
            <div class="desc">${ch.desc}</div>
          </div>
          <span class="count">${cards.length} cartes</span>
        </div>
        <div class="bottom">
          <span class="mastery ${mastered ? 'done' : ''}">${prog ? prog.best + '% connu' : 'Pas encore tenté'}</span>
          <button class="btn outline small" data-flashchapter="${ch.id}">🃏 Réviser</button>
        </div>
      </div>`;
    });
    html += `</div>`;
  });

  html += `<footer class="hint">Clique sur une carte pour la retourner, puis indique si tu la connaissais — comme un vrai jeu de cartes de révision.</footer>`;
  return html;
}

function attachFlashPickerEvents(){
  document.querySelectorAll("[data-flashlvl]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.flashLevel = btn.dataset.flashlvl; render(); });
  });
  document.querySelectorAll("[data-flashchapter]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const ch = CHAPTERS.find(c => c.id === btn.dataset.flashchapter);
      startFlashDeck(ch.id, ch.num + " · " + ch.title, FLASHCARDS[ch.id] || []);
    });
  });
  document.querySelectorAll("[data-flashlevelmix]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const lv = btn.dataset.flashlevelmix;
      const chs = CHAPTERS.filter(c=>c.level===lv);
      const cards = chs.flatMap(c => FLASHCARDS[c.id] || []);
      startFlashDeck("level:"+lv, "Niveau " + lv + " — " + levelName(lv), cards);
    });
  });
  const mixAll = document.querySelector("[data-flashall]");
  if(mixAll){
    mixAll.addEventListener("click", ()=>{
      const all = Object.values(FLASHCARDS).flat();
      startFlashDeck("all", "Toutes les flashcards", all);
    });
  }
}

function renderFlashPlay(){
  const d = state.flashDeck;
  const card = d.cards[d.idx];
  const pct = Math.round((d.idx / d.cards.length) * 100);

  return `
    <button class="btn-text" id="flash-back-btn">← Quitter le paquet</button>
    <div class="flash-play-top">
      <span class="lbl">${d.label} — Carte ${d.idx+1} / ${d.cards.length}</span>
      <div class="flash-counters">
        <span class="c-known">✅ ${d.known.length}</span>
        <span class="c-unknown">🔁 ${d.unknown.length}</span>
      </div>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>

    <div class="flash-stage">
      <div class="flashcard ${d.flipped ? 'flipped' : ''}" id="flashcard-el">
        <div class="flashcard-inner">
          <div class="flashcard-face flashcard-front">
            <div class="q">${card.front}</div>
            <div class="hint">Clique pour retourner la carte</div>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="lbl">Réponse</span>
            <div class="a">${card.back}</div>
          </div>
        </div>
      </div>

      ${!d.flipped
        ? `<div class="flash-hintline">Retourne la carte pour voir la réponse</div>`
        : `<div class="flash-judge">
            <button class="unknown" id="flash-unknown-btn"><span class="emoji">🔁</span>À revoir</button>
            <button class="known" id="flash-known-btn"><span class="emoji">✅</span>Je savais</button>
          </div>`
      }
    </div>
  `;
}

function attachFlashPlayEvents(){
  document.getElementById("flash-back-btn").addEventListener("click", backToFlashPicker);
  document.getElementById("flashcard-el").addEventListener("click", flipCurrentCard);
  const unknownBtn = document.getElementById("flash-unknown-btn");
  const knownBtn = document.getElementById("flash-known-btn");
  if(unknownBtn) unknownBtn.addEventListener("click", (e)=>{ e.stopPropagation(); judgeCard(false); });
  if(knownBtn) knownBtn.addEventListener("click", (e)=>{ e.stopPropagation(); judgeCard(true); });
}

function renderFlashSummary(){
  const d = state.flashDeck;
  const total = d.cards.length;
  const pct = Math.round((d.known.length/total)*100);
  let msg;
  if(pct >= 90) msg = "Excellent — ce paquet est maîtrisé.";
  else if(pct >= 70) msg = "Bon niveau, encore quelques cartes à revoir.";
  else if(pct >= 50) msg = "Sur la bonne voie, rejoue les cartes à revoir.";
  else msg = "Ce paquet mérite d'être rejoué en entier.";

  let reviewList = "";
  if(d.unknown.length > 0){
    reviewList = `<div class="flash-review-list">` + d.unknown.map(c =>
      `<div class="item"><span class="mark">🔁</span><span>${c.front}</span></div>`
    ).join("") + `</div>`;
  }

  return `
    <div class="card flash-summary">
      <h2 style="font-size:21px;font-weight:800;margin:0 0 4px;">${d.label}</h2>
      <div class="scoretag">Résultat de la session</div>
      <div class="ring" style="background:conic-gradient(var(--red) ${pct}%, var(--border) 0);">
        <div style="width:96px;height:96px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;">
          <span class="pct">${pct}%</span>
        </div>
      </div>
      <p class="sub">✅ ${d.known.length} connues &nbsp;·&nbsp; 🔁 ${d.unknown.length} à revoir</p>
      <p class="msg" style="margin-top:-10px;">${msg}</p>
      <div class="actions" style="justify-content:center;">
        ${d.unknown.length > 0 ? `<button class="btn red" id="flash-replay-unknown">Rejouer les cartes à revoir</button>` : ""}
        <button class="btn outline" id="flash-replay-all">Rejouer tout le paquet</button>
        <button class="btn-text" id="flash-picker-btn">Choisir un autre paquet</button>
      </div>
      ${reviewList}
    </div>
  `;
}

function attachFlashSummaryEvents(){
  const replayUnknownBtn = document.getElementById("flash-replay-unknown");
  if(replayUnknownBtn) replayUnknownBtn.addEventListener("click", replayUnknown);
  document.getElementById("flash-replay-all").addEventListener("click", ()=>{
    const d = state.flashDeck;
    startFlashDeck(d.scope, d.label, [...d.known, ...d.unknown]);
  });
  document.getElementById("flash-picker-btn").addEventListener("click", backToFlashPicker);
}

/* ============================================================
   12. INIT
   ============================================================ */
document.getElementById("tab-quiz").addEventListener("click", ()=> switchTab("quiz"));
document.getElementById("tab-fiches").addEventListener("click", ()=> switchTab("fiches"));
document.getElementById("tab-flash").addEventListener("click", ()=> switchTab("flash"));

(async function init(){
  await loadProgress();
  render();
})();
</script>
</body>
</html>
