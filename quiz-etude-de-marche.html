<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réviser — Étude de marché</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F3EC;
    --paper-line: #E4DCC9;
    --ink: #232323;
    --ink-soft: #5B5646;
    --crimson: #A6192E;
    --crimson-dark: #7E1224;
    --sage: #4B7355;
    --sage-bg: #E4EEE1;
    --coral: #C1502E;
    --coral-bg: #F5E2D6;
    --card: #FFFEFB;
    --tab-inactive: #EFE8D8;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, var(--paper-line) 28px);
    color: var(--ink);
    font-family: "Source Sans 3", sans-serif;
    min-height: 100vh;
    padding: 32px 18px 60px;
  }

  .wrap {
    max-width: 620px;
    margin: 0 auto;
  }

  header.top {
    margin-bottom: 28px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 16px;
  }

  header.top .kicker {
    font-size: 13px;
    color: var(--crimson);
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }

  header.top h1 {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 34px;
    margin: 0 0 4px;
    line-height: 1.1;
  }

  header.top p.sub {
    margin: 0;
    color: var(--ink-soft);
    font-size: 15px;
  }

  /* THEME PICKER */
  .themes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 30px;
  }

  .theme-btn {
    font-family: "Source Sans 3", sans-serif;
    background: var(--tab-inactive);
    border: 1px solid var(--paper-line);
    border-bottom: 3px solid var(--paper-line);
    color: var(--ink);
    padding: 10px 14px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    border-radius: var(--radius);
    text-align: left;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .theme-btn:hover { transform: translateY(-1px); }
  .theme-btn .count {
    display: block;
    font-weight: 400;
    color: var(--ink-soft);
    font-size: 12px;
    margin-top: 2px;
  }
  .theme-btn.best {
    color: var(--sage);
  }
  .theme-btn.all {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* CARD */
  .card {
    background: var(--card);
    border: 1px solid var(--paper-line);
    border-radius: var(--radius);
    box-shadow: 4px 4px 0 var(--paper-line);
    padding: 30px 28px;
  }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 18px;
  }
  .progress-row .label {
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .progress-row .score {
    font-family: "Fraunces", serif;
    font-size: 15px;
    color: var(--crimson);
    font-weight: 600;
  }
  .bar-track {
    height: 4px;
    background: var(--paper-line);
    border-radius: 2px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--crimson);
    transition: width 0.3s ease;
  }

  .qtheme {
    font-size: 12.5px;
    color: var(--crimson);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }

  h2.question {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 21px;
    line-height: 1.35;
    margin: 0 0 22px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 6px;
  }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    text-align: left;
    background: transparent;
    border: 1.5px solid var(--paper-line);
    border-radius: var(--radius);
    padding: 13px 14px;
    font-family: "Source Sans 3", sans-serif;
    font-size: 15.5px;
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .opt:hover:not(:disabled) { border-color: var(--ink); }
  .opt .letter {
    font-family: "Fraunces", serif;
    font-weight: 600;
    color: var(--ink-soft);
    flex-shrink: 0;
  }
  .opt:disabled { cursor: default; }
  .opt.correct { background: var(--sage-bg); border-color: var(--sage); }
  .opt.correct .letter { color: var(--sage); }
  .opt.incorrect { background: var(--coral-bg); border-color: var(--coral); }
  .opt.incorrect .letter { color: var(--coral); }
  .opt.dim { opacity: 0.55; }

  .feedback {
    margin-top: 20px;
    padding: 16px 16px;
    border-radius: var(--radius);
    border-left: 3px solid var(--sage);
    background: var(--sage-bg);
    font-size: 14.5px;
    line-height: 1.5;
  }
  .feedback.wrong { border-left-color: var(--coral); background: var(--coral-bg); }
  .feedback .verdict {
    font-weight: 700;
    display: block;
    margin-bottom: 4px;
  }
  .feedback.wrong .verdict { color: var(--coral); }
  .feedback:not(.wrong) .verdict { color: var(--sage); }

  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
  }

  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: "Source Sans 3", sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    padding: 12px 22px;
    border-radius: var(--radius);
    cursor: pointer;
  }
  .btn-primary:hover { background: var(--crimson-dark); }
  .btn-primary:disabled { background: var(--paper-line); color: var(--ink-soft); cursor: not-allowed; }

  .btn-ghost {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: "Source Sans 3", sans-serif;
    font-size: 13.5px;
    text-decoration: underline;
    cursor: pointer;
    padding: 6px 0;
  }

  /* RESULTS */
  .results h2 {
    font-family: "Fraunces", serif;
    font-size: 26px;
    margin: 0 0 6px;
  }
  .results .bigscore {
    font-family: "Fraunces", serif;
    font-size: 52px;
    font-weight: 700;
    color: var(--crimson);
    line-height: 1;
    margin: 10px 0 4px;
  }
  .results .bigscore span { font-size: 22px; color: var(--ink-soft); font-weight: 400; }
  .results p.msg { color: var(--ink-soft); margin: 0 0 22px; font-size: 15px; }

  .recap {
    border-top: 1px solid var(--paper-line);
    padding-top: 16px;
    margin-top: 8px;
  }
  .recap-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 9px 0;
    border-bottom: 1px dashed var(--paper-line);
    font-size: 14px;
  }
  .recap-item:last-child { border-bottom: none; }
  .recap-mark {
    flex-shrink: 0;
    width: 18px;
    font-weight: 700;
  }
  .recap-mark.ok { color: var(--sage); }
  .recap-mark.ko { color: var(--coral); }
  .recap-q { color: var(--ink-soft); }

  .results .actions { justify-content: flex-start; gap: 12px; }

  footer.hint {
    text-align: center;
    color: var(--ink-soft);
    font-size: 12.5px;
    margin-top: 22px;
  }

  @media (max-width: 480px) {
    header.top h1 { font-size: 27px; }
    .card { padding: 22px 18px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="kicker">L1 &amp; L2 — Analyser et comprendre le marché</div>
    <h1>Entraînement quiz</h1>
    <p class="sub">Choisis un thème pour t'entraîner, ou mélange tout.</p>
  </header>

  <div id="app"></div>

  <footer class="hint">Ta progression par thème est mémorisée pour cette révision.</footer>

</div>

<script>
const QUESTIONS = [
  // ---------- THEME: fondamentaux ----------
  {theme:"fondamentaux", q:"Comment définit-on l'étude de marché ?", opts:[
    "Un processus systématique de collecte et d'analyse d'informations pour soutenir la prise de décision commerciale",
    "Une base de données de tous les concurrents d'un secteur",
    "Un outil de publicité destiné à promouvoir un produit",
    "Un audit financier de l'entreprise"
  ], correct:0, exp:"L'étude de marché est avant tout un processus de collecte et d'analyse d'informations qui aide le manager à prendre une décision."},

  {theme:"fondamentaux", q:"À quel moment faut-il, en théorie, mener une étude de marché ?", opts:[
    "Seulement avant le lancement d'un nouveau produit",
    "Chaque fois qu'un manager a besoin d'informations avant de prendre une décision",
    "Une fois par an, de façon systématique",
    "Uniquement quand les ventes chutent"
  ], correct:1, exp:"L'étude de marché sert à conseiller la direction : elle est utile dès qu'une décision nécessite des informations fiables."},

  {theme:"fondamentaux", q:"Lequel n'est PAS présenté comme un risque de ne pas mener d'étude de marché ?", opts:[
    "Négliger des opportunités",
    "Mauvaise compréhension des besoins des consommateurs",
    "Une hausse automatique du chiffre d'affaires",
    "Difficultés à attirer des financements"
  ], correct:2, exp:"Ne pas faire d'étude de marché n'apporte aucun bénéfice — c'est justement l'absence d'information qui fragilise les décisions."},

  {theme:"fondamentaux", q:"L'étude de marché suit une approche scientifique structurée en 4 étapes. Laquelle NE fait PAS partie de ces étapes ?", opts:[
    "Description", "Explication", "Certification", "Prédiction"
  ], correct:2, exp:"Les 4 étapes sont : Description, Explication, Prédiction, Contrôle."},

  {theme:"fondamentaux", q:"Quelle est la différence entre problématique commerciale et objectif de recherche ?", opts:[
    "Ce sont deux termes strictement synonymes",
    "La problématique commerciale est le problème du décideur (la décision à prendre) ; l'objectif de recherche définit l'information nécessaire pour l'éclairer",
    "L'objectif de recherche précède toujours la problématique commerciale",
    "La problématique commerciale concerne uniquement les données quantitatives"
  ], correct:1, exp:"La problématique commerciale correspond à la décision du manager ; l'objectif de recherche en découle et précise quelles informations aller chercher."},

  {theme:"fondamentaux", q:"À quoi sert le Research Brief ?", opts:[
    "À présenter le budget marketing de l'année",
    "À lister les concurrents directs de l'entreprise",
    "À énoncer explicitement les objectifs de recherche et les informations à recueillir",
    "À remplacer le rapport final de l'étude"
  ], correct:2, exp:"Le Research Brief formalise, de façon claire et explicite, les objectifs de recherche et les informations attendues."},

  {theme:"fondamentaux", q:"Quel est l'enchaînement correct des 5 étapes du processus général d'étude de marché ?", opts:[
    "Collecte des données → Définition de la problématique → Plan de recherche → Analyse → Rapport",
    "Définition de la problématique → Plan de recherche → Collecte des données → Analyse des données → Rapport",
    "Plan de recherche → Analyse des données → Définition de la problématique → Collecte → Rapport",
    "Rapport → Définition de la problématique → Collecte → Analyse → Plan de recherche"
  ], correct:1, exp:"L'ordre est : 1) problématique, 2) plan de recherche, 3) collecte des données (terrain), 4) analyse, 5) rapport."},

  // ---------- THEME: donnees ----------
  {theme:"donnees", q:"Que sont les données secondaires ?", opts:[
    "Des données collectées pour la première fois pour la recherche en cours",
    "Des informations déjà collectées auparavant, à des fins différentes de la recherche actuelle",
    "Des données uniquement issues de sondages internes",
    "Des données jugées peu fiables et à éviter"
  ], correct:1, exp:"Les données secondaires existent déjà : elles ont été collectées pour un autre objectif que l'étude en cours."},

  {theme:"donnees", q:"Que sont les données primaires ?", opts:[
    "Des données collectées pour la première fois, spécifiquement pour traiter la problématique de recherche étudiée",
    "Des données gratuites disponibles sur Internet",
    "Des données historiques de plus de 10 ans",
    "Des statistiques publiées par l'INSEE"
  ], correct:0, exp:"Les données primaires sont recueillies spécifiquement pour répondre à la problématique actuelle — elles n'existaient pas avant l'étude."},

  {theme:"donnees", q:"Lequel N'EST PAS un avantage des données secondaires ?", opts:[
    "Facilement accessibles", "Relativement peu coûteuses", "Toujours parfaitement à jour et pertinentes", "Rapidement obtenues"
  ], correct:2, exp:"Au contraire, les données secondaires peuvent être obsolètes ou pas entièrement pertinentes — c'est justement une de leurs limites."},

  {theme:"donnees", q:"Laquelle de ces sources est une source INTERNE de données secondaires ?", opts:[
    "Statista", "Les chiffres de vente de l'entreprise", "L'INSEE", "Les études XERFI"
  ], correct:1, exp:"Les chiffres de vente (organisés par zone, produit, année) proviennent directement de l'entreprise : c'est une source interne."},

  {theme:"donnees", q:"Quand doit-on privilégier la collecte de données primaires ?", opts:[
    "Systématiquement, avant toute donnée secondaire",
    "Lorsque les données secondaires ne permettent pas de répondre à la problématique commerciale",
    "Uniquement pour les grandes entreprises cotées",
    "Jamais, car c'est trop coûteux"
  ], correct:1, exp:"On collecte des données primaires seulement quand les données secondaires, plus rapides et moins chères, ne suffisent pas."},

  {theme:"donnees", q:"D'après le cours, quelle précaution faut-il prendre avec les données secondaires générées par l'IA ?", opts:[
    "Aucune, elles sont automatiquement fiables",
    "Vérifier soigneusement leurs sources et leur fiabilité",
    "Les utiliser uniquement comme données primaires",
    "Les ignorer systématiquement"
  ], correct:1, exp:"L'IA peut fournir rapidement des données secondaires, mais leurs sources et leur fiabilité doivent être soigneusement évaluées."},

  // ---------- THEME: recherche ----------
  {theme:"recherche", q:"Quel objectif poursuit la recherche qualitative ?", opts:[
    "Comprendre le « QUOI » — obtenir des idées et perspectives sur un phénomène nouveau",
    "Comprendre le « COMMENT » via la mesure d'un phénomène",
    "Comprendre le « POURQUOI » via une relation de cause à effet",
    "Confirmer une hypothèse déjà solidement établie"
  ], correct:0, exp:"La recherche qualitative vise à comprendre un phénomène encore peu connu : elle répond au « QUOI »."},

  {theme:"recherche", q:"La recherche descriptive répond principalement à quelle question ?", opts:[
    "Pourquoi ?", "Quoi ?", "Comment ?", "Qui a décidé ?"
  ], correct:2, exp:"La recherche descriptive (quantitative) mesure la fréquence d'un phénomène et les relations entre variables : elle répond au « COMMENT »."},

  {theme:"recherche", q:"La recherche causale correspond à :", opts:[
    "Un plan expérimental visant à identifier une relation de cause à effet",
    "Une phase exploratoire sans hypothèse préalable",
    "Une simple collecte de données secondaires",
    "Une étude menée uniquement par entretiens"
  ], correct:0, exp:"La recherche causale teste des hypothèses en conditions contrôlées pour établir une relation de cause à effet — elle répond au « POURQUOI »."},

  {theme:"recherche", q:"Dans un projet de recherche typique, quel est l'enchaînement logique des trois types de recherche ?", opts:[
    "Causale → Descriptive → Qualitative",
    "Descriptive → Causale → Qualitative",
    "Qualitative (exploratoire) → Descriptive → Causale",
    "Les trois se déroulent toujours simultanément"
  ], correct:2, exp:"On explore d'abord en qualitatif, on mesure ensuite en descriptif, puis on teste les hypothèses en causal (phase conclusive)."},

  {theme:"recherche", q:"« Nous voulons tester la préférence des consommateurs pour différents tons de communication (ex : l'humour) » : de quel type de recherche s'agit-il ?", opts:[
    "Recherche qualitative", "Recherche descriptive", "Recherche causale", "Recherche documentaire"
  ], correct:2, exp:"Tester l'effet d'une variable (le ton) sur une préférence est une démarche causale, expérimentale."},

  {theme:"recherche", q:"Quelle affirmation est vraie concernant la connaissance préalable du sujet ?", opts:[
    "La recherche qualitative nécessite une connaissance approfondie et des hypothèses",
    "La recherche causale se mène avec une connaissance faible ou inexistante du sujet",
    "Descriptive et causale s'appuient sur une connaissance approfondie du sujet, contrairement à la qualitative",
    "Le niveau de connaissance préalable n'a aucune importance"
  ], correct:2, exp:"Qualitatif = connaissance faible/inexistante (exploration) ; descriptif et causal = connaissance approfondie permettant de formuler des hypothèses."},

  // ---------- THEME: echantillonnage (L1, probabiliste/non probabiliste) ----------
  {theme:"echantillon", q:"Quelle est la différence essentielle entre échantillonnage probabiliste et non probabiliste ?", opts:[
    "Le probabiliste ne concerne que les grandes populations",
    "Dans le probabiliste, chaque individu a une probabilité égale d'être sélectionné de façon aléatoire ; le non probabiliste repose sur l'accessibilité ou le jugement du chercheur",
    "Le non probabiliste est toujours plus fiable statistiquement",
    "Il n'y a aucune différence pratique entre les deux"
  ], correct:1, exp:"Le probabiliste repose sur le hasard et l'égalité des chances ; le non probabiliste sur la commodité ou un choix raisonné du chercheur."},

  {theme:"echantillon", q:"Un tirage au sort façon loto, où chaque individu a une chance égale d'être choisi, illustre :", opts:[
    "L'échantillon de convenance", "L'échantillon aléatoire simple", "L'échantillon boule de neige", "Le recensement"
  ], correct:1, exp:"C'est l'exemple typique de l'échantillonnage aléatoire simple (probabiliste)."},

  {theme:"echantillon", q:"Diviser la population en strates (ex : par tranche d'âge) puis échantillonner dans chaque strate correspond à :", opts:[
    "L'échantillonnage stratifié", "L'échantillonnage de convenance", "L'échantillonnage boule de neige", "Le recensement"
  ], correct:0, exp:"C'est la définition de l'échantillonnage stratifié, une méthode probabiliste."},

  {theme:"echantillon", q:"Interroger des passants dans un centre commercial parce qu'ils sont facilement accessibles est un exemple de :", opts:[
    "Échantillon stratifié", "Échantillon aléatoire simple", "Échantillon de convenance", "Recensement"
  ], correct:2, exp:"Sélectionner des individus parce qu'ils sont facilement accessibles est la définition même de l'échantillon de convenance (non probabiliste)."},

  {theme:"echantillon", q:"Demander à des participants de désigner d'autres personnes pertinentes à interroger correspond à :", opts:[
    "L'échantillon boule de neige", "L'échantillon stratifié", "L'échantillon aléatoire simple", "L'échantillon par quotas"
  ], correct:0, exp:"C'est la technique de la boule de neige : les participants recrutent d'autres participants par recommandation en chaîne."},

  {theme:"echantillon", q:"Quand parle-t-on de « recensement » plutôt que d'échantillonnage ?", opts:[
    "Quand on interroge un échantillon représentatif",
    "Quand l'étude porte sur l'ensemble de la population d'intérêt",
    "Quand on utilise uniquement des données secondaires",
    "Quand l'échantillon est tiré au sort"
  ], correct:1, exp:"Le recensement consiste à étudier toute la population, et non un sous-ensemble."},

  // ---------- THEME: entretiens ----------
  {theme:"entretiens", q:"Quelle est la différence entre entretien en profondeur et entretien semi-structuré ?", opts:[
    "L'entretien en profondeur est plus flexible et ouvert, le semi-structuré est plus structuré",
    "Le semi-structuré ne suit jamais de guide",
    "L'entretien en profondeur est toujours mené en groupe",
    "Il n'existe aucune différence entre les deux"
  ], correct:0, exp:"En profondeur = plus flexible/ouvert ; semi-structuré = plus structuré. Les deux reposent néanmoins sur un guide flexible."},

  {theme:"entretiens", q:"Dans quel cas les entretiens en profondeur sont-ils particulièrement recommandés ?", opts:[
    "Pour mesurer un phénomène sur un large échantillon représentatif",
    "Pour mettre au jour des motivations, croyances et émotions, y compris sur des sujets sensibles",
    "Uniquement pour tester des hypothèses en laboratoire",
    "Pour remplacer systématiquement les données secondaires"
  ], correct:1, exp:"Les entretiens en profondeur sont adaptés à l'exploration des motivations, croyances, émotions et sujets sensibles, ou pour interroger des experts."},

  {theme:"entretiens", q:"Quelle est la durée typique d'un entretien en profondeur ?", opts:[
    "5 à 10 minutes", "Au moins 30 minutes, jusqu'à 1h30", "Toujours exactement 1 heure", "Plusieurs jours"
  ], correct:1, exp:"Le cours indique une durée longue : au moins 30 minutes et jusqu'à 1h30."},

  {theme:"entretiens", q:"La technique de relance qui consiste à demander « Pouvez-vous m'en dire plus sur cet aspect ? » s'appelle :", opts:[
    "Le laddering", "Le probing", "L'échantillonnage par quotas", "La saturation"
  ], correct:1, exp:"C'est la technique du probing (relance), qui vise à approfondir une réponse déjà donnée."},

  {theme:"entretiens", q:"Le laddering (échelonnage) consiste à :", opts:[
    "Poser une seule question fermée à la fin de l'entretien",
    "Enchaîner des questions allant des caractéristiques du phénomène vers les caractéristiques de l'individu, pour cartographier le réseau de significations",
    "Interroger uniquement des experts",
    "Choisir un échantillon par quotas"
  ], correct:1, exp:"Le laddering permet de remonter, question après question, des caractéristiques d'un phénomène jusqu'aux valeurs personnelles de l'individu."},

  {theme:"entretiens", q:"Quel est l'ordre logique recommandé pour structurer les questions d'un protocole d'entretien ?", opts:[
    "Sensibles → Core → Brise-glace",
    "Brise-glace → Core → Sensibles",
    "Core → Sensibles → Brise-glace",
    "L'ordre n'a aucune importance"
  ], correct:1, exp:"On commence par des questions brise-glace (faciles), puis les questions centrales (core), puis les questions sensibles."},

  {theme:"entretiens", q:"Que doit préciser l'intervieweur en ouverture de l'entretien, selon le protocole ?", opts:[
    "Uniquement son nom et rien d'autre",
    "Les objectifs de l'entretien, pourquoi le participant a été sélectionné, la durée, la confidentialité et le consentement pour l'enregistrement",
    "Le montant du budget de l'étude",
    "La liste complète des questions à venir, mot pour mot"
  ], correct:1, exp:"Le protocole prévoit : remerciements/présentation, objectifs, raison de la sélection, durée, confidentialité, et demande de consentement (y compris pour l'enregistrement)."},

  // ---------- THEME: qualitatif sampling + analysis ----------
  {theme:"analyse", q:"Dans les entretiens qualitatifs, comment détermine-t-on la taille de l'échantillon ?", opts:[
    "Elle est fixée à l'avance à exactement 100 participants",
    "Elle est généralement petite (5 à 30 entretiens) et déterminée par la saturation des données",
    "Elle doit toujours être égale à celle utilisée en recherche descriptive",
    "Elle dépend uniquement du budget disponible, jamais du contenu"
  ], correct:1, exp:"L'échantillon qualitatif est petit et son arrêt est décidé par la saturation (quand plus aucune information nouvelle n'émerge), pas fixé a priori."},

  {theme:"analyse", q:"L'échantillonnage raisonné consiste à :", opts:[
    "Sélectionner les participants selon des critères spécifiques",
    "Choisir des participants totalement au hasard",
    "Faire recruter les participants par d'autres participants",
    "Interroger toute la population"
  ], correct:0, exp:"L'échantillonnage raisonné sélectionne des participants selon des critères précis, pertinents pour l'étude."},

  {theme:"analyse", q:"Qu'est-ce qu'un « thème » dans l'analyse thématique ?", opts:[
    "Un logiciel utilisé pour transcrire les entretiens",
    "Une caractéristique récurrente dans le discours des participants, jugée pertinente pour la question de recherche",
    "Le titre donné à chaque entretien",
    "Un type d'échantillonnage probabiliste"
  ], correct:1, exp:"Un thème traduit des perceptions ou expériences récurrentes et pertinentes pour la question de recherche."},

  {theme:"analyse", q:"Qu'est-ce qu'un « code », à la différence d'un thème ?", opts:[
    "Un code est une courte expression descriptive résumant un extrait de données, plus proche et concret que le thème",
    "Un code et un thème sont exactement la même chose",
    "Un code ne s'applique qu'aux données quantitatives",
    "Un code désigne le logiciel d'analyse utilisé"
  ], correct:0, exp:"Le code est descriptif et proche des données (le quoi/qui/où/quand) ; en les regroupant, on fait émerger des thèmes plus conceptuels."},

  {theme:"analyse", q:"À quel moment commence, en pratique, l'analyse des données qualitatives ?", opts:[
    "Seulement après que tous les entretiens ont été réalisés",
    "Dès la collecte des données, de façon itérative (l'analyse peut faire évoluer le guide d'entretien)",
    "Uniquement après validation par un logiciel comme NVivo",
    "Jamais avant la rédaction du rapport final"
  ], correct:1, exp:"L'analyse est itérative : elle commence pendant la collecte et peut amener à modifier le guide d'entretien avant les entretiens suivants, jusqu'à saturation."},

  {theme:"analyse", q:"Un bon code doit être, entre autres :", opts:[
    "Vague et ouvert à toutes les interprétations",
    "Exhaustif, mutuellement exclusif, pertinent, homogène et objectif",
    "Identique pour tous les entretiens, même hors sujet",
    "Réservé uniquement aux experts en statistiques"
  ], correct:1, exp:"Les critères de qualité d'un code sont : exhaustif, mutuellement exclusif, pertinent, homogène, objectif."},

  {theme:"analyse", q:"Que signifie l'affirmation « le codage n'est pas une science exacte » ?", opts:[
    "Que le codage est aléatoire et sans méthode",
    "Que le codage est avant tout un acte interprétatif du chercheur",
    "Qu'il ne faut jamais utiliser de logiciel pour coder",
    "Que les résultats du codage ne doivent jamais être partagés"
  ], correct:1, exp:"Le codage relève de l'interprétation du chercheur : deux chercheurs peuvent coder différemment un même extrait, d'où l'importance de partager codes et notes en équipe."},

  {theme:"analyse", q:"Comment appelle-t-on les extraits d'entretiens utilisés pour appuyer les résultats dans un rapport qualitatif ?", opts:[
    "Des indicateurs clés", "Des verbatim (citations)", "Des strates", "Des hypothèses causales"
  ], correct:1, exp:"Les extraits cités dans le rapport pour étayer les résultats sont appelés verbatim, ou citations."},
];

const THEME_META = {
  fondamentaux: {label:"Fondamentaux", short:"Fondamentaux"},
  donnees: {label:"Types de données", short:"Données"},
  recherche: {label:"Types de recherche", short:"Types de recherche"},
  echantillon: {label:"Échantillonnage (L1)", short:"Échantillonnage"},
  entretiens: {label:"Entretiens qualitatifs", short:"Entretiens"},
  analyse: {label:"Échantillonnage qualitatif & Analyse", short:"Analyse qualitative"},
};

const THEME_ORDER = ["fondamentaux","donnees","recherche","echantillon","entretiens","analyse"];

let state = {
  screen: "picker", // picker | quiz | results
  themeKey: null,   // theme id or "all"
  pool: [],
  index: 0,
  score: 0,
  answered: false,
  selectedOpt: null,
  recap: [],
  progress: {}
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

async function loadProgress(){
  try {
    const res = await window.storage.get("quiz-progress", false);
    if(res && res.value){ state.progress = JSON.parse(res.value); }
  } catch(e){ state.progress = {}; }
}

async function saveProgress(themeKey, scorePct){
  try {
    const prev = state.progress[themeKey];
    if(!prev || scorePct > prev.best){
      state.progress[themeKey] = { best: scorePct, attempts: (prev ? prev.attempts+1 : 1) };
    } else {
      state.progress[themeKey] = { best: prev.best, attempts: prev.attempts+1 };
    }
    await window.storage.set("quiz-progress", JSON.stringify(state.progress), false);
  } catch(e){ /* silent */ }
}

function startQuiz(themeKey){
  state.themeKey = themeKey;
  const source = themeKey === "all" ? QUESTIONS : QUESTIONS.filter(q => q.theme === themeKey);
  state.pool = shuffle(source);
  state.index = 0;
  state.score = 0;
  state.answered = false;
  state.selectedOpt = null;
  state.recap = [];
  state.screen = "quiz";
  render();
}

function selectOption(i){
  if(state.answered) return;
  state.answered = true;
  state.selectedOpt = i;
  const q = state.pool[state.index];
  const isCorrect = i === q.correct;
  if(isCorrect) state.score++;
  state.recap.push({q: q.q, ok: isCorrect});
  render();
}

function nextQuestion(){
  if(state.index < state.pool.length - 1){
    state.index++;
    state.answered = false;
    state.selectedOpt = null;
    render();
  } else {
    const pct = Math.round((state.score / state.pool.length) * 100);
    saveProgress(state.themeKey, pct);
    state.screen = "results";
    render();
  }
}

function backToPicker(){
  state.screen = "picker";
  render();
}

function render(){
  const app = document.getElementById("app");
  if(state.screen === "picker"){ app.innerHTML = renderPicker(); attachPickerEvents(); }
  else if(state.screen === "quiz"){ app.innerHTML = renderQuiz(); attachQuizEvents(); }
  else if(state.screen === "results"){ app.innerHTML = renderResults(); attachResultsEvents(); }
}

function renderPicker(){
  let html = '<div class="themes">';
  html += `<button class="theme-btn all" data-theme="all">Tout mélanger<span class="count">${QUESTIONS.length} questions</span></button>`;
  THEME_ORDER.forEach(key => {
    const n = QUESTIONS.filter(q => q.theme === key).length;
    const prog = state.progress[key];
    const bestTxt = prog ? `Meilleur score : ${prog.best}%` : `${n} questions`;
    const cls = prog && prog.best >= 80 ? "theme-btn best" : "theme-btn";
    html += `<button class="${cls}" data-theme="${key}">${THEME_META[key].label}<span class="count">${bestTxt}</span></button>`;
  });
  html += '</div>';
  return html;
}

function attachPickerEvents(){
  document.querySelectorAll(".theme-btn").forEach(btn=>{
    btn.addEventListener("click", ()=> startQuiz(btn.dataset.theme));
  });
}

const LETTERS = ["A","B","C","D"];

function renderQuiz(){
  const q = state.pool[state.index];
  const total = state.pool.length;
  const pct = Math.round(((state.index) / total) * 100);
  let optsHtml = "";
  q.opts.forEach((opt,i)=>{
    let cls = "opt";
    if(state.answered){
      if(i === q.correct) cls += " correct";
      else if(i === state.selectedOpt) cls += " incorrect";
      else cls += " dim";
    }
    optsHtml += `<button class="${cls}" data-i="${i}" ${state.answered ? "disabled":""}>
      <span class="letter">${LETTERS[i]}</span><span>${opt}</span>
    </button>`;
  });

  const isCorrect = state.answered && state.selectedOpt === q.correct;
  const feedback = state.answered ? `
    <div class="feedback ${isCorrect ? "" : "wrong"}">
      <span class="verdict">${isCorrect ? "Exact." : "Pas tout à fait."}</span>
      ${q.exp}
    </div>` : "";

  const isLast = state.index === total - 1;

  return `
    <div class="card">
      <div class="progress-row">
        <span class="label">Question ${state.index+1} / ${total}</span>
        <span class="score">${state.score} bonne${state.score>1?"s":""}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="qtheme">${THEME_META[q.theme].short}</div>
      <h2 class="question">${q.q}</h2>
      <div class="options">${optsHtml}</div>
      ${feedback}
      <div class="actions">
        <button class="btn-ghost" id="back-btn">Changer de thème</button>
        <button class="btn-primary" id="next-btn" ${state.answered ? "" : "disabled"}>${isLast ? "Voir mes résultats" : "Question suivante"}</button>
      </div>
    </div>
  `;
}

function attachQuizEvents(){
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.addEventListener("click", ()=> selectOption(parseInt(btn.dataset.i)));
  });
  document.getElementById("next-btn").addEventListener("click", nextQuestion);
  document.getElementById("back-btn").addEventListener("click", backToPicker);
}

function renderResults(){
  const total = state.pool.length;
  const pct = Math.round((state.score/total)*100);
  let msg;
  if(pct >= 90) msg = "Excellent — ce thème est maîtrisé.";
  else if(pct >= 70) msg = "Bon niveau, encore quelques détails à consolider.";
  else if(pct >= 50) msg = "Sur la bonne voie, relis la fiche sur les points ratés.";
  else msg = "Ce thème mérite une nouvelle relecture avant de retenter.";

  let recap = '<div class="recap">';
  state.recap.forEach(r=>{
    recap += `<div class="recap-item"><span class="recap-mark ${r.ok?"ok":"ko"}">${r.ok?"✓":"✕"}</span><span class="recap-q">${r.q}</span></div>`;
  });
  recap += '</div>';

  return `
    <div class="card results">
      <h2>${state.themeKey === "all" ? "Tous thèmes confondus" : THEME_META[state.themeKey].label}</h2>
      <div class="bigscore">${pct}%<span> — ${state.score}/${total} bonnes réponses</span></div>
      <p class="msg">${msg}</p>
      ${recap}
      <div class="actions">
        <button class="btn-primary" id="retry-btn">Rejouer ce thème</button>
        <button class="btn-ghost" id="picker-btn">Choisir un autre thème</button>
      </div>
    </div>
  `;
}

function attachResultsEvents(){
  document.getElementById("retry-btn").addEventListener("click", ()=> startQuiz(state.themeKey));
  document.getElementById("picker-btn").addEventListener("click", backToPicker);
}

(async function init(){
  await loadProgress();
  render();
})();
</script>
</body>
</html>
